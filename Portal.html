<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <?!= HtmlService.createHtmlOutputFromFile('Portal/Styles/Portal').getContent(); ?>
</head>

<body data-app-context="sidebar">
  <div id="searchView" style="height:100vh;overflow-y:auto;overflow-x:hidden;">
    <?!= HtmlService.createHtmlOutputFromFile('Portal/Components/SidebarHeader').getContent(); ?>

    <div class="wrap">
      <input
        id="search"
        class="searchBox"
        type="text"
        placeholder="Search people, schools, items or groups..."
        autocomplete="off"
        autofocus
      >

      <div id="status" class="status"></div>
      <div id="results"></div>
    </div>
  </div>

  <div id="profileView" class="profile">
    <div class="wrap">
      <button class="back" onclick="showSearch()">← Back to search</button>
      <input
        id="profileSearch"
        class="profileSearchBox"
        type="text"
        placeholder="Search Spec Central..."
        autocomplete="off"
        oninput="profileQuickSearch(this.value)"
      >
      <div id="profile"></div>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById("search");
    const resultsEl = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const searchView = document.getElementById("searchView");
    const profileView = document.getElementById("profileView");
    const profileEl = document.getElementById("profile");
    const profileSearchInput = document.getElementById("profileSearch");

let timer = null;
let latestResults = [];
let selectedResultIndex = -1;
let allParticipants = [];
let allGroups = [];
let allSchools = [];
let participantsBySchool = new Map();
let participantsByItem = new Map();
let participantsByTeacher = new Map();
let groupsBySchool = new Map();
let groupsByItem = new Map();
let searchIndex = [];
let itemSearchRecords = [];
let resolvedPhotos = {};
let portalReady = false;

    function getField(source, names) {
      if (!source) return "";

      for (const name of names) {
        const value = source[name];
        if (value !== undefined && value !== null && String(value).trim() !== "") {
          return value;
        }
      }

      return "";
    }

    function getParticipantFirstName(p) {
      return getField(p, ["firstName", "studentFirstName", "Student First Name"]);
    }

    function getParticipantLastName(p) {
      return getField(p, ["lastName", "studentLastName", "Student Last Name"]);
    }

    function getParticipantName(p) {
      return getField(p, ["name", "fullName", "studentName", "Student Name"]) ||
        [getParticipantFirstName(p), getParticipantLastName(p)].filter(Boolean).join(" ");
    }

    function getParticipantSchool(p) {
      return getField(p, ["school", "currentSchool", "schoolName", "Current School"]);
    }

    function getSchoolName(s) {
      return getField(s, ["schoolName", "school", "currentSchool", "School Name", "Current School"]);
    }

    function getParticipantYear(p) {
      return getField(p, ["year", "studentYear", "Student Year"]);
    }

    function getParticipantItem(p) {
      return getField(p, ["item", "Item"]);
    }

    function normaliseItemTitle(value) {
      return String(value || "")
        .trim()
        .replace(/^[\s"'(]*\d+\s*[a-z]\s+/i, "")
        .replace(/^[\s"'(]*(?:item\s*)?(?:\d+\s*)?[a-z]\s*[\).:\-–—]\s*/i, "")
        .replace(/^[\s"'(]*\d+\s*[\).:\-–—]\s*/i, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function getItemKey(value) {
      return normaliseItemTitle(value).toLowerCase();
    }

    function getGroupItemTitle(group) {
      return normaliseItemTitle(group && (group.item || group.groupName || group.category));
    }

    function getGroupStudentCount(group) {
      const accepted = String(group && group.acceptedCount || "").trim();
      const allocated = String(group && group.allocatedCount || group.count || "").trim();
      return accepted || allocated;
    }

    function parseParticipantCount(value) {
      const number = Number(String(value || "").replace(/,/g, "").trim());
      return Number.isFinite(number) ? number : 0;
    }

    function getTotalGroupStudentCount() {
      return (allGroups || []).reduce((total, group) => total + parseParticipantCount(getGroupStudentCount(group)), 0);
    }

    function hasNotAcceptedAllocationCounts() {
      return (allGroups || []).some(group => {
        const accepted = String(group && group.acceptedCount || "").trim();
        const allocated = String(group && (group.allocatedCount || group.count) || "").trim();
        return !accepted && parseParticipantCount(allocated) > 0;
      });
    }

    function getTotalParticipantCount() {
      return (allParticipants || []).length + getTotalGroupStudentCount();
    }

    function getParticipantTotalNote() {
      return hasNotAcceptedAllocationCounts() ? "Includes not accepted yet allocations" : "";
    }

    function getSchoolParticipantTotal(schoolName) {
      const key = String(schoolName || "").trim().toLowerCase();
      const individualCount = (participantsBySchool.get(key) || []).length;
      const groupCount = (groupsBySchool.get(key) || []).reduce((total, group) => total + parseParticipantCount(getGroupStudentCount(group)), 0);
      return individualCount + groupCount;
    }

    function getSchoolParticipantTotalNote(schoolName) {
      const key = String(schoolName || "").trim().toLowerCase();
      return (groupsBySchool.get(key) || []).some(group => {
        const accepted = String(group && group.acceptedCount || "").trim();
        const allocated = String(group && (group.allocatedCount || group.count) || "").trim();
        return !accepted && parseParticipantCount(allocated) > 0;
      }) ? "Includes not accepted yet allocations" : "";
    }

    function getGroupStudentCountLabel(group) {
      const accepted = String(group && group.acceptedCount || "").trim();
      const allocated = String(group && group.allocatedCount || group.count || "").trim();
      const count = accepted || allocated || "0";
      const suffix = Number(count) === 1 ? "student" : "students";
      return accepted ? `${count} ${suffix}` : `${count} ${suffix} · Not accepted yet`;
    }

    function formatPhoneNumber(value) {
      const original = String(value || "").trim();
      if (!original) return "";

      let digits = original.replace(/\D/g, "");
      if (!digits) return original;

      if (digits.startsWith("610")) digits = "61" + digits.slice(3);

      if (digits.startsWith("61") && digits.length === 11) {
        const local = "0" + digits.slice(2);
        if (/^04\d{8}$/.test(local)) return "+61 " + local.slice(1, 4) + " " + local.slice(4, 7) + " " + local.slice(7);
        if (/^0[2378]\d{8}$/.test(local)) return "+61 " + local.slice(1, 2) + " " + local.slice(2, 6) + " " + local.slice(6);
        return "+61 " + digits.slice(2);
      }

      if (digits.length === 9 && /^[23478]/.test(digits)) {
        digits = "0" + digits;
      }

      if (/^04\d{8}$/.test(digits)) {
        return digits.slice(0, 4) + " " + digits.slice(4, 7) + " " + digits.slice(7);
      }

      if (/^0[2378]\d{8}$/.test(digits)) {
        return digits.slice(0, 2) + " " + digits.slice(2, 6) + " " + digits.slice(6);
      }

      return original;
    }

    function getParticipantDiscipline(p) {
      return getField(p, ["discipline", "Discipline"]);
    }

    function getParticipantSubDiscipline(p) {
      return getField(p, ["subDiscipline", "subDisciplineName", "Sub-Discipline"]);
    }

    function getParticipantCategory(p) {
      return getField(p, ["category", "Category"]) || getParticipantDiscipline(p);
    }

    function getParticipantCategoryDetail(p) {
      return getField(p, ["categoryDetail", "Category Detail"]) || getParticipantSubDiscipline(p);
    }

    function getParticipantTeacherName(p) {
      return getField(p, ["teacherName", "Teacher Name"]);
    }

    function getParticipantTeacherEmail(p) {
      return getField(p, ["teacherEmail", "Teacher Email"]);
    }

    function getParticipantStudentEmail(p) {
      return getField(p, ["studentEmail", "Student Email"]);
    }

    function getParticipantStudentMobile(p) {
      return formatPhoneNumber(getField(p, ["studentMobile", "Student Mobile"]));
    }

    function getParticipantParentName(p) {
      return getField(p, ["parentName", "Parent Name"]);
    }

    function getParticipantParentEmail(p) {
      return getField(p, ["parentEmail", "Parent Email"]);
    }

    function getParticipantParentPhone(p) {
      return formatPhoneNumber(getField(p, ["parentPhone", "Parent Phone"]));
    }

    function getParticipantAdditionalParentName(p) {
      return getField(p, ["additionalParentName", "Additional Parent Name"]);
    }

    function getParticipantAdditionalParentEmail(p) {
      return getField(p, ["additionalParentEmail", "Additional Parent Email"]);
    }

    function getParticipantAdditionalParentPhone(p) {
      return formatPhoneNumber(getField(p, ["additionalParentPhone", "Additional Parent Phone"]));
    }

    function getParticipantAdditionalParentRelationship(p) {
      return getField(p, ["additionalParentRelationship", "Additional Parent Relationship"]);
    }

    function getParticipantStudentId(p) {
      return getField(p, ["studentId", "Student ID"]);
    }

    function getParticipantSrn(p) {
      return getField(p, ["srn", "SRN"]);
    }

    function getParticipantStableId(participant) {
      return String(participant && (participant.studentKey || participant.id) || "").trim();
    }

    function getParticipantPhotoUrl(participant) {
      const id = getParticipantStableId(participant);
      return id ? (resolvedPhotos[id] || "") : "";
    }

    /**
     * Lazily resolves real photos for the participants currently on screen,
     * through the same authenticated secure-image pipeline the full
     * SpecCentral app uses (never a raw Drive URL). Deliberately not called
     * eagerly for the whole roster on load — with 1000s of participants,
     * batch-resolving every photo up front would be slow and could exceed
     * response limits. HeadshotAssetService.resolveMany caps each call at 12
     * requests, so this mirrors that cap.
     */
    function resolveParticipantPhotos_(participants, onUpdated) {
      const pending = (participants || [])
        .filter(p => p && (!p.resultType || p.resultType === "participant"))
        .map(getParticipantStableId)
        .filter(id => id && !(id in resolvedPhotos))
        .slice(0, 12);
      if (!pending.length) return;
      pending.forEach(id => { resolvedPhotos[id] = ""; });
      google.script.run
        .withSuccessHandler(results => {
          (results || []).forEach(result => {
            if (result && result.stableId) resolvedPhotos[result.stableId] = (result.ok && result.dataUrl) || "";
          });
          if (onUpdated) onUpdated();
        })
        .withFailureHandler(error => {
          console.warn("Spec Central: photo resolution failed", error);
        })
        .portalResolveSecureImages(pending.map(id => ({ entityType: "participant", stableId: id, size: "small" })));
    }

  </script>
  <?!= HtmlService.createHtmlOutputFromFile('Portal/Pages/Profile').getContent(); ?>
  <?!= HtmlService.createHtmlOutputFromFile('Portal/Pages/Dashboard').getContent(); ?>
  <?!= HtmlService.createHtmlOutputFromFile('Portal/Pages/Search').getContent(); ?>
</body>
</html>
