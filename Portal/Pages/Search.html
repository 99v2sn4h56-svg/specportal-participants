<script>
    searchInput.addEventListener("input", () => {
      clearTimeout(timer);
      selectedResultIndex = -1;
      timer = setTimeout(runSearch, 220);
    });

    searchInput.addEventListener("keydown", handleSearchKeydown);

    renderDashboard();
    loadPortalData();

    function handleSearchKeydown(e) {
      if (e.key === "Escape") {
        e.preventDefault();
        clearSearch();
        return;
      }

      if (!latestResults.length) return;

      if (e.key === "ArrowDown") {
        e.preventDefault();
        selectedResultIndex = Math.min(selectedResultIndex + 1, latestResults.length - 1);
        updateSelectedResult();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        selectedResultIndex = Math.max(selectedResultIndex - 1, 0);
        updateSelectedResult();
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (selectedResultIndex < 0) selectedResultIndex = 0;
        openProfile(selectedResultIndex);
      }
    }

    function clearSearch() {
      searchInput.value = "";
      latestResults = [];
      selectedResultIndex = -1;
      resultsEl.innerHTML = "";
      setDashboardVisible(true);
      statusEl.textContent = portalReady
        ? `Ready · ${allParticipants.length} participant${allParticipants.length === 1 ? "" : "s"} loaded`
        : "Loading participant data...";
    }

    function addToIndex(map, key, value) {
      const k = String(key || "").trim().toLowerCase();
      if (!k) return;

      if (!map.has(k)) {
        map.set(k, []);
      }

      map.get(k).push(value);
    }

    function buildPortalIndexes() {
      participantsBySchool = new Map();
      participantsByItem = new Map();
      participantsByTeacher = new Map();

      allParticipants.forEach(p => {
        addToIndex(participantsBySchool, getParticipantSchool(p), p);
        addToIndex(participantsByItem, getItemKey(getParticipantItem(p)), p);
        addToIndex(participantsByTeacher, getParticipantTeacherEmail(p) || getParticipantTeacherName(p), p);
      });

      groupsBySchool = new Map();
      groupsByItem = new Map();

      allGroups.forEach(g => {
        addToIndex(groupsBySchool, g.school, g);
        addToIndex(groupsByItem, getItemKey(g.item || g.groupName), g);
      });

      searchIndex = allParticipants.map(p => ({
        participant: p,
        fullName: fullName(p).toLowerCase(),
        firstName: String(getParticipantFirstName(p) || "").toLowerCase(),
        lastName: String(getParticipantLastName(p) || "").toLowerCase(),
        school: String(getParticipantSchool(p) || "").toLowerCase(),
        item: String(getParticipantItem(p) || "").toLowerCase(),
        itemTitle: getItemKey(getParticipantItem(p)),
        discipline: String(getParticipantCategory(p) || "").toLowerCase(),
        subDiscipline: String(getParticipantCategoryDetail(p) || "").toLowerCase(),
        teacherName: String(getParticipantTeacherName(p) || "").toLowerCase(),
        teacherEmail: String(getParticipantTeacherEmail(p) || "").toLowerCase(),
        studentEmail: String(getParticipantStudentEmail(p) || "").toLowerCase(),
        parentName: String(getParticipantParentName(p) || "").toLowerCase(),
        parentEmail: String(getParticipantParentEmail(p) || "").toLowerCase(),
        additionalParentName: String(getParticipantAdditionalParentName(p) || "").toLowerCase(),
        additionalParentEmail: String(getParticipantAdditionalParentEmail(p) || "").toLowerCase()
      }));

      itemSearchRecords = buildItemSearchRecords();
    }

    function buildItemSearchRecords() {
      const itemMap = new Map();

      allGroups.forEach(group => {
        const title = getGroupItemTitle(group);
        const key = getItemKey(title);
        if (!key) return;

        if (!itemMap.has(key)) {
          itemMap.set(key, {
            resultType: "item",
            itemName: title,
            schools: new Set(),
            participants: 0,
            searchText: [title, group.item, group.groupName, group.category].filter(Boolean).join(" ").toLowerCase()
          });
        }

        const record = itemMap.get(key);
        if (group.school) record.schools.add(group.school);
        record.participants += Number(getGroupStudentCount(group)) || 0;
        record.searchText += " " + [group.school, group.teacherName, group.teacherEmail].filter(Boolean).join(" ").toLowerCase();
      });

      allParticipants.forEach(participant => {
        const title = normaliseItemTitle(getParticipantItem(participant));
        const key = getItemKey(title);
        if (!key) return;

        if (!itemMap.has(key)) {
          itemMap.set(key, {
            resultType: "item",
            itemName: title,
            schools: new Set(),
            participants: 0,
            searchText: title.toLowerCase()
          });
        }

        const record = itemMap.get(key);
        const school = getParticipantSchool(participant);
        if (school) record.schools.add(school);
        record.participants++;
        record.searchText += " " + [school, getParticipantCategory(participant), getParticipantCategoryDetail(participant)].filter(Boolean).join(" ").toLowerCase();
      });

      return Array.from(itemMap.values()).map(item => ({
        ...item,
        schoolCount: item.schools.size,
        count: item.participants,
        itemNameLower: String(item.itemName || "").toLowerCase()
      }));
    }

    function loadPortalData() {
      statusEl.textContent = "Loading participant data...";
      console.log("Spec Central: requesting portal data...");

      const loadingTimeout = setTimeout(() => {
        if (!portalReady) {
          statusEl.textContent = "Still loading participant data... this is taking longer than usual.";
          console.warn("Spec Central: portalGetPortalData has not returned yet.");
        }
      }, 12000);

      google.script.run
        .withSuccessHandler(data => {
          clearTimeout(loadingTimeout);
          console.log("Spec Central: portal data received", data);

          data = data || {};
          photoCache = data.photos || {};
          allParticipants = data.participants || [];
          allGroups = data.groups || [];
          allSchools = data.schools || [];

          allParticipants.forEach(p => {
            p.photoUrl = getParticipantPhotoUrl(p);
          });

          buildPortalIndexes();
          portalReady = true;
          statusEl.textContent = `Ready · ${allParticipants.length} participant${allParticipants.length === 1 ? "" : "s"}, ${allGroups.length} group${allGroups.length === 1 ? "" : "s"} and ${allSchools.length} school${allSchools.length === 1 ? "" : "s"} loaded`;
          renderDashboard();

          if (searchInput.value.trim()) {
            runSearch();
          }

          loadPortalPhotos();
        })
        .withFailureHandler(error => {
          clearTimeout(loadingTimeout);
          portalReady = false;
          console.error("Spec Central: error loading participant data", error);
          const message = error && error.message ? error.message : String(error || "Unknown error");
          statusEl.textContent = "Error loading participant data: " + message;
        })
        .portalGetPortalData();
    }

    function loadPortalPhotos() {
      google.script.run
        .withSuccessHandler(photos => {
          photoCache = photos || {};

          allParticipants.forEach(p => {
            p.photoUrl = getParticipantPhotoUrl(p);
          });

          if (latestResults.length) {
            renderSearchResults();
          }
        })
        .withFailureHandler(error => {
          console.warn("Spec Central: photos could not be loaded", error);
        })
        .portalGetStudentPhotos();
    }

    function runSearch() {
      const query = String(searchInput.value || "").trim();
      if (!portalReady) {
        resultsEl.innerHTML = "";
        statusEl.textContent = "Loading participant data...";
        return;
      }

      if (!query) {
        resultsEl.innerHTML = "";
        statusEl.textContent = `Ready · ${allParticipants.length} participant${allParticipants.length === 1 ? "" : "s"} loaded`;
        latestResults = [];
        selectedResultIndex = -1;
        setDashboardVisible(true);
        return;
      }

      setDashboardVisible(false);

      const q = query.toLowerCase();
      const schoolResults = getSchoolSearchResults(q);
      const itemResults = getItemSearchResults(q);
      const groupResults = getGroupSearchResults(q);
      const participantResults = getParticipantSearchResults(q);
      const peopleFirst = shouldPrioritisePeople(participantResults);

      latestResults = peopleFirst
        ? [...participantResults, ...schoolResults, ...itemResults, ...groupResults].slice(0, 50)
        : [...schoolResults, ...itemResults, ...groupResults, ...participantResults].slice(0, 50);

      selectedResultIndex = -1;
      renderSearchResults();

      if (latestResults.length === 0) {
        resultsEl.innerHTML = `<div class="empty">No matches found.</div>`;
        statusEl.textContent = "No matches found.";
      } else {
        saveRecentSearch(query);
        statusEl.textContent = `${latestResults.length} result${latestResults.length === 1 ? "" : "s"}`;
      }
    }

    function getSchoolSearchResults(q) {
      return allSchools
        .map(school => {
          const schoolName = getSchoolName(school);
          const schoolKey = String(schoolName || "").toLowerCase();

          return {
            resultType: "school",
            schoolName,
            participantCount: (participantsBySchool.get(schoolKey) || []).length,
            searchScore: getTextSearchScore(schoolKey, q)
          };
        })
        .filter(school => school.schoolName && school.searchScore > 0)
        .sort((a, b) => b.searchScore - a.searchScore || a.schoolName.localeCompare(b.schoolName))
        .slice(0, 8);
    }

    function getGroupSearchResults(q) {
      return allGroups
        .map(group => {
          const itemTitle = getGroupItemTitle(group) || group.category || "Unnamed item";
          const title = group.school || itemTitle || "Unnamed group";
          const searchText = [
            itemTitle,
            group.item,
            group.groupName,
            group.category,
            group.school,
            group.teacherName,
            group.teacherEmail,
            group.secondTeacherName,
            group.secondTeacherEmail
          ].filter(Boolean).join(" ").toLowerCase();

          return {
            resultType: "group",
            title,
            itemTitle,
            school: group.school || "",
            teacherName: group.teacherName || "",
            count: getGroupStudentCount(group),
            countLabel: getGroupStudentCountLabel(group),
            group,
            searchScore: getTextSearchScore(searchText, q)
          };
        })
        .filter(group => group.searchScore > 0)
        .sort((a, b) => b.searchScore - a.searchScore || a.title.localeCompare(b.title))
        .slice(0, 8);
    }

    function getItemSearchResults(q) {
      return itemSearchRecords
        .map(item => ({
          ...item,
          searchScore: getTextSearchScore(item.searchText, q) + (getTextSearchScore(item.itemNameLower, q) * 3)
        }))
        .filter(item => item.itemName && item.searchScore > 0)
        .sort((a, b) => b.searchScore - a.searchScore || a.itemName.localeCompare(b.itemName))
        .slice(0, 8);
    }

    function getParticipantSearchResults(q) {
      const participantResults = [];

      for (const entry of searchIndex) {
        if (!participantMatchesQuery(entry, q)) continue;

        participantResults.push({
          ...entry.participant,
          resultType: "participant",
          searchScore: getParticipantSearchScore(entry, q),
          nameSearchScore: getParticipantNameSearchScore(entry, q)
        });
      }

      return participantResults
        .filter(p => fullName(p))
        .sort((a, b) => b.searchScore - a.searchScore || fullName(a).localeCompare(fullName(b)));
    }

    function shouldPrioritisePeople(participantResults) {
      return participantResults.some(result => Number(result.nameSearchScore || 0) >= 330);
    }

    function participantMatchesQuery(entry, q) {
      return entry.fullName.includes(q) ||
        entry.firstName.includes(q) ||
        entry.lastName.includes(q) ||
        entry.school.includes(q) ||
        entry.item.includes(q) ||
        entry.discipline.includes(q) ||
        entry.subDiscipline.includes(q) ||
        entry.teacherName.includes(q) ||
        entry.teacherEmail.includes(q) ||
        entry.studentEmail.includes(q) ||
        entry.parentName.includes(q) ||
        entry.parentEmail.includes(q) ||
        entry.additionalParentName.includes(q) ||
        entry.additionalParentEmail.includes(q);
    }

    function getParticipantSearchScore(entry, q) {
      return Math.max(
        getParticipantNameSearchScore(entry, q),
        getTextSearchScore(entry.school, q) * 5,
        getTextSearchScore(entry.item, q) * 4,
        getTextSearchScore(entry.discipline, q) * 3,
        getTextSearchScore(entry.subDiscipline, q) * 3,
        getTextSearchScore(entry.teacherName, q) * 2,
        getTextSearchScore(entry.teacherEmail, q) * 2,
        getTextSearchScore(entry.studentEmail, q),
        getTextSearchScore(entry.parentName, q),
        getTextSearchScore(entry.parentEmail, q),
        getTextSearchScore(entry.additionalParentName, q),
        getTextSearchScore(entry.additionalParentEmail, q)
      );
    }

    function getParticipantNameSearchScore(entry, q) {
      return Math.max(
        getTextSearchScore(entry.fullName, q) * 8,
        getTextSearchScore(entry.lastName, q) * 6,
        getTextSearchScore(entry.firstName, q) * 6
      );
    }

    function getTextSearchScore(value, q) {
      const text = String(value || "").toLowerCase().trim();
      if (!text || !q) return 0;
      if (text === q) return 100;
      if (text.startsWith(q)) return 75;
      if (text.split(/\s+/).some(part => part.startsWith(q))) return 55;
      if (text.includes(q)) return 30;
      return 0;
    }

    function renderSearchResults() {
      if (!latestResults.length) {
        resultsEl.innerHTML = "";
        return;
      }

      resultsEl.innerHTML = latestResults
        .map((p, idx) => renderResultCard(p, idx))
        .join("");
      updateSelectedResult();
    }

    function renderResultCard(p, idx) {
      if (p.resultType === "school") return renderSchoolResultCard(p, idx);
      if (p.resultType === "group") return renderGroupResultCard(p, idx);
      if (p.resultType === "item") return renderItemResultCard(p, idx);
      if (p.resultType === "teacher") return renderTeacherResultCard(p, idx);
      return renderParticipantResultCard(p, idx);
    }

    function resultCardShell(p, idx, avatar, title, meta, pill) {
      const resultType = p.resultType === "participant" ? "student" : (p.resultType || "unknown");
      const selectedClass = selectedResultIndex === idx ? " selected" : "";
      return `
        <div class="result result--${escapeHtml(resultType)}${selectedClass}" tabindex="-1" onclick="openProfile(${idx})" data-result-index="${idx}">
          <div class="resultTop">
            <div class="avatar">${avatar}</div>
            <div>
              <div class="name">${escapeHtml(title)}</div>
              <div class="meta">${escapeHtml(meta)}</div>
            </div>
          </div>
          ${pill ? `<div class="pillRow"><span class="pill pill--${escapeHtml(resultType)}">${escapeHtml(pill)}</span></div>` : ""}
        </div>
      `;
    }

    function renderSchoolResultCard(p, idx) {
      const schoolName = getSchoolName(p) || "Unnamed school";
      const count = p.participantCount || 0;
      return resultCardShell(p, idx, "🏫", schoolName, `${count} participant${Number(count) === 1 ? "" : "s"}`, "School");
    }

    function renderGroupResultCard(p, idx) {
      const meta = [p.itemTitle, p.teacherName, p.countLabel || (p.count ? p.count + " student" + (Number(p.count) === 1 ? "" : "s") : "")].filter(Boolean).join(" · ");
      return resultCardShell(p, idx, "🎭", p.title || "Unnamed group", meta, "Group");
    }

    function renderItemResultCard(p, idx) {
      const meta = [
        p.schoolCount ? p.schoolCount + " school" + (Number(p.schoolCount) === 1 ? "" : "s") : "",
        p.count ? p.count + " student" + (Number(p.count) === 1 ? "" : "s") : ""
      ].filter(Boolean).join(" · ");
      return resultCardShell(p, idx, "🎭", p.itemName || "Unnamed item", meta || "Item", "Item");
    }

    function renderTeacherResultCard(p, idx) {
      const meta = [p.teacherEmail, p.count ? p.count + " participant" + (Number(p.count) === 1 ? "" : "s") : ""].filter(Boolean).join(" · ");
      return resultCardShell(p, idx, "👤", p.teacherName || p.teacherEmail || "Unnamed teacher", meta, "Teacher");
    }

    function renderParticipantResultCard(p, idx) {
      const name = fullName(p) || "Unnamed participant";
      const photoUrl = p.photoUrl || getParticipantPhotoUrl(p);
      const year = getParticipantYear(p);
      const meta = [getParticipantSchool(p), year ? "Year " + year : "", getParticipantItem(p), getParticipantCategory(p)].filter(Boolean).join(" · ");
      const avatar = photoUrl
        ? `<img src="${escapeHtml(photoUrl)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
        : escapeHtml(getInitials(p));

      return resultCardShell(p, idx, avatar, name, meta, "Student");
    }

    function updateSelectedResult() {
      const cards = resultsEl.querySelectorAll(".result");
      cards.forEach((el, i) => {
        if (i === selectedResultIndex) {
          el.classList.add("selected");
          el.scrollIntoView({ block: "nearest", behavior: "smooth" });
        } else {
          el.classList.remove("selected");
        }
      });
    }

    function copyText(value) {
      if (!value) return;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value);
        return;
      }

      const temp = document.createElement("textarea");
      temp.value = value;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      document.body.removeChild(temp);
    }

    function openEmail(email) {
      if (!email) return;
      window.open("mailto:" + encodeURIComponent(email), "_blank");
    }

    function fullName(p) {
      return getParticipantName(p);
    }

    function getInitials(p) {
      return `${(getParticipantFirstName(p) || "").charAt(0)}${(getParticipantLastName(p) || "").charAt(0)}`.toUpperCase() || "SP";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeJs(value) {
      return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;")
        .replace(/\n/g, " ")
        .replace(/\r/g, " ");
    }
</script>
