<template id="page-dashboard">
  <div class="dashboardCommandCentre">
    <section class="heroPanel dashboardBriefingHero">
      <div class="dashboardBriefingMain">
        <div class="kicker">Today · Schools Spectacular 2026</div>
        <h2 id="homeWelcome">Your daily briefing</h2>
        <div id="dashboardDate" class="heroMeta">Today</div>
        <ul id="dashboardBriefing" class="briefingList" aria-label="Today’s briefing"></ul>
      </div>
      <div class="staffSummary dashboardIdentityBrief">
        <div class="briefingIdentityRow"><span>Current role</span><strong id="dashboardStaffRole">Staff</strong></div>
        <div class="briefingIdentityRow"><span>Department</span><strong id="dashboardStaffDepartment">Not assigned</strong></div>
        <div class="briefingIdentityRow"><span>Next event</span><strong id="dashboardNextRehearsal">Loading…</strong></div>
        <div class="briefingIdentityRow"><span>Acting permissions</span><strong id="dashboardActingPermissions">Loading…</strong></div>
      </div>
    </section>

    <section id="unmatchedUserPanel" class="panel unmatchedUserPanel" hidden></section>

    <div class="dashboardPrimaryGrid">
      <section class="panel dashboardSchedulePanel">
        <div class="dashboardPanelHeading"><div><span>Today</span><h3>Today’s Schedule</h3></div></div>
        <div id="dashboardSchedule" class="dashboardSchedule" aria-live="polite"></div>
      </section>

      <section class="panel dashboardTasksPanel">
        <div class="dashboardPanelHeading"><div><span>Tasks</span><h3>My Tasks</h3></div></div>
        <div id="dashboardTasks" class="dashboardTaskList" aria-live="polite"></div>
      </section>
    </div>

    <div class="dashboardSecondaryGrid">
      <section class="panel">
        <div class="dashboardPanelHeading"><div><span>Updates</span><h3>Notifications</h3></div></div>
        <div id="dashboardNotifications" class="dashboardNotificationList" aria-live="polite"></div>
      </section>

      <section class="panel">
        <div class="dashboardPanelHeading"><div><span>Active work</span><h3>My Projects</h3></div></div>
        <div id="dashboardProjects" class="dashboardProjectGrid" aria-live="polite"></div>
      </section>
    </div>
  </div>
</template>
