<template id="page-dashboard">
  <div class="grid">
    <section class="heroPanel span12">
      <div class="operationalHeroGrid">
        <div>
          <div class="kicker">My Home · Schools Spectacular 2026</div>
          <h2 id="homeWelcome">Today at Spec Central</h2>
          <div id="dashboardGreeting" class="heroMeta">Good morning</div>
          <div id="dashboardDate" class="heroMeta">Today</div>
          <div class="heroMetricGrid">
            <div class="heroMetric">
              <strong id="heroTodayRehearsals">0</strong>
              <span>Today’s rehearsals</span>
            </div>
            <div class="heroMetric">
              <strong id="heroUpcomingRehearsals">0</strong>
              <span>My open tasks</span>
            </div>
            <div class="heroMetric">
              <strong id="heroOutstandingActions">0</strong>
              <span>Things requiring attention</span>
            </div>
            <div class="heroMetric">
              <strong id="heroAttendanceAlerts">0</strong>
              <span>Unread notifications</span>
            </div>
          </div>
        </div>
        <div class="staffSummary">
          <div class="moduleMeta">Current user</div>
          <strong id="dashboardStaffName">Authenticated user</strong>
          <span id="dashboardStaffRole">Staff</span>
          <span id="dashboardStaffDepartment">Department pending</span>
          <div class="moduleMeta" style="margin-top:12px;">Next relevant event</div>
          <strong id="dashboardNextRehearsal">Loading...</strong>
        </div>
      </div>
    </section>

    <section id="unmatchedUserPanel" class="panel span12 unmatchedUserPanel" hidden></section>

    <section class="panel span12 homeQuickActionsPanel">
      <h3 class="sectionTitle">Quick Actions</h3>
      <div class="homeActionGrid">
        <button type="button" data-permission="Participants.View" onclick="App.focusParticipantsSearch()"><b>P</b><strong>Find Participant</strong><span>Search passports and relationships</span></button>
        <button type="button" data-permission="Attendance.View" onclick="App.openAttendance()"><b>A</b><strong>Open Attendance</strong><span>Launch live attendance operations</span></button>
        <button type="button" data-permission="Calendar.View" onclick="App.navigate('calendar')"><b>C</b><strong>Today’s Calendar</strong><span>See today’s full schedule</span></button>
        <button type="button" data-permission="Calendar.View" onclick="App.navigate('rehearsals')"><b>R</b><strong>My Rehearsals</strong><span>Review rehearsal detail</span></button>
        <button type="button" data-permission="Participants.View" onclick="App.browseGlobal('schools')"><b>S</b><strong>Search School</strong><span>Open a School Passport</span></button>
        <button type="button" data-permission="operations.view" onclick="App.openOperationsView('timeline')"><b>T</b><strong>Open Timeline</strong><span>Operational Timeline workspace</span></button>
        <button type="button" data-permission="operations.view" onclick="App.openOperationsView('projects')"><b>✓</b><strong>My Tasks</strong><span>Open assigned work</span></button>
      </div>
    </section>

    <section class="panel span7">
      <h3 class="sectionTitle">Today’s Schedule</h3>
      <div id="upcomingRehearsals" class="dateList"></div>
    </section>

    <section class="panel span5">
      <h3 class="sectionTitle">Things Requiring Attention</h3>
      <div id="dashboardAttention" class="attentionList"></div>
    </section>

    <section class="panel span7">
      <h3 class="sectionTitle">Recent Activity</h3>
      <div id="recentActivityFull" class="activityList"></div>
    </section>

    <section class="panel span5">
      <h3 class="sectionTitle">My Tasks</h3>
      <div id="dashboardTasks" class="activityList"></div>
    </section>

    <section class="panel span6">
      <h3 class="sectionTitle">Recently Viewed</h3>
      <div id="workspaceRecentlyViewed" class="workspaceMemoryGrid"></div>
    </section>

    <section class="panel span6">
      <h3 class="sectionTitle">Favourites</h3>
      <div id="workspaceFavourites" class="workspaceMemoryGrid"></div>
    </section>

    <section class="panel span4">
      <h3 class="sectionTitle">My Schools</h3>
      <div id="dashboardMySchools" class="relationshipList"></div>
    </section>

    <section class="panel span8">
      <h3 class="sectionTitle">Announcements</h3>
      <div id="announcementCards" class="announcementGrid"></div>
    </section>

    <section class="panel span4">
      <h3 class="sectionTitle">My Productions</h3>
      <div id="dashboardMyItems" class="relationshipList"></div>
    </section>

    <section class="panel span4">
      <h3 class="sectionTitle">My Team</h3>
      <div id="dashboardMyTeam" class="relationshipList"></div>
    </section>
  </div>
</template>
