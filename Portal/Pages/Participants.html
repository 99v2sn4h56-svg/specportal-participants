<template id="page-participants">
  <div class="participantExplorer">
    <section class="panel participantExplorerHeader">
      <div class="participantExplorerTopRow">
        <div class="participantModeToggle" role="tablist" aria-label="Participant data type">
          <button id="participantModeIndividuals" type="button" role="tab" onclick="App.setParticipantExplorerMode('individuals')">Individuals</button>
          <button id="participantModeGroups" type="button" role="tab" onclick="App.setParticipantExplorerMode('groups')">School Groups</button>
        </div>
        <button id="participantMobileFilterToggle" class="quickLink compact participantMobileFilterToggle" type="button" aria-expanded="false" onclick="App.toggleParticipantMobileFilters()">Filters</button>
      </div>
      <div class="participantFilterControls">
        <div id="participantDropdownFilters" class="participantDropdownFilters"></div>
        <div id="participantQuickFilters" class="participantQuickFilters"></div>
      </div>
    </section>

    <div id="participantStats" class="participantExplorerStats" aria-live="polite"></div>

    <div class="participantExplorerBody">
      <section class="panel participantTablePanel">
        <div class="participantTableToolbar"><div id="participantStatus" class="status">Loading participant data…</div><div class="participantTableActions"><div id="participantActiveFilters" class="participantActiveFilters"></div></div></div>
        <div class="participantSearchRow">
          <input id="participantSearch" class="participantSearch participantTableSearch" type="search" placeholder="Search name, school, category, item or status…" autocomplete="off" oninput="App.queueParticipantExplorer()">
          <div class="participantBulkActions"><button id="participantCopyEmails" class="quickLink compact" type="button" onclick="App.copyParticipantExplorerAllEmails()">Copy family emails</button><button class="quickLink compact" type="button" onclick="App.exportParticipantExplorer()">Export safe list</button></div>
        </div>
        <div id="participantResults" class="participantDatabase"></div>
        <div id="participantPagination" class="participantPagination"></div>
      </section>
    </div>

  </div>
</template>

<script>
  Object.assign(App, {
    renderParticipantExplorer: function () {
      var root = document.querySelector(".participantExplorer");
      if (!root) return;
      if (!App.state.ready) {
        var results = document.getElementById("participantResults");
        if (results) results.innerHTML = App.loadingState("Loading participant database");
        App.ensurePortalDataLoaded({ firstPageOnly: true }).then(App.renderParticipantExplorer).catch(function (error) { if (results) results.innerHTML = App.emptyState("Participant data unavailable", App.getErrorMessage(error)); });
        return;
      }
      try {
        App.initialiseParticipantExplorer();
        var groupMode = App.state.participantExplorerMode === "groups";
        root.classList.toggle("groupMode", groupMode);
        App.renderParticipantModeToggle();
        if (groupMode) {
          if (!App.state.participantGroupsReady) {
            var groupResults = document.getElementById("participantResults");
            if (groupResults) groupResults.innerHTML = App.loadingState("Loading school groups");
            var groupStatus = document.getElementById("participantStatus");
            if (groupStatus) groupStatus.textContent = "Loading school groups…";
            if (!App.state.participantGroupListLoading) App.loadParticipantGroups(false).then(App.renderParticipantExplorer).catch(function (error) {
              // This can resolve after the user has already switched back to
              // Individuals; only paint the error if Groups is still the active
              // tab, otherwise it silently clobbers whatever is now showing.
              if (groupResults && App.state.participantExplorerMode === "groups") groupResults.innerHTML = App.emptyState("School groups could not be loaded", App.getErrorMessage(error));
            });
            return;
          }
          var groups = App.getFilteredParticipantGroups();
          App.renderParticipantGroupStats(groups);
          App.renderParticipantGroupTable(groups);
          return;
        }
        var pageQuery = App.participantExplorerPageQuery();
        if (App.state.participantExplorerPageSignature !== pageQuery.signature) {
          var pageResults = document.getElementById("participantResults"), pageStatus = document.getElementById("participantStatus");
          if (pageStatus) pageStatus.textContent = "Loading matching participants…";
          if (pageResults) pageResults.innerHTML = App.loadingState("Loading participant page");
          App.loadParticipantExplorerPage(false).then(App.renderParticipantExplorer).catch(function (error) { if (pageResults) pageResults.innerHTML = App.emptyState("Participant data unavailable", App.getErrorMessage(error)); });
          return;
        }
        var filtered = App.getFilteredParticipants();
        App.renderParticipantExplorerStats(filtered);
        App.renderParticipantFilterPanel();
        App.renderParticipantQuickFilters();
        App.renderParticipantActiveFilters();
        App.renderParticipantTable(filtered);
      } catch (error) {
        var failed = document.getElementById("participantResults");
        if (failed) failed.innerHTML = App.emptyState("Participant explorer could not render", App.getErrorMessage(error));
        var status = document.getElementById("participantStatus");
        if (status) status.textContent = "Explorer error: " + App.getErrorMessage(error);
        App.notify("Participant explorer error: " + App.getErrorMessage(error));
      }
    },

    initialiseParticipantExplorer: function () {
      if (!App.state.participantExplorerInitialised) {
        App.state.participantExplorerFilters = App.state.participantExplorerFilters || {};
        App.state.participantExplorerPage = App.state.participantExplorerPage || 1;
        App.state.participantExplorerSort = App.state.participantExplorerSort || { key: "name", direction: "asc" };
        App.state.participantExplorerLayout = "default";
        App.state.participantExplorerMode = localStorage.getItem("specParticipantExplorerMode") || "individuals";
        try { App.state.participantHiddenColumns = JSON.parse(localStorage.getItem("specParticipantHiddenColumns") || "[]"); } catch (error) { App.state.participantHiddenColumns = []; }
        App.state.participantExplorerInitialised = true;
      }
      var search = document.getElementById("participantSearch");
      if (search && search.value !== (App.state.participantExplorerSearch || "")) search.value = App.state.participantExplorerSearch || "";
      var searchPlaceholder = App.state.participantExplorerMode === "groups" ? "Search school, group, item or category…" : "Search name, school, category, item or status…";
      if (search) search.placeholder = searchPlaceholder;
    },

    renderParticipantModeToggle: function () {
      var mode = App.state.participantExplorerMode || "individuals";
      [["participantModeIndividuals", "individuals"], ["participantModeGroups", "groups"]].forEach(function (entry) {
        var button = document.getElementById(entry[0]), active = mode === entry[1];
        if (!button) return;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", active ? "true" : "false");
        button.setAttribute("tabindex", active ? "0" : "-1");
      });
      var copy = document.getElementById("participantCopyEmails");
      if (copy) copy.textContent = mode === "groups" ? "Copy teacher emails" : "Copy family emails";
    },

    setParticipantExplorerMode: function (mode) {
      App.state.participantExplorerMode = mode === "groups" ? "groups" : "individuals";

    queueParticipantExplorer: function () {

    },

    getFilteredParticipants: function () {
      if (App.state.participantExplorerPageData && App.state.participantExplorerPageSignature === App.participantExplorerPageQuery().signature) return (App.state.participantExplorerPageData.participants || []).slice();
      var filters = App.state.participantExplorerFilters || {}, query = String(App.state.participantExplorerSearch || "").trim().toLowerCase();
      var list = (App.state.participants || []).filter(function (participant) {
        var values = App.getParticipantExplorerValues(participant);

        if (filters.category && !values.categories.includes(filters.category)) return false;
        if (filters.item && !values.items.includes(filters.item)) return false;
        if (filters.school && values.school !== filters.school) return false;
        if (filters.region && values.region !== filters.region) return false;
        if (filters.year && values.year !== filters.year) return false;
        if (filters.gender && values.gender !== filters.gender) return false;
        if (filters.directorate && values.directorate !== filters.directorate) return false;
        if (filters.status && values.status !== filters.status) return false;
        if (filters.participationType && values.participationType !== filters.participationType) return false;
        if (filters.segment && values.segment !== filters.segment) return false;
        if (filters.staffAllocation && values.staffAllocation !== filters.staffAllocation) return false;
        if (filters.rehearsal && !App.participantMatchesRehearsal(participant, filters.rehearsal)) return false;
        if (filters.teacher && values.teacher !== filters.teacher) return false;
        if (filters.schoolGroup && values.schoolGroup !== filters.schoolGroup) return false;

        var booleans = ["featuredPerformer", "returningStudent", "supervisingTeacherRequired", "outstandingForms"];
        if (booleans.some(function (key) { return filters[key] === true && !participant[key]; })) return false;
        if (filters.culturalIdentity && !App.participantMatchesCulturalIdentity(participant)) return false;
        if (filters.loteNote && !App.participantNotesContain(participant, /\blote\b/i)) return false;
        if (filters.supportNeededNote && !App.participantNotesContain(participant, /\bsupport\s+needed\b/i)) return false;
        if (filters.medicalNote && !(participant.hasMedicalAlert || App.participantNotesContain(participant, /\b(?:medical|med\s*plan)\b/i))) return false;
        if (filters.firstTimeNote && !App.participantNotesContain(participant, /\b1st\b/i)) return false;
        if (filters.hasAttendance && !String(participant.attendanceStatus || "").trim()) return false;
        if (filters.missingAttendance && String(participant.attendanceStatus || "").trim()) return false;
        if (filters.myStudents) { var staff = App.state.staff || {}; var mine = [staff.email, staff.displayName, staff.name].filter(Boolean).map(function (value) { return String(value).toLowerCase(); }); if (!mine.includes(String(values.teacher || "").toLowerCase()) && !mine.includes(String(participant.teacherEmail || "").toLowerCase())) return false; }

      });
      var sort = App.state.participantExplorerSort || { key: "name", direction: "asc" };
      return list.sort(function (a, b) { var av = sort.key === "rehearsal" ? App.getParticipantNextRehearsal(a) : App.getParticipantExplorerValues(a)[sort.key] || "", bv = sort.key === "rehearsal" ? App.getParticipantNextRehearsal(b) : App.getParticipantExplorerValues(b)[sort.key] || ""; var result = String(av).localeCompare(String(bv), undefined, { numeric: true }); return sort.direction === "desc" ? -result : result; });
    },

    participantNotesContain: function (participant, pattern) { return pattern.test(String(participant && participant.notes || "")); },
    participantMatchesCulturalIdentity: function (participant) { return !!(participant.aboriginal || participant.torresStraitIslander || App.participantNotesContain(participant, /\b(?:aboriginal|torres\s+strait\s+islander|atsi|tsi)\b/i)); },

    getFilteredParticipantGroups: function () {
      var query = String(App.state.participantExplorerSearch || "").trim().toLowerCase();
      return (App.state.groups || []).filter(function (group) {
        var values = App.getParticipantGroupValues(group);
        return values.hasData && (!query || values.search.indexOf(query) >= 0);
      }).sort(function (a, b) {
        var av = App.getParticipantGroupValues(a), bv = App.getParticipantGroupValues(b);
        return av.school.localeCompare(bv.school) || av.title.localeCompare(bv.title);
      });
    },

    getParticipantGroupValues: function (group) {
      var item = App.normaliseItemTitle(group.item || ""), groupName = String(group.groupName || "").trim();

      var teachers = [group.teacherName, group.secondTeacherName].filter(Boolean).join(", ");
      var emails = [group.teacherEmail, group.secondTeacherEmail].filter(Boolean).join("; ");
      var count = App.getGroupStudentCount(group) || "0";
      var values = [group.school, title, item, group.category, group.segment, teachers, emails];
      return { title: title, item: item, school: String(group.school || ""), category: String(group.category || ""), segment: String(group.segment || ""), students: String(count), teachers: teachers, emails: emails, hasData: values.some(Boolean), search: values.filter(Boolean).join(" ").toLowerCase() };
    },

    getParticipantExplorerValues: function (participant) {
      var name = App.getParticipantName(participant), school = App.getParticipantSchool(participant), categories = App.getParticipantCategories(participant), category = categories.join(", "), items = App.getParticipantItems(participant), item = items.join(", "), teacher = App.getParticipantTeacherName(participant) || App.getParticipantTeacherEmail(participant);
      var production = categories.concat([App.getParticipantCategoryDetail(participant)], items, [participant.schoolGroup]).filter(Boolean).join(" ").toLowerCase();
      return { name: name, school: school, categories: categories, category: category, items: items, item: item, year: String(App.getParticipantYear(participant) || ""), region: String(participant.region || ""), gender: String(participant.gender || "N/A"), directorate: String(participant.directorate || ""), notes: String(participant.notes || ""), status: String(participant.applicationStatus || ""), participationType: String(participant.participationType || ""), segment: String(participant.segment || ""), staffAllocation: String(participant.staffAllocation || ""), teacher: String(teacher || ""), schoolGroup: String(participant.schoolGroup || ""), attendance: String(participant.attendanceStatus || ""), production: production, search: [name, school, category, App.getParticipantCategoryDetail(participant)].concat(items, [teacher, participant.teacherEmail, participant.applicationId, participant.studentId, participant.studentEmail, participant.schoolGroup, participant.participationType, participant.segment, participant.staffAllocation, participant.notes]).filter(Boolean).join(" ").toLowerCase() };
    },

    getParticipantCategories: function (participant) { var source = App.getParticipantDiscipline(participant) || App.getParticipantCategory(participant) || ""; var seen = {}; return App.participantArray(source).map(function (value) { return String(value || "").trim(); }).filter(function (value) { var key = value.toLowerCase(); if (!value || seen[key]) return false; seen[key] = true; return true; }); },
    getParticipantItems: function (participant) { var seen = {}; return App.participantArray(App.getParticipantItem(participant)).map(function (value) { return String(value || "").trim(); }).filter(function (value) { var key = value.toLowerCase(); if (!value || seen[key]) return false; seen[key] = true; return true; }); },

    getParticipantFacets: function () {
      var fields = ["category", "item", "school", "region", "year", "gender", "directorate", "status", "participationType", "segment", "staffAllocation", "teacher", "schoolGroup"], facets = {};
      fields.forEach(function (field) { facets[field] = []; });
      var projected = App.state.participantFilterProjection && App.state.participantFilterProjection.values || {};
      var projectedFields = { category: "categories", item: "items", school: "schools", region: "regions", year: "years", gender: "genders", directorate: "directorates", status: "statuses", participationType: "participationTypes", segment: "segments", schoolGroup: "schoolGroups" };
      Object.keys(projectedFields).forEach(function (field) { if (Array.isArray(projected[projectedFields[field]])) facets[field] = projected[projectedFields[field]].slice(); });
      (App.state.participants || []).forEach(function (participant) { var values = App.getParticipantExplorerValues(participant); fields.forEach(function (field) { if (field === "category") { values.categories.forEach(function (category) { if (!facets.category.includes(category)) facets.category.push(category); }); } else if (field === "item") { values.items.forEach(function (item) { if (!facets.item.includes(item)) facets.item.push(item); }); } else if (values[field] && facets[field].indexOf(values[field]) < 0) facets[field].push(values[field]); }); });
      fields.forEach(function (field) { facets[field].sort(function (a, b) { return String(a).localeCompare(String(b), undefined, { numeric: true }); }); });
      facets.rehearsal = App.participantArray((App.state.calendarData && App.state.calendarData.events) || App.state.rehearsals).filter(function (event) { return event && event.eventType !== "Operational Event"; }).map(function (event) { return event.id || event.eventId || event.title || event.event; }).filter(function (value, index, values) { return value && values.indexOf(value) === index; });
      return facets;
    },

    renderParticipantFilterPanel: function () {
      var el = document.getElementById("participantDropdownFilters"); if (!el) return; var facets = App.getParticipantFacets();
      var fields = [["category", "Category"], ["item", "Item"], ["school", "School"], ["region", "Region"], ["year", "Yr"], ["gender", "Gender"], ["directorate", "Directorate"], ["segment", "Segment"]];
      el.innerHTML = fields.map(function (field) { return App.renderParticipantFilterSelect(field[0], field[1], facets[field[0]]); }).join("") + '<details class="participantColumnChooser"><summary>Columns</summary>' + App.getParticipantColumns(true).map(function (column) { var hidden = (App.state.participantHiddenColumns || []).includes(column[0]); return '<label><input type="checkbox"' + (hidden ? '' : ' checked') + ' onchange="App.toggleParticipantColumn(\'' + column[0] + '\',this.checked)"> ' + App.escapeHtml(column[1]) + '</label>'; }).join("") + '</details><button class="quickLink compact participantClearFilters" type="button" onclick="App.clearParticipantExplorerFilters()">Clear filters</button>';
    },

    renderParticipantFilterSelect: function (key, label, values) { var selected = (App.state.participantExplorerFilters || {})[key] || ""; return '<label class="participantFilterField"><span>' + App.escapeHtml(label) + '</span><select class="filterSelect" onchange="App.setParticipantExplorerFilter(\'' + key + '\',this.value)"><option value="">All</option>' + (values || []).map(function (value) { return '<option' + (selected === value ? ' selected' : '') + '>' + App.escapeHtml(value) + '</option>'; }).join("") + '</select></label>'; },
    setParticipantExplorerFilter: function (key, value) { if (value === false || value === "") delete App.state.participantExplorerFilters[key]; else App.state.participantExplorerFilters[key] = value; App.state.participantExplorerPage = 1; App.renderParticipantExplorer(); },
    clearParticipantExplorerFilters: function () { App.state.participantExplorerFilters = {}; App.state.participantExplorerSearch = ""; App.state.participantExplorerPage = 1; App.renderParticipantExplorer(); },
    toggleParticipantMobileFilters: function () { var root = document.querySelector(".participantExplorerHeader"), button = document.getElementById("participantMobileFilterToggle"); if (!root) return; var open = !root.classList.contains("mobileFiltersOpen"); root.classList.toggle("mobileFiltersOpen", open); if (button) { button.setAttribute("aria-expanded", open ? "true" : "false"); button.textContent = open ? "Hide filters" : "Filters"; } },
    // These filters must stay as toolbar toggles, not per-row indicators: the
    // underlying notes/medical/support fields are deliberately never sent to
    // the browser (ProjectionContractService's LIST_FIELDS boundary), so a
    // chip here only ever needs to flip a filter flag -- the server does the
    // actual matching against data that never leaves it.
    renderParticipantQuickFilters: function () {
      var el = document.getElementById("participantQuickFilters"); if (!el) return;
      var quick = App.state.participantExplorerMode === "groups" ? [] : [
        ["hasAttendance", "Has attendance"], ["missingAttendance", "Missing attendance"],
        ["firstTimeNote", "First time"], ["loteNote", "LOTE / EAL-D"], ["supportNeededNote", "Support needed"],
        ["medicalNote", "Medical"], ["culturalIdentity", "Aboriginal / TSI"]
      ];
      el.innerHTML = quick.map(function (item) { var active = !!(App.state.participantExplorerFilters || {})[item[0]]; return '<button class="filterChip ' + (active ? 'active' : '') + '" type="button" onclick="App.setParticipantExplorerFilter(\'' + item[0] + '\',' + (!active) + ')">' + App.escapeHtml(item[1]) + '</button>'; }).join("");
    },
    renderParticipantActiveFilters: function () { var el = document.getElementById("participantActiveFilters"); if (!el) return; var filters = App.state.participantExplorerFilters || {}, labels = { culturalIdentity: "Aboriginal / Torres Strait Islander", loteNote: "LOTE / EAL-D", supportNeededNote: "Support needed", medicalNote: "Medical", firstTimeNote: "First time" }; var activeKeys = Object.keys(filters).filter(function (key) { return filters[key] !== false && filters[key] !== ""; }); var chips = activeKeys.map(function (key) { return '<button type="button" onclick="App.setParticipantExplorerFilter(\'' + key + '\',\'\')">' + App.escapeHtml((labels[key] || App.toTitle(key)) + (filters[key] === true ? "" : ": " + filters[key])) + ' ×</button>'; }); el.innerHTML = chips.join(""); var toggle = document.getElementById("participantMobileFilterToggle"), root = document.querySelector(".participantExplorerHeader"); if (toggle) toggle.textContent = root && root.classList.contains("mobileFiltersOpen") ? "Hide filters" : "Filters" + (activeKeys.length ? " (" + activeKeys.length + ")" : ""); },

    renderParticipantExplorerStats: function (participants) {
      var el = document.getElementById("participantStats"); if (!el) return; var unique = function (values) { return new Set(values.filter(Boolean)).size; };
      if (App.state.participantExplorerPageData && App.state.participantExplorerPageSignature === App.participantExplorerPageQuery().signature) {
        var page = App.state.participantExplorerPageData.pagination || {}, projected = App.state.participantFilterProjection && App.state.participantFilterProjection.values || {};
        el.innerHTML = [[Number(page.total || 0), "Total Participants"], [(projected.schools || []).length, "Schools"], [(projected.categories || projected.disciplines || []).length, "Categories"]].map(function (item) { return '<article><strong>' + item[0] + '</strong><span>' + App.escapeHtml(item[1]) + '</span></article>'; }).join("");
        return;
      }
      var stats = [[participants.length, "Total Participants"], [unique(participants.map(App.getParticipantSchool)), "Schools"], [unique(participants.reduce(function (all, participant) { return all.concat(App.getParticipantCategories(participant)); }, [])), "Categories"], [participants.filter(function (p) { return p.featuredPerformer; }).length, "Featured Performers"], [participants.filter(App.participantMatchesCulturalIdentity).length, "Aboriginal / TSI"], [participants.filter(function (p) { return App.participantNotesContain(p, /\blote\b/i); }).length, "LOTE / EAL-D"], [participants.filter(function (p) { return App.participantNotesContain(p, /\bsupport\s+needed\b/i); }).length, "Support Needed"], [participants.filter(function (p) { return App.participantNotesContain(p, /\b1st\b/i); }).length, "First Time"], [participants.filter(function (p) { return p.returningStudent; }).length, "Returning"], [participants.filter(App.participantHasAttendanceToday).length, "Attendance Today"]];
      el.innerHTML = stats.filter(function (item) { return Number(item[0]) > 0 || ["Total Participants", "Schools", "Categories"].includes(item[1]); }).map(function (item) { return '<article><strong>' + item[0] + '</strong><span>' + App.escapeHtml(item[1]) + '</span></article>'; }).join("");
    },

    renderParticipantGroupStats: function (groups) {
      var el = document.getElementById("participantStats"); if (!el) return;
      var schools = new Set(), categories = new Set(), students = 0;
      groups.forEach(function (group) { if (group.school) schools.add(group.school); if (group.category) categories.add(group.category); students += App.parseParticipantCount(App.getGroupStudentCount(group)); });
      el.innerHTML = [[groups.length, "School Groups"], [students, "Students represented"], [schools.size, "Schools"], [categories.size, "Categories"]].map(function (item) { return '<article><strong>' + item[0] + '</strong><span>' + App.escapeHtml(item[1]) + '</span></article>'; }).join("");
    },

    getParticipantColumns: function (includeHidden) { var columns = [["name", "Name"], ["school", "School"], ["category", "Category"], ["item", "Item"], ["year", "Yr"], ["region", "Region"], ["status", "Status"]]; return includeHidden ? columns : columns.filter(function (column) { return !(App.state.participantHiddenColumns || []).includes(column[0]); }); },

    // Individuals are server-paginated, so participantExplorerPageData only ever

    buildParticipantExcelWorkbook: function (headers, rows, sheetName) { var cell = function (value, style) { return '<Cell' + (style ? ' ss:StyleID="' + style + '"' : '') + '><Data ss:Type="String">' + App.escapeParticipantExcelXml(value) + '</Data></Cell>'; }; var table = '<Row>' + headers.map(function (header) { return cell(header, "Header"); }).join("") + '</Row>' + rows.map(function (row) { return '<Row>' + row.map(function (value) { return cell(value, "Body"); }).join("") + '</Row>'; }).join(""); return '<?xml version="1.0" encoding="UTF-8"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="Header"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#1256CF" ss:Pattern="Solid"/></Style><Style ss:ID="Body"><Alignment ss:Vertical="Center" ss:WrapText="1"/></Style></Styles><Worksheet ss:Name="' + App.escapeParticipantExcelXml(sheetName) + '"><Table>' + table + '</Table></Worksheet></Workbook>'; },

    getParticipantNextRehearsal: function (participant) { var today = App.toDateKey(new Date()), category = String(App.getParticipantCategory(participant) || "").toLowerCase(), detail = String(App.getParticipantCategoryDetail(participant) || "").toLowerCase(), items = App.getParticipantItems(participant).map(function (item) { return item.toLowerCase(); }), school = String(App.getParticipantSchool(participant) || "").toLowerCase(); var event = App.participantArray((App.state.calendarData && App.state.calendarData.events) || App.state.rehearsals).filter(function (event) { return event && (!event.dateKey || event.dateKey >= today); }).find(function (event) { var selections = App.participantArray(event.categories).concat(App.participantArray(event.studentGroups), App.participantArray(event.items)).map(function (value) { return String(value).toLowerCase(); }); var schools = App.participantArray(event.schoolGroups).map(function (value) { return String(value).toLowerCase(); }); return selections.includes(category) || selections.includes(detail) || items.some(function (item) { return selections.includes(item); }) || schools.includes(school); }); return event ? [event.date, event.start].filter(Boolean).join(" · ") : "Not scheduled"; },
