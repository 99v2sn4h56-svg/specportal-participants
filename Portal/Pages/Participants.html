<template id="page-participants">
  <div class="participantExplorer">
    <section class="panel participantExplorerHeader">
      <div class="participantExplorerActions">
        <input id="participantSearch" class="participantSearch" type="search" placeholder="Search name, school, item, teacher, ID, email or group…" autocomplete="off" oninput="App.queueParticipantExplorer()">
        <select id="participantSavedView" class="filterSelect" onchange="App.applyParticipantSavedView(this.value)" aria-label="Saved view"></select>
        <select id="participantLayout" class="filterSelect" onchange="App.applyParticipantLayout(this.value)" aria-label="Table layout"><option value="default">Default columns</option><option value="compact">Compact columns</option><option value="production">Production columns</option></select>
      </div>
      <div id="participantQuickFilters" class="participantQuickFilters"></div>
      <div id="participantDropdownFilters" class="participantDropdownFilters"></div>
    </section>

    <div id="participantStats" class="participantExplorerStats" aria-live="polite"></div>

    <div class="participantExplorerBody">
      <section class="panel participantTablePanel">
        <div class="participantTableToolbar"><div id="participantStatus" class="status">Loading participant data…</div><div id="participantActiveFilters" class="participantActiveFilters"></div></div>
        <div id="participantResults" class="participantDatabase"></div>
        <div id="participantPagination" class="participantPagination"></div>
      </section>
    </div>

  </div>
</template>

<script>
  Object.assign(App, {
    participantSavedViews: {
      all: { label: "All Participants", filters: {} },
      featured: { label: "Featured Performers", filters: { featuredPerformer: true } },
      aboriginal: { label: "Aboriginal Students", filters: { aboriginal: true } },
      lote: { label: "LOTE Students", filters: { hasLote: true } },
      support: { label: "Support Plans", filters: { hasSupportPlan: true } },
      medical: { label: "Medical", filters: { hasMedicalAlert: true } },
      attendanceToday: { label: "Today's Attendance", filters: { attendanceToday: true } },
      secondaryChoir: { label: "Secondary Choir", filters: { productionText: "secondary choir" } },
      combinedDance: { label: "Combined Dance", filters: { productionText: "combined dance" } },
      myStudents: { label: "My Students", filters: { myStudents: true } },
      recent: { label: "Recently Updated", filters: { recentlyUpdated: true } }
    },

    renderParticipantExplorer: function () {
      var root = document.querySelector(".participantExplorer");
      if (!root) return;
      if (!App.state.ready) {
        var results = document.getElementById("participantResults");
        if (results) results.innerHTML = App.loadingState("Loading participant database");
        App.ensurePortalDataLoaded().then(App.renderParticipantExplorer).catch(function (error) { if (results) results.innerHTML = App.emptyState("Participant data unavailable", App.getErrorMessage(error)); });
        return;
      }
      try {
        App.initialiseParticipantExplorer();
        var filtered = App.getFilteredParticipants();
        App.renderParticipantSavedViews();
        App.renderParticipantExplorerStats(filtered);
        App.renderParticipantFilterPanel();
        App.renderParticipantQuickFilters();
        App.renderParticipantActiveFilters();
        App.renderParticipantTable(filtered);
      } catch (error) {
        var failed = document.getElementById("participantResults");
        if (failed) failed.innerHTML = App.emptyState("Participant explorer could not render", App.getErrorMessage(error));
        var status = document.getElementById("participantStatus");
        if (status) status.textContent = "Explorer error: " + App.getErrorMessage(error);
        App.notify("Participant explorer error: " + App.getErrorMessage(error));
      }
    },

    initialiseParticipantExplorer: function () {
      if (!App.state.participantExplorerInitialised) {
        App.state.participantExplorerFilters = App.state.participantExplorerFilters || {};
        App.state.participantExplorerPage = 1;
        App.state.participantExplorerSort = { key: "name", direction: "asc" };
        App.state.participantExplorerLayout = sessionStorage.getItem("specParticipantLayout") || "default";
        try { App.state.participantHiddenColumns = JSON.parse(sessionStorage.getItem("specParticipantHiddenColumns") || "[]"); } catch (error) { App.state.participantHiddenColumns = []; }
        App.state.participantExplorerInitialised = true;
      }
      var search = document.getElementById("participantSearch");
      if (search && search.value !== (App.state.participantExplorerSearch || "")) search.value = App.state.participantExplorerSearch || "";
      var layout = document.getElementById("participantLayout"); if (layout) layout.value = App.state.participantExplorerLayout;
    },

    queueParticipantExplorer: function () {
      clearTimeout(App.state.participantSearchTimer);
      App.state.participantSearchTimer = setTimeout(function () { var input = document.getElementById("participantSearch"); App.state.participantExplorerSearch = String(input && input.value || ""); App.state.participantExplorerPage = 1; App.renderParticipantExplorer(); }, 140);
    },

    getFilteredParticipants: function () {
      var filters = App.state.participantExplorerFilters || {}, query = String(App.state.participantExplorerSearch || "").trim().toLowerCase();
      var list = (App.state.participants || []).filter(function (participant) {
        var values = App.getParticipantExplorerValues(participant);
        if (query && values.search.indexOf(query) < 0) return false;
        if (filters.category && !values.categories.includes(filters.category)) return false;
        if (filters.item && values.item !== filters.item) return false;
        if (filters.school && values.school !== filters.school) return false;
        if (filters.region && values.region !== filters.region) return false;
        if (filters.year && values.year !== filters.year) return false;
        if (filters.gender && values.gender !== filters.gender) return false;
        if (filters.directorate && values.directorate !== filters.directorate) return false;
        if (filters.status && values.status !== filters.status) return false;
        if (filters.participationType && values.participationType !== filters.participationType) return false;
        if (filters.segment && values.segment !== filters.segment) return false;
        if (filters.staffAllocation && values.staffAllocation !== filters.staffAllocation) return false;
        if (filters.rehearsal && !App.participantMatchesRehearsal(participant, filters.rehearsal)) return false;
        if (filters.teacher && values.teacher !== filters.teacher) return false;
        if (filters.schoolGroup && values.schoolGroup !== filters.schoolGroup) return false;
        if (filters.productionText && values.production.indexOf(filters.productionText) < 0) return false;
        var booleans = ["aboriginal", "torresStraitIslander", "eald", "featuredPerformer", "hasSupportAdjustments", "hasSupportPlan", "hasMedicalAlert", "firstTime", "returningStudent", "supervisingTeacherRequired", "outstandingForms"];
        if (booleans.some(function (key) { return filters[key] === true && !participant[key]; })) return false;
        if (filters.hasLote && !String(participant.lote || "").trim()) return false;
        if (filters.hasAttendance && !String(participant.attendanceStatus || "").trim()) return false;
        if (filters.missingAttendance && String(participant.attendanceStatus || "").trim()) return false;
        if (filters.myStudents) { var staff = App.state.staff || {}; var mine = [staff.email, staff.displayName, staff.name].filter(Boolean).map(function (value) { return String(value).toLowerCase(); }); if (!mine.includes(String(values.teacher || "").toLowerCase()) && !mine.includes(String(participant.teacherEmail || "").toLowerCase())) return false; }
        if (filters.recentlyUpdated && !App.participantUpdatedRecently(participant)) return false;
        if (filters.attendanceToday && !App.participantHasAttendanceToday(participant)) return false;
        return true;
      });
      var sort = App.state.participantExplorerSort || { key: "name", direction: "asc" };
      return list.sort(function (a, b) { var av = sort.key === "rehearsal" ? App.getParticipantNextRehearsal(a) : App.getParticipantExplorerValues(a)[sort.key] || "", bv = sort.key === "rehearsal" ? App.getParticipantNextRehearsal(b) : App.getParticipantExplorerValues(b)[sort.key] || ""; var result = String(av).localeCompare(String(bv), undefined, { numeric: true }); return sort.direction === "desc" ? -result : result; });
    },

    getParticipantExplorerValues: function (participant) {
      var name = App.getParticipantName(participant), school = App.getParticipantSchool(participant), categories = App.getParticipantCategories(participant), category = categories.join(", "), item = App.getParticipantItem(participant), teacher = App.getParticipantTeacherName(participant) || App.getParticipantTeacherEmail(participant);
      var production = categories.concat([App.getParticipantCategoryDetail(participant), item, participant.schoolGroup]).filter(Boolean).join(" ").toLowerCase();
      return { name: name, school: school, categories: categories, category: category, item: item, year: String(App.getParticipantYear(participant) || ""), region: String(participant.region || ""), gender: String(participant.gender || "N/A"), directorate: String(participant.directorate || ""), notes: String(participant.notes || ""), status: String(participant.applicationStatus || ""), participationType: String(participant.participationType || ""), segment: String(participant.segment || ""), staffAllocation: String(participant.staffAllocation || ""), teacher: String(teacher || ""), schoolGroup: String(participant.schoolGroup || ""), attendance: String(participant.attendanceStatus || ""), production: production, search: [name, school, category, App.getParticipantCategoryDetail(participant), item, teacher, participant.teacherEmail, participant.applicationId, participant.studentId, participant.studentEmail, participant.schoolGroup, participant.participationType, participant.segment, participant.staffAllocation, participant.notes].filter(Boolean).join(" ").toLowerCase() };
    },

    getParticipantCategories: function (participant) { var source = App.getParticipantDiscipline(participant) || App.getParticipantCategory(participant) || ""; var seen = {}; return App.participantArray(source).map(function (value) { return String(value || "").trim(); }).filter(function (value) { var key = value.toLowerCase(); if (!value || seen[key]) return false; seen[key] = true; return true; }); },

    getParticipantFacets: function () {
      var fields = ["category", "item", "school", "region", "year", "gender", "directorate", "status", "participationType", "segment", "staffAllocation", "teacher", "schoolGroup"], facets = {};
      fields.forEach(function (field) { facets[field] = []; });
      (App.state.participants || []).forEach(function (participant) { var values = App.getParticipantExplorerValues(participant); fields.forEach(function (field) { if (field === "category") { values.categories.forEach(function (category) { if (!facets.category.includes(category)) facets.category.push(category); }); } else if (values[field] && facets[field].indexOf(values[field]) < 0) facets[field].push(values[field]); }); });
      fields.forEach(function (field) { facets[field].sort(function (a, b) { return String(a).localeCompare(String(b), undefined, { numeric: true }); }); });
      facets.rehearsal = App.participantArray((App.state.calendarData && App.state.calendarData.events) || App.state.rehearsals).filter(function (event) { return event && event.eventType !== "Operational Event"; }).map(function (event) { return event.id || event.eventId || event.title || event.event; }).filter(function (value, index, values) { return value && values.indexOf(value) === index; });
      return facets;
    },

    renderParticipantFilterPanel: function () {
      var el = document.getElementById("participantDropdownFilters"); if (!el) return; var facets = App.getParticipantFacets();
      var fields = [["category", "Category"], ["item", "Item"], ["school", "School"], ["region", "Region"], ["year", "Year"], ["gender", "Gender"], ["directorate", "Directorate"], ["segment", "Segment"]];
      el.innerHTML = fields.map(function (field) { return App.renderParticipantFilterSelect(field[0], field[1], facets[field[0]]); }).join("") + '<details class="participantColumnChooser"><summary>Columns</summary>' + App.getParticipantColumns(true).map(function (column) { var hidden = (App.state.participantHiddenColumns || []).includes(column[0]); return '<label><input type="checkbox"' + (hidden ? '' : ' checked') + ' onchange="App.toggleParticipantColumn(\'' + column[0] + '\',this.checked)"> ' + App.escapeHtml(column[1]) + '</label>'; }).join("") + '</details><button class="quickLink compact participantClearFilters" type="button" onclick="App.clearParticipantExplorerFilters()">Clear filters</button>';
    },

    renderParticipantFilterSelect: function (key, label, values) { var selected = (App.state.participantExplorerFilters || {})[key] || ""; return '<label class="participantFilterField"><span>' + App.escapeHtml(label) + '</span><select class="filterSelect" onchange="App.setParticipantExplorerFilter(\'' + key + '\',this.value)"><option value="">All</option>' + (values || []).map(function (value) { return '<option' + (selected === value ? ' selected' : '') + '>' + App.escapeHtml(value) + '</option>'; }).join("") + '</select></label>'; },
    setParticipantExplorerFilter: function (key, value) { if (value === false || value === "") delete App.state.participantExplorerFilters[key]; else App.state.participantExplorerFilters[key] = value; App.state.participantExplorerPage = 1; App.renderParticipantExplorer(); },
    clearParticipantExplorerFilters: function () { App.state.participantExplorerFilters = {}; App.state.participantExplorerSearch = ""; App.state.participantExplorerSavedView = "all"; App.state.participantExplorerPage = 1; App.renderParticipantExplorer(); },
    renderParticipantQuickFilters: function () { var el = document.getElementById("participantQuickFilters"); if (!el) return; var quick = [["featuredPerformer", "Featured"], ["aboriginal", "Aboriginal"], ["torresStraitIslander", "Torres Strait Islander"], ["eald", "EAL/D"], ["hasLote", "LOTE"], ["hasSupportAdjustments", "Support adjustments"], ["hasSupportPlan", "Support plan"], ["hasMedicalAlert", "Medical"], ["firstTime", "First time"], ["returningStudent", "Returning"], ["supervisingTeacherRequired", "Teacher required"], ["outstandingForms", "Outstanding forms"], ["hasAttendance", "Has attendance"], ["missingAttendance", "Missing attendance"]]; el.innerHTML = quick.map(function (item) { var active = !!(App.state.participantExplorerFilters || {})[item[0]]; return '<button class="filterChip ' + (active ? 'active' : '') + '" type="button" onclick="App.setParticipantExplorerFilter(\'' + item[0] + '\',' + (!active) + ')">' + App.escapeHtml(item[1]) + '</button>'; }).join(""); },
    renderParticipantActiveFilters: function () { var el = document.getElementById("participantActiveFilters"); if (!el) return; var filters = App.state.participantExplorerFilters || {}; var chips = Object.keys(filters).filter(function (key) { return filters[key] !== false && filters[key] !== ""; }).map(function (key) { return '<button type="button" onclick="App.setParticipantExplorerFilter(\'' + key + '\',\'\')">' + App.escapeHtml(App.toTitle(key) + (filters[key] === true ? "" : ": " + filters[key])) + ' ×</button>'; }); el.innerHTML = chips.join(""); },

    renderParticipantExplorerStats: function (participants) {
      var el = document.getElementById("participantStats"); if (!el) return; var unique = function (values) { return new Set(values.filter(Boolean)).size; };
      var stats = [[participants.length, "Total Participants"], [unique(participants.map(App.getParticipantSchool)), "Schools"], [unique(participants.reduce(function (all, participant) { return all.concat(App.getParticipantCategories(participant)); }, [])), "Categories"], [participants.filter(function (p) { return p.featuredPerformer; }).length, "Featured Performers"], [participants.filter(function (p) { return p.aboriginal; }).length, "Aboriginal Students"], [participants.filter(function (p) { return String(p.lote || "").trim(); }).length, "LOTE Students"], [participants.filter(function (p) { return p.hasSupportPlan; }).length, "Support Plans"], [participants.filter(function (p) { return p.firstTime; }).length, "First Time"], [participants.filter(function (p) { return p.returningStudent; }).length, "Returning"], [participants.filter(App.participantHasAttendanceToday).length, "Attendance Today"]];
      el.innerHTML = stats.filter(function (item) { return Number(item[0]) > 0 || ["Total Participants", "Schools", "Categories"].includes(item[1]); }).map(function (item) { return '<article><strong>' + item[0] + '</strong><span>' + App.escapeHtml(item[1]) + '</span></article>'; }).join("");
    },

    getParticipantColumns: function (includeHidden) { var layouts = { default: [["name", "Name"], ["school", "School"], ["category", "Category"], ["item", "Item"], ["year", "Year"], ["region", "Region"], ["attendance", "Attendance"], ["rehearsal", "Upcoming rehearsal"], ["status", "Status"], ["notes", "Notes"]], compact: [["name", "Name"], ["school", "School"], ["category", "Category"], ["item", "Item"], ["year", "Year"], ["notes", "Notes"], ["status", "Status"]], production: [["name", "Name"], ["category", "Category"], ["item", "Item"], ["year", "Year"], ["schoolGroup", "Group"], ["teacher", "Teacher"], ["rehearsal", "Upcoming rehearsal"], ["attendance", "Attendance"], ["notes", "Notes"]] }; var columns = layouts[App.state.participantExplorerLayout] || layouts.default; return includeHidden ? columns : columns.filter(function (column) { return !(App.state.participantHiddenColumns || []).includes(column[0]); }); },
    renderParticipantTable: function (participants) { var el = document.getElementById("participantResults"), status = document.getElementById("participantStatus"), pagination = document.getElementById("participantPagination"); if (!el) return; var size = window.matchMedia && window.matchMedia("(max-width: 700px)").matches ? 20 : 50, pages = Math.max(1, Math.ceil(participants.length / size)), page = Math.min(App.state.participantExplorerPage || 1, pages), rows = participants.slice((page - 1) * size, page * size), columns = App.getParticipantColumns(); App.state.participantExplorerPage = page; if (status) status.textContent = participants.length + " matching participants · page " + page + " of " + pages; el.innerHTML = rows.length ? '<div class="participantTableWrap"><table class="participantExplorerTable"><thead><tr>' + columns.map(function (column) { var sort = App.state.participantExplorerSort || {}; return '<th><button type="button" onclick="App.sortParticipantExplorer(\'' + column[0] + '\')">' + App.escapeHtml(column[1]) + (sort.key === column[0] ? (sort.direction === "asc" ? " ↑" : " ↓") : "") + '</button></th>'; }).join("") + '<th>Open</th></tr></thead><tbody>' + rows.map(function (participant, index) { var values = App.getParticipantExplorerValues(participant); return '<tr>' + columns.map(function (column) { return '<td data-label="' + App.escapeHtml(column[1]) + '">' + App.renderParticipantCell(participant, values, column[0]) + '</td>'; }).join("") + '<td data-label="Profile"><button class="participantOpenButton" type="button" onclick="App.openExplorerParticipant(' + ((page - 1) * size + index) + ')">Passport →</button></td></tr>'; }).join("") + '</tbody></table></div>' : App.emptyState("No participants match these filters", "Clear or adjust the active filters."); if (pagination) pagination.innerHTML = '<button type="button"' + (page <= 1 ? ' disabled' : '') + ' onclick="App.changeParticipantPage(-1)">Previous</button><span>' + page + ' / ' + pages + '</span><button type="button"' + (page >= pages ? ' disabled' : '') + ' onclick="App.changeParticipantPage(1)">Next</button>'; App.state.participantExplorerCurrentRows = participants; },
    renderParticipantCell: function (participant, values, key) { if (key === "rehearsal") return App.escapeHtml(App.getParticipantNextRehearsal(participant)); if (key === "name") return '<strong>' + App.escapeHtml(values.name) + '</strong>'; if (key === "category") return values.categories.length ? '<span class="participantCategoryPills">' + values.categories.map(function (category) { return '<button class="categoryTone' + App.getParticipantCategoryTone(category) + '" type="button" onclick="App.setParticipantExplorerFilter(\'category\',\'' + App.escapeJs(category) + '\')">' + App.escapeHtml(category) + '</button>'; }).join("") + '</span>' : "—"; return App.escapeHtml(values[key] || "—"); },
    getParticipantCategoryTone: function (category) { var hash = 0, text = String(category || "").toLowerCase(); for (var i = 0; i < text.length; i++) hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0; return Math.abs(hash) % 8; },
    openExplorerParticipant: function (index) { var participant = (App.state.participantExplorerCurrentRows || [])[index]; if (participant) App.openParticipant(participant); },
    sortParticipantExplorer: function (key) { var sort = App.state.participantExplorerSort || {}; App.state.participantExplorerSort = { key: key, direction: sort.key === key && sort.direction === "asc" ? "desc" : "asc" }; App.renderParticipantExplorer(); },
    changeParticipantPage: function (delta) { App.state.participantExplorerPage = Math.max(1, (App.state.participantExplorerPage || 1) + delta); App.renderParticipantExplorer(); },
    applyParticipantLayout: function (layout) { App.state.participantExplorerLayout = layout; sessionStorage.setItem("specParticipantLayout", layout); App.renderParticipantExplorer(); },
    toggleParticipantColumn: function (key, visible) { var hidden = App.state.participantHiddenColumns || []; hidden = hidden.filter(function (item) { return item !== key; }); if (!visible) hidden.push(key); App.state.participantHiddenColumns = hidden; sessionStorage.setItem("specParticipantHiddenColumns", JSON.stringify(hidden)); App.renderParticipantExplorer(); },

    renderParticipantSavedViews: function () { var select = document.getElementById("participantSavedView"); if (!select) return; select.innerHTML = Object.keys(App.participantSavedViews).map(function (key) { return '<option value="' + key + '"' + (App.state.participantExplorerSavedView === key ? ' selected' : '') + '>' + App.escapeHtml(App.participantSavedViews[key].label) + '</option>'; }).join(""); },
    applyParticipantSavedView: function (key) { var view = App.participantSavedViews[key] || App.participantSavedViews.all; App.state.participantExplorerSavedView = key; App.state.participantExplorerFilters = Object.assign({}, view.filters); App.state.participantExplorerSearch = ""; App.state.participantExplorerPage = 1; App.renderParticipantExplorer(); },
    openParticipantsForCategory: function (category) { App.state.participantExplorerFilters = { productionText: String(category || "").toLowerCase() }; App.state.participantExplorerSavedView = ""; App.state.participantExplorerPage = 1; App.navigate("participants", { context: { category: category } }); setTimeout(App.renderParticipantExplorer, 0); },

    getParticipantNextRehearsal: function (participant) { var today = App.toDateKey(new Date()), category = String(App.getParticipantCategory(participant) || "").toLowerCase(), detail = String(App.getParticipantCategoryDetail(participant) || "").toLowerCase(), item = String(App.getParticipantItem(participant) || "").toLowerCase(), school = String(App.getParticipantSchool(participant) || "").toLowerCase(); var event = App.participantArray((App.state.calendarData && App.state.calendarData.events) || App.state.rehearsals).filter(function (event) { return event && (!event.dateKey || event.dateKey >= today); }).find(function (event) { var selections = App.participantArray(event.categories).concat(App.participantArray(event.studentGroups), App.participantArray(event.items)).map(function (value) { return String(value).toLowerCase(); }); var schools = App.participantArray(event.schoolGroups).map(function (value) { return String(value).toLowerCase(); }); return selections.includes(category) || selections.includes(detail) || selections.includes(item) || schools.includes(school); }); return event ? [event.date, event.start].filter(Boolean).join(" · ") : "Not scheduled"; },
    participantUpdatedRecently: function (participant) { var date = new Date(participant.lastUpdated || ""); return !isNaN(date.getTime()) && Date.now() - date.getTime() <= 14 * 86400000; },
    participantHasAttendanceToday: function (participant) { var today = App.toDateKey(new Date()), production = App.getParticipantExplorerValues(participant).production; return App.participantArray(App.state.attendanceEvents).some(function (event) { return event && event.dateKey === today && [event.eventName].concat(App.participantArray(event.categories), App.participantArray(event.studentGroups)).join(" ").toLowerCase().split(/[,;]+/).some(function (value) { return value.trim() && production.indexOf(value.trim()) >= 0; }); }); },
    participantMatchesRehearsal: function (participant, rehearsalId) { var event = App.participantArray((App.state.calendarData && App.state.calendarData.events) || App.state.rehearsals).find(function (item) { return item && [item.id, item.eventId, item.title, item.event].map(String).includes(String(rehearsalId)); }); if (!event) return false; var values = App.getParticipantExplorerValues(participant); var selections = App.participantArray(event.categories).concat(App.participantArray(event.studentGroups), App.participantArray(event.items)).map(function (value) { return String(value).toLowerCase(); }); return selections.includes(String(values.category).toLowerCase()) || selections.includes(String(App.getParticipantCategoryDetail(participant)).toLowerCase()) || selections.includes(String(values.item).toLowerCase()) || App.participantArray(event.schoolGroups).map(function (value) { return String(value).toLowerCase(); }).includes(String(values.school).toLowerCase()); },
    participantArray: function (value) { if (Array.isArray(value)) return value; if (value === null || value === undefined || value === "") return []; if (typeof value === "object" && Array.isArray(value.data)) return value.data; return String(value).split(/[;,\n]+/).map(function (item) { return item.trim(); }).filter(Boolean); }
  });
</script>
