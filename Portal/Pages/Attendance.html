<template id="page-attendance">
  <section class="panel">
    <h3 class="sectionTitle">Attendance</h3>
    <div id="attendancePlaceholder" class="empty">Attendance is coming soon. Configure `SPEC_CENTRAL_ATTENDANCE_URL` or `ATTENDANCE_WEB_APP_URL` to embed the existing Attendance web app here.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;">
      <button id="attendanceLaunch" class="quickLink" type="button" onclick="App.openAttendance()">Attendance Coming Soon</button>
    </div>
    <iframe
      id="attendanceFrame"
      title="Spec Central Attendance"
      style="display:none;width:100%;height:72vh;border:1px solid var(--border);border-radius:18px;background:white;"
      allowfullscreen
    ></iframe>
  </section>
</template>
