<template id="page-attendance">
  <section class="attendanceEmbed">
    <div class="attendanceOverview">
      <section class="panel attendanceHero">
        <div>
          <div class="sectionTitle">Live Attendance</div>
          <h2>Attendance overview</h2>
          <div id="attendanceSourceText" class="moduleMeta">Checking the Attendance API...</div>
          <div id="attendanceUrlText" class="moduleMeta"></div>
        </div>
        <div class="attendanceHeaderActions">
          <span id="attendanceHeroStatus" class="attendanceStatusChip">Loading</span>
          <button class="quickLink compact" type="button" onclick="App.loadAttendanceData(true)">Retry</button>
          <button id="attendanceLaunch" class="quickLink compact" type="button" onclick="App.openAttendance()">Open Attendance</button>
          <button id="attendanceQrLaunch" class="quickLink compact" type="button" onclick="App.openAttendanceQr()">Student check-in QR</button>
        </div>
      </section>
    </div>

    <div id="attendanceFramePanel" class="attendanceFramePanel">
      <div id="attendancePlaceholder" class="empty">Configure the Attendance URL to open the standalone app.</div>
      <iframe
        id="attendanceFrame"
        title="Spec Central Attendance"
        referrerpolicy="no-referrer-when-downgrade"
        onload="App.handleAttendanceFrameLoaded()"
        allowfullscreen
      ></iframe>
    </div>

    <div id="attendanceLoading" class="statePanel loadingState attendanceBelowFrame"><span class="skeletonPulse"></span><strong>Loading live Attendance</strong><small>Connecting to attendance sessions and status totals…</small></div>
    <div id="attendanceError" class="empty attendanceError attendanceBelowFrame" style="display:none;"></div>

    <section id="attendanceLiveContent" class="attendanceBelowFrame" style="display:none;">
      <div id="attendanceSummaryCards" class="attendanceSummaryGrid"></div>

      <div class="grid attendanceDataGrid">
        <section class="panel span4 attendanceOperationsPanel">
          <h3 class="sectionTitle">Attendance status</h3>
          <div id="attendanceStatusCounts" class="attendanceStatusList"></div>
        </section>
        <section class="panel span8 attendanceOperationsPanel">
          <div class="attendanceEventsHeader">
            <h3 class="sectionTitle">Upcoming events</h3>
            <input
              id="attendanceEventSearch"
              class="attendanceEventSearch"
              type="search"
              placeholder="Search events, venues, staff or categories..."
              aria-label="Search Attendance events"
              oninput="App.setAttendanceEventSearch(this.value)"
            >
          </div>
          <div class="attendanceEventFilters" role="group" aria-label="Filter Attendance events">
            <button type="button" data-attendance-filter="today" onclick="App.setAttendanceEventFilter('today')">Today</button>
            <button type="button" data-attendance-filter="week" onclick="App.setAttendanceEventFilter('week')">This Week</button>
            <button type="button" data-attendance-filter="upcoming" onclick="App.setAttendanceEventFilter('upcoming')">Upcoming</button>
            <button type="button" data-attendance-filter="all" onclick="App.setAttendanceEventFilter('all')">All</button>
          </div>
          <div id="attendanceEventList" class="attendanceEventList"></div>
        </section>
      </div>
    </section>
  </section>
</template>
