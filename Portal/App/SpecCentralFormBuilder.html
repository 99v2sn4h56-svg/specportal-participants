<script>
  (function () {
    var STORAGE_KEY = "specCentralFormDefinitionsV1";
    var types = [
      ["dropdown_single", "Dropdown — single select"], ["dropdown_multi", "Dropdown — multi select"], ["single_selection", "Single selection"],
      ["number", "Number input with validation"], ["large_text", "Large text input"], ["text_section", "Text-only section"],
      ["conditional_section", "Go to section depending on answers"], ["ranking", "Ranking question"], ["limited_response", "Limited response question"],
      ["file_upload", "File upload"], ["video_upload", "Video upload"], ["photo_upload", "Photo upload"], ["drive_link", "Google Drive link upload"],
      ["signature", "Signature input"], ["checkbox", "Checkbox input"], ["table", "Table input"]
    ];
    var mappings = [
      ["", "No response mapping"], ["responderEmail", "Responder email"], ["parentEmail", "Parent email"], ["schoolEmail", "School email"],
      ["teacherEmail", "Teacher email"], ["responderFirstName", "Responder first name"], ["responderLastName", "Responder last name"],
      ["schoolName", "School name"], ["studentId", "Student ID"], ["programCategory", "Program category"], ["applicationStatus", "Application status"]
    ];

    function load() { return App.safeLoadJson(STORAGE_KEY, []); }
    function store(items) { App.safeSaveJson(STORAGE_KEY, items); }
    function uid(prefix) { return prefix + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7); }
    function workspace() { App.state.formsWorkspace = App.state.formsWorkspace || { mode: "dashboard", status: "Draft", editorTab: "editor", responseFormId: "" }; return App.state.formsWorkspace; }
    function newForm() { return { id: uid("form"), name: "Untitled form", description: "", source: "custom", googleFormUrl: "", programId: "schools-spectacular-current", useAsApplication: false, status: "Draft", publicUrl: "", prefill: { email: true, firstName: true, lastName: false, school: true }, storage: { mode: "new", spreadsheetUrl: "", spreadsheetName: "", folderUrl: "", folderName: "" }, workflow: { confirmation: { enabled: false, recipientField: "responderEmail", recipientEmail: "", subject: "We received your {{formName}} response", body: "<p>Thank you. Your response has been received.</p><p>Reference: {{responseId}}</p>" }, steps: [] }, questions: [], responseCount: 0, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }; }
    function newQuestion(type) { var match = types.filter(function (item) { return item[0] === type; })[0]; return { id: uid("question"), type: type, label: match ? match[1] : "Question", help: "", required: false, options: ["Option 1", "Option 2"], mapping: "", min: "", max: "", step: "1", limit: "1", branchAnswer: "", branchTarget: "", rows: "Row 1\nRow 2", columns: "Column 1\nColumn 2", maxSize: "25", uploadFolderName: "", filePrefix: "{{responderFirstName}}_{{schoolName}}", rankingTopLabel: "Highest preference", rankingBottomLabel: "Lowest preference" }; }
    function selectedForm() { var forms = load(), id = App.state.selectedFormDefinitionId || sessionStorage.getItem("specCentralSelectedFormDefinition") || "", form; if (window.__specCentralTransientForm && (!id || window.__specCentralTransientForm.id === id)) return window.__specCentralTransientForm; form = forms.filter(function (item) { return item.id === id; })[0]; return form || forms[0] || newForm(); }
    function setSelected(form) { App.state.selectedFormDefinitionId = form.id; sessionStorage.setItem("specCentralSelectedFormDefinition", form.id); }
    function formatDate(value) { if (!value) return "No responses yet"; try { return new Date(value).toLocaleString("en-AU", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" }); } catch (_) { return value; } }
    function programName(id) { return ({"schools-spectacular-current":"Schools Spectacular — current production","schools-spectacular-next":"Schools Spectacular — next production"})[id] || "Reusable form"; }
    function typeOptions(value) { return types.map(function (item) { return '<option value="' + App.escapeHtml(item[0]) + '"' + (item[0] === value ? " selected" : "") + '>' + App.escapeHtml(item[1]) + '</option>'; }).join(""); }
    function mappingOptions(value) { return mappings.map(function (item) { return '<option value="' + App.escapeHtml(item[0]) + '"' + (item[0] === value ? " selected" : "") + '>' + App.escapeHtml(item[1]) + '</option>'; }).join(""); }
    function programOptions(value) { return [["schools-spectacular-current","Schools Spectacular — current production"],["schools-spectacular-next","Schools Spectacular — next production"],["","Reusable form — no program"]].map(function (item) { return '<option value="' + item[0] + '"' + (item[0] === value ? " selected" : "") + '>' + item[1] + '</option>'; }).join(""); }
    function pill(options, selected, handler) { return '<div class="scPillSlider" role="tablist">' + options.map(function (option) { return '<button type="button" class="' + (option.value === selected ? 'active' : '') + '" onclick="' + handler + '(\'' + App.escapeJs(option.value) + '\')">' + App.escapeHtml(option.label) + (option.count == null ? '' : '<b>' + option.count + '</b>') + '</button>'; }).join('') + '</div>'; }

    App.renderFormBuilderPage = function () {
      if (!document.getElementById("scFormsDashboard")) return;
      loadSharedDefinitions();
      var mode = workspace().mode;
      document.getElementById("scFormsDashboard").hidden = mode !== "dashboard";
      document.getElementById("scFormsEditor").hidden = mode !== "editor";
      document.getElementById("scFormsResponses").hidden = mode !== "responses";
      if (mode === "editor") renderEditor(); else if (mode === "responses") renderResponses(); else renderDashboard();
    };

    function loadSharedDefinitions() {
      if (!App.state.sharedClientCache || App.state.sharedFormDefinitionsLoaded || App.state.sharedFormDefinitionsLoading) return;
      App.state.sharedFormDefinitionsLoading = true;
      App.services.request("formsWorkspace", "portalGetFormsWorkspaceData", { args: [workspace().responseFormId || ""], forceRefresh: true, timeoutMs: 30000 }).then(function (data) {
        App.state.sharedFormDefinitionsLoaded = true; App.state.sharedFormDefinitionsLoading = false; App.state.formsWorkspaceData = data || {};
        if (data && Array.isArray(data.forms)) store(data.forms);
        if (App.state.currentPage === "formBuilder") App.renderFormBuilderPage();
      }).catch(function () { App.state.sharedFormDefinitionsLoaded = true; App.state.sharedFormDefinitionsLoading = false; });
    }

    function renderDashboard() {
      var forms = load(), status = workspace().status || "Draft", visible = forms.filter(function (form) { return (form.status || "Draft") === status; });
      document.getElementById("scFormsHeaderActions").innerHTML = '<button class="quickLink primaryAction" type="button" onclick="App.newFormDefinition()">+ New form</button>';
      var counts = ["Draft","Published","Archived"].reduce(function (out, key) { out[key] = forms.filter(function (form) { return (form.status || "Draft") === key; }).length; return out; }, {});
      document.getElementById("scFormsDashboard").innerHTML = '<section class="panel scFormsDashboardPanel">' +
        '<div class="scFormsDashboardToolbar"><div><div class="scProfileKicker">Form library</div><h3>' + App.escapeHtml(status) + ' forms</h3></div>' + pill([{value:"Draft",label:"Drafts",count:counts.Draft},{value:"Published",label:"Published",count:counts.Published},{value:"Archived",label:"Archived",count:counts.Archived}], status, "App.setFormsStatusFilter") + '</div>' +
        '<div class="scFormsCardGrid">' + (visible.length ? visible.map(formCard).join('') : App.emptyState("No " + status.toLowerCase() + " forms", status === "Draft" ? "Create a form to begin." : "Forms will appear here when their status changes.")) + '</div></section>';
    }

    function formCard(form) {
      var archived = form.status === "Archived", responses = Number(form.responseCount || 0), spreadsheet = form.storage && form.storage.spreadsheetUrl || "";
      return '<article class="scFormsCard"><header><div><span class="scFormSourceBadge">' + App.escapeHtml(form.source === "google" ? "Google Form" : "SpecCentral form") + '</span><h3>' + App.escapeHtml(form.name) + '</h3><p>' + App.escapeHtml(form.description || "No description") + '</p></div><span class="statusChip">' + App.escapeHtml(form.status || "Draft") + '</span></header>' +
        '<div class="scFormCardStats"><div><strong>' + responses + '</strong><span>Responses</span></div><div><strong>' + (form.questions || []).length + '</strong><span>Items</span></div><div><strong>' + App.escapeHtml(formatDate(form.lastResponseAt)) + '</strong><span>Latest response</span></div></div>' +
        '<div class="scFormCardMeta"><span>' + App.escapeHtml(programName(form.programId)) + '</span><span>Updated ' + App.escapeHtml(formatDate(form.updatedAt)) + '</span></div>' +
        '<footer>' + (archived ? '<button type="button" onclick="App.setFormLifecycleStatus(\'' + App.escapeJs(form.id) + '\',\'Draft\')">Restore</button>' : '<button type="button" onclick="App.editFormDefinition(\'' + App.escapeJs(form.id) + '\')">Edit</button>') +
        (!archived && form.publicUrl ? '<a href="' + App.escapeHtml(form.publicUrl) + '" target="_blank" rel="noopener">Open form</a>' : '') +
        '<button type="button" onclick="App.openFormResponses(\'' + App.escapeJs(form.id) + '\')">Responses</button>' +
        (spreadsheet ? '<a href="' + App.escapeHtml(spreadsheet) + '" target="_blank" rel="noopener">Google Sheet</a>' : '') +
        '<button type="button" onclick="App.duplicateFormDefinition(\'' + App.escapeJs(form.id) + '\')">Duplicate form</button>' +
        (!archived ? '<button class="danger" type="button" onclick="App.setFormLifecycleStatus(\'' + App.escapeJs(form.id) + '\',\'Archived\')">Archive</button>' : '') + '</footer></article>';
    }

    App.setFormsStatusFilter = function (status) { workspace().status = status; renderDashboard(); };
    App.showFormsDashboard = function () { window.__specCentralTransientForm = null; workspace().mode = "dashboard"; App.renderFormBuilderPage(); };
    App.openFormsResponses = function () { var forms = load().filter(function (form) { return form.status !== "Archived"; }); workspace().responseFormId = workspace().responseFormId || (forms[0] && forms[0].id) || ""; workspace().mode = "responses"; App.renderFormBuilderPage(); };
    App.openFormResponses = function (id) { workspace().responseFormId = id; workspace().mode = "responses"; App.state.formsResponseDataFor = ""; App.renderFormBuilderPage(); };

    function renderResponses() {
      var forms = load(), id = workspace().responseFormId || (forms[0] && forms[0].id) || "", form = forms.filter(function (item) { return item.id === id; })[0] || forms[0];
      if (form) workspace().responseFormId = form.id;
      document.getElementById("scFormsHeaderActions").innerHTML = '<button class="quickLink" type="button" onclick="App.showFormsDashboard()">← Forms dashboard</button>';
      var data = App.state.formsWorkspaceData || {}, responses = data.responses || [];
      if (App.state.formsResponseDataFor !== id && App.state.sharedClientCache) {
        App.state.formsResponseDataFor = id;
        App.services.request("formsResponses:" + id, "portalGetFormsWorkspaceData", { args: [id], forceRefresh: true, timeoutMs: 30000 }).then(function (next) { App.state.formsWorkspaceData = next || {}; if (next && Array.isArray(next.forms)) store(next.forms); if (workspace().mode === "responses" && workspace().responseFormId === id) renderResponses(); }).catch(function () {});
      }
      if (!form) { document.getElementById("scFormsResponses").innerHTML = '<section class="panel">' + App.emptyState("No forms yet", "Create a form before viewing responses.") + '</section>'; return; }
      var summary = (data.forms || forms).filter(function (item) { return item.id === form.id; })[0] || form;
      document.getElementById("scFormsResponses").innerHTML = '<section class="panel scResponsesWorkspace"><div class="scResponsesTop"><div><div class="scProfileKicker">Responses</div><h3>' + App.escapeHtml(form.name) + '</h3></div><label><span>View responses for</span><select onchange="App.openFormResponses(this.value)">' + forms.map(function (item) { return '<option value="' + App.escapeHtml(item.id) + '"' + (item.id === form.id ? ' selected' : '') + '>' + App.escapeHtml(item.name) + '</option>'; }).join('') + '</select></label></div>' +
        '<div class="scResponseSummaryCards"><div><strong>' + Number(summary.responseCount || 0) + '</strong><span>Total responses</span></div><div><strong>' + Number(summary.matchedStudents || 0) + '</strong><span>Matched students</span></div><div><strong>' + Number(summary.matchedStaff || 0) + '</strong><span>Matched staff</span></div><div><strong>' + Number(summary.unmatchedResponses || 0) + '</strong><span>Unmatched</span></div></div>' +
        '<div class="scResponsesActions">' + (form.storage && form.storage.spreadsheetUrl ? '<a class="quickLink primaryAction" href="' + App.escapeHtml(form.storage.spreadsheetUrl) + '" target="_blank" rel="noopener">Open Google Sheet</a>' : '') + (form.publicUrl ? '<a class="quickLink" href="' + App.escapeHtml(form.publicUrl) + '" target="_blank" rel="noopener">Open respondent form</a>' : '') + '</div>' +
        '<div class="scResponsesList"><div class="dashboardPanelHeading"><div><div class="scProfileKicker">Latest activity</div><h3>Recent responses</h3></div></div>' + (responses.length ? responses.slice(0,50).map(responseRow).join('') : App.emptyState("No responses yet", "Responses will appear here as forms are submitted.")) + '</div></section>';
    }
    function responseRow(item) { var steps=item.workflow&&item.workflow.steps||[];return '<article class="'+(steps.length?'hasWorkflow':'')+'"><span class="scResponseAvatar">' + App.escapeHtml((item.profileName || item.profileEmail || '?').charAt(0).toUpperCase()) + '</span><div><strong>' + App.escapeHtml(item.profileName || item.profileEmail || "Unmatched respondent") + '</strong><small>' + App.escapeHtml([item.profileType || "Unmatched", formatDate(item.submittedAt), item.responseId].join(" · ")) + '</small>'+(steps.length?'<div class="scResponseWorkflow"><b>'+App.escapeHtml(item.workflow.status)+'</b>'+steps.map(function(step){return'<span class="'+(step.status==='Complete'?'complete':'pending')+'">'+App.escapeHtml(step.title)+' · '+App.escapeHtml(step.status)+(step.completedBy?' by '+App.escapeHtml(step.completedBy):step.assigneeEmail?' · '+App.escapeHtml(step.assigneeEmail):'')+'</span>';}).join('')+'</div>':'')+'</div>' + (item.spreadsheetUrl ? '<a href="' + App.escapeHtml(item.spreadsheetUrl) + '" target="_blank" rel="noopener">Open</a>' : '') + '</article>'; }

    App.newFormDefinition = function () { var form = newForm(); window.__specCentralTransientForm = form; setSelected(form); workspace().mode = "editor"; workspace().editorTab = "editor"; App.renderFormBuilderPage(); };
    App.editFormDefinition = function (id) { var form = load().filter(function (item) { return item.id === id; })[0]; if (!form) return; window.__specCentralTransientForm = JSON.parse(JSON.stringify(form)); setSelected(form); workspace().mode = "editor"; workspace().editorTab = "editor"; App.renderFormBuilderPage(); };
    App.loadFormDefinition = App.editFormDefinition;

    function renderEditor() {
      var form = selectedForm(), tab = workspace().editorTab || "editor"; setSelected(form);
      document.getElementById("scFormsHeaderActions").innerHTML = '<button class="quickLink" type="button" onclick="App.showFormsDashboard()">← Forms dashboard</button><button class="quickLink primary" type="button" onclick="App.saveFormDefinition()">Save</button><button class="quickLink primaryAction" type="button" onclick="App.publishFormDefinition()">Publish &amp; get link</button>';
      document.getElementById("scFormEditorTop").innerHTML = '<section class="panel scFormEditorInfo"><div class="dashboardPanelHeading"><div><div class="scProfileKicker">Form information</div><h3>' + App.escapeHtml(form.name) + '</h3><p class="moduleMeta">' + App.escapeHtml(form.description || "Add a description for respondents and administrators.") + '</p></div><span class="statusChip">' + App.escapeHtml(form.status || "Draft") + '</span></div><div id="scFormSettings"></div></section><section class="panel scEditorModeBar"><div><strong>Design, test and automate this form</strong><span>Configure the form, respondent preview and post-submission workflow.</span></div>' + pill([{value:"editor",label:"Editor"},{value:"preview",label:"Preview"},{value:"workflow",label:"Workflow"}], tab, "App.setFormEditorTab") + '</section>';
      renderFormDefinitionSettings(form);
      if (tab === "preview") {
        document.getElementById("scFormEditorBody").innerHTML = '<section class="panel scFormPreview" id="scFormPreview">' + previewHeader(form) + previewHtml(form, App.state.currentUser || App.state.staff || {}) + '</section>';
        bindRankingLists(document.getElementById("scFormPreview"));
      } else if (tab === "workflow") {
        document.getElementById("scFormEditorBody").innerHTML = workflowHtml(form);
      } else {
        document.getElementById("scFormEditorBody").innerHTML = '<div class="scFormBuilderGrid"><div class="scFormCanvas"><section class="panel" id="scFormQuestions"></section></div><aside class="panel scQuestionPalette"><div class="scProfileKicker">Add an item</div><h3>Question types</h3><div id="scQuestionTypes" class="scQuestionTypeList">' + types.map(function (item) { return '<button type="button" onclick="App.addFormQuestion(\'' + item[0] + '\')"><b>+</b><span>' + App.escapeHtml(item[1]) + '</span></button>'; }).join('') + '</div><div class="scResponseMapGuide"><h4>Automatic response fields</h4><p>Mappings power profile matching, notifications and filename merge fields.</p><div id="scResponseMapTokens">' + mappings.slice(1).map(function (item) { return '<span>' + App.escapeHtml(item[1]) + '</span>'; }).join('') + '</div></div></aside></div>';
        renderFormDefinitionQuestions(form);
      }
    }

    App.setFormEditorTab = function (tab) { window.__specCentralTransientForm = collectFormDefinition(); workspace().editorTab = tab; renderEditor(); };
    App.previewFormDefinition = function () { App.setFormEditorTab("preview"); };
    function previewHeader(form) { return '<div class="dashboardPanelHeading"><div><div class="scProfileKicker">Respondent preview</div><h3>' + App.escapeHtml(form.name) + '</h3></div><span class="statusChip">Preview</span></div>'; }

    function renderFormDefinitionSettings(form) {
      var el = document.getElementById("scFormSettings"); if (!el) return;
      el.innerHTML = '<div class="scFormSettingsGrid"><label class="span2"><span>Form name</span><input id="scFormName" value="' + App.escapeHtml(form.name) + '"></label><label class="span2"><span>Description</span><textarea id="scFormDescription" rows="2">' + App.escapeHtml(form.description) + '</textarea></label><fieldset class="span2"><legend>Form source</legend><label><input type="radio" name="scFormSource" value="custom"' + (form.source !== "google" ? " checked" : "") + ' onchange="App.toggleFormDefinitionSource()"> Build in SpecCentral</label><label><input type="radio" name="scFormSource" value="google"' + (form.source === "google" ? " checked" : "") + ' onchange="App.toggleFormDefinitionSource()"> Existing Google Form</label></fieldset><label id="scGoogleFormField" class="span2"' + (form.source === "google" ? "" : " hidden") + '><span>Google Form URL</span><input id="scGoogleFormUrl" type="url" placeholder="https://docs.google.com/forms/..." value="' + App.escapeHtml(form.googleFormUrl || "") + '"><small>Question labels below should match Google Form titles.</small></label><label><span>Assign to program</span><select id="scFormProgram">' + programOptions(form.programId) + '</select></label><label class="scApplicationAssignment"><input id="scUseAsApplication" type="checkbox"' + (form.useAsApplication ? " checked" : "") + '> Use as the program application</label></div>' +
        '<div class="scLoginPrefill"><div><div class="scProfileKicker">Current login prefill</div><strong>Prefill matched user information</strong></div><div>' + prefill("email","Email",form.prefill) + prefill("firstName","First name",form.prefill) + prefill("lastName","Last name",form.prefill) + prefill("school","School",form.prefill) + '</div></div>' + storageSettings(form) + (form.publicUrl ? '<div class="scPublishedFormLink"><div><strong>Form link for respondents</strong><a href="' + App.escapeHtml(form.publicUrl) + '" target="_blank" rel="noopener">' + App.escapeHtml(form.publicUrl) + '</a></div><button class="quickLink compact" type="button" onclick="App.copyPublishedFormLink()">Copy link</button></div>' : '');
    }
    App.renderFormDefinitionSettings = renderFormDefinitionSettings;
    function storageSettings(form) { var storage = form.storage || {}; return '<div class="scFormDestination"><div><div class="scProfileKicker">Response destination</div><h4>Google Drive and spreadsheet</h4></div><div class="scFormSettingsGrid"><label><span>Spreadsheet</span><select id="scStorageMode"><option value="new"' + (storage.mode !== "existing" ? ' selected' : '') + '>Create a new spreadsheet</option><option value="existing"' + (storage.mode === "existing" ? ' selected' : '') + '>Use an existing spreadsheet</option></select></label><label><span>New spreadsheet name</span><input id="scSpreadsheetName" value="' + App.escapeHtml(storage.spreadsheetName || form.name + ' — responses') + '"></label><label class="span2"><span>Existing spreadsheet URL or ID</span><input id="scSpreadsheetUrl" value="' + App.escapeHtml(storage.spreadsheetUrl || '') + '"></label><label class="span2"><span>Response folder URL or ID</span><input id="scFolderUrl" value="' + App.escapeHtml(storage.folderUrl || '') + '"></label><label><span>New folder name</span><input id="scFolderName" value="' + App.escapeHtml(storage.folderName || form.name + ' — responses') + '"></label></div></div>'; }
    function prefill(key,label,values) { return '<label><input type="checkbox" data-sc-prefill="' + key + '"' + (values && values[key] ? ' checked' : '') + '> ' + label + '</label>'; }

    function renderFormDefinitionQuestions(form) { var el = document.getElementById("scFormQuestions"); if (!el) return; el.innerHTML = '<div class="dashboardPanelHeading"><div><div class="scProfileKicker">Form editor</div><h3>Questions and sections</h3></div><span class="statusChip">' + form.questions.length + ' items</span></div><div id="scFormQuestionList">' + (form.questions.length ? form.questions.map(renderQuestion).join('') : App.emptyState("No questions yet", "Choose a question type from the palette.")) + '</div>'; }
    App.renderFormDefinitionQuestions = renderFormDefinitionQuestions;
    function renderQuestion(item,index) {
      var advanced = "", optionsTypes = ["dropdown_single","dropdown_multi","single_selection","ranking","checkbox","conditional_section"];
      if (optionsTypes.indexOf(item.type) >= 0) advanced += field("Options — one per line","options",(item.options || []).join("\n"),"textarea","span2");
      if (item.type === "ranking") advanced += field("Top of ranking means","rankingTopLabel",item.rankingTopLabel || "Highest preference") + field("Bottom of ranking means","rankingBottomLabel",item.rankingBottomLabel || "Lowest preference");
      if (item.type === "number") advanced += field("Minimum","min",item.min,"number") + field("Maximum","max",item.max,"number") + field("Increment","step",item.step || 1,"number");
      if (item.type === "limited_response") advanced += field("Maximum accepted responses","limit",item.limit || 1,"number");
      if (item.type === "conditional_section") advanced += field("When answer equals","branchAnswer",item.branchAnswer) + field("Go to section","branchTarget",item.branchTarget);
      if (["file_upload","video_upload","photo_upload"].indexOf(item.type) >= 0) advanced += field("Maximum file size (MB)","maxSize",item.maxSize || 25,"number") + field("Upload subfolder name","uploadFolderName",item.uploadFolderName || item.label) + field("Filename prefix","filePrefix",item.filePrefix || "{{responderFirstName}}_{{schoolName}}","text","span2");
      if (item.type === "table") advanced += field("Rows","rows",item.rows,"textarea") + field("Columns","columns",item.columns,"textarea");
      return '<article class="scFormQuestion" data-sc-question="' + App.escapeHtml(item.id) + '"><div class="scFormQuestionHeader"><span>' + (index + 1) + '</span><select data-sc-q="type" onchange="App.changeFormQuestionType(\'' + App.escapeJs(item.id) + '\',this.value)">' + typeOptions(item.type) + '</select><div><button type="button" title="Move up" onclick="App.moveFormQuestion(\'' + App.escapeJs(item.id) + '\',-1)">↑</button><button type="button" title="Move down" onclick="App.moveFormQuestion(\'' + App.escapeJs(item.id) + '\',1)">↓</button><button type="button" title="Remove" onclick="App.removeFormQuestion(\'' + App.escapeJs(item.id) + '\')">×</button></div></div><div class="scFormQuestionGrid">' + field("Prompt or section text","label",item.label,"text","span2") + field("Help text","help",item.help,"text","span2") + advanced + '<label><span>Map answer to</span><select data-sc-q="mapping">' + mappingOptions(item.mapping) + '</select></label><label class="scRequiredToggle"><input data-sc-q="required" type="checkbox"' + (item.required ? ' checked' : '') + '> Required</label></div></article>';
    }
    function field(label,key,value,type,className) { type = type || "text"; return '<label class="' + (className || '') + '"><span>' + App.escapeHtml(label) + '</span>' + (type === "textarea" ? '<textarea data-sc-q="' + key + '" rows="3">' + App.escapeHtml(value || '') + '</textarea>' : '<input data-sc-q="' + key + '" type="' + type + '" value="' + App.escapeHtml(value == null ? '' : value) + '">') + '</label>'; }

    function defaultWorkflow() { return { confirmation: { enabled:false,recipientField:"responderEmail",recipientEmail:"",subject:"We received your {{formName}} response",body:"<p>Thank you. Your response has been received.</p><p>Reference: {{responseId}}</p>" }, steps:[] }; }
    function workflowHtml(form) {
      var workflow=Object.assign(defaultWorkflow(),form.workflow||{}),confirmation=Object.assign({},defaultWorkflow().confirmation,workflow.confirmation||{}),steps=workflow.steps||[],forms=load().filter(function(item){return item.id!==form.id&&item.status==="Published"&&item.source!=="google";});
      return '<section class="panel scWorkflowPanel"><div class="dashboardPanelHeading"><div><div class="scProfileKicker">After submission</div><h3>Workflow</h3><p class="moduleMeta">Keep confirmations, additional forms and approvals attached to one overall response.</p></div><span class="statusChip">'+steps.length+' steps</span></div>'+
        '<section class="scWorkflowConfirmation"><div><h4>Confirmation email</h4><p>Send a personalised email when the first form is submitted.</p></div><label class="scWorkflowSwitch"><input id="scWorkflowConfirmationEnabled" type="checkbox"'+(confirmation.enabled?' checked':'')+'> Send confirmation email</label><div class="scWorkflowGrid"><label><span>Send to mapped field</span><select id="scWorkflowRecipientField">'+workflowRecipientOptions(confirmation.recipientField)+'</select></label><label><span>Or a fixed email address</span><input id="scWorkflowRecipientEmail" type="email" value="'+App.escapeHtml(confirmation.recipientEmail||'')+'"></label><label class="span2"><span>Subject</span><input id="scWorkflowSubject" value="'+App.escapeHtml(confirmation.subject||'')+'"></label><label class="span2"><span>Email body</span><textarea id="scWorkflowBody" rows="7">'+App.escapeHtml(confirmation.body||'')+'</textarea><small>Merge fields include {{formName}}, {{responseId}} and mapped answers such as {{responderFirstName}}.</small></label></div></section>'+
        '<div class="scWorkflowHeading"><div><h4>Required next steps</h4><p>Each step stays with the original response and records who completed it.</p></div><div><button class="quickLink" type="button" onclick="App.addFormWorkflowStep(\'follow_up\')">+ Additional form</button><button class="quickLink primaryAction" type="button" onclick="App.addFormWorkflowStep(\'approval\')">+ Approval</button></div></div>'+
        '<div id="scWorkflowSteps" class="scWorkflowSteps">'+(steps.length?steps.map(function(step,index){return workflowStepHtml(step,index,forms);}).join(''):App.emptyState("No next steps", "Add another form or an approval when this response should continue through a workflow."))+'</div></section>';
    }
    function workflowRecipientOptions(value){return [["responderEmail","Responder email"],["parentEmail","Parent email"],["teacherEmail","Teacher email"],["schoolEmail","School email"],["","Fixed email only"]].map(function(item){return'<option value="'+item[0]+'"'+(item[0]===value?' selected':'')+'>'+item[1]+'</option>';}).join('');}
    function workflowStepHtml(step,index,forms){return'<article class="scWorkflowStep" data-sc-workflow-step="'+App.escapeHtml(step.id)+'"><header><span>'+(index+1)+'</span><div><strong>'+(step.type==='approval'?'Approval':'Additional form')+'</strong><small>Pending until the assigned person submits the linked form.</small></div><button type="button" onclick="App.removeFormWorkflowStep(\''+App.escapeJs(step.id)+'\')" aria-label="Remove step">×</button></header><div class="scWorkflowGrid"><label><span>Step title</span><input data-workflow-field="title" value="'+App.escapeHtml(step.title||'')+'"></label><label><span>Form to complete</span><select data-workflow-field="formId"><option value="">Select a form…</option>'+forms.map(function(item){return'<option value="'+App.escapeHtml(item.id)+'"'+(item.id===step.formId?' selected':'')+'>'+App.escapeHtml(item.name)+'</option>';}).join('')+'</select></label><label><span>Assign using answer</span><select data-workflow-field="assigneeField">'+workflowRecipientOptions(step.assigneeField||'')+'</select></label><label><span>Or fixed assignee email</span><input data-workflow-field="assigneeEmail" type="email" value="'+App.escapeHtml(step.assigneeEmail||'')+'"></label><label class="span2"><span>Instructions for the recipient</span><textarea data-workflow-field="instructions" rows="3">'+App.escapeHtml(step.instructions||'')+'</textarea></label></div><input data-workflow-field="type" type="hidden" value="'+App.escapeHtml(step.type||'follow_up')+'"></article>';}
    function collectWorkflow(existing){var prior=Object.assign(defaultWorkflow(),existing||{}),enabled=document.getElementById('scWorkflowConfirmationEnabled');if(!enabled)return prior;var workflow={confirmation:{enabled:enabled.checked,recipientField:document.getElementById('scWorkflowRecipientField').value,recipientEmail:document.getElementById('scWorkflowRecipientEmail').value.trim(),subject:document.getElementById('scWorkflowSubject').value,body:document.getElementById('scWorkflowBody').value},steps:[]};document.querySelectorAll('[data-sc-workflow-step]').forEach(function(card){var step={id:card.dataset.scWorkflowStep};card.querySelectorAll('[data-workflow-field]').forEach(function(input){step[input.dataset.workflowField]=input.value;});workflow.steps.push(step);});return workflow;}
    App.addFormWorkflowStep=function(type){var form=collectFormDefinition();form.workflow=form.workflow||defaultWorkflow();form.workflow.steps=form.workflow.steps||[];form.workflow.steps.push({id:uid('workflow'),type:type,title:type==='approval'?'Approval required':'Additional information required',formId:'',assigneeField:type==='approval'?'teacherEmail':'responderEmail',assigneeEmail:'',instructions:''});window.__specCentralTransientForm=form;renderEditor();};
    App.removeFormWorkflowStep=function(id){var form=collectFormDefinition();form.workflow=form.workflow||defaultWorkflow();form.workflow.steps=(form.workflow.steps||[]).filter(function(step){return step.id!==id;});window.__specCentralTransientForm=form;renderEditor();};

    function collectFormDefinition() {
      var existing = selectedForm(), form = JSON.parse(JSON.stringify(existing)), get = function (id) { return document.getElementById(id); };
      if (!get("scFormName")) return form;
      form.name = get("scFormName").value || "Untitled form"; form.description = get("scFormDescription").value || ""; form.source = (document.querySelector('[name="scFormSource"]:checked') || {}).value || "custom"; form.googleFormUrl = get("scGoogleFormUrl").value || ""; form.programId = get("scFormProgram").value || ""; form.useAsApplication = !!get("scUseAsApplication").checked;
      form.storage = Object.assign({}, form.storage || {}, { mode:get("scStorageMode").value || "new",spreadsheetName:get("scSpreadsheetName").value || "",spreadsheetUrl:get("scSpreadsheetUrl").value || "",folderUrl:get("scFolderUrl").value || "",folderName:get("scFolderName").value || "" });
      form.prefill = {}; Array.prototype.forEach.call(document.querySelectorAll("[data-sc-prefill]"), function (box) { form.prefill[box.dataset.scPrefill] = box.checked; });
      if (workspace().editorTab === "editor") form.questions = Array.prototype.map.call(document.querySelectorAll("[data-sc-question]"), function (card) { var old = (existing.questions || []).filter(function (item) { return item.id === card.dataset.scQuestion; })[0] || newQuestion("large_text"), item = JSON.parse(JSON.stringify(old)); item.id = card.dataset.scQuestion; Array.prototype.forEach.call(card.querySelectorAll("[data-sc-q]"), function (input) { var key=input.dataset.scQ;if(key==="required")item[key]=input.checked;else if(key==="options")item[key]=input.value.split("\n").map(function(v){return v.trim();}).filter(Boolean);else item[key]=input.value;}); return item; });
      if (workspace().editorTab === "workflow") form.workflow = collectWorkflow(form.workflow);
      return form;
    }
    App.collectFormDefinition = collectFormDefinition;
    function transientAndRender(form) { window.__specCentralTransientForm = form; setSelected(form); renderEditor(); }
    App.addFormQuestion = function (type) { var form=collectFormDefinition();form.questions.push(newQuestion(type));transientAndRender(form); };
    App.removeFormQuestion = function (id) { var form=collectFormDefinition();form.questions=form.questions.filter(function(item){return item.id!==id;});transientAndRender(form); };
    App.moveFormQuestion = function (id,direction) { var form=collectFormDefinition(),index=form.questions.map(function(item){return item.id;}).indexOf(id),next=index+direction;if(index<0||next<0||next>=form.questions.length)return;var temp=form.questions[index];form.questions[index]=form.questions[next];form.questions[next]=temp;transientAndRender(form); };
    App.changeFormQuestionType = function (id,type) { var form=collectFormDefinition(),item=form.questions.filter(function(q){return q.id===id;})[0];if(item)item.type=type;transientAndRender(form); };
    App.toggleFormDefinitionSource = function () { var field=document.getElementById("scGoogleFormField"),source=(document.querySelector('[name="scFormSource"]:checked')||{}).value;if(field)field.hidden=source!=="google"; };

    function storeReturnedForm(form) { var forms=load(),index=forms.map(function(item){return item.id;}).indexOf(form.id),old=index>=0?forms[index]:{};form=Object.assign({},old,form);if(form.useAsApplication&&form.programId)forms.forEach(function(item){if(item.id!==form.id&&item.programId===form.programId)item.useAsApplication=false;});if(index>=0)forms[index]=form;else forms.push(form);store(forms);window.__specCentralTransientForm=null;setSelected(form);App.state.sharedFormDefinitionsLoaded=false;workspace().mode="dashboard";App.renderFormBuilderPage(); }
    App.saveFormDefinition = function () { var form=collectFormDefinition();form.status=form.status==="Published"?"Published":"Draft";if(typeof google==="undefined"||!google.script){storeReturnedForm(form);return;}App.notify("Saving form…");google.script.run.withSuccessHandler(function(saved){storeReturnedForm(saved);App.notify("Form saved.");}).withFailureHandler(function(error){App.notify("Form could not be saved: "+App.getErrorMessage(error));}).portalSaveFormDefinition(form); };
    App.publishFormDefinition = function () { var form=collectFormDefinition();if(typeof google==="undefined"||!google.script)return;App.notify("Publishing form…");google.script.run.withSuccessHandler(function(published){storeReturnedForm(published);App.notify("Form published. The respondent link is ready.");}).withFailureHandler(function(error){App.notify("Form could not be published: "+App.getErrorMessage(error));}).portalPublishFormDefinition(form); };
    App.duplicateFormDefinition = function (id) { var original=load().filter(function(item){return item.id===id;})[0];if(!original)return;var copy=JSON.parse(JSON.stringify(original));copy.id=uid("form");copy.name=original.name+" — Copy";copy.status="Draft";copy.publicUrl="";copy.publishedAt="";copy.archivedAt="";copy.responseCount=0;copy.lastResponseAt="";copy.storage={mode:"new",spreadsheetUrl:"",spreadsheetName:copy.name+" — responses",folderUrl:"",folderName:copy.name+" — responses"};copy.createdAt=new Date().toISOString();copy.updatedAt=copy.createdAt;if(typeof google==="undefined"||!google.script){storeReturnedForm(copy);return;}google.script.run.withSuccessHandler(function(saved){storeReturnedForm(saved);App.notify("Form duplicated as a draft.");}).withFailureHandler(function(error){App.notify(App.getErrorMessage(error));}).portalSaveFormDefinition(copy); };
    App.setFormLifecycleStatus = function (id,status) { if(typeof google==="undefined"||!google.script){var forms=load(),form=forms.filter(function(item){return item.id===id;})[0];if(form){form.status=status;store(forms);renderDashboard();}return;}google.script.run.withSuccessHandler(function(saved){var forms=load(),index=forms.map(function(item){return item.id;}).indexOf(id);if(index>=0)forms[index]=Object.assign({},forms[index],saved);store(forms);workspace().status=status;renderDashboard();App.notify(status==="Archived"?"Form archived.":"Form restored to drafts.");}).withFailureHandler(function(error){App.notify(App.getErrorMessage(error));}).portalSetFormStatus(id,status); };
    App.copyPublishedFormLink = function () { var url=selectedForm().publicUrl;if(!url)return;if(navigator.clipboard)navigator.clipboard.writeText(url).then(function(){App.notify("Form link copied.");});else window.prompt("Copy this form link",url); };

    function previewHtml(form,user) { if(form.source==="google")return '<div class="scGoogleFormPreview"><strong>Connected Google Form</strong><p>'+App.escapeHtml(form.googleFormUrl||"Add a Google Form URL.")+'</p></div>';var prefills=[];if(form.prefill.email)prefills.push(["Email",user.email||"signed.in.user@education.nsw.gov.au"]);if(form.prefill.firstName)prefills.push(["First name",user.firstName||String(user.displayName||"Signed-in user").split(" ")[0]]);if(form.prefill.lastName)prefills.push(["Last name",user.surname||"Matched surname"]);if(form.prefill.school)prefills.push(["School",user.school||"Matched school profile"]);return '<div class="scPreviewPrefill"><strong>Prefilled from current login</strong>'+prefills.map(function(item){return'<span><b>'+App.escapeHtml(item[0])+'</b>'+App.escapeHtml(item[1])+'</span>';}).join('')+'</div><div class="scCustomFormPreview">'+form.questions.map(previewQuestion).join('')+'</div>'; }
    function previewQuestion(item,index) { var options=item.options||[],control="";if(item.type==="dropdown_single"||item.type==="conditional_section")control='<select><option>Select…</option>'+options.map(function(o){return'<option>'+App.escapeHtml(o)+'</option>';}).join('')+'</select>';else if(item.type==="dropdown_multi")control='<select multiple>'+options.map(function(o){return'<option>'+App.escapeHtml(o)+'</option>';}).join('')+'</select>';else if(item.type==="single_selection"||item.type==="checkbox")control='<div class="scPreviewOptions">'+options.map(function(o){return'<label><input type="'+(item.type==="checkbox"?"checkbox":"radio")+'" disabled> '+App.escapeHtml(o)+'</label>';}).join('')+'</div>';else if(item.type==="number")control='<input type="number" min="'+App.escapeHtml(item.min)+'" max="'+App.escapeHtml(item.max)+'">';else if(item.type==="large_text")control='<textarea rows="4"></textarea>';else if(item.type==="text_section")return'<section class="scPreviewText"><h3>'+App.escapeHtml(item.label)+'</h3><p>'+App.escapeHtml(item.help)+'</p></section>';else if(item.type==="ranking")control=rankingHtml(item);else if(item.type==="drive_link")control='<input type="url" placeholder="https://drive.google.com/…">';else if(item.type==="signature")control='<div class="scSignaturePad">Sign here</div>';else if(item.type==="table")control=tablePreview(item);else if(item.type==="limited_response")control='<input><small>Closes after '+App.escapeHtml(item.limit||1)+' responses.</small>';else control='<input type="file"><small>Maximum '+App.escapeHtml(item.maxSize||25)+' MB</small>';return'<section class="scPreviewQuestion"><span>'+(index+1)+'. '+App.escapeHtml(item.label)+(item.required?' <b>*</b>':'')+'</span><small>'+App.escapeHtml(item.help||'')+'</small>'+control+'</section>'; }
    function rankingHtml(item) { return '<div class="scRankingScale"><strong>'+App.escapeHtml(item.rankingTopLabel||"Highest preference")+'</strong><div class="scRankingTiles" data-ranking-list>'+((item.options||[]).map(function(option){return'<button type="button" draggable="true" data-ranking-value="'+App.escapeHtml(option)+'"><span>⋮⋮</span>'+App.escapeHtml(option)+'</button>';}).join(''))+'</div><strong>'+App.escapeHtml(item.rankingBottomLabel||"Lowest preference")+'</strong></div>'; }
    function bindRankingLists(root) { if(!root)return;root.querySelectorAll('[data-ranking-list]').forEach(function(list){var dragging=null;list.querySelectorAll('[draggable="true"]').forEach(function(tile){tile.addEventListener('dragstart',function(){dragging=tile;tile.classList.add('dragging');});tile.addEventListener('dragend',function(){tile.classList.remove('dragging');dragging=null;});});list.addEventListener('dragover',function(event){event.preventDefault();if(!dragging)return;var target=event.target.closest('[draggable="true"]');if(!target||target===dragging)return;var rect=target.getBoundingClientRect();list.insertBefore(dragging,event.clientY<rect.top+rect.height/2?target:target.nextSibling);});}); }
    App.bindFormRankingLists = bindRankingLists;
    function tablePreview(item){var rows=String(item.rows||'').split('\n').filter(Boolean),cols=String(item.columns||'').split('\n').filter(Boolean);return'<div class="tableWrap"><table><tr><th></th>'+cols.map(function(c){return'<th>'+App.escapeHtml(c)+'</th>';}).join('')+'</tr>'+rows.map(function(r){return'<tr><th>'+App.escapeHtml(r)+'</th>'+cols.map(function(){return'<td><input></td>';}).join('')+'</tr>';}).join('')+'</table></div>';}

    App.formBuilderTypes = types;
    App.formResponseMappings = mappings;
  })();
</script>
