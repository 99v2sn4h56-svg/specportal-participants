  <script>
    window.App = {
      state: {
        currentPage: "dashboard",
        participants: [],
        groups: [],
        schools: [],
        photos: {},
        secureImages: {},
        secureImageExpiry: {},
        secureImageQueue: {},
        secureImageTimer: null,
        secureImageObserver: null,

        staff: {},
        staffTeam: [],
        staffDirectoryData: null,
        staffDirectorySearch: "",
        staffDirectoryFilters: {},
        staffDirectoryPage: 1,
        selectedStaffId: "",
        selectedStaffProfile: null,
        announcements: [],
        notifications: [],
        tasks: [],
        recentActivity: [],
        rehearsals: [],
        todaysRehearsals: [],
        calendarData: null,
        calendarDate: new Date(),
        calendarView: "month",
        selectedCalendarEvent: null,
        eventManagerData: null,
        eventManagerSearch: "",
        eventManagerRange: "upcoming",
        eventManagerType: "",
        eventManagerWarningsOnly: false,
        eventManagerFilters: {},
        eventManagerView: sessionStorage.getItem("specCentralEventManagerView") || "cards",
        selectedEventWorkspaceId: "",

        upcomingManagedEvents: [],

        eventWorkflowStep: "details",

        profileMutationPending: false,
        projectData: null,
        productionExceptions: null,
        projectView: "board",
        mediaData: null,
        mediaView: "gantt",
        attendanceEvents: [],
        attendanceSummary: null,
        attendanceError: "",
        attendanceLoaded: false,
        attendanceEventFilter: "upcoming",
        attendanceEventSearch: "",
        selectedAttendanceSessionId: "",
        selectedAttendanceEventName: "",
        attendanceUrl: "",
        timelineStatus: "",
        timelineLastRefreshed: "",
        staffStatus: "",
        latestResults: [],
        participantSearchTimer: null,
        participantExplorerSearch: "",
        participantExplorerFilters: {},
        participantExplorerPage: 1,
        participantExplorerPageData: null,
        participantExplorerPageSignature: "",
        participantExplorerPageLoading: false,
        participantExplorerSavedView: "all",
        searchProviders: [],
        searchHistory: [],
        recentlyViewed: [],
        favourites: [],
        currentFilters: {},
        currentModule: "dashboard",
        currentUser: null,
        permissions: [],
        authorizationModel: null,
        viewingAsRole: "",
        viewingAsCapabilities: null,
        dashboardContext: null,
        loadedServices: {},
        cacheTimestamps: {},
        serviceCache: {},
        inFlightRequests: {},
        serviceRegistry: {},
        loading: {},
        systemStatus: {},
        dashboardRenderTimer: null,
        operationsNavExpanded: true,
        dashboardProfile: "operations",
        applicationVersion: "17",
        selectedFormDefinitionId: "",
        communicationsWorkspace: null,
        communicationsView: "dashboard",
        communicationsComposerStep: "details",
        selectedCommunicationCampaignId: "",
        communicationDraft: null,
        communicationAudienceResult: null,
        communicationPreview: null,
        selectedParticipant: null,
        selectedSchool: null,
        selectedGroup: null,
        selectedItem: null,
        selectedTeacher: null,
        selectedEvent: null,
        selectedStaff: null,
        adminMode: false,
        administrationData: null,
        administrationView: "users",
        administrationSearch: "",
        administrationStatus: "",
        administrationSort: "name",
        administrationDetailItems: [],
        navigationHistory: [],
        navigationIndex: -1,
        ready: false,
        bootstrapContext: null,
        startupStartedAt: 0,
        dashboardUsableRecorded: false,
        participantsUsableRecorded: false,
        participantListComplete: false,
        participantFirstPageReady: false,
        participantFirstPageData: null,
        preloadInFlight: {},
        preloadedModules: {},
        pendingPerformanceMetrics: [],
        performanceFlushTimer: null,
        performanceInFlightBatch: null,
        performanceRetryCount: 0,
        performanceDroppedSamples: 0,
        performanceMaxQueue: 100
      },

      pages: {
        dashboard: {
          title: "Dashboard",
          description: "What you need today across Schools Spectacular.",
          template: "page-dashboard"
        },
        participants: {
          title: "Participants",
          description: "View and manage students participating in Schools Spectacular.",
          template: "page-participants",
          permission: "Participants.View"
        },
        calendar: {
          title: "Calendar",
          description: "Live rehearsal schedule and operational timeline.",
          template: "page-calendar",
          permission: "calendar.view"
        },
        attendance: {
          title: "Attendance",
          description: "Open attendance rolls and check-in workflows.",
          template: "page-attendance",
          permission: "Attendance.View"
        },
        rehearsals: {
          title: "Rehearsals",
          description: "Schedules, venues and upcoming rehearsal dates.",
          template: "page-rehearsals",
          permission: "Calendar.View"
        },
        staff: {
          title: "Staff",
          description: "Staff Directory, contacts, production roles and operational relationships.",
          template: "page-staff",
          permission: "Operations.View"
        },
        formBuilder: {
          title: "Forms",
          description: "Create, publish and review reusable forms and responses.",
          template: "page-form-builder",
          permission: "Operations.View"
        },
        communications: {
          title: "Communications",
          description: "Create safe, personalised campaign drafts, audiences and templates.",
          template: "page-communications",
          permission: "Communications.View"
        },
        operations: {
          title: "Operations",
          description: "Production management and operational control.",
          template: "page-operations",
          permission: "operations.view"
        },
        administration: {
          title: "Administration",
          description: "Users, permissions, workflows, data sources and platform health.",
          template: "page-administration",
          permission: "Administration.View"
        },
        projectManagement: {
          title: "Operations",
          description: "Compatibility route for the protected Operations module.",
          template: "page-operations",
          permission: "operations.view",
          redirectTo: "operations"
        },
        mediaTimeline: {
          title: "Media",
          description: "Campaign planning, media milestones and publishing activity.",
          template: "page-media-timeline",
          permission: "mediaTimeline.view"
        },
        settings: {
          title: "Settings",
          description: "Staff permissions, app configuration and module setup.",
          template: "page-settings",
          permission: "Settings.Admin"
        }
      },

      init: function () {
        App.state.startupStartedAt = performance.now();
        App.bootstrapState();
        App.restoreSidebarState();
        App.initPerformance();
        App.loadBootstrap().then(function (bootstrap) {
          if (!bootstrap) return;
          if (bootstrap.platform.maintenanceMode) {
            App.renderBootstrapGate("Scheduled maintenance", "SpecCentral is temporarily unavailable while platform maintenance is completed.");
            return;
          }
          if (!bootstrap.permissions.modules.dashboard) {
            App.renderBootstrapGate("Access unavailable", "Your account does not currently have access to the SpecCentral dashboard.");
            return;
          }
          App.navigateRoute(location.hash || "#home", { replace: true, initial: true });
          App.loadConfig().finally(function () {
            if (App.state.currentPage === "dashboard") App.markDashboardUsable();
            App.prefetchLikelyData();
          });
        }).catch(function (error) {
          var authenticationRequired = /AUTHENTICATION_REQUIRED|Authentication is required/i.test(App.getErrorMessage(error));
          App.renderBootstrapGate(authenticationRequired ? "Sign in required" : "SpecCentral could not be loaded", authenticationRequired ? "Sign in with your authorised Google Workspace account, then refresh this page." : "Please refresh and try again. If the problem continues, contact the SpecCentral administrator.");
        });
      },

      bootstrapState: function () {
        App.state.searchHistory = [];
        App.state.recentlyViewed = [];
        try { localStorage.removeItem("specCentralSearchHistory"); localStorage.removeItem("specPortalRecentSearches"); localStorage.removeItem("specCentralRecentlyViewed"); localStorage.removeItem("specPortalRecentlyViewed"); } catch (_) {}
        App.state.favourites = App.safeLoadJson("specCentralFavourites", []);
        App.registerCoreServices();
        App.bindApplicationEvents();
        App.registerDefaultSearchProviders();
        App.initSecureImages();
      },

      restoreSidebarState: function () {
        var collapsed = App.safeLoadJson("specCentralSidebarCollapsed", false);
        document.body.classList.toggle("sidebarCollapsed", !!collapsed);
        document.body.classList.remove("mobileSidebarOpen");
        App.state.operationsNavExpanded = App.safeLoadJson("specCentralOperationsNavExpanded", true);
        App.renderOperationsNavState();
      },

      toggleSidebar: function () {
        if (window.matchMedia && window.matchMedia("(max-width: 1060px)").matches) {
          var open = !document.body.classList.contains("mobileSidebarOpen");
          document.body.classList.toggle("mobileSidebarOpen", open);
          var toggle = document.querySelector(".topBarSidebarToggle");
          if (toggle) toggle.setAttribute("aria-expanded", open ? "true" : "false");
          if (open) setTimeout(function () { var first = document.querySelector(".appSidebar .navItem:not([hidden])"); if (first) first.focus(); }, 0);
          return;
        }
        var collapsed = !document.body.classList.contains("sidebarCollapsed");
        document.body.classList.toggle("sidebarCollapsed", collapsed);
        App.safeSaveJson("specCentralSidebarCollapsed", collapsed);
      },

      closeMobileNavigation: function (restoreFocus) {
        var wasOpen = document.body.classList.contains("mobileSidebarOpen");
        document.body.classList.remove("mobileSidebarOpen");
        var toggle = document.querySelector(".topBarSidebarToggle");
        if (toggle) toggle.setAttribute("aria-expanded", "false");
        if (wasOpen && restoreFocus !== false && toggle) toggle.focus();
      },

      toggleOperationsNav: function () {
        if (document.body.classList.contains("sidebarCollapsed")) {
          document.body.classList.remove("sidebarCollapsed");
          App.safeSaveJson("specCentralSidebarCollapsed", false);
          App.state.operationsNavExpanded = true;
          App.safeSaveJson("specCentralOperationsNavExpanded", true);
          App.renderOperationsNavState();
          return;
        }
        App.state.operationsNavExpanded = !App.state.operationsNavExpanded;
        App.safeSaveJson("specCentralOperationsNavExpanded", App.state.operationsNavExpanded);
        App.renderOperationsNavState();
      },

      renderOperationsNavState: function () {
        var children = document.getElementById("operationsNavChildren");
        if (children) children.hidden = !App.state.operationsNavExpanded;
        document.body.classList.toggle("operationsNavCollapsed", !App.state.operationsNavExpanded);
      },

      openOperationsView: function (view) {
        App.state.operationsView = view || "overview";
        App.state.operationsNavExpanded = true;
        App.renderOperationsNavState();
        App.navigate("operations");
      },

      events: {
        handlers: {},
        on: function (name, handler) {
          if (!name || typeof handler !== "function") return function () {};
          App.events.handlers[name] = App.events.handlers[name] || [];
          App.events.handlers[name].push(handler);
          return function () {
            App.events.handlers[name] = (App.events.handlers[name] || []).filter(function (item) {
              return item !== handler;
            });
          };
        },
        emit: function (name, payload) {
          (App.events.handlers[name] || []).slice().forEach(function (handler) {
            try {
              handler(payload);
            } catch (err) {
              console.error("Spec Central event handler failed", name, err);
            }
          });
        }
      },

      services: {
        request: function (key, serverFunction, options) {
          options = options || {};
          var service = App.getService(key) || {};
          serverFunction = serverFunction || service.serverFunction;
          var args = options.args || [];
          var cacheMs = options.cacheMs || 0;
          var timeoutMs = options.timeoutMs || 25000;
          var forceRefresh = !!options.forceRefresh;
          var cached = App.state.serviceCache[key];
          var cachedAt = App.state.cacheTimestamps[key] || 0;

          if (!forceRefresh && cacheMs && cached && Date.now() - cachedAt < cacheMs) {
            return Promise.resolve(cached);
          }

          if (!forceRefresh && App.state.inFlightRequests[key]) {
            return App.state.inFlightRequests[key];
          }

          App.state.loading[key] = true;
          App.setServiceStatus(key, "Loading");
          App.events.emit("service:loading", { key: key, serverFunction: serverFunction });

          App.state.inFlightRequests[key] = new Promise(function (resolve, reject) {
            var settled = false;
            var timer = setTimeout(function () {
              if (settled) return;
              settled = true;
              App.state.loading[key] = false;
              delete App.state.inFlightRequests[key];
              App.setServiceStatus(key, "Offline", App.formatTime(new Date()));
              var error = new Error(serverFunction + " timed out after " + Math.round(timeoutMs / 1000) + " seconds");
              App.events.emit("service:error", { key: key, serverFunction: serverFunction, error: error });
              reject(error);
            }, timeoutMs);

            function finish(success, value) {
              if (settled) return;
              settled = true;
              clearTimeout(timer);
              App.state.loading[key] = false;
              delete App.state.inFlightRequests[key];

              if (success) {
                App.state.loadedServices[key] = true;
                App.state.serviceCache[key] = value;
                App.state.cacheTimestamps[key] = Date.now();
                App.setServiceStatus(key, "Connected", App.formatTime(new Date()));
                App.events.emit("service:loaded", { key: key, serverFunction: serverFunction, data: value });
                resolve(value);
                return;
              }

              App.events.emit("service:error", { key: key, serverFunction: serverFunction, error: value });
              App.setServiceStatus(key, "Offline", App.formatTime(new Date()));
              reject(value);
            }

            try {
              var runner = google.script.run
                .withSuccessHandler(function (data) { finish(true, data); })
                .withFailureHandler(function (error) { finish(false, error); });

              if (!runner || typeof runner[serverFunction] !== "function") {
                finish(false, new Error("Missing server function: " + serverFunction));
                return;
              }

              runner[serverFunction].apply(runner, args);
            } catch (err) {
              finish(false, err);
            }
          });

          return App.state.inFlightRequests[key];
        }
      },

      SearchRegistry: {
        register: function (provider) {
          App.registerSearchProvider(provider);
        },
        search: function (query, limit) {
          return App.runUniversalSearch(query, limit);
        },
        list: function () {
          return (App.state.searchProviders || []).slice();
        }
      },

      registerService: function (id, config) {
        if (!id) return;
        App.state.serviceRegistry[id] = Object.assign({ id: id, status: "Waiting" }, config || {});
        App.state.systemStatus[id] = App.state.systemStatus[id] || {
          label: App.state.serviceRegistry[id].label || id,
          status: "Waiting",
          lastRefresh: ""
        };
      },

      getService: function (id) {
        return App.state.serviceRegistry[id] || null;
      },

      registerCoreServices: function () {
        [
          ["config", "Dashboard", "portalGetDashboardProjection"],
          ["portalData", "Participants", "portalGetParticipantListProjection"],
          ["calendar", "Timeline", "portalGetCalendarData"],
          ["attendance", "Attendance", "portalGetAttendanceSummary"],
          ["staff", "Staff", "portalGetStaffProductionTeam"],
          ["announcements", "Announcements", ""],
          ["operations", "Operations", "portalGetOperationsData"],
          ["mediaTimeline", "Media", "portalGetMediaTimelineData"]
        ].forEach(function (service) {
          App.registerService(service[0], {
            label: service[1],
            serverFunction: service[2],
            owner: service[0]
          });
        });
      },

      setServiceStatus: function (id, status, lastRefresh) {
        var service = App.getService(id) || { label: id };
        App.state.systemStatus[id] = {
          label: service.label || id,
          status: status || "Waiting",
          lastRefresh: lastRefresh || (App.state.systemStatus[id] || {}).lastRefresh || ""
        };
        App.renderStatusRibbon();
      },

      bindApplicationEvents: function () {
        App.events.on("service:loaded", function () {
          if (App.state.currentPage === "dashboard") App.scheduleDashboardRender();
        });
        App.events.on("service:error", function () {
          App.renderStatusRibbon();
        });
        App.events.on("dashboard:refresh", function () {
          App.scheduleDashboardRender();
        });
      },

      scheduleDashboardRender: function () {
        if (App.state.dashboardRenderTimer) clearTimeout(App.state.dashboardRenderTimer);
        App.state.dashboardRenderTimer = setTimeout(function () {
          App.state.dashboardRenderTimer = null;
          if (App.state.currentPage === "dashboard") App.renderDashboardPage();
        }, 50);
      },

      navigate: function (page, options) {
        options = options || {};
        var requestedPage = page;
        var routeStarted = performance.now();
        if (App.state.currentPage) App.saveCurrentScrollPosition();
        App.closeMobileNavigation(false);
        App.clearNotification();
        if (page === "projectManagement") page = "operations";
        var config = App.pages[page] || App.pages.dashboard;
        var template = document.getElementById(config.template);
        var outlet = document.getElementById("appContent");

        if (config.permission && !App.hasPermission(config.permission)) {
          App.notify("You do not have permission to open " + config.title + ".");
          page = "dashboard";
          config = App.pages.dashboard;
          template = document.getElementById(config.template);
        }

        App.state.currentPage = page;
        App.state.currentModule = page;
        document.body.classList.toggle("attendanceFocus", page === "attendance");
        if (!options.fromHistory && !options.fromBrowser) {
          App.pushNavigation(page, options);
        }
        document.getElementById("topBarTitle").textContent = config.title;
        document.getElementById("topBarDescription").textContent = config.description;
        var searchLabel = document.getElementById("workspaceSearchLabel");
        if (searchLabel) searchLabel.textContent = page === "dashboard" ? "Quick participant lookup…" : "Search Participants, Schools, Staff, Events…";
        var breadcrumb = document.getElementById("topBarBreadcrumb");
        var contextStatus = document.getElementById("topBarContextStatus");
        if (breadcrumb) breadcrumb.textContent = page === "operations" ? "Spec Central / Operations / " + App.toTitle(App.state.operationsView || "dashboard") : "Spec Central / " + config.title;
        if (contextStatus) contextStatus.textContent = page === "administration" ? "Controlled" : (App.state.systemStatus[page] && App.state.systemStatus[page].status || "Live");

        Array.prototype.forEach.call(document.querySelectorAll("[data-nav-page],[data-nav-pages]"), function (button) {
          var pages = String(button.getAttribute("data-nav-pages") || button.getAttribute("data-nav-page") || "").split(",");
          var active = pages.indexOf(page) >= 0;
          var navView = button.getAttribute("data-nav-view");
          if (navView === "events") active = active && App.state.operationsView === "events";
          if (navView === "general") active = active && App.state.operationsView !== "events";
          button.classList.toggle("active", active);
        });

        App.renderStatusRibbon();
        var activation = App.activatePersistentPage(page, template, outlet);
        App.restorePageControls(page);
        App.renderNavigation();
        App.renderSyncControl();

        if (page === "dashboard") App.renderDashboardPage();
        if (page === "participants") {
          App.renderParticipantStatus();
          App.ensurePortalDataLoaded({ firstPageOnly: true }).then(function () { if (App.renderParticipantExplorer) App.renderParticipantExplorer(); });
        }
        if (page === "calendar") App.renderCalendarPage();
        if (page === "attendance") App.renderAttendancePage();
        if (page === "rehearsals") App.renderRehearsalsPage();
        if (page === "operations") App.renderOperationsPage();
        if (page === "administration") App.renderAdministrationPage();
        if (page === "mediaTimeline") App.renderMediaTimelinePage();
        if (page === "staff") App.renderStaffPage();
        if (page === "formBuilder" && App.renderFormBuilderPage) App.renderFormBuilderPage();
        if (page === "communications" && App.renderCommunicationsPage) App.renderCommunicationsPage();
        if (!options.fromBrowser || page !== requestedPage) App.updateBrowserRoute(!!options.replace || page !== requestedPage);
        App.persistModuleState();
        App.restoreCurrentScrollPosition();
        App.maybeRevalidateCurrentPage();
        App.recordPerformance("route:" + page, routeStarted, { cachedPage: !activation.firstRender });
      },

      pushNavigation: function (page, options) {
        var history = App.state.navigationHistory;
        var entry = { page: page, at: Date.now(), context: (options && options.context) || null };

        if (options && options.replace && history.length) {
          history[App.state.navigationIndex] = entry;
          return;
        }

        if (App.state.navigationIndex < history.length - 1) {
          history.splice(App.state.navigationIndex + 1);
        }

        history.push(entry);
        if (history.length > 30) history.shift();
        App.state.navigationIndex = history.length - 1;
      },

      goBack: function () {
        history.back();
      },

      goForward: function () {
        history.forward();
      },

      loadConfig: function (forceRefresh) {
        return App.services.request("config", "portalGetDashboardProjection", { cacheMs: 60000, timeoutMs: 30000, forceRefresh: !!forceRefresh })
          .then(function (config) {
            config = config || {};
            App.state.dashboardContext = config;
            App.state.dashboardProfile = config.dashboardProfile || "operations";
            if (!App.state.bootstrapContext) App.applyStaffContext(config.staff || {});
            App.state.staffTeam = config.staffTeam || [];
            App.state.attendanceUrl = config.attendanceUrl || "";
            App.state.attendanceStatus = config.attendanceStatus || "";
            App.state.attendanceSource = config.attendanceSource || "";
            App.state.announcements = config.announcements || [];
            App.state.notifications = config.notifications || [];
            App.state.tasks = config.tasks || [];
            App.state.recentActivity = config.recentActivity || [];
            App.state.productionOverview = config.participantSummary || { categories: [], status: "Not warmed" };
            App.state.rehearsals = config.rehearsals || [];
            App.state.todaysRehearsals = config.todaysRehearsals || [];
            App.state.upcomingManagedEvents = config.upcomingManagedEvents || [];
            App.state.attendanceEvents = config.attendanceEvents || [];
            App.state.currentDate = config.currentDate || "";
            App.state.timelineStatus = config.timelineStatus || "";
            App.state.timelineLastRefreshed = config.timelineLastRefreshed || "";
            App.state.staffStatus = config.staffStatus || "";
            App.applyServerServiceStatuses(config.services || {});
            App.renderStatusRibbon();
            App.renderNotifications();
            App.renderNotificationCount();
            if (App.state.currentPage === "attendance") App.renderAttendancePage();
            if (App.state.currentPage === "dashboard") App.renderDashboardPage();
            if (App.state.currentPage === "calendar") App.renderCalendarPage();
            if (App.state.currentPage === "calendar" && App.state.selectedCalendarEventId) setTimeout(function () { App.showCalendarEventDetail(App.state.selectedCalendarEventId); }, 0);
            if (App.state.currentPage === "rehearsals") App.renderRehearsalsPage();
            if (App.state.currentPage === "operations") App.renderOperationsPage();
            if (App.state.currentPage === "mediaTimeline") App.renderMediaTimelinePage();
            if (App.state.currentPage === "staff") App.renderStaffPage();
          })
          .catch(function (error) {
            App.notify("Dashboard data could not be loaded: " + App.getErrorMessage(error));
          });
      },

      loadIdentityContext: function () {
        return App.services.request("identity", "getCurrentStaffContext", { cacheMs: 5 * 60 * 1000, timeoutMs: 15000 })
          .then(function (staff) {
            App.applyStaffContext(staff || {});
            App.renderDashboardPage();
            return staff;
          })
          .catch(function (error) {
            App.notify("Staff identity could not be loaded: " + App.getErrorMessage(error));
          });
      },

      loadBootstrap: function () {
        var started = performance.now();
        return App.services.request("bootstrap", "portalBootstrap", { noCache: true, forceRefresh: true, timeoutMs: 15000 })
          .then(function (bootstrap) {
            bootstrap = App.validateBootstrapResponse(bootstrap);
            App.state.bootstrapContext = bootstrap;
            App.state.applicationVersion = bootstrap.platform.buildVersion || App.state.applicationVersion;
            App.applyStaffContext(App.bootstrapStaffContext(bootstrap));
            App.recordPerformance("bootstrap", started, { payloadBytes: App.estimatePayloadSize ? App.estimatePayloadSize(bootstrap) : 0, projection: "bootstrap" });
            App.renderDashboardPage();
            return bootstrap;
          })
          .catch(function (error) {
            App.notify("SpecCentral could not be initialised: " + App.getErrorMessage(error));
            throw error;
          });
      },

      validateBootstrapResponse: function (value) {
        var isRecord = function (input) { return !!input && typeof input === "object" && !Array.isArray(input); };
        if (!isRecord(value) || !isRecord(value.user) || !isRecord(value.permissions) || !isRecord(value.permissions.modules) || !isRecord(value.permissions.actions) || !isRecord(value.featureFlags) || !isRecord(value.platform)) {
          var invalid = new Error("The server returned an invalid bootstrap response.");
          invalid.code = "INVALID_BOOTSTRAP_RESPONSE";
          throw invalid;
        }
        if (!value.user.id || !value.user.email || value.platform.applicationName !== "SpecCentral") {
          var incomplete = new Error("The bootstrap response is missing required identity or platform fields.");
          incomplete.code = "INVALID_BOOTSTRAP_RESPONSE";
          throw incomplete;
        }
        return value;
      },

      bootstrapStaffContext: function (bootstrap) {
        var actions = bootstrap.permissions.actions || {};
        var capabilities = Object.keys(actions).filter(function (name) { return actions[name] === true; });
        return Object.assign({}, bootstrap.user, {
          role: bootstrap.user.role || (bootstrap.permissions.roles || [])[0] || "Authenticated user",
          permissions: capabilities.slice(),
          capabilities: capabilities.slice()
        });
      },

      renderBootstrapGate: function (title, message) {
        var content = document.getElementById("appContent");
        if (!content) return;

      recordClientPerformance: function (name, started, detail) {
        var acceptedNames = ["journey.dashboard-bootstrap", "journey.participant-search", "journey.participant-passport", "journey.event-loading", "journey.communications-loading", "journey.forms-loading"];
        if (acceptedNames.indexOf(String(name || "")) < 0) return App.recordPerformance(name, started, detail);
        var duration = typeof started === "number" ? Math.max(0, Math.round(performance.now() - started)) : 0;
        var eventId = App.makeTelemetryId("c");
        if (App.state.pendingPerformanceMetrics.length >= App.state.performanceMaxQueue) {
          var inFlightIds = new Set((App.state.performanceInFlightBatch && App.state.performanceInFlightBatch.metrics || []).map(function (item) { return item.eventId; }));
          var removable = App.state.pendingPerformanceMetrics.findIndex(function (item) { return !inFlightIds.has(item.eventId); });
          if (removable >= 0) App.state.pendingPerformanceMetrics.splice(removable, 1);
          else { App.state.performanceDroppedSamples++; return duration; }
          App.state.performanceDroppedSamples++;
        }
        App.state.pendingPerformanceMetrics.push({ name: name, durationMs: duration, detail: detail || {}, eventId: eventId, correlationId: eventId });
        App.scheduleClientPerformanceFlush(250);
        return duration;
      },

      makeTelemetryId: function (prefix) { return String(prefix || "c") + Date.now().toString(36) + Math.random().toString(36).slice(2, 12); },

      scheduleClientPerformanceFlush: function (delay) {
        if (App.state.performanceInFlightBatch || !App.state.pendingPerformanceMetrics.length) return;
        clearTimeout(App.state.performanceFlushTimer);
        App.state.performanceFlushTimer = setTimeout(function () { App.flushClientPerformance(false); }, Math.max(0, Number(delay) || 0));
      },

      flushClientPerformance: function (force) {
        if (App.state.performanceInFlightBatch || !App.state.pendingPerformanceMetrics.length) return;
        var metrics = App.state.pendingPerformanceMetrics.slice(0, 20);
        var batch = { batchId: App.makeTelemetryId("b"), metrics: metrics, attempts: 0 };
        App.state.performanceInFlightBatch = batch;
        App.sendClientPerformanceBatch(batch, !!force);
      },

      sendClientPerformanceBatch: function (batch, force) {
        if (!batch || App.state.performanceInFlightBatch !== batch) return;
        batch.attempts++;
        var complete = function (acknowledgement) {
          if (App.state.performanceInFlightBatch !== batch) return;
          acknowledgement = acknowledgement || {};
          if (!acknowledgement.writeSuccess) { retry(); return; }
          var delivered = new Set(batch.metrics.map(function (item) { return item.eventId; }));
          App.state.pendingPerformanceMetrics = App.state.pendingPerformanceMetrics.filter(function (item) { return !delivered.has(item.eventId); });
          App.state.performanceDroppedSamples += Number(acknowledgement.rejectedSampleCount || 0) + Number(acknowledgement.droppedSampleCount || 0);
          App.state.performanceInFlightBatch = null;
          App.state.performanceRetryCount = 0;
          App.scheduleClientPerformanceFlush(0);
        };
        var retry = function () {
          if (App.state.performanceInFlightBatch !== batch) return;
          if (batch.attempts >= 3 || force) {
            var abandoned = new Set(batch.metrics.map(function (item) { return item.eventId; }));
            App.state.pendingPerformanceMetrics = App.state.pendingPerformanceMetrics.filter(function (item) { return !abandoned.has(item.eventId); });
            App.state.performanceDroppedSamples += batch.metrics.length;
            App.state.performanceInFlightBatch = null;
            App.state.performanceRetryCount = batch.attempts;
            App.scheduleClientPerformanceFlush(0);
            return;
          }
          App.state.performanceRetryCount = batch.attempts;
          setTimeout(function () { App.sendClientPerformanceBatch(batch, false); }, [1000, 3000, 8000][Math.min(batch.attempts - 1, 2)]);
        };
        try {
          google.script.run.withSuccessHandler(complete).withFailureHandler(retry).portalRecordClientPerformanceBatch(batch.metrics, batch.batchId);
        } catch (_) { retry(); }
      },

          select.innerHTML = '<option value="">Actual permissions</option>' + roles.map(function (name) { return '<option value="' + App.escapeHtml(name) + '"' + (name === App.state.viewingAsRole ? ' selected' : '') + '>' + App.escapeHtml(name) + '</option>'; }).join("");
        }
        if (badge) { badge.hidden = !App.state.viewingAsRole; badge.textContent = App.state.viewingAsRole ? "VIEWING AS: " + App.state.viewingAsRole : ""; }
      },

      setViewingAsRole: function (role) {
        if (!App.state.staff.isAdmin || !App.hasActualPermission("Administration.View")) return;
        var roles = App.state.authorizationModel && App.state.authorizationModel.roles || {};
        App.state.viewingAsRole = roles[role] ? role : "";
        App.state.viewingAsCapabilities = App.state.viewingAsRole ? (roles[App.state.viewingAsRole] || []).slice() : null;
        App.clearPermissionScopedCaches();
        App.closeAdministrationDetail();
        App.renderStaffContext();
        var page = App.state.currentPage;
        var config = App.pages[page] || App.pages.dashboard;
        if (config.permission && !App.hasPermission(config.permission)) App.navigate("dashboard", { replace: true });
        else App.navigate(page, { replace: true });
        App.notify(App.state.viewingAsRole ? "Viewing the workspace as " + App.state.viewingAsRole + ". Server permissions remain unchanged." : "Restored your actual workspace permissions.");
      },

      hasActualPermission: function (permission) {
        return App.permissionListHas((App.state.staff.permissions || []).concat(App.state.staff.capabilities || []), permission);
      },

      hasPermission: function (permission) {
        var permissions = App.state.viewingAsCapabilities || (App.state.staff.permissions || []).concat(App.state.staff.capabilities || []);
        return App.permissionListHas(permissions, permission);
      },

      permissionListHas: function (permissions, permission) {
        var aliases = {
          "participant.view": "Participants.View",
          "participant.edit": "Participants.Edit",
          "participants.view": "Participants.View",
          "participants.edit": "Participants.Edit",
          "attendance.view": "Attendance.View",
          "attendance.mark": "Attendance.Mark",
          "calendar.view": "Calendar.View",
          "calendar.edit": "Calendar.Edit",
          "rehearsals.view": "Calendar.View",
          "operations.view": "Operations.View",
          "operations.users.manage": "Users.Manage",
          "operations.permissions.manage": "Permissions.Manage",
          "operations.events.manage": "Timeline.Edit",
          "settings.view": "Settings.Admin",
          "settings.admin": "Settings.Admin",
          "administration.view": "Administration.View"
        };
        var target = aliases[String(permission || "").toLowerCase()] || permission;
        return (permissions || []).some(function (granted) {
          return (aliases[String(granted || "").toLowerCase()] || granted) === target;
        });
      },

      renderNavigation: function () {
        Array.prototype.forEach.call(document.querySelectorAll("[data-permission]"), function (button) {
          var permission = button.getAttribute("data-permission");
          button.hidden = permission ? !App.hasPermission(permission) : false;
        });

          control.hidden = !App.state.adminMode;
        });
      },

      renderStatusRibbon: function () {
        var ribbon = document.getElementById("statusRibbon");

          ribbon.hidden = true;
          ribbon.innerHTML = "";
          return;

        ribbon.hidden = false;
        var statuses = App.getStatusItems();
        ribbon.innerHTML = statuses.map(function (item) {
          var theme = App.getStatusTheme(item.id);
          var meta = [App.getStatusState(item.status), item.lastRefresh].filter(Boolean).join(" · ");
          return '<div class="statusPill" style="--status-color:' + App.escapeHtml(theme.color) + ';--status-bg:' + App.escapeHtml(theme.bg) + ';">' +

      getStatusTheme: function (id) {
        var themes = {
          portalData: { icon: "👤", color: "#44c2f0", bg: "rgba(68,194,240,.16)", purpose: "People + profiles" },
          calendar: { icon: "📅", color: "#2d67b2", bg: "rgba(45,103,178,.14)", purpose: "Events + rehearsals" },
          attendance: { icon: "✓", color: "#9dd085", bg: "rgba(157,208,133,.20)", purpose: "Rolls + check-in" },
          staff: { icon: "🪪", color: "#fbcc39", bg: "rgba(251,204,57,.24)", purpose: "Roles + access" },
          announcements: { icon: "!", color: "#ef509c", bg: "rgba(239,80,156,.16)", purpose: "Updates" },
          operations: { icon: "◆", color: "#bb529e", bg: "rgba(187,82,158,.16)", purpose: "Management" },
          mediaTimeline: { icon: "▶", color: "#f79420", bg: "rgba(247,148,32,.18)", purpose: "Campaigns" }
        };

      getStatusState: function (status) {
        var text = String(status || "Waiting");

        if (/loading/i.test(text)) return "Loading";
        if (/offline|unavailable|error|failed/i.test(text)) return "Offline";
        if (/ready/i.test(text)) return "Ready";
        return text;
      },

      renderSpecCountdown: function () {
        var el = document.getElementById("dashboardCountdownDays");
        if (!el) return;
        var now = new Date();
        var today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12);
        var spec = new Date(2026, 10, 27, 12);
        el.textContent = Math.max(0, Math.ceil((spec.getTime() - today.getTime()) / 86400000));
      },

      renderProductionOverview: function () {
        var el = document.getElementById("productionOverview");
        if (!el) return;
        if (!App.hasPermission("Participants.View")) { if (el.parentElement) el.parentElement.hidden = true; return; }
        if (el.parentElement) el.parentElement.hidden = false;
        if (!App.state.productionOverview) {
          el.innerHTML = App.loadingState("Loading production categories");
          App.loadProductionOverview(false);
          return;
        }
        if (App.state.productionOverview.error) { el.innerHTML = App.emptyState("Production categories unavailable", App.state.productionOverview.error); return; }
        var priority = ["Aboriginal Dance Ensemble", "Boys Hip Hop", "Featured Dance", "Featured Drama", "Featured Vocalists", "Backing Vocalists", "Signing Choir", "Combined Choir", "Orchestra", "Stage Band", "Circus Arts", "D'Arts", "Public Speaking", "Student Hosts", "Student Production Team"];
        var rows = (App.state.productionOverview.categories || []).slice().sort(function (a, b) { var ai = priority.indexOf(a.name), bi = priority.indexOf(b.name); if (ai < 0) ai = 999; if (bi < 0) bi = 999; return ai - bi || a.name.localeCompare(b.name); });
        el.innerHTML = rows.length ? rows.map(function (category, index) { return '<button class="productionTile productionTone' + (index % 8) + '" type="button" onclick="App.openParticipantsForCategory(\'' + App.escapeJs(category.name) + '\')"><span class="productionTileName">' + App.escapeHtml(category.name) + '</span><span class="productionTileCount"><strong>' + category.participants + '</strong><small>participants</small></span></button>'; }).join("") : App.emptyState("No production categories available", "Participant categories will appear when the live database is available.");
      },

      renderDashboardSchedule: function () {
        var el = document.getElementById("dashboardSchedule");
        if (!el) return;
        var today = App.toDateKey(new Date());
        var tomorrowDate = new Date(); tomorrowDate.setDate(tomorrowDate.getDate() + 1);
        var tomorrow = App.toDateKey(tomorrowDate);
        var events = App.getRelevantHomeEvents(false).filter(function (event) {
          var key = event.dateKey || App.toDateKey(event.date);
          return key >= today;
        }).slice(0, 10);
        if (!events.length) { el.innerHTML = App.emptyState("Your schedule is clear", "No relevant events are currently scheduled."); return; }
        var lastGroup = "";
        el.innerHTML = events.map(function (event) {
          var key = event.dateKey || App.toDateKey(event.date);
          var group = key === today ? "Today" : key === tomorrow ? "Tomorrow" : (event.date || App.formatShortDate(key));
          var heading = group !== lastGroup ? '<div class="scheduleDayLabel">' + App.escapeHtml(group) + '</div>' : "";
          lastGroup = group;
          return heading + '<button class="scheduleRow" type="button" onclick="App.navigate(\'calendar\')" aria-label="Open ' + App.escapeHtml(event.title || event.event || "event") + ' in Calendar"><time>' + App.escapeHtml(event.start || "All day") + '</time><span><strong>' + App.escapeHtml(event.title || event.event || "Scheduled event") + '</strong><small>' + App.escapeHtml([event.venue, event.area].filter(Boolean).join(" · ") || "Location to be confirmed") + '</small></span></button>';
        }).join("");
      },

      renderDashboardManagedEvents: function () {
        var panel = document.getElementById("dashboardManagedEventsPanel");

        if (!panel || !el) return;

        el.innerHTML = events.map(function (event) {
          var readiness = event.readiness || {};

        }).join("");
      },

      openEventManagerFromDashboard: function () { App.navigate("operations"); App.setOperationsView("events"); },
      openManagedEventFromDashboard: function (eventId) { App.openEventManagerFromDashboard(); setTimeout(function () { App.openEventWorkspace(eventId); }, 0); },

      getRelevantHomeEvents: function (todayOnly) {
        var staff = App.state.staff || {};
        var name = String(staff.displayName || staff.name || "").toLowerCase();
        var email = String(staff.email || "").toLowerCase();
        var department = String(staff.department || staff.team || "").toLowerCase();
        var allocated = (staff.allocatedEvents || []).map(function (item) { return String(item).toLowerCase(); });
        var today = App.toDateKey(new Date());
        var events = (App.state.calendarData && App.state.calendarData.events) || App.state.rehearsals || [];
        return events.filter(function (event) {
          var dateKey = event.dateKey || App.toDateKey(event.date);
          if (todayOnly && dateKey !== today) return false;
          if (!todayOnly && dateKey && dateKey < today) return false;
          var text = [event.id, event.title, event.event, event.area, (event.staff || []).join(" ")].join(" ").toLowerCase();
          if (!name && !email && !department && !allocated.length) return true;
          return (name && text.indexOf(name) >= 0) || (email && text.indexOf(email) >= 0) || (department && text.indexOf(department) >= 0) || allocated.some(function (item) { return text.indexOf(item) >= 0; });
        }).sort(App.sortEvents);
      },

      renderDashboardNotifications: function () {
        var el = document.getElementById("dashboardNotifications");
        if (!el) return;
        var prefs = App.getNotificationPrefs();
        var rows = (App.state.notifications || []).slice().sort(function (a, b) { return String(b.createdAt || "").localeCompare(String(a.createdAt || "")); }).slice(0, 6);
        el.innerHTML = rows.length ? rows.map(function (item) {
          var unread = !(prefs[item.id] || {}).read;
          return '<button class="dashboardNotification ' + (unread ? "unread" : "") + '" type="button" onclick="App.openNotificationCentre()"><span class="notificationDot" aria-hidden="true"></span><span><strong>' + App.escapeHtml(item.title || "Platform update") + '</strong><small>' + App.escapeHtml([item.body, item.createdAt].filter(Boolean).join(" · ")) + '</small></span></button>';
        }).join("") : App.emptyState("You are caught up", "New operational notifications will appear here.");
      },

        if (!el) return;

        var unmatched = user.isMatched === false;
        el.hidden = !unmatched;

      },

      openIdentityDiagnostics: function () {

      renderDashboardTasks: function () {

        if (!el) return;
        el.innerHTML = App.renderMyTasksHtml();
      },

      renderMyTasksHtml: function () {
        var tasks = (App.state.tasks || []).filter(function (item) { return ["Completed", "Cancelled"].indexOf(item.status) < 0; }).slice(0, 7);
        return tasks.length ? tasks.map(function (item) {
          var priority = String(item.priority || "Normal");
          var workflow = item.workflow || item.module || item.workstream || item.relatedEvent || "Task Service";
          return '<button class="dashboardTask" type="button" onclick="App.openTaskFromNotificationCentre()"><span class="taskPriority priority' + App.escapeHtml(priority.replace(/[^a-z]/gi, "")) + '">' + App.escapeHtml(priority) + '</span><span class="dashboardTaskBody"><strong>' + App.escapeHtml(item.title || item.task || "Task") + '</strong><small>' + App.escapeHtml([workflow, item.dueDate ? "Due " + item.dueDate : "No due date"].join(" · ")) + '</small></span><span class="taskStatus">' + App.escapeHtml(item.status || "Open") + '</span></button>';
        }).join("") : App.emptyState("No open tasks", "Your task queue has no pending work.");
      },

      openTaskFromNotificationCentre: function () { App.closeNotificationCentre(); App.openOperationsView("projects"); },

      renderDashboardProjects: function () {
        var el = document.getElementById("dashboardProjects");
        if (!el) return;
        var tasks = App.state.tasks || [];
        var names = {};
        (App.state.staff.assignedItems || []).forEach(function (name) { if (name) names[name] = true; });
        tasks.forEach(function (task) { var name = task.workstream || task.module || task.relatedEvent; if (name) names[name] = true; });
        var projects = Object.keys(names).slice(0, 6);
        if (!projects.length) { el.innerHTML = App.emptyState("No active projects", "Projects linked to your staff profile or task workflow will appear here."); return; }
        var upcoming = App.getRelevantHomeEvents(false);
        el.innerHTML = projects.map(function (name) {
          var projectTasks = tasks.filter(function (task) { return [task.workstream, task.module, task.relatedEvent].filter(Boolean).indexOf(name) >= 0; });
          var complete = projectTasks.filter(function (task) { return task.status === "Completed"; }).length;
          var waiting = projectTasks.filter(function (task) { return ["Completed", "Cancelled"].indexOf(task.status) < 0; }).length;
          var progress = projectTasks.length ? Math.round(complete / projectTasks.length * 100) : 0;
          var milestone = projectTasks.filter(function (task) { return ["Completed", "Cancelled"].indexOf(task.status) < 0; }).sort(function (a, b) { return String(a.dueDate || "9999").localeCompare(String(b.dueDate || "9999")); })[0];
          var searchName = String(name).toLowerCase();
          var rehearsal = upcoming.find(function (event) { return [event.title, event.event, event.area, (event.items || []).join(" ")].join(" ").toLowerCase().indexOf(searchName) >= 0; });
          return '<button class="dashboardProjectCard" type="button" onclick="App.openOperationsView(\'projects\')"><span class="projectCardTop"><strong>' + App.escapeHtml(name) + '</strong><b>' + (projectTasks.length ? progress + "%" : "Active") + '</b></span><span class="projectProgress" aria-label="' + progress + ' percent complete"><i style="width:' + progress + '%"></i></span><small><b>Next milestone</b>' + App.escapeHtml(milestone ? (milestone.title || milestone.task || milestone.dueDate || "Open task") : "No linked milestone") + '</small><small><b>Waiting</b>' + waiting + ' item' + (waiting === 1 ? "" : "s") + '</small><small><b>Next rehearsal</b>' + App.escapeHtml(rehearsal ? [rehearsal.date, rehearsal.start].filter(Boolean).join(" · ") : "Not scheduled") + '</small></button>';
        }).join("");
      },

      renderParticipantStatus: function () {
        var status = document.getElementById("participantStatus");
        if (!status) return;

        if (!App.state.ready) {
          status.textContent = "Loading participant data...";
          return;
        }

        status.textContent = "Ready - " + App.getTotalParticipantCount() + " participants, " +
          App.state.groups.length + " groups and " + App.state.schools.length + " schools loaded" +
          (App.getParticipantTotalNote() ? " - " + App.getParticipantTotalNote() : "");

      loadCalendarData: function (forceRefresh) {
        if (App.state.calendarData && !forceRefresh) return Promise.resolve(App.state.calendarData);

        var source = document.getElementById("calendarSource");
        if (source) source.textContent = "Loading Timeline events...";

        return App.services.request("calendar", "portalGetCalendarData", { cacheMs: 120000, timeoutMs: 120000, forceRefresh: !!forceRefresh })
          .then(function (data) {
            App.state.calendarData = data || { events: [] };
            App.state.rehearsals = App.state.calendarData.events || App.state.rehearsals || [];
            if (App.state.selectedCalendarEventId) App.state.selectedCalendarEvent = (App.state.calendarData.events || []).find(function (event) { return String(event.id || event.eventId || "") === String(App.state.selectedCalendarEventId); }) || null;
            App.rebuildSearchProviders();
            App.renderStatusRibbon();
            if (App.state.currentPage === "calendar") App.renderCalendarPage();
            if (App.state.currentPage === "calendar" && App.state.selectedCalendarEventId) setTimeout(function () { App.showCalendarEventDetail(App.state.selectedCalendarEventId); }, 0);
            if (App.state.currentPage === "rehearsals") App.renderRehearsalsPage();
          })
          .catch(function (error) {
            if (!App.state.calendarData) App.state.calendarData = { events: [], source: "Timeline unavailable", error: App.getErrorMessage(error) };
            if (App.state.currentPage === "calendar" || App.state.currentPage === "rehearsals") App.notify("Calendar data could not be loaded: " + App.getErrorMessage(error));
            if (App.state.currentPage === "calendar") App.renderCalendarPage();
            if (App.state.currentPage === "rehearsals") App.renderRehearsalsPage();
          });
      },

      renderCalendarPage: function () {
        if (window.matchMedia && window.matchMedia("(max-width: 700px)").matches && !App.state.calendarMobileViewInitialised) {
          App.state.calendarMobileViewInitialised = true;
          if (App.state.calendarView === "month") App.state.calendarView = "agenda";
        }
        if (!App.state.calendarData) {
          App.loadCalendarData();
          App.renderCalendarLoading();
          return;
        }

        var source = document.getElementById("calendarSource");
        if (source) {
          source.textContent = (App.state.calendarData.source || "Timeline data") +
            (App.state.calendarData.generatedAt ? " · " + App.state.calendarData.generatedAt : "");
        }

        App.populateEventFilters("calendarTypeFilter", "type", App.getCalendarEvents());
        App.populateEventFilters("calendarVenueFilter", "venue", App.getCalendarEvents());
        App.restorePageControls("calendar");

        var heading = document.getElementById("calendarHeading");
        if (heading) heading.textContent = App.getCalendarHeading();

        var month = document.getElementById("calendarMonth");
        var agenda = document.getElementById("calendarAgenda");
        if (!month || !agenda) return;

        if (App.state.calendarView === "agenda") {
          month.style.display = "none";
          agenda.style.display = "grid";
          App.renderCalendarAgenda(agenda);
          return;
        }

        month.style.display = "grid";
        agenda.style.display = "none";
        if (App.state.calendarView === "day") App.renderCalendarRange(month, 1);
        else if (App.state.calendarView === "week") App.renderCalendarRange(month, 7);
        else App.renderCalendarMonth(month);
      },

      renderCalendarLoading: function () {
        var month = document.getElementById("calendarMonth");
        if (month) month.innerHTML = '<div style="grid-column:1/-1;">' + App.loadingState("Loading calendar events") + '</div>';
      },

      getCalendarEvents: function () {
        var events = (App.state.calendarData && App.state.calendarData.events) || App.state.rehearsals || [];
        var search = String((document.getElementById("calendarSearch") || {}).value || "").toLowerCase();
        var type = String((document.getElementById("calendarTypeFilter") || {}).value || "");
        var venue = String((document.getElementById("calendarVenueFilter") || {}).value || "");

        return events.filter(function (event) {
          var text = [event.title, event.event, event.area, event.venue, event.type, event.eventType,
            (event.staff || []).join(" "), (event.categories || []).join(" "),
            (event.schoolGroups || []).join(" "), (event.studentGroups || []).join(" "),
            (event.items || []).join(" ")].join(" ").toLowerCase();
          if (search && text.indexOf(search) < 0) return false;
          if (type && String(event.type || event.rehearsalType || "") !== type) return false;
          if (venue && String(event.venue || "") !== venue) return false;
          return true;
        });
      },

      renderCalendarMonth: function (el) {
        el.className = "calendarMonth";
        var date = App.state.calendarDate;
        var first = new Date(date.getFullYear(), date.getMonth(), 1);
        var start = new Date(first);
        start.setDate(first.getDate() - first.getDay());
        var events = App.getCalendarEvents();
        var byDate = App.groupEventsByDate(events);
        var html = "";

        for (var i = 0; i < 42; i++) {
          var day = new Date(start);
          day.setDate(start.getDate() + i);
          var key = App.toDateKey(day);
          var dayEvents = byDate[key] || [];
          html += '<div class="calendarDay' + (day.getMonth() === date.getMonth() ? "" : " muted") + '">' +
            '<div class="calendarDayNumber">' + App.escapeHtml(App.formatShortDate(day)) + '</div>' +
            dayEvents.slice(0, 3).map(function (event) {
              return '<button class="calendarEvent" type="button" style="background:' + App.escapeHtml(event.colour || "#2d67b2") + '" onclick="App.showCalendarEventDetail(\'' + App.escapeJs(event.id) + '\')">' +
                App.escapeHtml(event.title || event.event || "Event") +
              '</button>';
            }).join("") +
            (dayEvents.length > 3 ? '<div class="moduleMeta">+' + (dayEvents.length - 3) + ' more</div>' : "") +
          '</div>';
        }

        el.innerHTML = html;
      },

      renderCalendarRange: function (el, days) {
        var start = new Date(App.state.calendarDate);
        if (days === 7) start.setDate(start.getDate() - start.getDay() + 1);
        var events = App.getCalendarEvents();
        var byDate = App.groupEventsByDate(events);
        var html = "";

        for (var i = 0; i < days; i++) {
          var day = new Date(start);
          day.setDate(start.getDate() + i);
          var key = App.toDateKey(day);
          var dayEvents = (byDate[key] || []).sort(App.sortEvents);
          html += '<section class="calendarRangeDay">' +
            '<h4>' + App.escapeHtml(App.formatShortDate(day)) + '</h4>' +
            (dayEvents.length ? dayEvents.map(App.renderTimelineEventCard).join("") : App.emptyState("No events today", "Enjoy the quiet while it lasts.")) +
          '</section>';
        }
        el.className = "calendarRange calendarRange" + days;
        el.innerHTML = html;
      },

      renderCalendarAgenda: function (el) {
        var events = App.getCalendarEvents().sort(App.sortEvents);
        el.innerHTML = events.length
          ? events.map(App.renderTimelineEventCard).join("")
          : App.emptyState("No matching events", "Try adjusting the date, venue or event filters.");
      },

            (App.canEditTimeline() ? '<button class="quickLink compact" type="button" onclick="App.openTimelineEditor(\'' + App.escapeJs(event.id || event.eventId) + '\')">Edit Timeline event</button>' : '') +

      goCalendarToday: function () {
        App.state.calendarDate = new Date();
        App.renderCalendarPage();
      },

      moveCalendar: function (months) {
        var current = App.state.calendarDate;
        if (App.state.calendarView === "day") App.state.calendarDate = new Date(current.getFullYear(), current.getMonth(), current.getDate() + months);
        else if (App.state.calendarView === "week") App.state.calendarDate = new Date(current.getFullYear(), current.getMonth(), current.getDate() + (months * 7));
        else App.state.calendarDate = new Date(current.getFullYear(), current.getMonth() + months, 1);
        App.renderCalendarPage();
      },

      setCalendarView: function (view) {
        App.state.calendarView = ["day", "week", "month", "agenda"].indexOf(view) >= 0 ? view : "month";
        App.renderCalendarPage();
      },

      toggleCalendarView: function () {
        App.state.calendarView = App.state.calendarView === "month" ? "agenda" : "month";
        App.renderCalendarPage();
      },

      getCalendarHeading: function () {
        var date = App.state.calendarDate;
        if (App.state.calendarView === "day") return App.formatShortDate(date);
        if (App.state.calendarView === "week") {
          var start = new Date(date);
          start.setDate(start.getDate() - start.getDay() + 1);
          var end = new Date(start);
          end.setDate(start.getDate() + 6);
          return App.formatShortDate(start) + " – " + App.formatShortDate(end);
        }
        if (App.state.calendarView === "agenda") return "Agenda";
        return new Intl.DateTimeFormat("en-AU", { month: "long", year: "numeric" }).format(date);

      groupEventsByDate: function (events) {
        return (events || []).reduce(function (map, event) {
          var key = event.dateKey || App.toDateKey(event.date);
          if (!key) return map;
          map[key] = map[key] || [];
          map[key].push(event);
          return map;
        }, {});
      },

      renderAttendancePage: function () {
        var launch = document.getElementById("attendanceLaunch");
        var frame = document.getElementById("attendanceFrame");
        var placeholder = document.getElementById("attendancePlaceholder");
        var heroStatus = document.getElementById("attendanceHeroStatus");
        var sourceText = document.getElementById("attendanceSourceText");
        var urlText = document.getElementById("attendanceUrlText");
        if (!frame || !placeholder) return;

        if (heroStatus) heroStatus.textContent = App.state.attendanceStatus || (App.state.attendanceUrl ? "Checking" : "Waiting");
        if (sourceText) sourceText.textContent = App.state.attendanceSource || "Attendance API and standalone web app";
        if (urlText) {
          urlText.textContent = App.state.attendanceUrl
            ? "The standalone Attendance application remains available below."
            : "Configure SPEC_CENTRAL_ATTENDANCE_URL or ATTENDANCE_WEB_APP_URL.";
        }

        if (App.state.attendanceUrl) {
          if (launch) {
            launch.disabled = false;
            launch.textContent = "Open Attendance";
          }
          var qrLaunch = document.getElementById("attendanceQrLaunch");
          if (qrLaunch) {
            qrLaunch.disabled = !App.state.selectedAttendanceSessionId;
            qrLaunch.title = App.state.selectedAttendanceSessionId
              ? "Show the event check-in QR for " + (App.state.selectedAttendanceEventName || "this event")
              : "Select an attendance event first";
          }
          var attendanceTarget = App.buildAttendanceDeepLinkUrl(App.state.selectedAttendanceSessionId);
          if (frame.dataset.attendanceTarget !== attendanceTarget) {
            App.loadAttendanceFrameTarget(attendanceTarget, App.state.selectedAttendanceEventName);
          } else if (!frame.dataset.attendanceLoading) {
            frame.style.display = "block";
            placeholder.style.display = "none";
          }
        } else {
          if (launch) {
            launch.disabled = true;
            launch.textContent = "Attendance Not Configured";
          }
          frame.style.display = "none";
          placeholder.style.display = "block";
        }

        App.renderAttendanceLiveData();
        if (!App.state.attendanceLoaded && !App.state.loading.attendanceSummary) {
          App.loadAttendanceData(false);
        }
      },

      loadAttendanceData: function (forceRefresh) {
        App.state.attendanceError = "";
        App.state.loading.attendanceSummary = true;
        App.renderAttendanceLiveData();

        var summaryRequest = App.services.request("attendanceSummary", "portalGetAttendanceSummary", {
          cacheMs: 2 * 60 * 1000,
          timeoutMs: 30000,
          forceRefresh: !!forceRefresh
        });
        var eventsRequest = App.services.request("attendanceEvents", "portalGetAttendanceEvents", {
          cacheMs: 5 * 60 * 1000,
          timeoutMs: 30000,
          forceRefresh: !!forceRefresh
        });

        return Promise.all([summaryRequest, eventsRequest])
          .then(function (results) {
            var summaryResult = results[0] || {};
            var eventsResult = results[1] || {};
            App.state.attendanceLoaded = true;
            App.state.attendanceSummary = summaryResult.ok ? summaryResult.data || {} : null;
            App.state.attendanceEvents = eventsResult.ok && Array.isArray(eventsResult.data) ? eventsResult.data : [];
            App.state.attendanceStatus = summaryResult.status || (summaryResult.ok ? "Connected" : "Degraded");

            var errors = [];
            if (!summaryResult.ok) errors.push(summaryResult.error || "Attendance summary is unavailable.");
            if (!eventsResult.ok) errors.push(eventsResult.error || "Attendance events are unavailable.");
            App.state.attendanceError = errors.join(" ");
            App.setServiceStatus("attendance", App.state.attendanceStatus, App.formatTime(new Date()));
            App.renderAttendanceLiveData();
            App.renderStatusRibbon();
            return results;
          })
          .catch(function (error) {
            App.state.attendanceLoaded = true;
            App.state.attendanceStatus = App.state.attendanceUrl ? "Degraded" : "Waiting";
            App.state.attendanceError = App.getErrorMessage(error);
            App.setServiceStatus("attendance", App.state.attendanceStatus, App.formatTime(new Date()));
            App.renderAttendanceLiveData();
          })
          .finally(function () {
            App.state.loading.attendanceSummary = false;
            App.renderAttendanceLiveData();
          });
      },

      renderAttendanceLiveData: function () {
        var content = document.getElementById("attendanceLiveContent");
        var cards = document.getElementById("attendanceSummaryCards");
        var counts = document.getElementById("attendanceStatusCounts");
        var eventsList = document.getElementById("attendanceEventList");
        if (!content || !cards || !counts || !eventsList) return;

        var summary = App.state.attendanceSummary;

        if (!summary) {
          content.style.display = "none";
          return;
        }

        content.style.display = "block";
        var summaryCards = [
          ["Total events", summary.totalEvents || 0],
          ["Upcoming", summary.upcomingEvents || 0],
          ["Past", summary.pastEvents || 0],
          ["Student-event records", summary.totalStudentEventRecords || 0]
        ];
        cards.innerHTML = summaryCards.map(function (card) {
          return '<div class="attendanceSummaryCard"><div class="attendanceSummaryValue">' +
            App.escapeHtml(card[1]) + '</div><div class="attendanceSummaryLabel">' +
            App.escapeHtml(card[0]) + '</div></div>';
        }).join("") + '<div class="attendanceUpdated">Last updated ' + App.escapeHtml(App.formatAttendanceApiTime(summary.lastUpdated)) + '</div>';

        var statusCounts = summary.countsByStatus || {};
        var statusNames = Object.keys(statusCounts);
        counts.innerHTML = statusNames.length
          ? statusNames.map(function (status) {
              return '<div class="attendanceStatusRow"><span>' + App.escapeHtml(status) + '</span><strong>' +
                App.escapeHtml(statusCounts[status]) + '</strong></div>';
            }).join("")
          : App.emptyState("No attendance marks yet", "Status totals will appear when a roll is marked.");

        var search = document.getElementById("attendanceEventSearch");
        if (search && search.value !== App.state.attendanceEventSearch) {
          search.value = App.state.attendanceEventSearch;
        }
        Array.prototype.forEach.call(document.querySelectorAll("[data-attendance-filter]"), function (button) {
          button.classList.toggle("active", button.getAttribute("data-attendance-filter") === App.state.attendanceEventFilter);
        });

        var filteredEvents = App.getFilteredAttendanceEvents()
          .sort(function (a, b) {
            return String(a.dateKey || a.date || "").localeCompare(String(b.dateKey || b.date || "")) ||
              String(a.time || "").localeCompare(String(b.time || ""));
          });

        eventsList.className = "attendanceEventList";
        eventsList.innerHTML = filteredEvents.length
          ? filteredEvents.map(App.renderAttendanceEventCard).join("")
          : App.emptyState("No matching attendance sessions", "Try another date range or search term.");
      },

      setAttendanceEventFilter: function (filter) {
        App.state.attendanceEventFilter = ["today", "week", "upcoming", "all"].indexOf(filter) >= 0
          ? filter
          : "upcoming";
        App.renderAttendanceLiveData();
      },

      setAttendanceEventSearch: function (value) {
        App.state.attendanceEventSearch = String(value || "").trim().toLowerCase();
        App.renderAttendanceLiveData();
      },

      getFilteredAttendanceEvents: function () {
        var todayDate = new Date();
        var today = App.toDateKey(todayDate);
        var day = todayDate.getDay();
        var mondayOffset = day === 0 ? -6 : 1 - day;
        var weekStartDate = new Date(todayDate.getFullYear(), todayDate.getMonth(), todayDate.getDate() + mondayOffset);
        var weekEndDate = new Date(weekStartDate.getFullYear(), weekStartDate.getMonth(), weekStartDate.getDate() + 6);
        var weekStart = App.toDateKey(weekStartDate);
        var weekEnd = App.toDateKey(weekEndDate);
        var filter = App.state.attendanceEventFilter || "upcoming";
        var query = String(App.state.attendanceEventSearch || "").toLowerCase();

        return (App.state.attendanceEvents || []).filter(function (event) {
          var dateKey = event.dateKey || App.toDateKey(event.date);
          var matchesDate = filter === "all" ||
            (filter === "today" && dateKey === today) ||
            (filter === "week" && dateKey && dateKey >= weekStart && dateKey <= weekEnd) ||
            (filter === "upcoming" && (!dateKey || dateKey >= today));
          if (!matchesDate) return false;
          if (!query) return true;

          return [event.eventName, event.location, event.staff, event.categories]
            .filter(Boolean)
            .join(" ")
            .toLowerCase()
            .indexOf(query) >= 0;
        });
      },

      renderAttendanceEventCard: function (event) {
        var attendanceCounts = event.attendanceCounts && event.attendanceCounts.byStatus
          ? event.attendanceCounts.byStatus
          : {};
        var countText = Object.keys(attendanceCounts)
          .filter(function (status) { return Number(attendanceCounts[status]) > 0; })
          .map(function (status) { return status + " " + attendanceCounts[status]; })
          .join(" · ");

        var sessionId = String(event.sessionId || "");
        var eventName = String(event.eventName || "Attendance event");
        var accessibleName = "Open Attendance roll for " + eventName;
        var encodedSessionId = App.encodeAttendanceInlineValue(sessionId);
        var encodedEventName = App.encodeAttendanceInlineValue(eventName);
        var total = Number((event.attendanceCounts || {}).total || event.studentCount) || 0;
        var present = Number(attendanceCounts.Present) || 0;
        var progress = total > 0 ? Math.min(100, Math.round((present / total) * 100)) : 0;
        var selected = sessionId && sessionId === App.state.selectedAttendanceSessionId;
        var selectedBadge = selected ? '<span class="attendanceOpenBadge">Currently Open</span>' : "";

        return '<article class="attendanceEventCard' + (selected ? ' selected' : '') + '"><button class="attendanceEventMain" type="button" aria-label="' +
          App.escapeHtml(accessibleName) + '" onclick="App.openAttendanceEvent(decodeURIComponent(\'' + encodedSessionId +
          '\'),decodeURIComponent(\'' + encodedEventName + '\'),false)"><div class="attendanceEventTitle"><strong>' +
          App.escapeHtml(eventName) + '</strong>' + selectedBadge + '</div>' +
          '<div class="attendanceEventMeta">' +
          App.escapeHtml([event.date, event.time, event.location].filter(Boolean).join(" · ")) +
          '</div><div class="attendanceEventCounts">' + App.escapeHtml(countText || "No attendance marks yet") +
          '</div><div class="attendanceProgressText"><strong>' + present + ' / ' + total +
          '</strong><span>' + progress + '% complete</span></div><div class="attendanceProgress" role="progressbar" aria-label="' +
          App.escapeHtml(eventName + " attendance progress") + '" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' +
          progress + '"><span style="width:' + progress + '%"></span></div></button><div class="attendanceEventActions">' +
          '<strong>' + App.escapeHtml(total) +
          '</strong><button class="quickLink compact" type="button" onclick="App.openAttendanceEvent(decodeURIComponent(\'' +
          encodedSessionId + '\'),decodeURIComponent(\'' + encodedEventName + '\'),false)">Open roll →</button>' +
          '<button class="quickLink compact" type="button" aria-label="' + App.escapeHtml(accessibleName + " in a new tab") +
          '" onclick="App.openAttendanceEvent(decodeURIComponent(\'' + encodedSessionId + '\'),decodeURIComponent(\'' +
          encodedEventName + '\'),true)">New tab ↗</button>' +
          '<button class="quickLink compact" type="button" aria-label="Show event check-in QR for ' + App.escapeHtml(eventName) +
          '" onclick="App.openAttendanceQr(decodeURIComponent(\'' + encodedSessionId + '\'),decodeURIComponent(\'' +
          encodedEventName + '\'))">Check-in QR</button></div></article>';
      },

      encodeAttendanceInlineValue: function (value) {
        return encodeURIComponent(String(value === undefined || value === null ? "" : value))
          .replace(/'/g, "%27");
      },

      buildAttendanceDeepLinkUrl: function (sessionId) {
        var baseUrl = String(App.state.attendanceUrl || "");
        if (!baseUrl || !sessionId) return baseUrl;

        try {
          var url = new URL(baseUrl, window.location.href);
          url.searchParams.set("sessionId", String(sessionId));
          return url.toString();
        } catch (error) {
          return baseUrl + (baseUrl.indexOf("?") >= 0 ? "&" : "?") +
            "sessionId=" + encodeURIComponent(String(sessionId));
        }
      },

      buildAttendanceCheckinUrl: function (sessionId, token) {
        var baseUrl = String(App.state.attendanceUrl || "");
        if (!baseUrl || !sessionId) return "";
        try {
          var url = new URL(baseUrl, window.location.href);
          url.searchParams.set("page", "student");
          if (token) {
            // Preferred: opaque, expiring token (see Attendance/PublicCheckinTokens.gs).
            url.searchParams.set("token", String(token));
          } else {
            // Legacy fallback: the deterministic session ID. Still works —
            // the Attendance app now validates session eligibility
            // server-side on every request regardless of how it was
            // reached — but carries no expiry of its own, so the token
            // path above is preferred whenever it's available.
            url.searchParams.set("sessionId", String(sessionId));
          }
          return url.toString();
        } catch (error) {
          var query = token
            ? "token=" + encodeURIComponent(String(token))
            : "sessionId=" + encodeURIComponent(String(sessionId));
          return baseUrl + (baseUrl.indexOf("?") >= 0 ? "&" : "?") + "page=student&" + query;
        }
      },

      openAttendanceQr: function (sessionId, eventName) {
        var safeSessionId = String(sessionId || App.state.selectedAttendanceSessionId || "").trim();
        var safeEventName = String(eventName || App.state.selectedAttendanceEventName || "Attendance event");
        var drawer = document.getElementById("attendanceQrDrawer");
        var legacyUrl = App.buildAttendanceCheckinUrl(safeSessionId);
        if (!drawer || !legacyUrl) {
          App.notify("Select an Attendance event before opening its check-in QR code.");
          return;
        }
        App.state.selectedAttendanceSessionId = safeSessionId;
        App.state.selectedAttendanceEventName = safeEventName;

        drawer.hidden = false;
        drawer.innerHTML = '<div class="drawerHeader"><div><span class="scProfileKicker">Student and staff check-in</span><h3>' +
          App.escapeHtml(safeEventName) + '</h3></div><button type="button" onclick="App.closeAttendanceQr()" aria-label="Close QR code">×</button></div>' +
          '<div class="drawerBody attendanceQrBody"><p>Preparing a secure check-in link…</p></div>';

        // Mint a short-lived token before rendering. If the secure token
        // channel is unavailable for any reason, fall back to the legacy
        // sessionId-only link rather than blocking the manager — that link
        // still works (see buildAttendanceCheckinUrl above).
        google.script.run
          .withSuccessHandler(function (result) {
            var hasToken = !!(result && result.ok && result.token);
            var checkinUrl = hasToken ? App.buildAttendanceCheckinUrl(safeSessionId, result.token) : legacyUrl;
            var note = hasToken
              ? "This code expires automatically and is scoped to this event only."
              : "Using a standard link — secure check-in tokens are temporarily unavailable.";
            App.renderAttendanceQrDrawer(drawer, safeEventName, checkinUrl, note);
          })
          .withFailureHandler(function () {
            App.renderAttendanceQrDrawer(drawer, safeEventName, legacyUrl, "Using a standard link — secure check-in tokens are temporarily unavailable.");
          })
          .portalIssueAttendanceCheckinToken(safeSessionId);
      },

      renderAttendanceQrDrawer: function (drawer, safeEventName, checkinUrl, note) {
        if (!drawer) return;
        drawer.innerHTML = '<div class="drawerHeader"><div><span class="scProfileKicker">Student and staff check-in</span><h3>' +
          App.escapeHtml(safeEventName) + '</h3></div><button type="button" onclick="App.closeAttendanceQr()" aria-label="Close QR code">×</button></div>' +
          '<div class="drawerBody attendanceQrBody"><p>Students and staff can scan this code to open the check-in page with this event selected.</p>' +
          '<div id="attendanceQrCanvas" class="attendanceQrCanvas" role="img" aria-label="QR code for event check-in to ' + App.escapeHtml(safeEventName) + '"></div>' +
          '<p class="moduleMeta">' + App.escapeHtml(note || "") + ' Each person still chooses Student or Staff before finding their own profile — the link carries no participant information.</p></div>' +
          '<div class="drawerActions"><button class="quickLink primaryAction" type="button" onclick="window.open(\'' +

      /**
       * Renders a QR code entirely client-side (kazuhikoarase/qrcode-generator,

       * third-party QR image API — sending the check-in URL/token to an
       * external service was flagged as finding H2 in
       * Attendance/Docs/StudentCheckinAudit.md. If the library failed to
       * load, this falls back to a plain link rather than reintroducing
       * that dependency.
       */
      renderQrCodeInto: function (elementId, value) {
        var el = document.getElementById(elementId);
        if (!el) return;
        try {
          if (typeof qrcode !== "function") throw new Error("QR library unavailable");
          var qr = qrcode(0, "M");
          qr.addData(String(value || ""));
          qr.make();
          if (typeof qr.createImgTag === "function") {
            el.innerHTML = qr.createImgTag(6, 12);
          } else if (typeof qr.createSvgTag === "function") {
            el.innerHTML = qr.createSvgTag(6, 12);
          } else {
            throw new Error("No supported QR render method");
          }
        } catch (error) {
          el.innerHTML = '<p class="moduleMeta">QR image unavailable right now — use the "Open check-in page" button below, or share this link directly: ' +

        placeholder.textContent = eventName
          ? "Loading Attendance roll for " + eventName + "..."
