        var source = document.getElementById("mediaSource");
        if (!el) return;

        if (!App.state.mediaData) {
          el.innerHTML = App.loadingState("Loading Media workspace");
          App.loadMediaTimelineData();
          return;
        }

        if (source) source.textContent = (App.state.mediaData.source || "Media Timeline") +
          (App.state.mediaData.generatedAt ? " · " + App.state.mediaData.generatedAt : "");

        var activities = App.state.mediaData.activities || [];
        var view = App.state.mediaView || "gantt";

        if (view === "calendar") {
          el.innerHTML = App.renderGroupedCards(activities, "publishDate");
        } else if (view === "campaigns") {
          el.innerHTML = App.renderGroupedCards(activities, "campaign");
        } else if (view === "mine") {
          el.innerHTML = App.renderDataTable(App.filterMine(activities, "owner"), ["campaign", "activity", "channel", "owner", "status", "priority", "publishDate", "approvalStatus", "notes"]);
        } else {
          el.innerHTML = App.renderMediaGantt(activities);
        }
      },

      loadMediaTimelineData: function () {
        App.services.request("mediaTimeline", "portalGetMediaTimelineData", { cacheMs: 120000, timeoutMs: 30000 })
          .then(function (data) {
            App.state.mediaData = data || { activities: [] };
            if (App.state.currentPage === "mediaTimeline") App.renderMediaTimelinePage();
          })
          .catch(function (error) {
            App.state.mediaData = { activities: [], source: "Unavailable: " + App.getErrorMessage(error) };
            if (App.state.currentPage === "mediaTimeline") App.renderMediaTimelinePage();
          });
      },

      setMediaView: function (view) {
        App.state.mediaView = view;
        App.renderMediaTimelinePage();
      },

      renderMediaGantt: function (activities) {
        return '<div class="ganttGrid">' + (activities.length ? activities.map(function (activity) {
          return '<div class="ganttRow">' +
            '<div><strong>' + App.escapeHtml(activity.campaign || "Campaign") + '</strong><div class="moduleMeta">' + App.escapeHtml(activity.activity || "") + '</div></div>' +
            '<div class="ganttTrack"><div class="ganttBar" title="' + App.escapeHtml(activity.status || "") + '"></div></div>' +
          '</div>';
        }).join("") : '<div class="empty">No media activities found.</div>') + '</div>';
      },

      renderGroupedCards: function (items, field) {
        var groups = {};
        (items || []).forEach(function (item) {
          var key = item[field] || "Unspecified";
          groups[key] = groups[key] || [];
          groups[key].push(item);
        });

        var keys = Object.keys(groups).sort();
        return keys.length ? keys.map(function (key) {
          return '<div class="boardColumn" style="margin-bottom:12px;"><strong>' + App.escapeHtml(key) + '</strong>' +
            groups[key].map(App.renderTaskCard).join("") +
          '</div>';
        }).join("") : '<div class="empty">No records found.</div>';
      },

      renderDataTable: function (rows, columns) {
        if (!rows.length) return '<div class="empty">No records found.</div>';
        return '<table class="dataTable"><thead><tr>' +
          columns.map(function (column) { return '<th>' + App.escapeHtml(App.toTitle(column)) + '</th>'; }).join("") +
          '</tr></thead><tbody>' +
          rows.map(function (row) {
            return '<tr>' + columns.map(function (column) {
              return '<td>' + App.escapeHtml(row[column] || "") + '</td>';
            }).join("") + '</tr>';
          }).join("") +
          '</tbody></table>';
      },

      loadAdministrationData: function (forceRefresh) {
        if (App.state.loading.administration) return;
        App.state.loading.administration = true;
        return App.services.request("administration", "portalGetAdministrationData", { cacheMs: 300000, timeoutMs: 60000, forceRefresh: !!forceRefresh })
          .then(function (data) {
            App.state.administrationData = data || {};
            App.state.loading.administration = false;
            if (App.state.currentPage === "administration") App.renderAdministrationPage();
          })
          .catch(function (error) {
            App.state.loading.administration = false;
            var el = document.getElementById("administrationContent");
            if (el) el.innerHTML = '<div class="empty">Administration data could not be loaded: ' + App.escapeHtml(App.getErrorMessage(error)) + '</div>';
          });
      },

      renderAdministrationPage: function () {
        var content = document.getElementById("administrationContent");
        if (!content) return;
        if (!App.state.administrationData) {
          content.innerHTML = App.loadingState("Loading platform services");
          App.loadAdministrationData();
          return;
        }
        var data = App.state.administrationData;
        var source = document.getElementById("administrationSource");
        if (source) source.textContent = "Platform diagnostics are read-only; authorised role assignments are audited · " + App.formatAdministrationTimestamp(data.generatedAt);
        App.renderAdministrationSummary();
        var views = ["users", "authentication", "permissions", "modules", "sources", "workflows", "jobs", "rules", "notifications", "audit", "health", "registry"];
        Array.prototype.forEach.call(document.querySelectorAll(".administrationTabs button"), function (button, index) {
          button.classList.toggle("active", views[index] === App.state.administrationView);
        });
        var renderers = {
          users: App.renderAdministrationUsers,
          authentication: App.renderAdministrationAuthentication,
          permissions: App.renderAdministrationPermissions,
          modules: App.renderAdministrationModules,
          sources: App.renderAdministrationSources,
          workflows: App.renderAdministrationWorkflows,
          jobs: App.renderAdministrationJobs,
          rules: App.renderAdministrationRules,
          notifications: App.renderAdministrationNotifications,
          audit: App.renderAdministrationAudit,
          health: App.renderAdministrationHealth,
          registry: App.renderAdministrationRegistry
        };
        content.innerHTML = (renderers[App.state.administrationView] || App.renderAdministrationUsers)();
      },

      setAdministrationView: function (view) {
        App.state.administrationView = view;
        App.setWorkspaceBreadcrumb(["Administration", App.toTitle(view)]);
        App.closeAdministrationDetail();
        App.renderAdministrationPage();
      },

      updateAdministrationFilters: function () {
        App.state.administrationSearch = String((document.getElementById("administrationSearch") || {}).value || "").trim().toLowerCase();
        App.state.administrationStatus = String((document.getElementById("administrationStatusFilter") || {}).value || "").toLowerCase();
        App.state.administrationSort = String((document.getElementById("administrationSort") || {}).value || "name");
        App.renderAdministrationPage();
        var search = document.getElementById("administrationSearch");
        if (search) {
          search.value = App.state.administrationSearch;
          search.focus();
        }
      },

      filterAdministrationRows: function (rows) {
        var search = App.state.administrationSearch || "";
        var status = App.state.administrationStatus || "";
        var sort = App.state.administrationSort || "name";
        return (rows || []).filter(function (row) {
          var text = JSON.stringify(row || {}).toLowerCase();
          return (!search || text.indexOf(search) >= 0) && (!status || text.indexOf(status) >= 0);
        }).sort(function (a, b) {
          var aValue = sort === "status" ? (a.status || a.health || a.enabled) : sort === "type" ? (a.entityType || a.trigger || a.channel) : (a.name || a.title || a.id || "");
          var bValue = sort === "status" ? (b.status || b.health || b.enabled) : sort === "type" ? (b.entityType || b.trigger || b.channel) : (b.name || b.title || b.id || "");
          return String(aValue).localeCompare(String(bValue));
        });
      },

      renderAdministrationSummary: function () {
        var el = document.getElementById("administrationSummary");
        if (!el) return;
        var data = App.state.administrationData || {};
        var stats = [
          { label: "Users", value: (data.users || []).length },
          { label: "Capabilities", value: ((data.permissions || {}).capabilities || []).length },
          { label: "Sources", value: (data.sources || []).length },
          { label: "Workflows", value: (data.workflows || []).length },
          { label: "Jobs", value: (data.jobs || []).length },
          { label: "Health checks", value: (data.health || []).length }
        ];
        el.innerHTML = stats.map(function (stat) { return '<div><strong>' + App.escapeHtml(stat.value) + '</strong><span>' + App.escapeHtml(stat.label) + '</span></div>'; }).join("");
      },

      renderAdministrationUsers: function () {
        return App.renderAdministrationTable(App.filterAdministrationRows((App.state.administrationData.users || []).map(function (user) {
          return Object.assign({}, user, { capabilities: (user.capabilities || []).join(", "), administrator: user.administrator ? "Administrator" : "Standard", scope: user.scope && user.scope.type || "production" });
        })), ["name", "email", "role", "capabilities", "productionArea", "department", "administrator", "status", "lastSeen", "authenticationSource", "source"], "user");
      },

      renderAdministrationAuthentication: function () {
        var auth = App.state.administrationData.authentication || {};
        var user = auth.currentUser || {};
        var resolution = auth.resolution || {};
        var cache = auth.cache || {};
        var cards = [
          ["Current user", user.displayName || "Authenticated user", user.googleAccount || "No Google account"],
          ["Staff match", user.matchedStaffRecord ? "Matched" : user.status || "Not matched", resolution.matchedUsing || "No match method"],
          ["Role & department", user.role || "No role", (user.departments || []).join(", ") || user.department || "No department"],
          ["Capabilities", (user.capabilities || []).length, user.scope && user.scope.type || "No scope"],
          ["Identity cache", cache.cache || "Unknown", cache.cacheHit ? "Cache hit" : "Cache miss"],
          ["Lookup performance", (auth.lookupTimeMs || 0) + "ms", "Permission build " + (cache.permissionBuildMs || 0) + "ms"]
        ];
        var checks = auth.checks || [];
        var conflicts = auth.conflicts || [];
        return '<div class="identitySummaryGrid">' + cards.map(function (item) { return '<article class="identitySummaryCard"><span>' + App.escapeHtml(item[0]) + '</span><strong>' + App.escapeHtml(item[1]) + '</strong><small>' + App.escapeHtml(item[2]) + '</small></article>'; }).join("") + '</div><h4 class="sectionTitle">Authentication diagnostics</h4>' + App.renderAdministrationTable(checks.map(function (item) { return { name: item.name, status: item.status, detail: item.detail }; }), ["name", "status", "detail"], "authentication-check") + '<h4 class="sectionTitle adminSubheading">Identity conflicts</h4>' + (conflicts.length ? App.renderAdministrationTable(conflicts.map(function (item) { return { name: item.identity, status: "Duplicate", records: item.count, staff: (item.records || []).map(function (record) { return record.name; }).join(", ") }; }), ["name", "status", "records", "staff"], "identity-conflict") : App.emptyState("No duplicate identities", "Every indexed staff email resolves to at most one record."));
      },

      renderAdministrationPermissions: function () {
        var permissions = App.state.administrationData.permissions || { capabilities: [], matrix: [] };
        var rows = App.filterAdministrationRows(permissions.matrix || []);
        var canManage = !App.state.viewingAsRole && App.hasActualPermission("Permissions.Manage");
        var currentEmail = String((App.state.staff || {}).email || "").toLowerCase();
        var roles = ["No Access"].concat(Object.keys(permissions.roles || {}));
        App.state.administrationDetailItems = rows;
        if (!rows.length) return '<div class="empty">No permission records match.</div>';
        return '<div class="permissionLegend"><span>✓ Direct grant</span><span>○ Inherited from role</span><span>— Unavailable</span>' + (canManage ? '<strong>Change a role to update access. Capability cells remain derived.</strong>' : '') + '</div><div class="adminTableWrap"><table class="adminTable permissionMatrix"><thead><tr><th>User</th><th>SpecCentral Role</th><th>Scope</th>' +
          permissions.capabilities.map(function (capability) { return '<th title="' + App.escapeHtml(capability) + '">' + App.escapeHtml(capability) + '</th>'; }).join("") +
          '</tr></thead><tbody>' + rows.map(function (row, index) {
            var editable = canManage && row.email && String(row.email).toLowerCase() !== currentEmail;
            var roleControl = editable ? '<select class="permissionRoleSelect" aria-label="SpecCentral role for ' + App.escapeHtml(row.name) + '" data-original="' + App.escapeHtml(row.role) + '" onchange="App.updateAdministrationRole(\'' + App.escapeJs(row.email) + '\',this)">' + roles.map(function (role) { return '<option value="' + App.escapeHtml(role) + '"' + (String(row.role).toLowerCase() === role.toLowerCase() ? ' selected' : '') + '>' + App.escapeHtml(role) + '</option>'; }).join("") + '</select>' : '<span>' + App.escapeHtml(row.role) + '</span>';
            return '<tr><td><button type="button" onclick="App.openAdministrationDetail(' + index + ',\'permission\')">' + App.escapeHtml(row.name) + '</button></td><td>' + roleControl + '</td><td>' + App.escapeHtml(row.scope && row.scope.type || "production") + '</td>' +
              permissions.capabilities.map(function (capability) { var value = row.grants[capability]; return '<td class="permissionCell ' + App.escapeHtml(String(value).toLowerCase()) + '" title="' + App.escapeHtml(value) + '">' + (value === "Granted" ? "✓" : value === "Inherited" ? "○" : "—") + '</td>'; }).join("") + '</tr>';
          }).join("") + '</tbody></table></div>';
      },

      updateAdministrationRole: function (email, select) {
        if (!select || !email || App.state.viewingAsRole || !App.hasActualPermission("Permissions.Manage")) return;
        var role = select.value, original = select.dataset.original || "No Access";
        if (role === original) return;
        if (!window.confirm("Assign " + role + " to " + email + "?")) { select.value = original; return; }
        select.disabled = true;
        App.services.request("staffAccessRole:" + email + ":" + Date.now(), "portalUpdateStaffAccessRole", { args: [{ email: email, role: role }], noCache: true, timeoutMs: 60000 })
          .then(function () { App.notify("SpecCentral role updated for " + email + "."); App.invalidateClientModule("administration"); App.state.administrationData = null; return App.loadAdministrationData(true); })
          .catch(function (error) { select.value = original; select.disabled = false; App.notify("Role could not be updated: " + App.getErrorMessage(error)); });
      },

      renderAdministrationModules: function () {
        return App.renderAdministrationTable(App.filterAdministrationRows(App.state.administrationData.modules || []), ["id", "entityType", "source", "cache", "editable", "direction", "health", "readCapability", "editCapability", "actions", "interaction"], "module");
      },

      renderAdministrationSources: function () {
        return App.renderAdministrationTable(App.filterAdministrationRows(App.state.administrationData.sources || []), ["id", "spreadsheet", "sheetNames", "lastSync", "cache", "cacheAge", "identityField", "stableId", "health", "direction", "editable"], "source");
      },

      renderAdministrationWorkflows: function () {
        var rows = (App.state.administrationData.workflows || []).map(function (item) { return Object.assign({}, item, { trigger: item.trigger && item.trigger.type, dependencies: (item.dependencies || []).join(", "), actions: (item.actions || []).join(", "), capabilitiesRequired: (item.capabilitiesRequired || []).join(", "), approvalRequired: item.approval && item.approval.required ? "Required" : "Not required", enabled: item.enabled ? "Enabled" : "Disabled" }); });
        return App.renderAdministrationTable(App.filterAdministrationRows(rows), ["name", "id", "status", "enabled", "owner", "trigger", "dependencies", "actions", "version", "approvalRequired"], "workflow");
      },

      renderAdministrationJobs: function () {
        var data = App.state.administrationData;
        var registry = (data.jobRegistry || []).map(function (item) { return { name: item.jobType, status: item.adapterConnected ? "Connected" : "Waiting for Adapter", adapter: item.adapterConnected ? "Registered" : "None", schedule: "Not scheduled" }; });
        var jobs = (data.jobs || []).map(function (item) { return Object.assign({ name: item.jobType }, item); });
        return '<h4 class="sectionTitle">Registered job adapters</h4>' + App.renderAdministrationTable(App.filterAdministrationRows(registry), ["name", "status", "adapter", "schedule"], "job-adapter") +
          '<h4 class="sectionTitle adminSubheading">Operations queue</h4>' + App.renderAdministrationTable(App.filterAdministrationRows(jobs), ["name", "status", "priority", "requestedBy", "createdAt", "attempts", "error"], "job");
      },

      renderAdministrationRules: function () {
        var rows = (App.state.administrationData.automationRules || []).map(function (rule) { return Object.assign({}, rule, { status: rule.enabled ? "Enabled" : "Disabled", trigger: rule.eventType, actions: rule.workflowId, owner: String(rule.workflowId || "").split(".")[0], dependencies: "Workflow registry" }); });
        return App.renderAdministrationTable(App.filterAdministrationRows(rows), ["name", "status", "trigger", "condition", "actions", "owner", "dependencies"], "rule");
      },

      renderAdministrationNotifications: function () {
        var channels = (App.state.administrationData.notificationChannels || []).map(function (channel) { return { name: channel.channel, channel: channel.channel, status: channel.connected ? "Connected" : "Adapter Only", adapter: channel.connected ? "Registered" : "None", queueCount: (App.state.administrationData.notifications || []).filter(function (item) { return item.channel === channel.channel; }).length }; });
        return App.renderAdministrationTable(App.filterAdministrationRows(channels), ["name", "status", "adapter", "queueCount"], "notification");
      },

      renderAdministrationAudit: function () {
        var rows = (App.state.administrationData.audit || []).map(function (item) { return { id: item.id, name: item.action, entity: item.entity && (item.entity.type || item.entity.id) || "", user: item.actor, timestamp: item.occurredAt, action: item.action, workflow: item.details && item.details.workflowId || "", source: "AuditService", status: "Recorded", details: item.details }; });
        return App.renderAdministrationTable(App.filterAdministrationRows(rows), ["name", "entity", "user", "timestamp", "workflow", "source", "status"], "audit");
      },

      renderAdministrationHealth: function () {
        var rows = App.filterAdministrationRows(App.state.administrationData.health || []);
        App.state.administrationDetailItems = rows;
        return rows.length ? '<div class="healthGrid">' + rows.map(function (item, index) { return '<button class="healthCard" type="button" onclick="App.openAdministrationDetail(' + index + ',\'health\')"><span class="statusChip ' + App.escapeHtml(String(item.status).toLowerCase().replace(/[^a-z]+/g, "-")) + '">' + App.escapeHtml(item.status) + '</span><strong>' + App.escapeHtml(item.name) + '</strong><span>' + App.escapeHtml(item.entityCount + " " + item.entityLabel) + '</span><small>' + App.escapeHtml(item.responseMs + "ms · " + item.dependencies) + '</small>' + (item.errors ? '<em>' + App.escapeHtml(item.errors) + '</em>' : '') + '</button>'; }).join("") + '</div>' : '<div class="empty">No health checks match.</div>';
      },

      renderAdministrationRegistry: function () {
        var registry = App.state.administrationData.registry || {};
        var search = App.state.administrationSearch || "";
        function matches(value) { return !search || JSON.stringify(value).toLowerCase().indexOf(search) >= 0; }
        function sorted(rows) { return (rows || []).filter(matches).sort(function (a, b) { return JSON.stringify(a).localeCompare(JSON.stringify(b)); }); }
        return '<div class="registryGrid">' +
          App.renderRegistrySection("Entities", sorted(registry.entities).map(function (name) { return { name: name, type: "Entity" }; }), ["name", "type"]) +
          App.renderRegistrySection("Relationships", sorted(registry.relationships), ["from", "relation", "to", "via", "resolver"]) +
          App.renderRegistrySection("Actions", sorted(registry.actions), ["module", "action"]) +
          App.renderRegistrySection("AI hooks", sorted(registry.aiExtensions), ["hook", "connected"]) +
        '</div>';
      },

      renderRegistrySection: function (title, rows, columns) {
        return '<section class="registrySection"><h4>' + App.escapeHtml(title) + ' <span class="countBadge">' + rows.length + '</span></h4>' + App.renderDataTable(rows, columns) + '</section>';
      },

      renderAdministrationTable: function (rows, columns, detailType) {
        App.state.administrationDetailItems = rows;
        if (!rows.length) return '<div class="empty">No records match the current filters.</div>';
        return '<div class="adminTableWrap"><table class="adminTable"><thead><tr>' + columns.map(function (column) { return '<th>' + App.escapeHtml(App.toTitle(column)) + '</th>'; }).join("") + '</tr></thead><tbody>' +
          rows.map(function (row, index) { return '<tr>' + columns.map(function (column, columnIndex) { var value = App.formatAdministrationValue(row[column]); return '<td>' + (columnIndex === 0 ? '<button type="button" onclick="App.openAdministrationDetail(' + index + ',\'' + App.escapeJs(detailType) + '\')">' + value + '</button>' : value) + '</td>'; }).join("") + '</tr>'; }).join("") + '</tbody></table></div>';
      },

      formatAdministrationValue: function (value) {
        if (Array.isArray(value)) return value.length ? '<span class="adminBadgeList">' + value.map(function (item) { return '<span class="adminBadge">' + App.escapeHtml(item) + '</span>'; }).join("") + '</span>' : "—";
        if (value && typeof value === "object") return App.escapeHtml(JSON.stringify(value));
        if (value === true || value === "Enabled" || value === "Connected" || value === "Active" || value === "Registered") return '<span class="statusChip connected">' + App.escapeHtml(String(value)) + '</span>';
        if (value === false || value === "Disabled" || value === "Unavailable" || value === "Not Connected") return '<span class="statusChip disabled">' + App.escapeHtml(String(value)) + '</span>';
        return App.escapeHtml(value === undefined || value === null || value === "" ? "—" : String(value));
      },

      openAdministrationDetail: function (index, type) {
        var item = App.state.administrationDetailItems[index];
        var drawer = document.getElementById("administrationDrawer");
        if (!item || !drawer) return;
        drawer.hidden = false;
        drawer.innerHTML = '<div class="drawerHeader"><div><div class="scProfileKicker">' + App.escapeHtml(type || "record") + '</div><h3>' + App.escapeHtml(item.name || item.title || item.id || "Detail") + '</h3></div><button type="button" aria-label="Close detail" onclick="App.closeAdministrationDetail()">×</button></div>' +
          '<div class="drawerBody">' + Object.keys(item).filter(function (key) { return key !== "rawPermissions" && key !== "rawAccess"; }).map(function (key) { return '<div class="drawerField"><strong>' + App.escapeHtml(App.toTitle(key)) + '</strong><div>' + App.formatAdministrationValue(item[key]) + '</div></div>'; }).join("") + '</div>' +
          '<div class="drawerActions"><span class="statusChip">Read-only platform record</span></div>';
      },

      closeAdministrationDetail: function () {
        var drawer = document.getElementById("administrationDrawer");
        if (drawer) { drawer.hidden = true; drawer.innerHTML = ""; }
      },

      formatAdministrationTimestamp: function (value) {
        var date = new Date(value);
        return isNaN(date.getTime()) ? String(value || "") : date.toLocaleString("en-AU");
      },

      filterMine: function (items, ownerField) {
        var email = String(App.state.staff.email || "").toLowerCase();
        var name = String(App.state.staff.name || App.state.staff.displayName || "").toLowerCase();
        return (items || []).filter(function (item) {
          var owner = String(item[ownerField] || "").toLowerCase();
          return owner && (owner.indexOf(email) >= 0 || owner.indexOf(name) >= 0);
        });
      },

      toTitle: function (value) {
        return String(value || "")
          .replace(/([A-Z])/g, " $1")
          .replace(/^./, function (char) { return char.toUpperCase(); });
      },

      openAttendance: function () {
        if (App.state.attendanceUrl) {
          window.open(App.state.attendanceUrl, "_blank");
          return;
        }
        App.navigate("attendance");
        App.notify("Attendance URL is not configured yet.");
      },

      focusParticipantsSearch: function () {
        App.navigate("participants");
        setTimeout(function () {
          var search = document.getElementById("participantSearch");
          if (search) search.focus();
          App.ensurePortalDataLoaded().catch(function (error) {
            App.notify("Participant data could not be loaded: " + App.getErrorMessage(error));
          });
        }, 0);
      },

      browseGlobal: function (type) {
        App.navigate("participants");
        setTimeout(function () {
          var search = document.getElementById("participantSearch");
          var resultsEl = document.getElementById("participantResults");
          var statusEl = document.getElementById("participantStatus");
          if (!search || !resultsEl || !statusEl) return;

          search.value = "";
          if (!App.state.ready) {
            statusEl.textContent = "Loading participant data...";
            App.ensurePortalDataLoaded()
              .then(function () {
                App.browseGlobal(type);
              })
              .catch(function (error) {
                statusEl.textContent = "Participant data could not be loaded: " + App.getErrorMessage(error);
              });
            return;
          }

          if (type === "schools") {
            App.state.latestResults = App.state.schools
              .map(function (school) {
                var title = App.getSchoolName(school);
                return { resultType: "school", title: title, meta: "School", score: 100 };
              })
              .filter(function (result) { return result.title; })
              .sort(function (a, b) { return a.title.localeCompare(b.title); })
              .slice(0, 50);
          } else {
            var itemMap = {};
            App.state.participants.forEach(function (participant) {
              var item = participant.item || participant.Item || "";
              if (!item) return;
              itemMap[item] = (itemMap[item] || 0) + 1;
            });
            App.state.groups.forEach(function (group) {
              var item = group.item || group.groupName || "";
              if (!item) return;
              itemMap[item] = itemMap[item] || 0;
            });
            App.state.latestResults = Object.keys(itemMap)
              .sort()
              .slice(0, 50)
              .map(function (item) {
                return { resultType: "item", title: item, meta: itemMap[item] + " participant" + (itemMap[item] === 1 ? "" : "s"), score: 100 };
              });
          }

          statusEl.textContent = App.state.latestResults.length + " " + (type === "schools" ? "schools" : "items");
          resultsEl.innerHTML = App.state.latestResults.map(App.renderResultCard).join("");
          search.focus();
        }, 0);
      },

      openImportCentre: function () {
        App.notify("Open the spreadsheet menu: Spec Tools > Upload Acceptances/New Participant.");
      },

      notify: function (message) {
        var el = document.getElementById("notifications");
        if (!el) return;
        el.textContent = message;
        el.classList.add("show");
      },

      renderNotifications: function () {
        var notifications = App.state.notifications || [];
        if (notifications.length) {
          App.notify(notifications[0].title + ": " + notifications[0].body);
        }
      },

      clearNotification: function () {
        var el = document.getElementById("notifications");
        if (!el) return;
        el.textContent = "";
        el.classList.remove("show");
      },


    };
  </script>
