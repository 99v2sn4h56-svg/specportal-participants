  <script>
    window.App = {
      state: {
        currentPage: "dashboard",
        participants: [],
        groups: [],
        schools: [],
        photos: {},
        secureImages: {},
        secureImageQueue: {},
        secureImageTimer: null,
        secureImageObserver: null,
        productionOverview: null,
        staff: {},
        staffTeam: [],
        staffDirectoryData: null,
        staffDirectorySearch: "",
        staffDirectoryFilters: {},
        staffDirectoryPage: 1,
        selectedStaffId: "",
        selectedStaffProfile: null,
        announcements: [],
        notifications: [],
        tasks: [],
        recentActivity: [],
        rehearsals: [],
        todaysRehearsals: [],
        calendarData: null,
        calendarDate: new Date(),
        calendarView: "month",
        selectedCalendarEvent: null,
        eventManagerData: null,
        eventManagerSearch: "",
        eventManagerRange: "upcoming",
        eventManagerType: "",
        eventManagerWarningsOnly: false,
        eventManagerFilters: {},
        eventManagerView: sessionStorage.getItem("specCentralEventManagerView") || "cards",
        selectedEventWorkspaceId: "",
        selectedEventWorkspaceSection: "overview",
        profileMutationPending: false,
        projectData: null,
        productionExceptions: null,
        projectView: "board",
        mediaData: null,
        mediaView: "gantt",
        attendanceEvents: [],
        attendanceSummary: null,
        attendanceError: "",
        attendanceLoaded: false,
        attendanceEventFilter: "upcoming",
        attendanceEventSearch: "",
        selectedAttendanceSessionId: "",
        selectedAttendanceEventName: "",
        attendanceUrl: "",
        timelineStatus: "",
        timelineLastRefreshed: "",
        staffStatus: "",
        latestResults: [],
        participantSearchTimer: null,
        participantExplorerSearch: "",
        participantExplorerFilters: {},
        participantExplorerPage: 1,
        participantExplorerSavedView: "all",
        searchProviders: [],
        searchHistory: [],
        recentlyViewed: [],
        favourites: [],
        currentFilters: {},
        currentModule: "dashboard",
        currentUser: null,
        permissions: [],
        authorizationModel: null,
        viewingAsRole: "",
        viewingAsCapabilities: null,
        dashboardContext: null,
        loadedServices: {},
        cacheTimestamps: {},
        serviceCache: {},
        inFlightRequests: {},
        serviceRegistry: {},
        loading: {},
        systemStatus: {},
        dashboardRenderTimer: null,
        operationsNavExpanded: true,
        dashboardProfile: "operations",
        applicationVersion: "5",
        selectedParticipant: null,
        selectedSchool: null,
        selectedGroup: null,
        selectedItem: null,
        selectedTeacher: null,
        selectedEvent: null,
        selectedStaff: null,
        adminMode: false,
        administrationData: null,
        administrationView: "users",
        administrationSearch: "",
        administrationStatus: "",
        administrationSort: "name",
        administrationDetailItems: [],
        navigationHistory: [],
        navigationIndex: -1,
        ready: false
      },

      pages: {
        dashboard: {
          title: "Dashboard",
          description: "What you need today across Schools Spectacular.",
          template: "page-dashboard"
        },
        participants: {
          title: "Participants",
          description: "View and manage students participating in Schools Spectacular.",
          template: "page-participants",
          permission: "Participants.View"
        },
        calendar: {
          title: "Calendar",
          description: "Live rehearsal schedule and operational timeline.",
          template: "page-calendar",
          permission: "calendar.view"
        },
        attendance: {
          title: "Attendance",
          description: "Open attendance rolls and check-in workflows.",
          template: "page-attendance",
          permission: "Attendance.View"
        },
        rehearsals: {
          title: "Rehearsals",
          description: "Schedules, venues and upcoming rehearsal dates.",
          template: "page-rehearsals",
          permission: "Calendar.View"
        },
        staff: {
          title: "Staff",
          description: "Staff Directory, contacts, production roles and operational relationships.",
          template: "page-staff",
          permission: "Operations.View"
        },
        operations: {
          title: "Operations",
          description: "Production management and operational control.",
          template: "page-operations",
          permission: "operations.view"
        },
        administration: {
          title: "Administration",
          description: "Users, permissions, workflows, data sources and platform health.",
          template: "page-administration",
          permission: "Administration.View"
        },
        projectManagement: {
          title: "Operations",
          description: "Compatibility route for the protected Operations module.",
          template: "page-operations",
          permission: "operations.view",
          redirectTo: "operations"
        },
        mediaTimeline: {
          title: "Media",
          description: "Campaign planning, media milestones and publishing activity.",
          template: "page-media-timeline",
          permission: "mediaTimeline.view"
        },
        settings: {
          title: "Settings",
          description: "Staff permissions, app configuration and module setup.",
          template: "page-settings",
          permission: "Settings.Admin"
        }
      },

      init: function () {
        App.bootstrapState();
        App.restoreSidebarState();
        App.initPerformance();
        App.loadIdentityContext().then(function () {
          App.navigateRoute(location.hash || "#home", { replace: true, initial: true });
          App.loadConfig();
          App.prefetchLikelyData();
        });
      },

      bootstrapState: function () {
        App.state.searchHistory = App.safeLoadJson("specCentralSearchHistory", []);
        App.state.recentlyViewed = App.safeLoadJson("specCentralRecentlyViewed", []);
        App.state.favourites = App.safeLoadJson("specCentralFavourites", []);
        App.registerCoreServices();
        App.bindApplicationEvents();
        App.registerDefaultSearchProviders();
        App.initSecureImages();
      },

      restoreSidebarState: function () {
        var collapsed = App.safeLoadJson("specCentralSidebarCollapsed", false);
        document.body.classList.toggle("sidebarCollapsed", !!collapsed);
        document.body.classList.remove("mobileSidebarOpen");
        App.state.operationsNavExpanded = App.safeLoadJson("specCentralOperationsNavExpanded", true);
        App.renderOperationsNavState();
      },

      toggleSidebar: function () {
        if (window.matchMedia && window.matchMedia("(max-width: 1060px)").matches) {
          var open = !document.body.classList.contains("mobileSidebarOpen");
          document.body.classList.toggle("mobileSidebarOpen", open);
          var toggle = document.querySelector(".topBarSidebarToggle");
          if (toggle) toggle.setAttribute("aria-expanded", open ? "true" : "false");
          if (open) setTimeout(function () { var first = document.querySelector(".appSidebar .navItem:not([hidden])"); if (first) first.focus(); }, 0);
          return;
        }
        var collapsed = !document.body.classList.contains("sidebarCollapsed");
        document.body.classList.toggle("sidebarCollapsed", collapsed);
        App.safeSaveJson("specCentralSidebarCollapsed", collapsed);
      },

      closeMobileNavigation: function (restoreFocus) {
        var wasOpen = document.body.classList.contains("mobileSidebarOpen");
        document.body.classList.remove("mobileSidebarOpen");
        var toggle = document.querySelector(".topBarSidebarToggle");
        if (toggle) toggle.setAttribute("aria-expanded", "false");
        if (wasOpen && restoreFocus !== false && toggle) toggle.focus();
      },

      toggleOperationsNav: function () {
        if (document.body.classList.contains("sidebarCollapsed")) {
          document.body.classList.remove("sidebarCollapsed");
          App.safeSaveJson("specCentralSidebarCollapsed", false);
          App.state.operationsNavExpanded = true;
          App.safeSaveJson("specCentralOperationsNavExpanded", true);
          App.renderOperationsNavState();
          return;
        }
        App.state.operationsNavExpanded = !App.state.operationsNavExpanded;
        App.safeSaveJson("specCentralOperationsNavExpanded", App.state.operationsNavExpanded);
        App.renderOperationsNavState();
      },

      renderOperationsNavState: function () {
        var children = document.getElementById("operationsNavChildren");
        if (children) children.hidden = !App.state.operationsNavExpanded;
        document.body.classList.toggle("operationsNavCollapsed", !App.state.operationsNavExpanded);
      },

      openOperationsView: function (view) {
        App.state.operationsView = view || "overview";
        App.state.operationsNavExpanded = true;
        App.renderOperationsNavState();
        App.navigate("operations");
      },

      events: {
        handlers: {},
        on: function (name, handler) {
          if (!name || typeof handler !== "function") return function () {};
          App.events.handlers[name] = App.events.handlers[name] || [];
          App.events.handlers[name].push(handler);
          return function () {
            App.events.handlers[name] = (App.events.handlers[name] || []).filter(function (item) {
              return item !== handler;
            });
          };
        },
        emit: function (name, payload) {
          (App.events.handlers[name] || []).slice().forEach(function (handler) {
            try {
              handler(payload);
            } catch (err) {
              console.error("Spec Central event handler failed", name, err);
            }
          });
        }
      },

      services: {
        request: function (key, serverFunction, options) {
          options = options || {};
          var service = App.getService(key) || {};
          serverFunction = serverFunction || service.serverFunction;
          var args = options.args || [];
          var cacheMs = options.cacheMs || 0;
          var timeoutMs = options.timeoutMs || 25000;
          var forceRefresh = !!options.forceRefresh;
          var cached = App.state.serviceCache[key];
          var cachedAt = App.state.cacheTimestamps[key] || 0;

          if (!forceRefresh && cacheMs && cached && Date.now() - cachedAt < cacheMs) {
            return Promise.resolve(cached);
          }

          if (!forceRefresh && App.state.inFlightRequests[key]) {
            return App.state.inFlightRequests[key];
          }

          App.state.loading[key] = true;
          App.setServiceStatus(key, "Loading");
          App.events.emit("service:loading", { key: key, serverFunction: serverFunction });

          App.state.inFlightRequests[key] = new Promise(function (resolve, reject) {
            var settled = false;
            var timer = setTimeout(function () {
              if (settled) return;
              settled = true;
              App.state.loading[key] = false;
              delete App.state.inFlightRequests[key];
              App.setServiceStatus(key, "Offline", App.formatTime(new Date()));
              var error = new Error(serverFunction + " timed out after " + Math.round(timeoutMs / 1000) + " seconds");
              App.events.emit("service:error", { key: key, serverFunction: serverFunction, error: error });
              reject(error);
            }, timeoutMs);

            function finish(success, value) {
              if (settled) return;
              settled = true;
              clearTimeout(timer);
              App.state.loading[key] = false;
              delete App.state.inFlightRequests[key];

              if (success) {
                App.state.loadedServices[key] = true;
                App.state.serviceCache[key] = value;
                App.state.cacheTimestamps[key] = Date.now();
                App.setServiceStatus(key, "Connected", App.formatTime(new Date()));
                App.events.emit("service:loaded", { key: key, serverFunction: serverFunction, data: value });
                resolve(value);
                return;
              }

              App.events.emit("service:error", { key: key, serverFunction: serverFunction, error: value });
              App.setServiceStatus(key, "Offline", App.formatTime(new Date()));
              reject(value);
            }

            try {
              var runner = google.script.run
                .withSuccessHandler(function (data) { finish(true, data); })
                .withFailureHandler(function (error) { finish(false, error); });

              if (!runner || typeof runner[serverFunction] !== "function") {
                finish(false, new Error("Missing server function: " + serverFunction));
                return;
              }

              runner[serverFunction].apply(runner, args);
            } catch (err) {
              finish(false, err);
            }
          });

          return App.state.inFlightRequests[key];
        }
      },

      SearchRegistry: {
        register: function (provider) {
          App.registerSearchProvider(provider);
        },
        search: function (query, limit) {
          return App.runUniversalSearch(query, limit);
        },
        list: function () {
          return (App.state.searchProviders || []).slice();
        }
      },

      registerService: function (id, config) {
        if (!id) return;
        App.state.serviceRegistry[id] = Object.assign({ id: id, status: "Waiting" }, config || {});
        App.state.systemStatus[id] = App.state.systemStatus[id] || {
          label: App.state.serviceRegistry[id].label || id,
          status: "Waiting",
          lastRefresh: ""
        };
      },

      getService: function (id) {
        return App.state.serviceRegistry[id] || null;
      },

      registerCoreServices: function () {
        [
          ["config", "Dashboard", "portalGetSpecCentralConfig"],
          ["portalData", "Participants", "portalGetPortalData"],
          ["calendar", "Timeline", "portalGetCalendarData"],
          ["attendance", "Attendance", "portalGetAttendanceSummary"],
          ["staff", "Staff", "portalGetStaffProductionTeam"],
          ["announcements", "Announcements", ""],
          ["operations", "Operations", "portalGetOperationsData"],
          ["mediaTimeline", "Media", "portalGetMediaTimelineData"]
        ].forEach(function (service) {
          App.registerService(service[0], {
            label: service[1],
            serverFunction: service[2],
            owner: service[0]
          });
        });
      },

      setServiceStatus: function (id, status, lastRefresh) {
        var service = App.getService(id) || { label: id };
        App.state.systemStatus[id] = {
          label: service.label || id,
          status: status || "Waiting",
          lastRefresh: lastRefresh || (App.state.systemStatus[id] || {}).lastRefresh || ""
        };
        App.renderStatusRibbon();
      },

      bindApplicationEvents: function () {
        App.events.on("service:loaded", function () {
          if (App.state.currentPage === "dashboard") App.scheduleDashboardRender();
        });
        App.events.on("service:error", function () {
          App.renderStatusRibbon();
        });
        App.events.on("dashboard:refresh", function () {
          App.scheduleDashboardRender();
        });
      },

      scheduleDashboardRender: function () {
        if (App.state.dashboardRenderTimer) clearTimeout(App.state.dashboardRenderTimer);
        App.state.dashboardRenderTimer = setTimeout(function () {
          App.state.dashboardRenderTimer = null;
          if (App.state.currentPage === "dashboard") App.renderDashboardPage();
        }, 50);
      },

      navigate: function (page, options) {
        options = options || {};
        var requestedPage = page;
        var routeStarted = performance.now();
        if (App.state.currentPage) App.saveCurrentScrollPosition();
        App.closeMobileNavigation(false);
        if (page === "projectManagement") page = "operations";
        var config = App.pages[page] || App.pages.dashboard;
        var template = document.getElementById(config.template);
        var outlet = document.getElementById("appContent");

        if (config.permission && !App.hasPermission(config.permission)) {
          App.notify("You do not have permission to open " + config.title + ".");
          page = "dashboard";
          config = App.pages.dashboard;
          template = document.getElementById(config.template);
        }

        App.state.currentPage = page;
        App.state.currentModule = page;
        document.body.classList.toggle("attendanceFocus", page === "attendance");
        if (!options.fromHistory && !options.fromBrowser) {
          App.pushNavigation(page, options);
        }
        document.getElementById("topBarTitle").textContent = config.title;
        document.getElementById("topBarDescription").textContent = config.description;
        var searchLabel = document.getElementById("workspaceSearchLabel");
        if (searchLabel) searchLabel.textContent = page === "dashboard" ? "Quick participant lookup…" : "Search Participants, Schools, Staff, Events…";
        var breadcrumb = document.getElementById("topBarBreadcrumb");
        var contextStatus = document.getElementById("topBarContextStatus");
        if (breadcrumb) breadcrumb.textContent = page === "operations" ? "Spec Central / Operations / " + App.toTitle(App.state.operationsView || "dashboard") : "Spec Central / " + config.title;
        if (contextStatus) contextStatus.textContent = page === "administration" ? "Controlled" : (App.state.systemStatus[page] && App.state.systemStatus[page].status || "Live");

        Array.prototype.forEach.call(document.querySelectorAll("[data-nav-page]"), function (button) {
          button.classList.toggle("active", button.getAttribute("data-nav-page") === page);
        });

        App.renderStatusRibbon();
        var activation = App.activatePersistentPage(page, template, outlet);
        App.restorePageControls(page);
        App.renderNavigation();
        App.renderSyncControl();

        if (page === "dashboard") App.renderDashboardPage();
        if (page === "participants") {
          App.renderParticipantStatus();
          App.ensurePortalDataLoaded().then(function () { if (App.renderParticipantExplorer) App.renderParticipantExplorer(); });
        }
        if (page === "calendar") App.renderCalendarPage();
        if (page === "attendance") App.renderAttendancePage();
        if (page === "rehearsals") App.renderRehearsalsPage();
        if (page === "operations") App.renderOperationsPage();
        if (page === "administration") App.renderAdministrationPage();
        if (page === "mediaTimeline") App.renderMediaTimelinePage();
        if (page === "staff") App.renderStaffPage();
        if (!options.fromBrowser || page !== requestedPage) App.updateBrowserRoute(!!options.replace || page !== requestedPage);
        App.persistModuleState();
        App.restoreCurrentScrollPosition();
        App.maybeRevalidateCurrentPage();
        App.recordPerformance("route:" + page, routeStarted, { cachedPage: !activation.firstRender });
      },

      pushNavigation: function (page, options) {
        var history = App.state.navigationHistory;
        var entry = { page: page, at: Date.now(), context: (options && options.context) || null };

        if (options && options.replace && history.length) {
          history[App.state.navigationIndex] = entry;
          return;
        }

        if (App.state.navigationIndex < history.length - 1) {
          history.splice(App.state.navigationIndex + 1);
        }

        history.push(entry);
        if (history.length > 30) history.shift();
        App.state.navigationIndex = history.length - 1;
      },

      goBack: function () {
        history.back();
      },

      goForward: function () {
        history.forward();
      },

      loadConfig: function (forceRefresh) {
        return App.services.request("config", "portalGetSpecCentralConfig", { cacheMs: 120000, timeoutMs: 30000, forceRefresh: !!forceRefresh })
          .then(function (config) {
            config = config || {};
            App.state.dashboardContext = config;
            App.state.dashboardProfile = config.dashboardProfile || "operations";
            App.applyStaffContext(config.staff || {});
            App.state.staffTeam = config.staffTeam || [];
            App.state.attendanceUrl = config.attendanceUrl || "";
            App.state.attendanceStatus = config.attendanceStatus || "";
            App.state.attendanceSource = config.attendanceSource || "";
            App.state.announcements = config.announcements || [];
            App.state.notifications = config.notifications || [];
            App.state.tasks = config.tasks || [];
            App.state.recentActivity = config.recentActivity || [];
            App.state.rehearsals = config.rehearsals || [];
            App.state.todaysRehearsals = config.todaysRehearsals || [];
            App.state.attendanceEvents = config.attendanceEvents || [];
            App.state.currentDate = config.currentDate || "";
            App.state.timelineStatus = config.timelineStatus || "";
            App.state.timelineLastRefreshed = config.timelineLastRefreshed || "";
            App.state.staffStatus = config.staffStatus || "";
            App.applyServerServiceStatuses(config.services || {});
            App.renderStatusRibbon();
            App.renderNotifications();
            App.renderNotificationCount();
            if (App.state.currentPage === "attendance") App.renderAttendancePage();
            if (App.state.currentPage === "dashboard") App.renderDashboardPage();
            if (App.state.currentPage === "calendar") App.renderCalendarPage();
            if (App.state.currentPage === "calendar" && App.state.selectedCalendarEventId) setTimeout(function () { App.showCalendarEventDetail(App.state.selectedCalendarEventId); }, 0);
            if (App.state.currentPage === "rehearsals") App.renderRehearsalsPage();
            if (App.state.currentPage === "operations") App.renderOperationsPage();
            if (App.state.currentPage === "mediaTimeline") App.renderMediaTimelinePage();
            if (App.state.currentPage === "staff") App.renderStaffPage();
          })
          .catch(function (error) {
            App.notify("Dashboard data could not be loaded: " + App.getErrorMessage(error));
          });
      },

      loadIdentityContext: function () {
        return App.services.request("identity", "getCurrentStaffContext", { cacheMs: 5 * 60 * 1000, timeoutMs: 15000 })
          .then(function (staff) {
            App.applyStaffContext(staff || {});
            App.renderDashboardPage();
            return staff;
          })
          .catch(function (error) {
            App.notify("Staff identity could not be loaded: " + App.getErrorMessage(error));
          });
      },

      applyStaffContext: function (staff) {
        var identityWasResolved = !!App.state.identityWasResolved;
        var previousSignature = App.permissionCacheSignature ? App.permissionCacheSignature() : "";
        App.state.staff = staff || {};
        App.state.currentUser = App.state.staff;
        App.state.permissions = App.state.staff.permissions || [];
        App.state.adminMode = !!App.state.staff.isAdmin;
        if (previousSignature && App.permissionCacheSignature && previousSignature !== App.permissionCacheSignature()) App.clearPermissionScopedCaches();
        App.state.identityWasResolved = true;
        App.renderNavigation();
        App.renderStaffContext();
        if (App.state.staff.isAdmin) App.loadViewingAsRoles();
        if (identityWasResolved && previousSignature !== App.permissionCacheSignature()) setTimeout(function () { App.navigateRoute(location.hash || "#home", { replace: true }); }, 0);
      },

      loadPortalData: function (forceRefresh) {
        return App.services.request("portalData", "portalGetPortalData", { cacheMs: 10 * 60 * 1000, timeoutMs: 45000, forceRefresh: !!forceRefresh })
          .then(function (data) {
            data = data || {};
            App.state.participants = data.participants || [];
            App.state.groups = data.groups || [];
            App.state.schools = data.schools || [];
            App.state.photos = data.photos || {};
            App.state.ready = true;
            App.rebuildSearchProviders();
            App.events.emit("dashboard:refresh");
            App.renderStaffContext();
            App.renderStatusRibbon();
            App.renderDashboardPage();
            App.renderParticipantStatus();
            if (App.state.currentPage === "participants" && App.renderParticipantExplorer) App.renderParticipantExplorer();
          })
          .catch(function (error) {
            App.state.ready = !!(App.state.participants && App.state.participants.length);
            App.notify("Portal data could not be loaded: " + App.getErrorMessage(error));
            App.renderStatusRibbon();
            App.renderParticipantStatus();
          });
      },

      ensurePortalDataLoaded: function () {
        if (App.state.ready) return Promise.resolve({
          participants: App.state.participants,
          groups: App.state.groups,
          schools: App.state.schools,
          photos: App.state.photos
        });

        return App.loadPortalData();
      },

      loadProductionOverview: function (forceRefresh) {
        if (App.state.productionOverview && !forceRefresh) return Promise.resolve(App.state.productionOverview);
        return App.services.request("productionOverview", "portalGetProductionOverview", { cacheMs: 10 * 60 * 1000, timeoutMs: 30000, forceRefresh: !!forceRefresh })
          .then(function (data) {
            App.state.productionOverview = data || { categories: [] };
            if (App.state.currentPage === "dashboard") App.renderProductionOverview();
            return App.state.productionOverview;
          })
          .catch(function (error) {
            App.state.productionOverview = { categories: [], error: App.getErrorMessage(error) };
            if (App.state.currentPage === "dashboard") App.renderProductionOverview();
            return App.state.productionOverview;
          });
      },

      refreshParticipantViews: function () {
        var resultsEl = document.getElementById("participantResults");
        if (resultsEl && App.state.latestResults && App.state.latestResults.length) {
          resultsEl.innerHTML = App.state.latestResults.map(App.renderResultCard).join("");
        }

        if (App.state.currentPage !== "participants") return;
        if (App.state.selectedParticipant) {
          App.renderParticipantProfile(App.state.selectedParticipant);
        } else if (App.state.selectedSchool) {
          App.renderSchoolProfile(App.buildSchoolProfile(typeof App.state.selectedSchool === "string" ? App.state.selectedSchool : App.getSchoolName(App.state.selectedSchool)));
        } else if (App.state.selectedItem) {
          App.renderItemProfile(App.buildItemProfile(App.state.selectedItem));
        } else if (App.state.selectedGroup) {
          App.renderGroupProfile(App.state.selectedGroup);
        } else if (App.state.selectedTeacher) {
          App.renderTeacherProfile(App.buildTeacherProfile(App.state.selectedTeacher));
        }
      },

      renderStaffContext: function () {
        var topAvatar = document.querySelector(".topBarUserAvatar");
        var welcome = document.getElementById("topBarWelcome");
        var role = document.getElementById("topBarUserRole");
        var initials = ((App.state.staff.firstName || "S").charAt(0) + (App.state.staff.surname || "C").charAt(0)).toUpperCase();
        if (topAvatar) { topAvatar.innerHTML = App.secureAvatarHtml("staff", App.state.staff.staffId || App.state.staff.email, App.state.staff.displayName || initials, "card"); topAvatar.title = "Open my profile"; }
        if (welcome) welcome.textContent = "Welcome " + (App.state.staff.firstName || "there") + "!";
        if (role) role.textContent = App.state.viewingAsRole || App.state.staff.role || "Staff";
        App.renderViewingAsControl();
      },

      openMyProfile: function () {
        var drawer = document.getElementById("myProfileDrawer");
        if (!drawer) return;
        drawer.hidden = false;
        drawer.innerHTML = '<div class="drawerHeader"><div><span class="scProfileKicker">My account</span><h3>Profile</h3></div><button type="button" onclick="App.closeMyProfile()" aria-label="Close profile">×</button></div><div class="drawerBody">' + App.loadingState("Loading your Staff profile") + '</div>';
        App.services.request("myStaffProfile", "portalGetMyStaffProfile", { forceRefresh: true, timeoutMs: 20000 })
          .then(function (profile) { App.renderMyProfileEditor(profile || {}); })
          .catch(function (error) { drawer.innerHTML = '<div class="drawerHeader"><h3>My profile</h3><button type="button" onclick="App.closeMyProfile()" aria-label="Close profile">×</button></div><div class="drawerBody">' + App.errorState("Profile unavailable", App.getErrorMessage(error)) + '</div>'; });
      },

      renderMyProfileEditor: function (profile) {
        var drawer = document.getElementById("myProfileDrawer");

          '<label><span>Display name</span><input id="myProfileDisplayName" maxlength="100" value="' + value(profile.displayName) + '"></label>' +
          '<label><span>Replace display picture</span><input id="myProfilePhoto" type="url" maxlength="500" placeholder="Leave blank to keep the current picture" value=""></label>' +
          '<label><span>Mobile phone</span><input id="myProfileMobile" type="tel" maxlength="40" value="' + value(profile.mobile) + '"></label>' +
          '<label><span>Associated school</span><input id="myProfileSchool" maxlength="160" value="' + value(profile.school) + '"></label>' +
          '<label><span>Type of work</span><input id="myProfileTypeOfWork" maxlength="120" placeholder="For example: The Arts Unit, teacher, contractor" value="' + value(profile.typeOfWork) + '"></label>' +
          '</div><div class="profileAuthorityNotice"><strong>Managed by SpecCentral administrators</strong><span>Your login email, Staff ID, department, role and permissions cannot be changed here.</span></div></div><div class="drawerActions"><button class="quickLink primaryAction" type="button" onclick="App.saveMyProfile()">Save profile</button><button class="quickLink" type="button" onclick="App.closeMyProfile()">Cancel</button></div>';
      },

      saveMyProfile: function () {
        if (App.state.profileMutationPending) return;
        var read = function (id) { return String((document.getElementById(id) || {}).value || "").trim(); };
        var profile = { displayName: read("myProfileDisplayName"), photo: read("myProfilePhoto"), mobile: read("myProfileMobile"), school: read("myProfileSchool"), typeOfWork: read("myProfileTypeOfWork") };
        App.state.profileMutationPending = true;
        App.services.request("myStaffProfileUpdate", "portalUpdateMyStaffProfile", { args: [profile], forceRefresh: true, timeoutMs: 30000 })
          .then(function (response) {
            var updated = response && response.data || {};
            Object.assign(App.state.staff, updated);
            App.state.currentUser = App.state.staff;
            App.renderStaffContext();
            App.renderDashboardPage();
            App.closeMyProfile();
            App.notify("Your profile was updated.");
          })
          .catch(function (error) { App.notify("Profile update failed: " + App.getErrorMessage(error)); })
          .finally(function () { App.state.profileMutationPending = false; });
