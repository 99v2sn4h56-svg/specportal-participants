<script>
(function () {
  function state() { return App.state; }
  function workspace() { return state().communicationsWorkspace || { campaigns: [], templates: [], audiences: [], events: [], recipients: [], senderIdentities: [], mergeFields: [], metrics: {}, capabilities: {}, providerStatus: {}, filterOptions: {} }; }
  function can(capability) { return !!(workspace().capabilities || {})[capability]; }
  function root() { return document.getElementById("communicationsCentre"); }
  function e(value) { return App.escapeHtml(value == null ? "" : String(value)); }
  function date(value) { if (!value) return "—"; try { return new Date(value).toLocaleString("en-AU", { dateStyle: "medium", timeStyle: "short" }); } catch (_) { return String(value); } }
  function status(value) { return '<span class="statusChip commStatus-' + e(String(value || "draft").toLowerCase()) + '">' + e(String(value || "DRAFT").replace(/_/g, " ")) + '</span>'; }
  function empty(title, body) { return '<div class="communicationsEmpty"><span aria-hidden="true">◇</span><strong>' + e(title) + '</strong><p>' + e(body) + '</p></div>'; }
  function action(command, input, done) {
    App.notify("Working…");
    return App.services.request("communications:" + command + ":" + Date.now(), "portalExecuteCommunicationCommand", { args: [command, input || {}], forceRefresh: true, timeoutMs: 45000 }).then(function (result) {
      if (!result || !result.ok) throw new Error(result && result.error || "Communication command failed.");
      if (done) done(result.data); App.notify(command.replace(/([A-Z])/g, " $1").trim() + " completed."); return result.data;
    }).catch(function (error) { App.notify("Communications: " + App.getErrorMessage(error)); throw error; });
  }
  function reload(next) {
    var started = performance.now();
    return App.services.request("communicationsWorkspace", "portalGetCommunicationsWorkspace", { forceRefresh: true, timeoutMs: 45000 }).then(function (data) {
      App.recordClientPerformance("journey.communications-loading", started, { route: "communications", status: "completed", records: (data && data.campaigns || []).length, payloadBytes: App.estimatePayloadSize ? App.estimatePayloadSize(data) : 0, projection: "communications-workspace" });
      state().communicationsWorkspace = data || {}; if (next) next(data || {}); if (state().currentPage === "communications") render();
    }).catch(function (error) { App.recordClientPerformance("journey.communications-loading", started, { route: "communications", status: "failed", reason: "request-failed", projection: "communications-workspace" }); if (root()) root().innerHTML = '<div class="errorState panel"><strong>Communications could not be loaded</strong><p>' + e(App.getErrorMessage(error)) + '</p><button class="quickLink" type="button" onclick="App.loadCommunicationsWorkspace()">Try again</button></div>'; });
  }
  App.loadCommunicationsWorkspace = reload;
  App.renderCommunicationsPage = function () { if (!root()) return; if (!state().communicationsWorkspace) { root().innerHTML = '<div class="communicationsLoading panel"><span class="spinner"></span><strong>Loading Communications Centre</strong><p>Checking campaigns, permissions, audiences and provider status…</p></div>'; reload(); return; } render(); };
  function render() {
    var el = root(); if (!el) return; var view = state().communicationsView || "dashboard", provider = workspace().providerStatus || {};
    el.innerHTML = '<header class="communicationsHero panel"><div><span class="scProfileKicker">Schools Spectacular communications</span><h2>Communications Centre</h2><p>Build personalised email campaigns from current SpecCentral relationships. Milestone 1 test sends never leave the mock provider.</p></div>' + (can("Communications.Create") ? '<button class="quickLink primaryAction commPrimary" type="button" onclick="App.newCommunicationCampaign()">New Communication</button>' : '') + '</header>' +
      '<div class="commProviderBanner"><span class="commProviderDot"></span><div><strong>' + e(provider.mock && provider.mock.status || "Mock provider active") + '</strong><small>' + e(provider.microsoftGraph && provider.microsoftGraph.status || "Graph provider not configured") + ' · No real email will be sent</small></div><span class="statusChip">SAFE MODE</span></div>' +
      '<nav class="commViewTabs" aria-label="Communications Centre sections">' + [["dashboard","Dashboard"],["campaigns","Campaigns"],["templates","Templates"],["audiences","Audiences"],["history","Communication History"]].map(function (item) { return '<button class="' + (view === item[0] ? 'active' : '') + '" type="button" onclick="App.setCommunicationsView(\'' + item[0] + '\')">' + item[1] + '</button>'; }).join('') + '</nav><div id="communicationsView"></div>';
    if (view === "dashboard") renderDashboard(); else if (view === "campaigns") renderCampaigns(); else if (view === "templates") renderTemplates(); else if (view === "audiences") renderAudiences(); else if (view === "history") renderHistory(); else renderComposer();
  }
  App.setCommunicationsView = function (view) { state().communicationsView = view; render(); };
  function metricsCards() { var m = workspace().metrics || {}; return '<section class="commMetricGrid">' + [[m.draftCampaigns||0,"Draft campaigns"],[m.testedCampaigns||0,"Tested campaigns"],[m.activeTemplates||0,"Active templates"],[m.savedAudiences||0,"Saved audiences"],[m.realMessagesSent||0,"Real messages sent"]].map(function (item, index) { return '<article class="commMetric ' + (index === 4 ? 'safe' : '') + '"><strong>' + e(item[0]) + '</strong><span>' + e(item[1]) + '</span></article>'; }).join('') + '</section>'; }
  function renderDashboard() {
    var campaigns = workspace().campaigns || [], drafts = campaigns.filter(function (item) { return item.status === "DRAFT"; }).slice(0, 4), recent = campaigns.filter(function (item) { return item.status === "TESTED" || item.status === "SENT"; }).slice(0, 4);
    document.getElementById("communicationsView").innerHTML = metricsCards() + '<section class="commDashboardGrid"><article class="panel commDashboardPanel"><div class="dashboardPanelHeading"><div><span>Continue work</span><h3>Draft campaigns</h3></div><button type="button" onclick="App.setCommunicationsView(\'campaigns\')">View all</button></div>' + (drafts.length ? drafts.map(campaignRow).join('') : empty("No draft campaigns", "Select New Communication to create the first draft.")) + '</article><article class="panel commDashboardPanel"><div class="dashboardPanelHeading"><div><span>Recent activity</span><h3>Sent or tested</h3></div><button type="button" onclick="App.setCommunicationsView(\'history\')">History</button></div>' + (recent.length ? recent.map(campaignRow).join('') : empty("No test activity yet", "A safe mock test send will appear here.")) + '</article></section><section class="panel commFuture"><div><span class="scProfileKicker">Delivery metrics</span><h3>Provider analytics</h3><p>Delivery, open, click, bounce and reply metrics require an approved production email provider.</p></div><button class="quickLink" type="button" disabled>Future milestone</button></section>';
  }
  function campaignRow(item) { return '<button class="commCampaignRow" type="button" onclick="App.editCommunicationCampaign(\'' + e(item.id) + '\')"><span><strong>' + e(item.name) + '</strong><small>' + e(item.category || "General") + ' · Updated ' + e(date(item.updatedAt)) + '</small></span>' + status(item.status) + '<b>→</b></button>'; }
  function renderCampaigns() {
    var statuses = ["DRAFT","READY_FOR_REVIEW","SCHEDULED","SENDING","TESTED","SENT","FAILED","ARCHIVED"], campaigns = workspace().campaigns || [];
    document.getElementById("communicationsView").innerHTML = '<section class="panel commListPanel"><div class="dashboardPanelHeading"><div><span>Campaign lifecycle</span><h3>Campaigns</h3></div>' + (can("Communications.Create") ? '<button class="quickLink primaryAction" type="button" onclick="App.newCommunicationCampaign()">New Communication</button>' : '') + '</div><div class="commStatusColumns">' + statuses.map(function (value) { var rows = campaigns.filter(function (item) { return item.status === value; }); return '<section><header>' + status(value) + '<b>' + rows.length + '</b></header>' + (rows.length ? rows.map(campaignCard).join('') : '<p class="commColumnEmpty">No ' + e(value.toLowerCase().replace(/_/g," ")) + ' campaigns</p>') + '</section>'; }).join('') + '</div></section>';
  }
  function campaignCard(item) { return '<article class="commCampaignCard"><div><strong>' + e(item.name) + '</strong><small>' + e(item.category || "General") + ' · v' + e(item.version || 1) + '</small></div><footer><button type="button" onclick="App.editCommunicationCampaign(\'' + e(item.id) + '\')">Open</button>' + (item.status !== "ARCHIVED" ? '<button type="button" onclick="App.archiveCommunicationCampaign(\'' + e(item.id) + '\')">Archive</button>' : '') + '</footer></article>'; }
  App.newCommunicationCampaign = function () { var sender = (workspace().senderIdentities || []).filter(function (item) { return item.available; })[0] || (workspace().senderIdentities || [])[0] || {}; state().communicationDraft = { name: "", category: "General", senderIdentityId: sender.id || "", audienceDefinition: { recipientTypes: ["PARTICIPANT"], filters: {} }, templateId: (workspace().templates || [])[0] && workspace().templates[0].id || "", subjectOverride: "", bodyOverride: "", plainTextOverride: "" }; state().communicationAudienceResult = null; state().communicationPreview = null; state().communicationsComposerStep = "details"; state().communicationsView = "composer"; render(); };
  App.editCommunicationCampaign = function (id) { var found = (workspace().campaigns || []).find(function (item) { return item.id === id; }); if (!found) return; state().communicationDraft = JSON.parse(JSON.stringify(found)); state().communicationAudienceResult = null; state().communicationPreview = null; state().communicationsComposerStep = "details"; state().communicationsView = "composer"; render(); };
  App.archiveCommunicationCampaign = function (id) { if (!window.confirm("Archive this campaign? It will remain in communication history.")) return; action("ArchiveCommunicationCampaign", { id: id }, function () { reload(function () { state().communicationsView = "campaigns"; }); }); };
  function renderComposer() {
    var draft = state().communicationDraft || {}, step = state().communicationsComposerStep || "details", steps = [["details","1. Details"],["sender","2. Sender"],["audience","3. Audience"],["content","4. Content"],["preview","5. Preview"],["review","6. Review"]];
    document.getElementById("communicationsView").innerHTML = '<section class="commComposer"><div class="commComposerTop"><button type="button" onclick="App.setCommunicationsView(\'campaigns\')">← Campaigns</button><div><span class="scProfileKicker">Guided email composer</span><h3>' + e(draft.name || "New communication") + '</h3></div><span>' + status(draft.status || "DRAFT") + '</span></div><nav class="commComposerSteps" aria-label="Campaign composer steps">' + steps.map(function (item) { return '<button class="' + (step === item[0] ? 'active' : '') + '" type="button" onclick="App.setCommunicationComposerStep(\'' + item[0] + '\')">' + item[1] + '</button>'; }).join('') + '</nav><section id="commComposerPanel" class="panel commComposerPanel"></section></section>';
    if (step === "details") composerDetails(draft); else if (step === "sender") composerSender(draft); else if (step === "audience") composerAudience(draft); else if (step === "content") composerContent(draft); else if (step === "preview") composerPreview(draft); else composerReview(draft);
  }
  App.setCommunicationComposerStep = function (step) { App.captureCommunicationDraft(); state().communicationsComposerStep = step; render(); };
  function composerDetails(draft) { document.getElementById("commComposerPanel").innerHTML = '<div class="commSectionHeading"><div><span class="scProfileKicker">Campaign details</span><h3>What is this communication for?</h3></div></div><div class="commFormGrid"><label class="span2"><span>Internal campaign name</span><input id="commCampaignName" maxlength="180" value="' + e(draft.name) + '" placeholder="For example, Featured Artist rehearsal update"></label><label><span>Category</span><select id="commCampaignCategory">' + ["General","Operational update","Rehearsal","Application","Reminder","Emergency information"].map(function (value) { return '<option' + (draft.category === value ? ' selected' : '') + '>' + value + '</option>'; }).join('') + '</select></label><div class="commHelpCard"><strong>Internal only</strong><span>This name helps staff find the campaign; recipients do not see it.</span></div></div>' + composerFooter("sender"); }
  function composerSender(draft) { document.getElementById("commComposerPanel").innerHTML = '<div class="commSectionHeading"><div><span class="scProfileKicker">Sender identity</span><h3>Who will this appear to come from?</h3></div></div><div class="commIdentityGrid">' + (workspace().senderIdentities || []).map(function (item) { return '<label class="commIdentityCard ' + (!item.available ? 'unavailable' : '') + '"><input type="radio" name="commSender" value="' + e(item.id) + '"' + (draft.senderIdentityId === item.id ? ' checked' : '') + (!item.available ? ' disabled' : '') + '><span><strong>' + e(item.displayName) + '</strong><b>' + e(item.emailAddress) + '</b><small>' + e(item.status) + '</small></span>' + status(item.type) + '</label>'; }).join('') + '</div><div class="commWarning"><strong>Mailbox safety</strong><p>User and shared mailbox delivery requires approved Microsoft Graph and Exchange permissions. They are visible only when authorised and remain unavailable in this milestone.</p></div>' + composerFooter("audience"); }
  function filterSelect(id, label, values, current) { return '<label><span>' + e(label) + '</span><select id="' + id + '"><option value="">All</option>' + (values || []).map(function (value) { return '<option value="' + e(value) + '"' + (String(current || "") === String(value) ? ' selected' : '') + '>' + e(value) + '</option>'; }).join('') + '</select></label>'; }
  function composerAudience(draft) { var definition = draft.audienceDefinition || { recipientTypes: [], filters: {} }, filters = definition.filters || {}, options = workspace().filterOptions || {}, result = state().communicationAudienceResult;
    document.getElementById("commComposerPanel").innerHTML = '<div class="commSectionHeading"><div><span class="scProfileKicker">Dynamic audience</span><h3>Who should receive this communication?</h3></div><button class="quickLink primary" type="button" onclick="App.resolveCommunicationAudience()">Resolve audience</button></div><fieldset class="commRecipientTypes"><legend>Recipient types</legend>' + [["PARTICIPANT","Participants / students"],["PARENT","Parents / carers"],["TEACHER","Teachers"],["SCHOOL","Schools"],["STAFF","Staff"]].map(function (item) { return '<label><input type="checkbox" data-comm-recipient-type value="' + item[0] + '"' + ((definition.recipientTypes || []).includes(item[0]) ? ' checked' : '') + '> ' + item[1] + '</label>'; }).join('') + '</fieldset><div class="commFormGrid commAudienceFilters">' + filterSelect("commFilterStatus","Status",options.statuses,filters.status) + filterSelect("commFilterCategory","Category",options.categories,filters.category) + filterSelect("commFilterItem","Item",options.items,filters.item) + filterSelect("commFilterSegment","Segment",options.segments,filters.segment) + filterSelect("commFilterGroup","Group",options.groups,filters.group) + filterSelect("commFilterSchool","School",options.schools,filters.school) + filterSelect("commFilterRegion","Region",options.regions,filters.region) + filterSelect("commFilterParticipantType","Participant type",options.participantTypes,filters.participantType) + '</div>' + (result ? audienceSummary(result) : empty("Audience not resolved yet", "Choose recipient types and supported filters, then resolve the live audience.")) + '<div class="commInlineActions"><button type="button" onclick="App.saveCurrentCommunicationAudience()">Save this audience</button></div>' + composerFooter("content"); }
  function audienceSummary(result) { return '<section class="commAudienceResult"><div class="commSummaryCards">' + [[result.estimatedRecipientCount,"Matched records"],[result.uniqueEmailCount,"Unique emails"],[result.duplicatesRemoved,"Duplicates removed"],[result.invalidEmailCount,"Invalid emails"],[result.missingEmailCount,"Missing emails"]].map(function (item) { return '<div><strong>' + e(item[0]) + '</strong><span>' + e(item[1]) + '</span></div>'; }).join('') + '</div><div class="commSampleList"><strong>Sample recipients</strong>' + ((result.sampleRecipients || []).length ? result.sampleRecipients.map(function (item) { return '<article><span><b>' + e(item.displayName) + '</b><small>' + e(item.entityType + ' · ' + item.emailAddress) + '</small></span><em>' + e((item.matchReasons || []).join(" · ")) + '</em></article>'; }).join('') : '<p>No valid recipients match this definition.</p>') + '</div></section>'; }
  function composerContent(draft) { var templates = (workspace().templates || []).filter(function (item) { return item.status !== "ARCHIVED"; }); document.getElementById("commComposerPanel").innerHTML = '<div class="commSectionHeading"><div><span class="scProfileKicker">Email content</span><h3>Choose a template and personalise it</h3></div></div><div class="commContentLayout"><div class="commContentFields"><label><span>Template</span><select id="commTemplateId" onchange="App.applyCommunicationTemplate(this.value)">' + templates.map(function (item) { return '<option value="' + e(item.id) + '"' + (draft.templateId === item.id ? ' selected' : '') + '>' + e(item.name) + '</option>'; }).join('') + '</select></label><label><span>Subject</span><input id="commSubject" value="' + e(draft.subjectOverride) + '" onfocus="App.setCommunicationMergeTarget(\'commSubject\')"></label><label><span>HTML body</span><textarea id="commHtmlBody" rows="12" onfocus="App.setCommunicationMergeTarget(\'commHtmlBody\')">' + e(draft.bodyOverride) + '</textarea></label><label><span>Plain-text fallback</span><textarea id="commPlainBody" rows="8" onfocus="App.setCommunicationMergeTarget(\'commPlainBody\')">' + e(draft.plainTextOverride) + '</textarea></label><div class="commAttachmentPlaceholder"><strong>Attachments</strong><span>Metadata can be recorded, but Drive/provider attachment transfer is deferred.</span><button type="button" disabled>Add attachment — future</button></div></div><aside class="commMergePicker"><strong>Merge fields</strong><input type="search" placeholder="Search fields…" oninput="App.filterCommunicationMergeFields(this.value)"><div id="commMergeFields">' + mergeButtons("") + '</div><small>Values are HTML-escaped and executable template code is not supported.</small></aside></div>' + composerFooter("preview"); }
  function mergeButtons(query) { return (workspace().mergeFields || []).filter(function (field) { return !query || field.toLowerCase().includes(String(query).toLowerCase()); }).map(function (field) { return '<button type="button" onclick="App.insertCommunicationMergeField(\'' + e(field) + '\')">{{' + e(field) + '}}</button>'; }).join(''); }
  App.filterCommunicationMergeFields = function (query) { var el = document.getElementById("commMergeFields"); if (el) el.innerHTML = mergeButtons(query); };
  App.setCommunicationMergeTarget = function (id) { state().communicationMergeTarget = id; };
  App.insertCommunicationMergeField = function (field) { var input = document.getElementById(state().communicationMergeTarget || "commHtmlBody"); if (!input) return; var token = "{{" + field + "}}", start = input.selectionStart == null ? input.value.length : input.selectionStart, end = input.selectionEnd == null ? start : input.selectionEnd; input.value = input.value.slice(0,start) + token + input.value.slice(end); input.focus(); input.selectionStart = input.selectionEnd = start + token.length; };
  App.applyCommunicationTemplate = function (id) { var template = (workspace().templates || []).find(function (item) { return item.id === id; }); if (!template) return; document.getElementById("commSubject").value = template.subject || ""; document.getElementById("commHtmlBody").value = template.htmlBody || ""; document.getElementById("commPlainBody").value = template.plainTextBody || ""; };
  function composerPreview() { var preview = state().communicationPreview, audience = state().communicationAudienceResult; document.getElementById("commComposerPanel").innerHTML = '<div class="commSectionHeading"><div><span class="scProfileKicker">Personalised preview</span><h3>Preview against an audience recipient</h3></div><button class="quickLink primary" type="button" onclick="App.previewCommunication()">Refresh preview</button></div>' + (audience && audience.sampleRecipients && audience.sampleRecipients.length ? '<label class="commPreviewRecipient"><span>Preview recipient</span><select id="commPreviewRecipient">' + audience.sampleRecipients.map(function (item) { return '<option value="' + e(item.id) + '">' + e(item.displayName + ' · ' + item.entityType) + '</option>'; }).join('') + '</select></label>' : '<div class="commWarning"><strong>Resolve the audience first</strong><p>A safe sample will be used until a live audience is resolved.</p></div>') + (preview ? '<div class="commPreviewWarnings">' + (preview.unresolved && preview.unresolved.length ? '<strong>Unresolved merge fields</strong><span>' + e(preview.unresolved.join(", ")) + '</span>' : '<strong>All merge fields resolved</strong><span>No unresolved fields were detected for this recipient.</span>') + '</div><article class="commEmailPreview"><header><small>Subject</small><strong>' + e(preview.subject) + '</strong><span>To: ' + e(preview.recipient && preview.recipient.displayName) + '</span></header><div>' + (preview.htmlBody || '') + '</div><details><summary>Plain-text fallback</summary><pre>' + e(preview.plainTextBody) + '</pre></details></article>' : empty("Preview not generated", "Select Refresh preview to merge the current content safely.")) + composerFooter("review"); }
  function composerReview(draft) { var result = state().communicationAudienceResult, preview = state().communicationPreview, sender = (workspace().senderIdentities || []).find(function (item) { return item.id === draft.senderIdentityId; }) || {}; document.getElementById("commComposerPanel").innerHTML = '<div class="commSectionHeading"><div><span class="scProfileKicker">Review and test</span><h3>Check the communication before recording a test</h3></div></div><div class="commReviewGrid"><article><span>Campaign</span><strong>' + e(draft.name || "Untitled") + '</strong><small>' + e(draft.category || "General") + '</small></article><article><span>Sender</span><strong>' + e(sender.displayName || "Not selected") + '</strong><small>' + e(sender.emailAddress || "") + '</small></article><article><span>Audience</span><strong>' + e(result ? result.uniqueEmailCount : 0) + ' unique emails</strong><small>' + e(result ? result.duplicatesRemoved : 0) + ' duplicates · ' + e(result ? result.invalidEmailCount + result.missingEmailCount : 0) + ' excluded</small></article><article><span>Merge status</span><strong>' + e(preview && preview.unresolved && preview.unresolved.length ? preview.unresolved.length + ' unresolved' : 'Ready to preview') + '</strong><small>Unknown fields are never executed.</small></article></div><div class="commWarning safe"><strong>Mock/no-send guarantee</strong><p>Test Send records a TESTED event and mock provider ID. It does not contact Microsoft Graph or deliver external email.</p></div><label class="commTestEmail"><span>Send mock test record to</span><input id="commTestEmail" type="email" value="' + e((App.state.currentUser || {}).email || "") + '"></label><div class="commReviewActions"><button class="quickLink" type="button" onclick="App.saveCommunicationDraft()">Save Draft</button><button class="quickLink primaryAction" type="button" onclick="App.sendCommunicationTest()"' + (!can("Communications.SendTest") ? ' disabled' : '') + '>Test Send (Mock)</button><button class="quickLink" type="button" disabled>Send Campaign — future milestone</button></div></div>'; }
  function composerFooter(next) { return '<footer class="commComposerFooter"><button type="button" onclick="App.saveCommunicationDraft()">Save Draft</button><button class="quickLink primary" type="button" onclick="App.setCommunicationComposerStep(\'' + next + '\')">Continue →</button></footer>'; }
  App.captureCommunicationDraft = function () { var draft = state().communicationDraft || {}, value = function (id) { var el = document.getElementById(id); return el ? el.value : undefined; }; if (value("commCampaignName") !== undefined) draft.name = value("commCampaignName"); if (value("commCampaignCategory") !== undefined) draft.category = value("commCampaignCategory"); var sender = document.querySelector('[name="commSender"]:checked'); if (sender) draft.senderIdentityId = sender.value; var types = document.querySelectorAll('[data-comm-recipient-type]'); if (types.length) { draft.audienceDefinition = draft.audienceDefinition || { filters: {} }; draft.audienceDefinition.recipientTypes = [].slice.call(types).filter(function (box) { return box.checked; }).map(function (box) { return box.value; }); var map = { status:"commFilterStatus", category:"commFilterCategory", item:"commFilterItem", segment:"commFilterSegment", group:"commFilterGroup", school:"commFilterSchool", region:"commFilterRegion", participantType:"commFilterParticipantType" }; draft.audienceDefinition.filters = {}; Object.keys(map).forEach(function (key) { var current = value(map[key]); if (current) draft.audienceDefinition.filters[key] = current; }); } if (value("commTemplateId") !== undefined) draft.templateId = value("commTemplateId"); if (value("commSubject") !== undefined) draft.subjectOverride = value("commSubject"); if (value("commHtmlBody") !== undefined) draft.bodyOverride = value("commHtmlBody"); if (value("commPlainBody") !== undefined) draft.plainTextOverride = value("commPlainBody"); state().communicationDraft = draft; return draft; };
  App.saveCommunicationDraft = function () { var draft = App.captureCommunicationDraft(), command = draft.id ? "UpdateCommunicationCampaign" : "CreateCommunicationCampaign"; action(command, draft, function (saved) { state().communicationDraft = saved; state().selectedCommunicationCampaignId = saved.id; reload(); }); };
  App.resolveCommunicationAudience = function () { var draft = App.captureCommunicationDraft(); action("ResolveCampaignAudience", { campaignId: draft.id || "", audienceDefinition: draft.audienceDefinition }, function (result) { state().communicationAudienceResult = result; renderComposer(); }); };
  App.previewCommunication = function () { var draft = App.captureCommunicationDraft(), select = document.getElementById("commPreviewRecipient"); action("PreviewCommunication", { campaign: draft, recipientId: select && select.value || "" }, function (result) { state().communicationPreview = result; renderComposer(); }); };
  App.sendCommunicationTest = function () { var draft = App.captureCommunicationDraft(), input = document.getElementById("commTestEmail"); if (!draft.id) { App.notify("Save the campaign draft before recording a test send."); return; } if (!window.confirm("Record a mock test send? No external email will be delivered.")) return; action("SendTestCommunication", { campaignId: draft.id, testEmail: input && input.value || "" }, function (result) { state().communicationDraft = result.campaign; state().communicationPreview = result.preview; reload(function () { state().communicationsView = "history"; }); }); };
  App.saveCurrentCommunicationAudience = function () { var draft = App.captureCommunicationDraft(), name = window.prompt("Name this saved audience", (draft.name || "Campaign") + " audience"); if (!name) return; action("SaveAudience", { name: name, description: "Saved from campaign composer", recipientTypes: draft.audienceDefinition.recipientTypes, filters: draft.audienceDefinition.filters }, function () { reload(); }); };
  function renderTemplates() { var templates = workspace().templates || []; document.getElementById("communicationsView").innerHTML = '<section class="commSplit"><article class="panel commListPanel"><div class="dashboardPanelHeading"><div><span>Reusable content</span><h3>Templates</h3></div>' + (can("Communications.Template.Manage") ? '<button class="quickLink primary" type="button" onclick="App.editCommunicationTemplate()">Create template</button>' : '') + '</div><input class="participantSearch" type="search" placeholder="Search templates…" oninput="App.filterCommunicationTemplates(this.value)"><div id="commTemplateList">' + templateList(templates, "") + '</div></article><aside id="commTemplateEditor" class="panel">' + empty("Select a template", "Preview or edit a reusable email template.") + '</aside></section>'; }
  function templateList(templates, query) { var rows = templates.filter(function (item) { return !query || [item.name,item.category,item.subject].join(" ").toLowerCase().includes(query.toLowerCase()); }); return rows.length ? rows.map(function (item) { return '<article class="commLibraryRow"><span><strong>' + e(item.name) + '</strong><small>' + e(item.category + ' · v' + item.version) + '</small></span>' + status(item.status) + '<div><button type="button" onclick="App.previewCommunicationTemplate(\'' + e(item.id) + '\')">Preview</button>' + (!item.system && can("Communications.Template.Manage") ? '<button type="button" onclick="App.editCommunicationTemplate(\'' + e(item.id) + '\')">Edit</button><button type="button" onclick="App.duplicateCommunicationTemplate(\'' + e(item.id) + '\')">Duplicate</button><button type="button" onclick="App.archiveCommunicationTemplate(\'' + e(item.id) + '\')">Archive</button>' : '') + '</div></article>'; }).join('') : empty("No matching templates", "Create a reusable template or adjust the search."); }
  App.filterCommunicationTemplates = function (query) { document.getElementById("commTemplateList").innerHTML = templateList(workspace().templates || [], query); };
  App.editCommunicationTemplate = function (id, copy) { var item = (workspace().templates || []).find(function (row) { return row.id === id; }) || { name:"",category:"General",subject:"",htmlBody:"",plainTextBody:"",status:"ACTIVE" }; if (copy) item = Object.assign({}, item, { id:"", name:item.name + " — Copy", version:0 }); var el = document.getElementById("commTemplateEditor"); if (!el) return; el.innerHTML = '<div class="commSectionHeading"><div><span class="scProfileKicker">Template editor</span><h3>' + e(item.id ? "Edit template" : "New template") + '</h3></div></div><input id="commTemplateEditId" type="hidden" value="' + e(item.id || "") + '"><div class="commFormGrid"><label><span>Name</span><input id="commTemplateName" value="' + e(item.name) + '"></label><label><span>Category</span><input id="commTemplateCategory" value="' + e(item.category) + '"></label><label class="span2"><span>Subject</span><input id="commTemplateSubject" value="' + e(item.subject) + '"></label><label class="span2"><span>HTML body</span><textarea id="commTemplateHtml" rows="9">' + e(item.htmlBody) + '</textarea></label><label class="span2"><span>Plain text</span><textarea id="commTemplatePlain" rows="6">' + e(item.plainTextBody) + '</textarea></label></div><button class="quickLink primaryAction" type="button" onclick="App.saveCommunicationTemplate()">Save template</button>'; };
  App.saveCommunicationTemplate = function () { action("SaveCommunicationTemplate", { id:document.getElementById("commTemplateEditId").value, name:document.getElementById("commTemplateName").value, category:document.getElementById("commTemplateCategory").value, subject:document.getElementById("commTemplateSubject").value, htmlBody:document.getElementById("commTemplateHtml").value, plainTextBody:document.getElementById("commTemplatePlain").value, status:"ACTIVE" }, function () { reload(); }); };
  App.previewCommunicationTemplate = function (id) { var item = (workspace().templates || []).find(function (row) { return row.id === id; }); if (!item) return; document.getElementById("commTemplateEditor").innerHTML = '<div class="commSectionHeading"><div><span class="scProfileKicker">Template preview</span><h3>' + e(item.name) + '</h3></div></div><article class="commEmailPreview"><header><small>Subject</small><strong>' + e(item.subject) + '</strong></header><div>' + (item.htmlBody || '') + '</div><details><summary>Plain text</summary><pre>' + e(item.plainTextBody) + '</pre></details></article>'; };
  App.duplicateCommunicationTemplate = function (id) { App.editCommunicationTemplate(id, true); };
  App.archiveCommunicationTemplate = function (id) { var item = (workspace().templates || []).find(function (row) { return row.id === id; }); if (!item || !window.confirm("Archive this template?")) return; action("SaveCommunicationTemplate", Object.assign({}, item, { status:"ARCHIVED" }), function () { reload(); }); };
  function renderAudiences() { var audiences = workspace().audiences || []; document.getElementById("communicationsView").innerHTML = '<section class="commSplit"><article class="panel commListPanel"><div class="dashboardPanelHeading"><div><span>Reusable queries</span><h3>Saved audiences</h3></div><button class="quickLink primary" type="button" onclick="App.newSavedCommunicationAudience()">Build audience</button></div>' + (audiences.length ? audiences.map(function (item) { return '<article class="commLibraryRow"><span><strong>' + e(item.name) + '</strong><small>' + e((item.recipientTypes || []).join(", ")) + '</small></span><div><b>' + e(item.lastResolution && item.lastResolution.uniqueEmailCount || 0) + ' emails</b><button type="button" onclick="App.editSavedCommunicationAudience(\'' + e(item.id) + '\')">Open</button></div></article>'; }).join('') : empty("No saved audiences", "Audience definitions remain dynamic and resolve against current SpecCentral data.")) + '</article><aside id="commAudienceEditor" class="panel">' + empty("Build an audience", "Choose Build audience to save a reusable filter definition.") + '</aside></section>'; }
  App.newSavedCommunicationAudience = function () { audienceEditor({recipientTypes:["PARTICIPANT"],filters:{}}); };
  App.editSavedCommunicationAudience = function (id) { var item = (workspace().audiences || []).find(function (row) { return row.id === id; }); if (item) audienceEditor(item); };
  function audienceEditor(item) { var el=document.getElementById("commAudienceEditor"),o=workspace().filterOptions||{},f=item.filters||{};el.innerHTML='<div class="commSectionHeading"><div><span class="scProfileKicker">Audience builder</span><h3>Reusable audience definition</h3></div></div><input id="savedAudienceId" type="hidden" value="'+e(item.id||'')+'"><label><span>Name</span><input id="savedAudienceName" value="'+e(item.name||'')+'"></label><label><span>Description</span><textarea id="savedAudienceDescription" rows="3">'+e(item.description||'')+'</textarea></label><fieldset class="commRecipientTypes"><legend>Recipient types</legend>'+[["PARTICIPANT","Students"],["PARENT","Parents"],["TEACHER","Teachers"],["SCHOOL","Schools"],["STAFF","Staff"]].map(function(t){return'<label><input data-saved-recipient type="checkbox" value="'+t[0]+'"'+((item.recipientTypes||[]).includes(t[0])?' checked':'')+'> '+t[1]+'</label>';}).join('')+'</fieldset><div class="commFormGrid">'+filterSelect('savedFilterCategory','Category',o.categories,f.category)+filterSelect('savedFilterItem','Item',o.items,f.item)+filterSelect('savedFilterSchool','School',o.schools,f.school)+filterSelect('savedFilterRegion','Region',o.regions,f.region)+'</div><button class="quickLink primaryAction" type="button" onclick="App.saveCommunicationAudienceDefinition()">Save audience</button>'; }
  App.saveCommunicationAudienceDefinition=function(){var get=function(id){return document.getElementById(id).value;},filters={};[["category","savedFilterCategory"],["item","savedFilterItem"],["school","savedFilterSchool"],["region","savedFilterRegion"]].forEach(function(pair){var value=get(pair[1]);if(value)filters[pair[0]]=value;});action('SaveAudience',{id:get('savedAudienceId'),name:get('savedAudienceName'),description:get('savedAudienceDescription'),recipientTypes:[].slice.call(document.querySelectorAll('[data-saved-recipient]:checked')).map(function(box){return box.value;}),filters:filters},function(){reload();});};
  function renderHistory() { var campaigns = workspace().campaigns || [], events = workspace().events || [], recipients = workspace().recipients || []; document.getElementById("communicationsView").innerHTML = '<section class="panel commListPanel"><div class="dashboardPanelHeading"><div><span>Auditable activity</span><h3>Communication History</h3></div><span class="statusChip">Mock activity clearly labelled</span></div><div class="commHistoryList">' + (events.length ? events.map(function (event) { var campaign=campaigns.find(function(item){return item.id===event.campaignId;})||{},recipient=recipients.find(function(item){return item.id===event.recipientId;});return'<article><time>'+e(date(event.timestamp))+'</time><span><strong>'+e(campaign.name||event.type)+'</strong><small>'+e(event.type.replace(/_/g,' ')+' · '+event.actor)+'</small>'+(recipient?'<button type="button" onclick="App.openCommunicationRecipient(\''+e(recipient.relatedEntityType||'')+'\',\''+e(recipient.relatedEntityId||'')+'\')">'+e(recipient.displayName||recipient.emailAddress)+' →</button>':'')+'</span><div>'+status(event.provider||'MOCK')+(event.metadata&&event.metadata.mock?'<em>TEST / NO SEND</em>':'')+'</div></article>'; }).join('') : empty("No communication history", "Campaign changes, previews and mock test sends will be recorded here.")) + '</div></section>'; }
  App.openCommunicationRecipient=function(type,id){if(type==='PARTICIPANT'&&id){state().participantExplorerSearch=id;App.navigate('participants');setTimeout(function(){var input=document.getElementById('participantSearch');if(input){input.value=id;input.dispatchEvent(new Event('input',{bubbles:true}));}},0);}else App.notify('Related '+String(type||'entity').toLowerCase()+' record: '+id);};
})();
</script>
