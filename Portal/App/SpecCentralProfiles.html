  <script>
    Object.assign(App, {
      openParticipant: function (participant) {
        if (!participant) return;
        App.state.selectedParticipant = participant;
        App.events.emit("participant:selected", participant);
        App.recordRecentlyViewed("participant", App.getParticipantName(participant), participant.id || participant.studentKey, App.getParticipantSchool(participant));
        App.renderParticipantProfile(participant);
      },

      openSchool: function (school) {
        App.navigate("participants");
        App.state.selectedSchool = school;
        App.events.emit("school:selected", school);
        App.renderSchoolProfile(App.buildSchoolProfile(typeof school === "string" ? school : App.getSchoolName(school)));
      },

      openGroup: function (group) {
        App.navigate("participants");
        App.state.selectedGroup = group;
        App.events.emit("group:selected", group);
        App.renderGroupProfile(group || {});
      },

      openItem: function (item) {
        App.navigate("participants");
        App.state.selectedItem = item;
        App.events.emit("item:selected", item);
        App.renderItemProfile(App.buildItemProfile(String(item || "Item")));
      },

      openTeacher: function (teacher) {
        App.navigate("participants");
        App.state.selectedTeacher = teacher;
        App.events.emit("teacher:selected", teacher);
        App.renderTeacherProfile(App.buildTeacherProfile(teacher || ""));
      },

      openEvent: function (event) {
        if (!event) return;
        App.state.selectedEvent = event;
        App.events.emit("event:selected", event);
        App.navigate("calendar");
        setTimeout(function () {
          App.showCalendarEventDetail(event.id || event.title || event.event);
        }, 0);
      },

      openStaff: function (staff) {
        App.state.selectedStaff = staff;
        App.events.emit("staff:selected", staff);
        App.recordRecentlyViewed("staff", staff.displayName || staff.name || staff.email || String(staff || "Staff"));
        App.navigate("staff");
      },

      renderParticipantProfile: function (participant) {
        var panel = document.getElementById("participantProfilePanel");
        if (!panel) return;
        panel.hidden = false;

        var photo = App.getParticipantPhotoUrl(participant, false, 480);
        var name = App.getParticipantName(participant) || "Unnamed participant";
        var school = App.getParticipantSchool(participant);
        var category = App.getParticipantCategory(participant);
        var categoryLine = [category, App.getParticipantCategoryDetail(participant)].filter(Boolean).join(" - ");
        var subtitle = [school, App.getParticipantYear(participant) ? "Year " + App.getParticipantYear(participant) : ""].filter(Boolean).join(" · ");
        var avatar = '<div class="scProfileAvatar">' + (photo
          ? '<img src="' + App.escapeHtml(photo) + '" alt="" onerror="App.showAvatarFallback(this)"><span class="avatarFallbackInline">' + App.escapeHtml(App.getInitials(name)) + '</span>'
          : App.escapeHtml(App.getInitials(name))) + '</div>';
        App.recordRecentlyViewed("participant", name, participant.id || participant.studentKey, school);
        App.setWorkspaceBreadcrumb(["Participants", name]);

        panel.innerHTML =
          '<button class="participantProfileClose" type="button" onclick="App.closeParticipantProfile()" aria-label="Close Participant Passport">×</button>' +
          '<div class="scProfileCard">' +
            '<div class="scProfileHero student">' +
              '<div class="scProfileKicker">Participant Passport</div>' +
              App.favouriteButton("participant", participant.id || participant.studentKey, name, school) +
              avatar +
              '<h2>' + App.escapeHtml(name) + '</h2>' +
              (subtitle ? '<div class="scProfileSubtitle">' + App.escapeHtml(subtitle) + '</div>' : '') +
              (categoryLine ? '<div class="pillRow" style="justify-content:center;"><span class="pill">' + App.escapeHtml(categoryLine) + '</span></div>' : '') +
            '</div>' +
            '<div class="scProfileBody">' +
              '<div class="sectionTitle">Participation</div>' +
              '<div class="scProfileSection">' +
                App.profileLine("Item", App.getParticipantItem(participant)) +
                App.profileLine("Category", categoryLine) +
              '</div>' +
              '<div class="sectionTitle">Attendance History</div>' +
              '<div id="participantAttendanceHistory" class="scProfileSection scAttendanceHistory">' +
                '<div class="empty">Loading attendance history...</div>' +
              '</div>' +
              '<div class="sectionTitle">Rehearsal Schedule</div>' +
              '<div id="participantRehearsalSchedule" class="scProfileSection scAttendanceHistory">' +
                '<div class="empty">Loading Timeline schedule...</div>' +
              '</div>' +
              '<div class="sectionTitle">School & Teacher</div>' +
              '<div class="scProfileSection">' +
                App.profileLine("School", school) +
                App.profileLine("Year", App.getParticipantYear(participant) ? "Year " + App.getParticipantYear(participant) : "") +
                App.profileLine("Teacher", [App.getParticipantTeacherName(participant), App.getParticipantTeacherEmail(participant)].filter(Boolean).join(" - ")) +
              '</div>' +
              '<div class="sectionTitle">Student Details</div>' +
              '<div class="scProfileSection">' +
                App.profileLine("Student email", App.getParticipantStudentEmail(participant)) +
                App.profileLine("Student mobile", App.getParticipantStudentMobile(participant)) +
                App.profileLine("Student ID", App.getParticipantStudentId(participant)) +
                App.profileLine("SRN", App.getParticipantSrn(participant)) +
              '</div>' +
              '<div class="sectionTitle">Parents / Carers</div>' +
              '<div class="scProfileSection">' +
                App.profileLine("Parent / Carer 1", [App.getParticipantParentName(participant), App.getParticipantParentEmail(participant), App.getParticipantParentPhone(participant)].filter(Boolean).join(" - ")) +
                App.profileLine("Parent / Carer 2", [App.getParticipantAdditionalParentName(participant), App.getParticipantAdditionalParentEmail(participant), App.getParticipantAdditionalParentPhone(participant)].filter(Boolean).join(" - ")) +
              '</div>' +
            '</div>' +
          '</div>';
        App.loadParticipantAttendanceHistory(participant);
        App.loadParticipantRehearsalSchedule(participant);
      },

      closeParticipantProfile: function () {
        var panel = document.getElementById("participantProfilePanel");
        if (panel) { panel.hidden = true; panel.innerHTML = ""; }
        App.state.selectedParticipant = null;
      },

      loadParticipantRehearsalSchedule: function (participant) {
        var container = document.getElementById("participantRehearsalSchedule");
        var studentKey = String(participant && participant.studentKey || "").trim();
        if (!container || !studentKey) return;
        google.script.run
          .withSuccessHandler(function (response) {
            if (App.state.selectedParticipant !== participant) return;
            var events = response && response.ok && Array.isArray(response.data) ? response.data : [];
            container.innerHTML = events.length ? events.sort(App.sortEvents).map(function (event) {
              return '<article class="scAttendanceHistoryItem"><strong>' + App.escapeHtml(event.title || "Rehearsal") + '</strong>' +
                '<div class="scAttendanceHistoryMeta">' + App.escapeHtml([event.date, event.start, event.venue].filter(Boolean).join(" · ")) + '</div>' +
                (event.notes ? '<div class="scAttendanceHistoryNote">' + App.escapeHtml(event.notes) + '</div>' : '') + '</article>';
            }).join("") : '<div class="empty">No assigned rehearsals found.</div>';
          })
          .withFailureHandler(function () {
            if (App.state.selectedParticipant === participant) container.innerHTML = '<div class="empty">Timeline schedule is unavailable.</div>';
          })
          .portalGetParticipantSchedule(studentKey);
      },

      loadParticipantAttendanceHistory: function (participant, forceRefresh) {
        var container = document.getElementById("participantAttendanceHistory");
        if (!container || !participant) return;

        var studentKey = String(participant.studentKey || "").trim();
        if (!studentKey) {
          App.renderParticipantAttendanceError("Attendance identity is unavailable for this participant.", participant);
          return;
        }

        App.state.participantAttendanceCache = App.state.participantAttendanceCache || {};
        var cached = App.state.participantAttendanceCache[studentKey];
        if (!forceRefresh && cached && Date.now() - cached.loadedAt < 120000) {
          App.renderParticipantAttendanceHistory(cached.response, participant);
          return;
        }

        container.innerHTML = '<div class="empty">Loading attendance history...</div>';
        google.script.run
          .withSuccessHandler(function (response) {
            if (App.state.selectedParticipant !== participant) return;
            if (response && response.ok) {
              App.state.participantAttendanceCache[studentKey] = {
                loadedAt: Date.now(),
                response: response
              };
            }
            App.renderParticipantAttendanceHistory(response, participant);
          })
          .withFailureHandler(function (error) {
            if (App.state.selectedParticipant !== participant) return;
            App.renderParticipantAttendanceError(App.getErrorMessage(error), participant);
          })
          .portalGetParticipantAttendanceHistory(studentKey);
      },

      renderParticipantAttendanceHistory: function (response, participant) {
        var container = document.getElementById("participantAttendanceHistory");
        if (!container || App.state.selectedParticipant !== participant) return;
        if (!response || !response.ok) {
          App.renderParticipantAttendanceError(response && response.error || "Attendance history is unavailable.", participant);
          return;
        }

        var history = Array.isArray(response.data) ? response.data : [];
        if (!history.length) {
          container.innerHTML = '<div class="empty">No attendance history is available for this participant.</div>';
          return;
        }

        var statuses = ["Present", "Late", "Absent", "Left Early", "Waiting"];
        var counts = statuses.reduce(function (output, status) {
          output[status] = history.filter(function (entry) {
            return String(entry.status || "Waiting") === status;
          }).length;
          return output;
        }, {});

        container.innerHTML =
          '<div class="scAttendanceStats">' +
            '<div><strong>' + history.length + '</strong><span>Total events</span></div>' +
            statuses.map(function (status) {
              return '<div><strong>' + counts[status] + '</strong><span>' + App.escapeHtml(status) + '</span></div>';
            }).join("") +
          '</div>' +
          '<div class="scAttendanceHistoryList">' + history.map(function (entry) {
            var status = entry.status || "Waiting";
            var details = [entry.date, entry.time, entry.location].filter(Boolean).join(" · ");
            var marked = [entry.markedTime, entry.markedBy].filter(Boolean).join(" · ");
            return '<article class="scAttendanceHistoryItem">' +
              '<div class="scAttendanceHistoryHeading"><strong>' + App.escapeHtml(entry.eventName || "Attendance event") + '</strong>' +
                '<span class="scAttendanceStatus ' + App.escapeHtml(status.toLowerCase().replace(/[^a-z]+/g, "-")) + '">' + App.escapeHtml(status) + '</span></div>' +
              (details ? '<div class="scAttendanceHistoryMeta">' + App.escapeHtml(details) + '</div>' : '') +
              (entry.attendanceNotes ? '<div class="scAttendanceHistoryNote">' + App.escapeHtml(entry.attendanceNotes) + '</div>' : '') +
              (marked ? '<div class="scAttendanceHistoryMarked">Marked ' + App.escapeHtml(marked) + '</div>' : '') +
            '</article>';
          }).join("") + '</div>';
      },

      renderParticipantAttendanceError: function (message, participant) {
        var container = document.getElementById("participantAttendanceHistory");
        if (!container || App.state.selectedParticipant !== participant) return;
        container.innerHTML = '<div class="scAttendanceHistoryError">' +
          '<div>' + App.escapeHtml(message || "Attendance history is unavailable.") + '</div>' +
          '<button type="button" class="secondaryButton" id="participantAttendanceRetry">Retry</button>' +
        '</div>';
        var retry = document.getElementById("participantAttendanceRetry");
        if (retry) retry.addEventListener("click", function () {
          App.loadParticipantAttendanceHistory(participant, true);
        });
      },

      renderGenericProfile: function (title, lines, profileType) {
        var panel = document.getElementById("participantProfilePanel");
        if (!panel) return;
        profileType = profileType || "item";
        var passport = {
          school: "School Passport",
          item: "Item Passport",
          group: "Group Passport",
          teacher: "Teacher Passport",
          staff: "Staff Passport"
        }[profileType] || "Profile";

        var filteredLines = (lines || []).filter(Boolean);
        var stats = App.getProfileStatsFromLines(filteredLines);

        panel.innerHTML =
          '<div class="scProfileCard">' +
            '<div class="scProfileHero ' + App.escapeHtml(profileType) + '">' +
              '<div class="scProfileKicker">' + App.escapeHtml(passport) + '</div>' +
              '<h2>' + App.escapeHtml(title || "Preview") + '</h2>' +
              (filteredLines[0] ? '<div class="scProfileSubtitle">' + App.escapeHtml(filteredLines[0]) + '</div>' : '') +
              (stats.length ? '<div class="scProfileStats">' + stats.map(function (stat) {
                return '<div class="scProfileStat"><strong>' + App.escapeHtml(stat.value) + '</strong><span>' + App.escapeHtml(stat.label) + '</span></div>';
              }).join("") + '</div>' : '') +
            '</div>' +
            '<div class="scProfileBody">' +
              '<div class="sectionTitle">Details</div>' +
              '<div class="scProfileSection">' +
                filteredLines.map(function (line) {
                  return '<div class="scProfileLine">' + App.escapeHtml(line) + '</div>';
                }).join("") +
              '</div>' +
            '</div>' +
          '</div>';
      },

      buildSchoolProfile: function (schoolName) {
        var target = String(schoolName || "").trim();
        var participants = App.getSchoolParticipants(target);
        var groups = App.getSchoolGroups(target);
        var master = (App.state.schools || []).find(function (school) {
          return String(App.getSchoolName(school)).trim().toLowerCase() === target.toLowerCase();
        }) || null;
        var teachers = {};
        var items = {};
        var categories = {};

        participants.forEach(function (participant) {
          var teacherKey = String(App.getParticipantTeacherEmail(participant) || App.getParticipantTeacherName(participant) || "").trim().toLowerCase();
          if (teacherKey) {
            teachers[teacherKey] = teachers[teacherKey] || {
              name: App.getParticipantTeacherName(participant),
              email: App.getParticipantTeacherEmail(participant)
            };
          }

          var item = App.getParticipantItem(participant);
          if (item) {
            items[item] = items[item] || { name: item, category: App.getParticipantCategory(participant), count: 0 };
            items[item].count++;
          }

          var category = App.getParticipantCategory(participant) || "Unspecified";
          categories[category] = categories[category] || { name: category, count: 0, items: {} };
          categories[category].count++;
          if (item) categories[category].items[item] = true;
        });

        groups.forEach(function (group) {
          var teacherKey = String(group.teacherEmail || group.teacherName || "").trim().toLowerCase();
          if (teacherKey) {
            teachers[teacherKey] = teachers[teacherKey] || { name: group.teacherName, email: group.teacherEmail };
          }
        });

        var groupParticipantCount = groups.reduce(function (total, group) {
          return total + App.parseParticipantCount(App.getGroupStudentCount(group));
        }, 0);
        var participantCountNote = groups.some(function (group) {
          var accepted = String((group && group.acceptedCount) || "").trim();
          var allocated = String((group && (group.allocatedCount || group.count)) || "").trim();
          return !accepted && App.parseParticipantCount(allocated) > 0;
        }) ? "Includes not accepted yet allocations" : "";

        return {
          schoolName: target,
          master: master,
          participants: participants.sort(App.sortByParticipantName),
          groups: groups,
          participantCount: participants.length + groupParticipantCount,
          participantCountNote: participantCountNote,
          teachers: App.objectValues(teachers).sort(App.sortByName),
          items: App.objectValues(items).sort(App.sortByName),
          categories: App.objectValues(categories).map(function (category) {
            category.items = Object.keys(category.items).sort();
            return category;
          }).sort(App.sortByName)
        };
      },

      renderSchoolProfile: function (school) {
        var panel = document.getElementById("participantProfilePanel");
        if (!panel || !school) return;
        var name = school.schoolName || "School";
        var master = school.master || {};
        App.recordRecentlyViewed("school", name, school.id || name, master.directorate || "School");
        App.setWorkspaceBreadcrumb(["Participants", name]);
        panel.innerHTML =
          '<div class="scProfileCard">' +
            '<div class="scProfileHero school">' +
              '<div class="scProfileKicker">School Passport</div>' +
              App.favouriteButton("school", school.id || name, name, master.directorate || "School") +
              '<h2>' + App.escapeHtml(name) + '</h2>' +
              App.renderProfileStats([
                { value: school.participantCount, label: "Participants" },
                { value: school.teachers.length, label: "Teachers" },
                { value: school.items.length, label: "Items" },
                { value: school.groups.length, label: "Groups" }
              ]) +
              (school.participantCountNote ? '<div class="scProfileHeroNote">' + App.escapeHtml(school.participantCountNote) + '</div>' : '') +
              '<div class="scProfileSubtitle">' +
                [master.code ? "Code: " + master.code : "", master.directorate ? "Directorate: " + master.directorate : "", master.schoolEmail ? "Email: " + master.schoolEmail : ""].filter(Boolean).map(App.escapeHtml).join("<br>") +
              '</div>' +
            '</div>' +
            '<div class="scProfileBody">' +
              App.renderProfileSection("Details", [
                App.profileLine("School code", master.code),
                App.profileLine("Directorate", master.directorate),
                App.profileLine("School email", master.schoolEmail)
              ]) +
              App.renderProfileSection("Groups", school.groups.map(App.renderGroupListItem)) +
              App.renderProfileSection("Teachers", school.teachers.map(App.renderTeacherListItem)) +
              App.renderProfileSection("Categories", school.categories.map(App.renderCategoryListItem)) +
              App.renderProfileSection("Items", school.items.map(App.renderItemListItem)) +
              App.renderProfileSection("Participants", school.participants.map(App.renderParticipantListItem)) +
            '</div>' +
          '</div>';
      },

      buildItemProfile: function (itemName) {
        var target = App.normaliseItemTitle(itemName);
        var targetKey = App.getItemKey(target);
        var participants = (App.state.participants || []).filter(function (participant) {
          return App.getItemKey(App.getParticipantItem(participant)) === targetKey;
        });
        var groups = (App.state.groups || []).filter(function (group) {
          return App.getItemKey(group.item || group.groupName || "") === targetKey;
        });
        var schools = {};
        var teachers = {};
        var categories = {};

        groups.forEach(function (group) {
          var schoolName = String(group.school || "Unknown school").trim();
          var count = Number(App.getGroupStudentCount(group)) || 0;
          schools[schoolName] = schools[schoolName] || { name: schoolName, count: 0, acceptedCount: 0, allocatedCount: 0, notAcceptedYet: false };
          schools[schoolName].count += count;
          if (String(group.acceptedCount || "").trim()) {
            schools[schoolName].acceptedCount += Number(group.acceptedCount) || 0;
          } else {
            schools[schoolName].allocatedCount += Number(group.allocatedCount || group.count) || 0;
            schools[schoolName].notAcceptedYet = true;
          }
          App.addTeacherRecord(teachers, group);
          App.addCategoryRecord(categories, group.category || group.discipline, schoolName, count);
        });

        participants.forEach(function (participant) {
          var schoolName = App.getParticipantSchool(participant) || "Unknown school";
          schools[schoolName] = schools[schoolName] || { name: schoolName, count: 0, acceptedCount: 0, allocatedCount: 0, notAcceptedYet: false };
          schools[schoolName].count++;
          App.addTeacherRecord(teachers, participant);
          App.addCategoryRecord(categories, App.getParticipantCategory(participant), schoolName, 1);
        });

        return {
          itemName: target || itemName || "Item",
          participants: participants.sort(App.sortByParticipantName),
          groups: groups,
          schools: App.objectValues(schools).sort(App.sortByName),
          teachers: App.objectValues(teachers).sort(App.sortByName),
          categories: App.objectValues(categories).map(function (category) {
            category.schoolCount = Object.keys(category.schools || {}).length;
            return category;
          }).sort(App.sortByName)
        };
      },

      renderItemProfile: function (item) {
        var panel = document.getElementById("participantProfilePanel");
        if (!panel || !item) return;
        var participantCount = item.groups.length
          ? item.schools.reduce(function (total, school) { return total + (Number(school.count) || 0); }, 0)
          : item.participants.length;

        panel.innerHTML =
          '<div class="scProfileCard">' +
            '<div class="scProfileHero item">' +
              '<div class="scProfileKicker">Item Passport</div>' +
              '<h2>' + App.escapeHtml(item.itemName) + '</h2>' +
              App.renderProfileStats([
                { value: participantCount, label: "Participants" },
                { value: item.schools.length, label: "Schools" },
                { value: item.teachers.length, label: "Teachers" },
                { value: item.categories.length, label: "Categories" }
              ]) +
            '</div>' +
            '<div class="scProfileBody">' +
              App.renderProfileSection("Categories", item.categories.map(App.renderCategoryListItem)) +
              App.renderProfileSection("Schools", item.schools.map(App.renderItemSchoolListItem)) +
              App.renderProfileSection("Teachers", item.teachers.map(App.renderTeacherListItem)) +
              App.renderProfileSection("Participants", item.participants.map(App.renderParticipantListItem)) +
            '</div>' +
          '</div>';
      },

      renderGroupProfile: function (group) {
        var panel = document.getElementById("participantProfilePanel");
        if (!panel) return;
        group = group || {};
        var title = [App.normaliseItemTitle(group.item), group.groupName].filter(Boolean).join(" · ") || group.category || "Unnamed group";
        var students = (App.state.participants || []).filter(function (participant) {
          return App.getItemKey(App.getParticipantItem(participant)) === App.getItemKey(group.item || group.groupName || "") &&
            String(App.getParticipantSchool(participant) || "").trim().toLowerCase() === String(group.school || "").trim().toLowerCase();
        }).sort(App.sortByParticipantName);

        panel.innerHTML =
          '<div class="scProfileCard">' +
            '<div class="scProfileHero group">' +
              '<div class="scProfileKicker">Group Passport</div>' +
              '<h2>' + App.escapeHtml(title) + '</h2>' +
              (group.school ? '<div class="scProfileSubtitle">' + App.escapeHtml(group.school) + '</div>' : '') +
              App.renderProfileStats([
                { value: App.getGroupStudentCount(group) || students.length, label: "Students" },
                { value: group.category ? 1 : 0, label: "Category" },
                { value: group.teacherName || group.teacherEmail ? 1 : 0, label: "Teacher" }
              ]) +
            '</div>' +
            '<div class="scProfileBody">' +
              App.renderProfileSection("Group Details", [
                App.profileLine("Item", App.normaliseItemTitle(group.item)),
                App.profileLine("Category", group.category),
                App.profileLine("Group name", group.groupName),
                App.profileLine("School", group.school),
                App.profileLine("Accepted", App.getGroupStudentCountLabel(group))
              ]) +
              App.renderProfileSection("Teacher", [
                App.profileLine("Teacher", group.teacherName),
                App.profileLine("Teacher email", group.teacherEmail),
                App.profileLine("Teacher mobile", App.formatPhoneNumber(group.teacherMobile)),
                App.profileLine("Role at school", group.teacherRole)
              ]) +
              App.renderProfileSection("Students", students.map(App.renderParticipantListItem)) +
            '</div>' +
          '</div>';
      },

      buildTeacherProfile: function (teacher) {
        var key = typeof teacher === "string" ? teacher : (teacher.teacherEmail || teacher.email || teacher.teacherName || teacher.name || "");
        var target = String(key || "").trim().toLowerCase();
        var groups = (App.state.groups || []).filter(function (group) {
          var values = [group.teacherEmail, group.teacherName, group.secondTeacherEmail, group.secondTeacherName].map(function (value) {
            return String(value || "").trim().toLowerCase();
          });
          return target && values.indexOf(target) >= 0;
        });
        var participants = (App.state.participants || []).filter(function (participant) {
          var values = [App.getParticipantTeacherEmail(participant), App.getParticipantTeacherName(participant)].map(function (value) {
            return String(value || "").trim().toLowerCase();
          });
          return target && values.indexOf(target) >= 0;
        }).sort(App.sortByParticipantName);
        var firstGroup = groups[0] || {};
        var contact = App.getTeacherContact(firstGroup, target) || {};
        var name = App.getParticipantTeacherName(participants[0] || {}) || contact.name || firstGroup.teacherName || (typeof teacher === "object" ? teacher.title : "") || key || "Teacher";
        var email = App.getParticipantTeacherEmail(participants[0] || {}) || contact.email || firstGroup.teacherEmail || "";
        var schools = {};
        var items = {};

        participants.forEach(function (participant) {
          var school = App.getParticipantSchool(participant);
          var item = App.getParticipantItem(participant);
          if (school) schools[school] = { name: school, count: (schools[school] ? schools[school].count : 0) + 1 };
          if (item) items[item] = { name: item, count: (items[item] ? items[item].count : 0) + 1 };
        });
        groups.forEach(function (group) {
          if (group.school) schools[group.school] = { name: group.school, count: (schools[group.school] ? schools[group.school].count : 0) + 1 };
          if (group.item) items[group.item] = { name: App.normaliseItemTitle(group.item), count: (items[group.item] ? items[group.item].count : 0) + 1 };
        });

        return {
          name: name,
          email: email,
          mobile: App.formatPhoneNumber(contact.mobile || firstGroup.teacherMobile),
          role: contact.role || firstGroup.teacherRole,
          contactType: contact.contactType || "",
          firstTime: App.isAffirmative(contact.firstTime || firstGroup.teacherFirstTime),
          specAlumni: App.isAffirmative(contact.isSpecAlumni || firstGroup.teacherIsSpecAlumni),
          specRoles: contact.specRoles || firstGroup.teacherSpecRoles || "",
          participants: participants,
          groups: groups,
          schools: App.objectValues(schools).sort(App.sortByName),
          items: App.objectValues(items).sort(App.sortByName)
        };
      },

      renderTeacherProfile: function (teacher) {
        var panel = document.getElementById("participantProfilePanel");
        if (!panel || !teacher) return;
        panel.innerHTML =
          '<div class="scProfileCard">' +
            '<div class="scProfileHero teacher">' +
              '<div class="scProfileKicker">Teacher Passport</div>' +
              '<h2>' + App.escapeHtml(teacher.name || "Teacher") + '</h2>' +
              (teacher.email ? '<div class="scProfileSubtitle">' + App.escapeHtml(teacher.email) + '</div>' : '') +
              App.renderProfileStats([
                { value: teacher.groups.length, label: "Groups" },
                { value: teacher.schools.length, label: "Schools" },
                { value: teacher.items.length, label: "Items" }
              ]) +
            '</div>' +
            '<div class="scProfileBody">' +
              App.renderProfileSection("Contact Details", [
                App.profileLine("Email", teacher.email),
                App.profileLine("Mobile", teacher.mobile),
                App.profileLine("Role at school", teacher.role),
                App.profileLine("Contact type", teacher.contactType),
                teacher.firstTime ? App.profileLine("Spec experience", "1st Time") : "",
                teacher.specAlumni ? App.profileLine("Spec Alumni", "Yes") : "",
                App.profileLine("Previous Spec roles", teacher.specRoles)
              ]) +
              App.renderProfileSection("Schools", teacher.schools.map(App.renderCountListItem)) +
              App.renderProfileSection("Items", teacher.items.map(App.renderCountListItem)) +
              App.renderProfileSection("Groups", teacher.groups.map(App.renderGroupListItem)) +
            '</div>' +
          '</div>';
      },

      getProfileStatsFromLines: function (lines) {
        var stats = [];
        (lines || []).forEach(function (line) {
          String(line || "").split(/\s+-\s+|·/).forEach(function (part) {
            var match = String(part || "").trim().match(/^(\d+)\s+(.+)$/);
            if (!match) return;
            stats.push({
              value: match[1],
              label: match[2].replace(/s$/, "")
            });
          });
        });
        return stats.slice(0, 4);
      },

      renderProfileStats: function (stats) {
        stats = (stats || []).filter(function (stat) {
          return stat && stat.value !== undefined && stat.value !== null && String(stat.value) !== "";
        });
        if (!stats.length) return "";
        return '<div class="scProfileStats">' + stats.map(function (stat) {
          return '<div class="scProfileStat"><strong>' + App.escapeHtml(stat.value) + '</strong><span>' + App.escapeHtml(stat.label) + '</span></div>';
        }).join("") + '</div>';
      },

      renderProfileSection: function (title, rows) {
        rows = (rows || []).filter(Boolean);
        return '<div class="sectionTitle">' + App.escapeHtml(title) + '</div>' +
          '<div class="scProfileSection">' +
            (rows.length ? rows.join("") : '<div class="empty">No ' + App.escapeHtml(String(title || "records").toLowerCase()) + ' found.</div>') +
          '</div>';
      },

      renderGroupListItem: function (group) {
        group = group || {};
        var title = [App.normaliseItemTitle(group.item), group.groupName].filter(Boolean).join(" · ") || group.category || "Unnamed group";
        var meta = [group.category, App.getGroupStudentCountLabel(group), group.teacherName].filter(Boolean).join(" · ");
        return '<div class="scProfileLine"><strong>' + App.escapeHtml(title) + '</strong>' +
          App.escapeHtml(meta) +
          (group.teacherEmail ? '<br>' + App.escapeHtml(group.teacherEmail) : '') +
        '</div>';
      },

      renderTeacherListItem: function (teacher) {
        teacher = teacher || {};
        var label = teacher.name || teacher.email || "Unnamed teacher";
        return '<div class="scProfileLine"><strong>' + App.escapeHtml(label) + '</strong>' +
          App.escapeHtml(teacher.email || "") +
        '</div>';
      },

      renderCategoryListItem: function (category) {
        category = category || {};
        var meta = [
          category.count ? category.count + " participant" + (Number(category.count) === 1 ? "" : "s") : "",
          category.schoolCount ? category.schoolCount + " school" + (Number(category.schoolCount) === 1 ? "" : "s") : ""
        ].filter(Boolean).join(" · ");
        return '<div class="scProfileLine"><strong>' + App.escapeHtml(category.name || "Unspecified") + '</strong>' +
          App.escapeHtml(meta) +
          ((category.items || []).length ? '<div class="pillRow">' + category.items.map(function (item) {
            return '<span class="pill">' + App.escapeHtml(item) + '</span>';
          }).join("") + '</div>' : '') +
        '</div>';
      },

      renderItemListItem: function (item) {
        item = item || {};
        var meta = [item.category, item.discipline, item.count ? item.count + " participant" + (Number(item.count) === 1 ? "" : "s") : ""].filter(Boolean).join(" · ");
        return '<div class="scProfileLine"><strong>' + App.escapeHtml(item.name || "Unnamed item") + '</strong>' +
          App.escapeHtml(meta) +
        '</div>';
      },

      renderItemSchoolListItem: function (school) {
        school = school || {};
        var count = school.acceptedCount || school.count || 0;
        var label = school.notAcceptedYet && !school.acceptedCount
          ? (school.allocatedCount || count || 0) + " student" + (Number(school.allocatedCount || count) === 1 ? "" : "s") + " · Not accepted yet"
          : count + " student" + (Number(count) === 1 ? "" : "s");
        return '<div class="scProfileLine"><strong>' + App.escapeHtml(school.name || "Unknown school") + '</strong>' +
          App.escapeHtml(label) +
        '</div>';
      },

      renderParticipantListItem: function (participant) {
        var photo = App.getParticipantPhotoUrl(participant, false, 120);
        var name = App.getParticipantName(participant) || "Unnamed participant";
        var meta = [
          App.getParticipantSchool(participant),
          App.getParticipantYear(participant) ? "Year " + App.getParticipantYear(participant) : "",
          App.getParticipantCategory(participant),
          App.getParticipantItem(participant)
        ].filter(Boolean).join(" · ");
        return '<div class="scProfileLine">' +
          '<div class="resultTop">' +
            '<div class="avatar">' + (photo
              ? '<img src="' + App.escapeHtml(photo) + '" alt="" onerror="App.showAvatarFallback(this)"><span class="avatarFallbackInline">' + App.escapeHtml(App.getInitials(name)) + '</span>'
              : App.escapeHtml(App.getInitials(name))) + '</div>' +
            '<div><strong>' + App.escapeHtml(name) + '</strong>' + App.escapeHtml(meta) + '</div>' +
          '</div>' +
        '</div>';
      },

      renderCountListItem: function (item) {
        item = item || {};
        return '<div class="scProfileLine"><strong>' + App.escapeHtml(item.name || "Unnamed") + '</strong>' +
          App.escapeHtml((item.count || 0) + " record" + (Number(item.count) === 1 ? "" : "s")) +
        '</div>';
      },

      getSchoolParticipants: function (schoolName) {
        var target = String(schoolName || "").trim().toLowerCase();
        return (App.state.participants || []).filter(function (participant) {
          return String(App.getParticipantSchool(participant) || "").trim().toLowerCase() === target;
        });
      },

      getSchoolGroups: function (schoolName) {
        var target = String(schoolName || "").trim().toLowerCase();
        return (App.state.groups || []).filter(function (group) {
          return String(group.school || "").trim().toLowerCase() === target;
        });
      },

      getSchoolParticipantTotal: function (schoolName) {
        var individualCount = App.getSchoolParticipants(schoolName).length;
        var groupCount = App.getSchoolGroups(schoolName).reduce(function (total, group) {
          return total + App.parseParticipantCount(App.getGroupStudentCount(group));
        }, 0);
        return individualCount + groupCount;
      },

      getSchoolParticipantTotalNote: function (schoolName) {
        return App.getSchoolGroups(schoolName).some(function (group) {
          var accepted = String((group && group.acceptedCount) || "").trim();
          var allocated = String((group && (group.allocatedCount || group.count)) || "").trim();
          return !accepted && App.parseParticipantCount(allocated) > 0;
        }) ? "Includes not accepted yet allocations" : "";
      },

      objectValues: function (source) {
        return Object.keys(source || {}).map(function (key) { return source[key]; });
      },

      sortByName: function (a, b) {
        return String((a && a.name) || "").localeCompare(String((b && b.name) || ""));
      },

      sortByParticipantName: function (a, b) {
        return String(App.getParticipantName(a)).localeCompare(String(App.getParticipantName(b)));
      },

      addTeacherRecord: function (map, source) {
        var name = App.getParticipantTeacherName(source) || source.teacherName || "";
        var email = App.getParticipantTeacherEmail(source) || source.teacherEmail || "";
        var key = String(email || name || "").trim().toLowerCase();
        if (!key) return;
        map[key] = map[key] || { name: name, email: email };
      },

      addCategoryRecord: function (map, categoryName, schoolName, count) {
        var category = String(categoryName || "Unspecified").trim() || "Unspecified";
        map[category] = map[category] || { name: category, count: 0, schools: {} };
        map[category].count += Number(count) || 0;
        if (schoolName) map[category].schools[schoolName] = true;
      },

      getTeacherContact: function (group, target) {
        group = group || {};
        var primaryEmail = String(group.teacherEmail || "").trim().toLowerCase();
        var primaryName = String(group.teacherName || "").trim().toLowerCase();
        var secondEmail = String(group.secondTeacherEmail || "").trim().toLowerCase();
        var secondName = String(group.secondTeacherName || "").trim().toLowerCase();

        if (target && (primaryEmail === target || primaryName === target)) {
          return {
            contactType: group.teacherContactType || "Primary contact",
            name: group.teacherName || "",
            email: group.teacherEmail || "",
            mobile: group.teacherMobile || "",
            role: group.teacherRole || "",
            isSpecAlumni: group.teacherIsSpecAlumni || "",
            specRoles: group.teacherSpecRoles || "",
            firstTime: group.teacherFirstTime || ""
          };
        }

        if (target && (secondEmail === target || secondName === target)) {
          return {
            contactType: group.secondTeacherContactType || "Second contact",
            name: group.secondTeacherName || "",
            email: group.secondTeacherEmail || "",
            mobile: group.secondTeacherMobile || "",
            role: group.secondTeacherRole || "",
            isSpecAlumni: group.secondTeacherIsSpecAlumni || "",
            specRoles: group.secondTeacherSpecRoles || "",
            firstTime: ""
          };
        }

        return null;
      },

      isAffirmative: function (value) {
        return /^(yes|y|true|1)$/i.test(String(value || "").trim());
      },

    });
  </script>
