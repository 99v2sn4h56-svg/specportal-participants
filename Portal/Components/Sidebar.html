<aside id="appSidebar" class="appSidebar">
  <div class="sidebarBrand">
    <button class="sidebarHome" type="button" onclick="App.navigate('dashboard')" aria-label="Go to SpecCentral Home" title="Home">
      <img class="sidebarLogo" src="https://drive.google.com/thumbnail?id=1kK8A7JiFcuumLUM47CHLfj-MIw39-BQQ&sz=w600" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid';">
      <span class="sidebarLogoFallback" aria-hidden="true">SS</span>
    </button>
  </div>
  <nav class="sidebarNav" aria-label="Spec Central navigation">
    <div class="navSectionLabel">Workspace</div>
    <button class="navItem active" type="button" title="Dashboard" data-icon="D" data-nav-page="dashboard" onclick="App.navigate('dashboard')"><span>Dashboard</span></button>
    <button class="navItem" type="button" title="Participants" data-icon="P" data-nav-page="participants" data-permission="Participants.View" onclick="App.navigate('participants')"><span>Participants</span></button>
    <button class="navItem" type="button" title="Calendar" data-icon="C" data-nav-page="calendar" data-permission="Calendar.View" onclick="App.navigate('calendar')"><span>Calendar</span></button>
    <button class="navItem" type="button" title="Attendance" data-icon="A" data-nav-page="attendance" data-permission="Attendance.View" onclick="App.navigate('attendance')"><span>Attendance</span></button>
    <button class="navItem" type="button" title="Communications" data-icon="C" onclick="App.openNotificationCentre()"><span>Communications</span></button>
    <button class="navItem" type="button" title="Media" data-icon="M" data-nav-page="mediaTimeline" data-permission="mediaTimeline.view" onclick="App.navigate('mediaTimeline')"><span>Media</span></button>

    <div class="navSectionLabel" data-permission="operations.view">Management</div>
    <button class="navItem" type="button" title="Staff" data-icon="S" data-nav-page="staff" data-permission="Operations.View" onclick="App.navigate('staff')"><span>Staff</span></button>
    <div class="navGroup" data-permission="Operations.View">
      <button class="navItem navGroupToggle" type="button" title="Forms" data-icon="F" data-nav-page="formBuilder" onclick="App.navigate('formBuilder')"><span>Forms</span><b>⌄</b></button>
      <div class="navChildren formsNavChildren">
        <button type="button" onclick="App.navigate('formBuilder');setTimeout(function(){App.showFormsDashboard();},0)">Forms dashboard</button>
        <button type="button" onclick="App.navigate('formBuilder');setTimeout(function(){App.openFormsResponses();},0)">Responses</button>
      </div>
    </div>
    <div class="navGroup" data-permission="operations.view">
      <button class="navItem navGroupToggle" type="button" title="Operations" data-icon="O" data-nav-page="operations" onclick="App.toggleOperationsNav()"><span>Operations</span><b>⌄</b></button>
      <div id="operationsNavChildren" class="navChildren">
        <button type="button" onclick="App.openOperationsView('overview')">Operations</button>
        <button type="button" onclick="App.navigate('staff')">Staff Directory</button>
        <button type="button" onclick="App.openOperationsView('projects')">Projects</button>
        <button type="button" onclick="App.openOperationsView('timeline')">Timeline</button>
        <button type="button" onclick="App.openOperationsView('events')">Event Manager</button>
        <button type="button" disabled title="No authoritative logistics source is registered">Logistics</button>
        <button type="button" disabled title="Use live module reporting until a reporting source is registered">Reports</button>
        <button type="button" disabled title="Operational settings remain read-only">Settings</button>
      </div>
    </div>

    <div class="navSectionLabel" data-permission="Administration.View">Platform</div>
    <button class="navItem" type="button" title="Administration" data-icon="M" data-nav-page="administration" data-permission="Administration.View" onclick="App.navigate('administration')"><span>Administration</span></button>
    <button class="navItem" type="button" title="Settings" data-icon="S" data-nav-page="settings" data-permission="Settings.Admin" onclick="App.navigate('settings')"><span>Settings</span></button>
  </nav>
</aside>
