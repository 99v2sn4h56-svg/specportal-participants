<aside id="appSidebar" class="appSidebar">
  <div class="sidebarBrand">
    <button class="sidebarHome" type="button" onclick="App.navigate('dashboard')" aria-label="Go to SpecCentral Home" title="Home">
      <img class="sidebarLogo" src="https://drive.google.com/thumbnail?id=1kK8A7JiFcuumLUM47CHLfj-MIw39-BQQ&sz=w600" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid';">
      <span class="sidebarLogoFallback" aria-hidden="true">SS</span>
    </button>
  </div>
  <nav class="sidebarNav" aria-label="Spec Central navigation">
    <div class="navSectionLabel">Workspace</div>
    <button class="navItem active" type="button" title="Dashboard" data-nav-page="dashboard" onclick="App.navigate('dashboard')"><span>Dashboard</span></button>

    <details class="specNavGroup" open data-permission="Participants.View" data-preload-module="participants">
      <summary class="navItem navGroupToggle" data-nav-pages="participants,attendance" data-preload-module="participants"><span>Participants</span><b>⌄</b></summary>
      <div class="navChildren">
        <button type="button" data-preload-module="participants" onclick="App.navigate('participants');setTimeout(function(){App.setParticipantExplorerMode('individuals');},0)">Full List</button>
        <button type="button" data-preload-module="attendance" onclick="App.navigate('attendance')">Attendance</button>
        <button type="button" onclick="App.navigate('participants');setTimeout(function(){App.setParticipantExplorerMode('groups');},0)">Teachers</button>
        <button type="button" onclick="App.openImportCentre()">Import</button>
      </div>
    </details>

    <details class="specNavGroup" open data-permission="operations.view">
      <summary class="navItem navGroupToggle" data-nav-page="operations" data-nav-view="events"><span>Event Manager</span><b>⌄</b></summary>
      <div class="navChildren">
        <button type="button" onclick="App.openOperationsView('events')">All events</button>
        <button type="button" onclick="App.openOperationsView('events');setTimeout(function(){App.openTimelineEditor();},0)">New Event</button>
      </div>
    </details>

    <button class="navItem" type="button" title="Communications" data-nav-page="communications" data-permission="Communications.View" onclick="App.navigate('communications')"><span>Communications</span></button>

    <details class="specNavGroup" open data-permission="Operations.View">
      <summary class="navItem navGroupToggle" data-nav-page="formBuilder"><span>Forms</span><b>⌄</b></summary>
      <div class="navChildren">
        <button type="button" onclick="App.navigate('formBuilder');setTimeout(function(){App.showFormsDashboard();},0)">Forms Dashboard</button>
        <button type="button" onclick="App.navigate('formBuilder');setTimeout(function(){App.newFormDefinition();},0)">New Form</button>
        <button type="button" onclick="App.navigate('formBuilder');setTimeout(function(){App.openFormsResponses();},0)">Responses</button>
      </div>
    </details>

    <div class="specPlatformNav">
      <details class="specNavGroup" open data-permission="operations.view">
        <summary class="navItem navGroupToggle" data-nav-page="operations" data-nav-view="general"><span>Operations</span><b>⌄</b></summary>
        <div class="navChildren">
          <button type="button" onclick="App.openOperationsView('overview')">Operations</button>
          <button type="button" onclick="App.navigate('staff')">Staff Directory</button>
          <button type="button" onclick="App.openOperationsView('projects')">Projects</button>
          <button type="button" onclick="App.openOperationsView('timeline')">Timeline</button>
          <button type="button" onclick="App.openOperationsView('events')">Event Manager</button>
          <button type="button" disabled title="No authoritative logistics source is registered">Logistics</button>
          <button type="button" disabled title="Use live module reporting until a reporting source is registered">Reports</button>
          <button type="button" disabled title="Operational settings remain read-only">Settings</button>
        </div>
      </details>
      <button class="navItem" type="button" title="Administration" data-nav-page="administration" data-permission="Administration.View" onclick="App.navigate('administration')"><span>Administration</span></button>
      <button class="navItem" type="button" title="Settings" data-nav-page="settings" data-permission="Settings.Admin" onclick="App.navigate('settings')"><span>Settings</span></button>
    </div>
  </nav>
</aside>
  <script>
    App.init();
  </script>
