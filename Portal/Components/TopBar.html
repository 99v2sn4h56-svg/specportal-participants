<header class="topBar">
  <div class="workspaceTopRow">
    <div class="topBarBrand">
      <button class="topBarSidebarToggle" type="button" aria-label="Open navigation" aria-controls="appSidebar" aria-expanded="false" onclick="App.toggleSidebar()">☰</button>
    </div>
    <button class="commandTrigger workspaceSearch" type="button" onclick="App.openCommandCentre('search')" aria-label="Open search"><span id="workspaceSearchLabel">Search Participants, Schools, Staff, Events...</span> <kbd>⌘K</kbd></button>
    <div class="workspaceUserArea">
      <button class="topBarUserAvatar" type="button" onclick="App.openMyProfile()" aria-label="Open my profile">SC</button>
      <div class="workspaceWelcome"><span id="topBarWelcome">Welcome!</span><strong id="topBarUserRole">Staff</strong></div>
      <label id="viewAsControl" class="viewAsControl" hidden><span>Viewing As</span><select id="viewAsRole" onchange="App.setViewingAsRole(this.value)"><option value="">Actual permissions</option></select></label>
      <button id="syncDataButton" class="syncDataButton" type="button" hidden onclick="App.openSyncData()" aria-label="Sync cached data">↻</button>
      <button class="notificationTrigger" type="button" onclick="App.openNotificationCentre()" aria-label="Open notifications">●<span id="notificationCount" hidden></span></button>
    </div>
  </div>
  <div id="viewingAsBadge" class="viewingAsBadge" hidden></div>
  <div class="workspaceContextRow">
    <div><div id="topBarBreadcrumb" class="pageBreadcrumb">Spec Central / Dashboard</div><h2 id="topBarTitle" class="pageTitle">Dashboard</h2><div id="topBarDescription" class="pageDescription">What you need today.</div></div>
    <div class="pageContextActions"><span id="pageRefreshTimestamp" class="pageRefreshTimestamp" aria-live="polite"></span><button id="pageRefreshAction" class="quickLink compact" type="button" onclick="App.refreshCurrentPage()">Refresh</button><span id="topBarContextStatus" class="topBarStatus">Live</span></div>
  </div>
</header>
