  <style>
    :root {
      --blue: #2d67b2;
      --yellow: #fbcc39;
      --red: #ef4343;
      --purple: #bb529e;
      --sky: #44c2f0;
      --orange: #f79420;
      --magenta: #ef509c;
      --mint: #9dd085;
      --navy: #061d3d;
      --bg: #f5f8fd;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #e4eaf3;
      --shadow: 0 16px 42px rgba(6, 29, 61, .10);
      --softShadow: 0 8px 24px rgba(6, 29, 61, .07);
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Poppins, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(239,80,156,.14), transparent 34%),
        radial-gradient(circle at bottom left, rgba(68,194,240,.18), transparent 40%),
        var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .kicker {
      color: var(--yellow);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .appShell {
      min-height: calc(100vh - 94px);
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
    }

    body.sidebarCollapsed .appShell {
      grid-template-columns: minmax(0, 1fr);
    }

    body.sidebarCollapsed .appSidebar {
      display: none;
    }

    .appSidebar {
      position: sticky;
      top: 0;
      height: calc(100vh - 94px);
      padding: 18px;
      background: linear-gradient(180deg, var(--navy), #163f75);
      color: #fff;
      overflow-y: auto;
    }

    .sidebarSection {
      margin-bottom: 18px;
    }

    .navItem {
      position: relative;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 12px 13px;
      margin-bottom: 8px;
      text-align: left;
      color: rgba(255,255,255,.86);
      background: transparent;
      font-weight: 700;
    }

    .navItem.active,
    .navItem:hover {
      color: #fff;
      background: rgba(255,255,255,.17);
      box-shadow: inset 4px 0 0 var(--yellow);
    }

    .navItem[hidden] {
      display: none;
    }

    .appMain {
      min-width: 0;
    }

    .topBar {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      background: rgba(245, 248, 253, .88);
      border-bottom: 1px solid rgba(228, 234, 243, .9);
      backdrop-filter: blur(12px);
    }

    .pageTitle {
      margin: 0;
      color: var(--navy);
      font-size: 28px;
      line-height: 1;
      letter-spacing: -.03em;
    }

    .pageDescription {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .globalSearch {
      width: min(420px, 100%);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 12px 16px;
      background: #fff;
      outline: none;
      box-shadow: var(--softShadow);
    }

    .globalSearch:focus {
      border-color: var(--sky);
      box-shadow: 0 0 0 4px rgba(68,194,240,.18);
    }

    .notifications {
      margin: 18px 24px 0;
      display: none;
      border: 1px solid #f8dfbd;
      border-radius: 16px;
      padding: 12px 14px;
      color: #6d3b00;
      background: #fff7e8;
      font-size: 13px;
      font-weight: 700;
    }

    .notifications.show {
      display: block;
    }

    .attendanceModuleHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-left: 6px solid var(--mint);
      background:
        linear-gradient(110deg, rgba(157,208,133,.16), rgba(255,255,255,.96) 52%),
        #fff;
    }

    .attendanceModuleHeader h2 {
      margin: 0;
      color: var(--navy);
      font-size: 24px;
      line-height: 1.15;
    }

    .attendanceHeaderMeta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .attendanceHeaderActions {
      min-width: 260px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .attendanceStatusChip {
      border-radius: 999px;
      padding: 7px 10px;
      color: #276414;
      background: rgba(157,208,133,.28);
      font-size: 12px;
      font-weight: 900;
    }

    .pageOutlet {
      min-width: 0;
      padding: 24px;
    }

    body.attendanceFocus .topBar,
    body.attendanceFocus #notifications {
      display: none !important;
    }

    body.attendanceFocus .pageOutlet {
      padding: 0;
    }

    .attendanceEmbed {
      overflow: visible;
      padding: 24px;
      min-height: 620px;
      background: var(--bg);
    }

    .attendanceEmbed .empty {
      margin: 0;
    }

    .attendanceEmbed iframe {
      display: none;
      width: 100%;
      height: 70vh;
      min-height: 520px;
      border: 0;
      background: #fff;
    }

    .attendanceOverview {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .attendanceHero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 14px;
    }

    .attendanceHero h2 {
      margin: 0 0 2px;
      color: var(--navy);
      font-size: 19px;
      line-height: 1.15;
    }

    .attendanceHero .sectionTitle {
      margin-bottom: 2px;
      font-size: 9px;
    }

    .attendanceHero .moduleMeta {
      font-size: 10px;
      line-height: 1.25;
    }

    .attendanceHero .attendanceHeaderActions {
      gap: 6px;
    }

    .attendanceHero .attendanceStatusChip {
      padding: 5px 8px;
      font-size: 10px;
    }

    .attendanceHero .quickLink.compact {
      padding: 8px 10px;
      border-radius: 11px;
      font-size: 11px;
    }

    .attendanceSummaryGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .attendanceBelowFrame {
      margin-top: 18px;
    }

    .attendanceSummaryCard {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      box-shadow: var(--softShadow);
    }

    .attendanceSummaryValue {
      color: var(--navy);
      font-size: 26px;
      font-weight: 900;
    }

    .attendanceSummaryLabel,
    .attendanceUpdated {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .attendanceDataGrid {
      margin-top: 16px;
    }

    .attendanceOperationsPanel {
      height: 440px;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .attendanceStatusList,
    .attendanceEventList {
      display: grid;
      gap: 10px;
    }

    .attendanceStatusList {
      overflow-y: auto;
    }

    .attendanceEventList {
      min-height: 0;
      overflow-y: auto;
      padding-right: 5px;
      overscroll-behavior: contain;
    }

    .attendanceEventsHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .attendanceEventsHeader .sectionTitle {
      margin: 0;
      white-space: nowrap;
    }

    .attendanceEventSearch {
      width: min(100%, 330px);
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--navy);
      background: #fff;
      font: inherit;
    }

    .attendanceEventSearch:focus {
      outline: 3px solid rgba(18,86,207,.16);
      border-color: var(--blue);
    }

    .attendanceEventFilters {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .attendanceEventFilters button {
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--navy);
      background: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
    }

    .attendanceEventFilters button.active {
      border-color: var(--blue);
      color: #fff;
      background: var(--blue);
    }

    .attendanceStatusRow,
    .attendanceEventCard {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 14px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: #f6f9ff;
    }

    .attendanceEventCard.selected {
      border-color: #1256cf;
      background: #edf4ff;
      box-shadow: 0 0 0 2px rgba(18,86,207,.08);
    }

    .attendanceStatusRow strong,
    .attendanceEventCard strong {
      color: var(--navy);
    }

    .attendanceEventCard {
      align-items: flex-start;
    }

    .attendanceEventMain {
      flex: 1;
      min-width: 0;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }

    .attendanceEventMain:focus-visible {
      outline: 3px solid rgba(18,86,207,.28);
      outline-offset: 4px;
      border-radius: 8px;
    }

    .attendanceEventTitle,
    .attendanceProgressText {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .attendanceOpenBadge {
      flex: 0 0 auto;
      padding: 4px 7px;
      border-radius: 999px;
      color: #fff;
      background: #1256cf;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .attendanceProgressText {
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
    }

    .attendanceProgress {
      height: 7px;
      margin-top: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: #dfe8f6;
    }

    .attendanceProgress span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #1256cf, #44c2f0);
    }

    .attendanceEventActions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .attendanceQrDrawer { width: min(520px, 100%); }
    .attendanceQrBody { justify-items: center; text-align: center; }
    .attendanceQrBody p { margin: 0; }
    .attendanceQrBody img {
      width: min(100%, 420px);
      height: auto;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      padding: 10px;
    }

    .attendanceEventMeta,
    .attendanceEventCounts {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .attendanceError {
      color: #8f1d1d;
      background: #fff0f0;
    }

    .attendanceFramePanel {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #fff;
      box-shadow: var(--softShadow);
    }

    .attendanceFramePanel.attendanceFrameHighlight {
      animation: attendanceFramePulse 1.6s ease;
    }

    @keyframes attendanceFramePulse {
      0%, 100% { border-color: var(--border); box-shadow: var(--softShadow); }
      25% { border-color: #1256cf; box-shadow: 0 0 0 6px rgba(18,86,207,.18), var(--shadow); }
    }

    @media (max-width: 900px) {
      .attendanceEmbed { padding: 14px; }
      .attendanceHero { align-items: flex-start; flex-direction: column; }
      .attendanceHeaderActions { min-width: 0; justify-content: flex-start; }
      .attendanceSummaryGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .attendanceDataGrid .span4,
      .attendanceDataGrid .span8 { grid-column: 1 / -1; }
      .attendanceOperationsPanel { height: 390px; }
      .attendanceEventsHeader { align-items: stretch; flex-direction: column; }
      .attendanceEventSearch { width: 100%; }
      .attendanceEventCard { flex-direction: column; }
      .attendanceEventActions { width: 100%; justify-content: flex-start; }
      .attendanceEmbed iframe { height: 68vh; min-height: 480px; }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 16px;
    }

    .panel,
    .moduleCard,
    .resultCard,
    .profilePanel {
      background: rgba(255,255,255,.94);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--softShadow);
    }

    .panel {
      padding: 18px;
    }

    .span4 { grid-column: span 4; }
    .span5 { grid-column: span 5; }
    .span6 { grid-column: span 6; }
    .span7 { grid-column: span 7; }
    .span8 { grid-column: span 8; }
    .span12 { grid-column: 1 / -1; }

    .sectionTitle {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .09em;
      font-weight: 900;
    }

    .heroPanel {
      padding: 18px;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--purple), var(--magenta));
    }

    .heroPanel h2 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.1;
    }

    .heroMeta {
      color: rgba(255,255,255,.9);
      font-weight: 700;
    }

    .staffSummary {
      min-width: 220px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 18px;
      padding: 14px;
      background: rgba(255,255,255,.14);
      overflow-wrap: anywhere;
    }

    .staffSummary strong,
    .staffSummary span {
      display: block;
    }

    .announcementGrid {
      display: grid;
      gap: 10px;
    }

    .announcementCard {
      padding: 13px;
      border-radius: 16px;
      background: #f7faff;
      border-left: 5px solid var(--blue);
    }

    .announcementCard.yellow { border-left-color: var(--yellow); background: #fff9df; }
    .announcementCard.mint { border-left-color: var(--mint); background: #f0faee; }

    .announcementCard strong {
      display: block;
      color: var(--navy);
      margin-bottom: 4px;
    }

    .dateList,
    .activityList,
    .quickLinks {
      display: grid;
      gap: 10px;
    }

    .dateItem,
    .activityItem,
    .quickLink {
      padding: 11px;
      border-radius: 14px;
      background: #f7faff;
      color: var(--text);
      text-decoration: none;
    }

    .dateItem {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      border: 1px solid transparent;
    }

    .dateItem:hover {
      border-color: var(--blue);
    }

    .dateBadge {
      min-width: 50px;
      border-radius: 12px;
      padding: 7px 8px;
      text-align: center;
      color: var(--navy);
      background: var(--yellow);
      font-weight: 900;
      font-size: 12px;
    }

    .moduleGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .filterRow,
    .calendarToolbar,
    .toolbarActions,
    .viewTabs {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .calendarToolbar {
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .quickLink.compact {
      border: 0;
      cursor: pointer;
      font-weight: 800;
    }

    .filterSelect {
      min-height: 46px;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    .calendarHeading {
      margin: 16px 0 12px;
      color: var(--navy);
      font-size: 22px;
      font-weight: 900;
    }

    .calendarMonth {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
    }

    .calendarRange {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .calendarRange7 {
      grid-template-columns: repeat(7, minmax(220px, 1fr));
      overflow-x: auto;
      align-items: start;
    }

    .calendarRangeDay {
      min-height: 180px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #f8fafc;
    }

    .adminModeBanner {
      margin: 12px 0;
      padding: 10px 12px;
      border: 1px solid rgba(18, 86, 207, .25);
      border-radius: 10px;
      background: rgba(18, 86, 207, .07);
      color: #1256cf;
      font-size: 12px;
      font-weight: 600;
    }

    .adminActions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .calendarDay {
      min-height: 118px;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px;
      background: rgba(255,255,255,.9);
      overflow: hidden;
    }

    .calendarDay.muted {
      opacity: .5;
    }

    .calendarDayNumber {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .calendarEvent {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 6px 7px;
      margin-top: 5px;
      text-align: left;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.25;
      cursor: pointer;
    }

    .moduleWorkspace {
      margin-top: 14px;
      min-width: 0;
      overflow-x: auto;
    }

    .boardGrid {
      display: grid;
      grid-template-columns: repeat(5, minmax(220px, 1fr));
      gap: 12px;
      min-width: 900px;
    }

    .boardColumn,
    .timelineLane {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      background: #f7faff;
    }

    .taskCard {
      margin-top: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      box-shadow: var(--softShadow);
    }

    .dataTable {
      width: 100%;
      min-width: 920px;
      border-collapse: collapse;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
    }

    .dataTable th,
    .dataTable td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
      font-size: 12px;
    }

    .administrationShell { position: relative; }
    .administrationHeader { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .administrationSummary { display: grid; grid-template-columns: repeat(6, minmax(120px, 1fr)); gap: 10px; margin: 20px 0; }
    .administrationSummary > div { padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: #f8fafc; }
    .administrationSummary strong, .administrationSummary span { display: block; }
    .administrationSummary strong { color: #1256cf; font-size: 22px; }
    .administrationSummary span { margin-top: 3px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .administrationTabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; border-bottom: 1px solid var(--border); }
    .administrationTabs button { flex: 0 0 auto; border: 0; border-radius: 9px; padding: 8px 11px; background: transparent; color: #475569; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
    .administrationTabs button:hover, .administrationTabs button.active { background: #eaf1ff; color: #1256cf; }
    .administrationFilters { display: grid; grid-template-columns: minmax(260px, 1fr) auto auto; gap: 10px; margin: 16px 0; }
    .administrationContent { min-height: 360px; }
    .adminTableWrap { max-width: 100%; overflow: auto; border: 1px solid var(--border); border-radius: 14px; background: #fff; }
    .adminTable { width: 100%; min-width: 980px; border-collapse: separate; border-spacing: 0; font-size: 12px; }
    .adminTable th { position: sticky; top: 0; z-index: 1; padding: 10px 12px; border-bottom: 1px solid var(--border); background: #f3f6fb; color: #475569; text-align: left; white-space: nowrap; }
    .adminTable td { max-width: 320px; padding: 10px 12px; border-bottom: 1px solid #edf1f6; vertical-align: top; overflow-wrap: anywhere; }
    .adminTable tbody tr:hover { background: #f8fbff; }
    .adminTable td button { border: 0; padding: 0; background: none; color: #1256cf; font: inherit; font-weight: 700; text-align: left; cursor: pointer; }
    .adminBadgeList { display: flex; flex-wrap: wrap; gap: 4px; }
    .adminBadge, .countBadge, .statusChip { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 7px; background: #eef2f7; color: #475569; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .statusChip.connected, .statusChip.active, .statusChip.registered { background: #dcfce7; color: #166534; }
    .statusChip.disabled, .statusChip.unavailable, .statusChip.not-connected { background: #e2e8f0; color: #475569; }
    .statusChip.degraded, .statusChip.adapter-only { background: #fef3c7; color: #92400e; }
    .permissionLegend { display: flex; gap: 14px; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
    .permissionMatrix th { max-width: 130px; writing-mode: vertical-rl; transform: rotate(180deg); height: 150px; }
    .permissionMatrix th:first-child, .permissionMatrix th:nth-child(2), .permissionMatrix th:nth-child(3) { writing-mode: initial; transform: none; height: auto; }
    .permissionCell { text-align: center; font-size: 16px; }
    .permissionCell.granted { color: #15803d; background: #f0fdf4; }
    .permissionCell.inherited { color: #1256cf; background: #eff6ff; }
    .permissionCell.unavailable { color: #94a3b8; }
    .healthGrid { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 12px; }
