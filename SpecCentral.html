<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #2d67b2;
      --yellow: #fbcc39;
      --red: #ef4343;
      --purple: #bb529e;
      --sky: #44c2f0;
      --orange: #f79420;
      --magenta: #ef509c;
      --mint: #9dd085;
      --navy: #061d3d;
      --bg: #f5f8fd;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #e4eaf3;
      --shadow: 0 16px 42px rgba(6, 29, 61, .10);
      --softShadow: 0 8px 24px rgba(6, 29, 61, .07);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Poppins, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(239,80,156,.14), transparent 34%),
        radial-gradient(circle at bottom left, rgba(68,194,240,.18), transparent 40%),
        var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .suiteHeader {
      background: linear-gradient(135deg, var(--blue), var(--purple));
      color: #fff;
      padding: 16px 22px;
      box-shadow: 0 10px 28px rgba(45, 103, 178, .22);
    }

    .suiteHeaderInner {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .suiteLogo {
      width: 86px;
      height: 70px;
      flex: 0 0 86px;
      object-fit: contain;
      border-radius: 18px;
      background: rgba(255,255,255,.15);
      padding: 4px;
    }

    .suiteLogoFallback {
      display: none;
      place-items: center;
      color: var(--yellow);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .sidebarToggle {
      margin-left: auto;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 999px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: #fff;
      background: rgba(255,255,255,.14);
      font-size: 18px;
      font-weight: 900;
    }

    .kicker {
      color: var(--yellow);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .suiteBrand h1 {
      margin: 1px 0 0;
      font-size: 25px;
      line-height: 1;
    }

    .subtitle {
      margin-top: 6px;
      color: rgba(255,255,255,.9);
      font-size: 13px;
    }

    .appShell {
      min-height: calc(100vh - 94px);
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
    }

    body.sidebarCollapsed .appShell {
      grid-template-columns: minmax(0, 1fr);
    }

    body.sidebarCollapsed .appSidebar {
      display: none;
    }

    body.sidebarCollapsed .sidebarToggle {
      background: rgba(251,204,57,.25);
      border-color: rgba(251,204,57,.55);
    }

    .appSidebar {
      position: sticky;
      top: 0;
      height: calc(100vh - 94px);
      padding: 18px;
      background: linear-gradient(180deg, var(--navy), #163f75);
      color: #fff;
      overflow-y: auto;
    }

    .sidebarSection {
      margin-bottom: 18px;
    }

    .navItem {
      position: relative;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 12px 13px;
      margin-bottom: 8px;
      text-align: left;
      color: rgba(255,255,255,.86);
      background: transparent;
      font-weight: 700;
    }

    .navItem.active,
    .navItem:hover {
      color: #fff;
      background: rgba(255,255,255,.17);
      box-shadow: inset 4px 0 0 var(--yellow);
    }

    .navItem[hidden] {
      display: none;
    }

    .staffCard {
      padding: 13px;
      border-radius: 16px;
      background: rgba(255,255,255,.10);
      color: rgba(255,255,255,.88);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .appMain {
      min-width: 0;
    }

    .topBar {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      background: rgba(245, 248, 253, .88);
      border-bottom: 1px solid rgba(228, 234, 243, .9);
      backdrop-filter: blur(12px);
    }

    .pageTitle {
      margin: 0;
      color: var(--navy);
      font-size: 28px;
      line-height: 1;
      letter-spacing: -.03em;
    }

    .pageDescription {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .globalSearch {
      width: min(420px, 100%);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 12px 16px;
      background: #fff;
      outline: none;
      box-shadow: var(--softShadow);
    }

    .globalSearch:focus {
      border-color: var(--sky);
      box-shadow: 0 0 0 4px rgba(68,194,240,.18);
    }

    .notifications {
      margin: 18px 24px 0;
      display: none;
      border: 1px solid #f8dfbd;
      border-radius: 16px;
      padding: 12px 14px;
      color: #6d3b00;
      background: #fff7e8;
      font-size: 13px;
      font-weight: 700;
    }

    .notifications.show {
      display: block;
    }

    .statusRibbon {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      padding: 12px 24px 0;
    }

    .statusPill {
      --status-color: var(--blue);
      --status-bg: #f7faff;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      align-items: center;
      gap: 9px;
      min-width: 0;
      min-height: 56px;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-left: 5px solid var(--status-color);
      border-radius: 18px;
      background:
        linear-gradient(110deg, var(--status-bg), rgba(255,255,255,.96) 56%);
      box-shadow: var(--softShadow);
      font-size: 12px;
    }

    .statusIcon {
      width: 30px;
      height: 30px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--status-color);
      box-shadow: 0 7px 18px rgba(6,29,61,.14);
      font-size: 14px;
      font-weight: 900;
    }

    .statusContent {
      min-width: 0;
    }

    .statusPill strong {
      display: block;
      color: var(--navy);
      line-height: 1.15;
      font-size: 12px;
    }

    .statusPill span {
      display: block;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .statusPurpose {
      margin-top: 2px;
      font-size: 9px;
      font-weight: 800;
      color: var(--status-color);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .statusMeta {
      margin-top: 2px;
      font-size: 10px;
    }

    .attendanceModuleHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-left: 6px solid var(--mint);
      background:
        linear-gradient(110deg, rgba(157,208,133,.16), rgba(255,255,255,.96) 52%),
        #fff;
    }

    .attendanceModuleHeader h2 {
      margin: 0;
      color: var(--navy);
      font-size: 24px;
      line-height: 1.15;
    }

    .attendanceHeaderMeta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .attendanceHeaderActions {
      min-width: 260px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .attendanceStatusChip {
      border-radius: 999px;
      padding: 7px 10px;
      color: #276414;
      background: rgba(157,208,133,.28);
      font-size: 12px;
      font-weight: 900;
    }

    .pageOutlet {
      min-width: 0;
      padding: 24px;
    }

    body.attendanceFocus .topBar,
    body.attendanceFocus #notifications {
      display: none !important;
    }

    body.attendanceFocus .pageOutlet {
      padding: 0;
    }

    .attendanceEmbed {
      height: calc(100vh - 0px);
      min-height: 620px;
      background: #fff;
    }

    .attendanceEmbed .empty {
      margin: 24px;
    }

    .attendanceEmbed iframe {
      display: none;
      width: 100%;
      height: 100vh;
      min-height: 620px;
      border: 0;
      background: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 16px;
    }

    .panel,
    .moduleCard,
    .resultCard,
    .profilePanel {
      background: rgba(255,255,255,.94);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--softShadow);
    }

    .panel {
      padding: 18px;
    }

    .span4 { grid-column: span 4; }
    .span5 { grid-column: span 5; }
    .span6 { grid-column: span 6; }
    .span7 { grid-column: span 7; }
    .span8 { grid-column: span 8; }
    .span12 { grid-column: 1 / -1; }

    .sectionTitle {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .09em;
      font-weight: 900;
    }

    .heroPanel {
      padding: 18px;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--purple), var(--magenta));
    }

    .heroPanel h2 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.1;
    }

    .dashboardHeroGrid {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .heroMeta {
      color: rgba(255,255,255,.9);
      font-weight: 700;
    }

    .operationalHeroGrid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr);
      gap: 16px;
      align-items: stretch;
    }

    .heroMetricGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .heroMetric {
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 16px;
      padding: 12px;
      background: rgba(255,255,255,.13);
    }

    .heroMetric strong {
      display: block;
      font-size: 24px;
      line-height: 1;
    }

    .heroMetric span {
      display: block;
      margin-top: 6px;
      color: rgba(255,255,255,.86);
      font-size: 12px;
      font-weight: 700;
    }

    .staffSummary {
      min-width: 220px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 18px;
      padding: 14px;
      background: rgba(255,255,255,.14);
      overflow-wrap: anywhere;
    }

    .staffSummary strong,
    .staffSummary span {
      display: block;
    }

    .announcementGrid {
      display: grid;
      gap: 10px;
    }

    .announcementCard {
      padding: 13px;
      border-radius: 16px;
      background: #f7faff;
      border-left: 5px solid var(--blue);
    }

    .announcementCard.yellow { border-left-color: var(--yellow); background: #fff9df; }
    .announcementCard.mint { border-left-color: var(--mint); background: #f0faee; }

    .announcementCard strong {
      display: block;
      color: var(--navy);
      margin-bottom: 4px;
    }

    .dateList,
    .activityList,
    .quickLinks {
      display: grid;
      gap: 10px;
    }

    .dateItem,
    .activityItem,
    .quickLink {
      padding: 11px;
      border-radius: 14px;
      background: #f7faff;
      color: var(--text);
      text-decoration: none;
    }

    .dateItem {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      border: 1px solid transparent;
    }

    .dateItem:hover {
      border-color: var(--blue);
    }

    .dateBadge {
      min-width: 50px;
      border-radius: 12px;
      padding: 7px 8px;
      text-align: center;
      color: var(--navy);
      background: var(--yellow);
      font-weight: 900;
      font-size: 12px;
    }

    .moduleGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .filterRow,
    .calendarToolbar,
    .toolbarActions,
    .viewTabs {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .calendarToolbar {
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .quickLink.compact {
      border: 0;
      cursor: pointer;
      font-weight: 800;
    }

    .filterSelect {
      min-height: 46px;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    .calendarHeading {
      margin: 16px 0 12px;
      color: var(--navy);
      font-size: 22px;
      font-weight: 900;
    }

    .calendarMonth {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
    }

    .calendarDay {
      min-height: 118px;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px;
      background: rgba(255,255,255,.9);
      overflow: hidden;
    }

    .calendarDay.muted {
      opacity: .5;
    }

    .calendarDayNumber {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .calendarEvent {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 6px 7px;
      margin-top: 5px;
      text-align: left;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.25;
      cursor: pointer;
    }

    .moduleWorkspace {
      margin-top: 14px;
      min-width: 0;
      overflow-x: auto;
    }

    .boardGrid {
      display: grid;
      grid-template-columns: repeat(5, minmax(220px, 1fr));
      gap: 12px;
      min-width: 900px;
    }

    .boardColumn,
    .timelineLane {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      background: #f7faff;
    }

    .taskCard {
      margin-top: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      box-shadow: var(--softShadow);
    }

    .dataTable {
      width: 100%;
      min-width: 920px;
      border-collapse: collapse;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
    }

    .dataTable th,
    .dataTable td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
      font-size: 12px;
    }

    .ganttGrid {
      display: grid;
      gap: 10px;
      min-width: 860px;
    }

    .ganttRow {
      display: grid;
      grid-template-columns: 220px minmax(360px, 1fr);
      gap: 10px;
      align-items: center;
    }

    .ganttTrack {
      min-height: 34px;
      border-radius: 999px;
      background: #eef4ff;
      position: relative;
      overflow: hidden;
    }

    .ganttBar {
      position: absolute;
      top: 5px;
      bottom: 5px;
      left: 12%;
      width: 45%;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
    }

    .moduleCard {
      min-height: 116px;
      padding: 15px;
      text-align: left;
      transition: .16s ease;
    }

    .moduleCard:hover,
    .resultCard:hover {
      transform: translateY(-2px);
      border-color: var(--blue);
      box-shadow: var(--shadow);
    }

    .moduleIcon {
      font-size: 24px;
      margin-bottom: 12px;
    }

    .moduleTitle {
      color: var(--navy);
      font-weight: 900;
    }

    .moduleMeta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .moduleNote {
      margin-top: 6px;
      color: var(--orange);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.25;
    }

    .participantLayout {
      display: grid;
      grid-template-columns: minmax(480px, 1fr) minmax(500px, 620px);
      gap: 18px;
      align-items: start;
    }

    .participantSearch {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px 14px;
      margin-bottom: 12px;
      background: #fff;
      outline: none;
    }

    .participantSearch:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(45,103,178,.13);
    }

    .status {
      min-height: 20px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .resultCard {
      padding: 13px;
      text-align: left;
      transition: .16s ease;
    }

    .resultCard--participant {
      background: linear-gradient(100deg, rgba(68,194,240,.20), rgba(255,255,255,.98) 45%);
      border-left: 5px solid var(--sky);
    }

    .resultCard--school {
      background: linear-gradient(100deg, rgba(157,208,133,.24), rgba(255,255,255,.98) 45%);
      border-left: 5px solid var(--mint);
    }

    .resultCard--item {
      background: linear-gradient(100deg, rgba(187,82,158,.20), rgba(255,255,255,.98) 45%);
      border-left: 5px solid var(--purple);
    }

    .resultCard--group {
      background: linear-gradient(100deg, rgba(247,148,32,.22), rgba(255,255,255,.98) 45%);
      border-left: 5px solid var(--orange);
    }

    .resultCard--teacher {
      background: linear-gradient(100deg, rgba(251,204,57,.28), rgba(255,255,255,.98) 45%);
      border-left: 5px solid var(--yellow);
    }

    .resultCard--staff {
      background: linear-gradient(100deg, rgba(239,80,156,.20), rgba(255,255,255,.98) 45%);
      border-left: 5px solid var(--magenta);
    }

    .resultCard--timeline {
      background: linear-gradient(100deg, rgba(45,103,178,.16), rgba(255,255,255,.98) 45%);
      border-left: 5px solid var(--blue);
    }

    .resultTop {
      display: flex;
      gap: 11px;
      align-items: center;
    }

    .avatar {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff;
      background: var(--blue);
      font-weight: 900;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .resultTitle {
      color: var(--blue);
      font-weight: 900;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .resultMeta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .pillRow {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .pill {
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--blue);
      background: #eef4ff;
      font-size: 11px;
      font-weight: 800;
    }

    .profilePanel {
      min-height: 320px;
      padding: 0;
      position: sticky;
      top: 96px;
      max-height: calc(100vh - 120px);
      overflow-x: hidden;
      overflow-y: auto;
    }

    .profileTitle {
      margin: 0;
      color: var(--navy);
      font-size: 22px;
      line-height: 1.1;
    }

    .profileLine {
      padding: 9px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }

    .profileLine:first-of-type {
      border-top: 0;
      margin-top: 14px;
    }

    .profilePanel > .profileTitle {
      padding: 16px 16px 0;
    }

    .profilePanel > .scProfileLine {
      margin: 0 16px;
    }

    .scProfileCard {
      overflow: hidden;
      border-radius: 20px;
      background: #fff;
    }

    .scProfileHero {
      padding: 24px 22px;
      color: #fff;
      text-align: center;
      background: linear-gradient(135deg, var(--blue), var(--sky));
    }

    .scProfileHero.student {
      background:
        radial-gradient(circle at 16% 8%, rgba(251,204,57,.30), transparent 30%),
        linear-gradient(135deg, var(--blue), var(--sky));
    }

    .scProfileHero.school {
      background:
        radial-gradient(circle at 15% 8%, rgba(157,208,133,.34), transparent 34%),
        linear-gradient(135deg, var(--blue), var(--sky));
    }

    .scProfileHero.item {
      background:
        radial-gradient(circle at 85% 10%, rgba(239,80,156,.34), transparent 34%),
        linear-gradient(135deg, var(--blue), var(--purple));
    }

    .scProfileHero.group {
      background:
        radial-gradient(circle at 85% 10%, rgba(247,148,32,.35), transparent 34%),
        linear-gradient(135deg, var(--blue), var(--purple));
    }

    .scProfileHero.teacher {
      background:
        radial-gradient(circle at 15% 8%, rgba(251,204,57,.36), transparent 34%),
        linear-gradient(135deg, var(--blue), var(--sky));
    }

    .scProfileHero.staff {
      background:
        radial-gradient(circle at 82% 8%, rgba(239,80,156,.32), transparent 34%),
        linear-gradient(135deg, var(--blue), var(--magenta));
    }

    .scProfileKicker {
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .88;
    }

    .scProfileHero h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;

    @media (max-width: 640px) {

      }

      .moduleGrid,
      .statusRibbon,
      .calendarMonth,
      .results {

      }
    }
  </style>

  <script>
    window.App = {
      state: {
        currentPage: "dashboard",
        participants: [],
        groups: [],
        schools: [],
        photos: {},
        staff: {},
        staffTeam: [],
        announcements: [],
        notifications: [],
        rehearsals: [],
        todaysRehearsals: [],
        calendarData: null,
        calendarDate: new Date(),
        calendarView: "month",
        selectedCalendarEvent: null,
        projectData: null,
        projectView: "board",
        mediaData: null,
        mediaView: "gantt",
        attendanceEvents: [],
        attendanceUrl: "",
        timelineStatus: "",
        timelineLastRefreshed: "",
        staffStatus: "",
        latestResults: [],
        participantSearchTimer: null,
        searchProviders: [],
        searchHistory: [],
        recentlyViewed: [],
        currentFilters: {},
        currentModule: "dashboard",
        currentUser: null,
        permissions: [],
        dashboardContext: null,
        loadedServices: {},
        cacheTimestamps: {},
        serviceCache: {},
        inFlightRequests: {},
        serviceRegistry: {},
        loading: {},
        systemStatus: {},
        dashboardStats: null,
        dashboardRenderTimer: null,
        dashboardProfile: "operations",
        applicationVersion: "5",
        selectedParticipant: null,
        selectedSchool: null,
        selectedGroup: null,
        selectedItem: null,
        selectedTeacher: null,
        selectedEvent: null,
        selectedStaff: null,
        navigationHistory: [],
        navigationIndex: -1,
        ready: false
      },

      pages: {
        dashboard: {
          title: "Home",
          description: "Your Schools Spectacular staff portal.",
          template: "page-dashboard"
        },
        participants: {
          title: "Participants",
          description: "Search participants, schools, items, groups and teachers.",
          template: "page-participants"
        },
        calendar: {
          title: "Calendar",
          description: "Timeline events in month and agenda views.",
          template: "page-calendar",
          permission: "calendar.view"
        },
        attendance: {
          title: "Attendance",
          description: "Open attendance rolls and check-in workflows.",
          template: "page-attendance"
        },
        rehearsals: {
          title: "Rehearsals",
          description: "Schedules, venues and upcoming rehearsal dates.",
          template: "page-rehearsals"
        },
        staff: {
          title: "Staff",
          description: "Staff context, roles and future permission sync.",
          template: "page-staff"
        },
        operations: {
          title: "Operations",
          description: "Protected management area for Schools Spectacular operations.",
          template: "page-operations",
          permission: "operations.view"
        },
        projectManagement: {
          title: "Operations",
          description: "Compatibility route for the protected Operations module.",
          template: "page-operations",
          permission: "operations.view",
          redirectTo: "operations"
        },
        mediaTimeline: {
          title: "Media Timeline",
          description: "Campaign planning, media milestones and publishing activity.",
          template: "page-media-timeline",
          permission: "mediaTimeline.view"
        },
        settings: {
          title: "Settings",
          description: "Staff permissions, app configuration and module setup.",
          template: "page-settings"
        }
      },

      init: function () {
        App.bootstrapState();
        App.restoreSidebarState();
        App.bindGlobalSearch();
        App.loadConfig();
        App.loadPortalData();
        App.navigate("dashboard");
      },

      bootstrapState: function () {
        App.state.searchHistory = App.safeLoadJson("specCentralSearchHistory", []);
        App.state.recentlyViewed = App.safeLoadJson("specCentralRecentlyViewed", []);
        App.registerCoreServices();
        App.bindApplicationEvents();
        App.registerDefaultSearchProviders();
      },

      restoreSidebarState: function () {
        var collapsed = App.safeLoadJson("specCentralSidebarCollapsed", false);
        document.body.classList.toggle("sidebarCollapsed", !!collapsed);
      },

      toggleSidebar: function () {
        var collapsed = !document.body.classList.contains("sidebarCollapsed");
        document.body.classList.toggle("sidebarCollapsed", collapsed);
        App.safeSaveJson("specCentralSidebarCollapsed", collapsed);
      },

      events: {
        handlers: {},
        on: function (name, handler) {
          if (!name || typeof handler !== "function") return function () {};
          App.events.handlers[name] = App.events.handlers[name] || [];
          App.events.handlers[name].push(handler);
          return function () {
            App.events.handlers[name] = (App.events.handlers[name] || []).filter(function (item) {
              return item !== handler;
            });
          };
        },
        emit: function (name, payload) {
          (App.events.handlers[name] || []).slice().forEach(function (handler) {
            try {
              handler(payload);
            } catch (err) {
              console.error("Spec Central event handler failed", name, err);
            }
          });
        }
      },

      services: {
        request: function (key, serverFunction, options) {
          options = options || {};
          var service = App.getService(key) || {};
          serverFunction = serverFunction || service.serverFunction;
          var args = options.args || [];
          var cacheMs = options.cacheMs || 0;
          var timeoutMs = options.timeoutMs || 25000;
          var forceRefresh = !!options.forceRefresh;
          var cached = App.state.serviceCache[key];
          var cachedAt = App.state.cacheTimestamps[key] || 0;

          if (!forceRefresh && cacheMs && cached && Date.now() - cachedAt < cacheMs) {
            return Promise.resolve(cached);
          }

          if (!forceRefresh && App.state.inFlightRequests[key]) {
            return App.state.inFlightRequests[key];
          }

          App.state.loading[key] = true;
          App.setServiceStatus(key, "Loading");
          App.events.emit("service:loading", { key: key, serverFunction: serverFunction });

          App.state.inFlightRequests[key] = new Promise(function (resolve, reject) {
            var settled = false;
            var timer = setTimeout(function () {
              if (settled) return;
              settled = true;
              App.state.loading[key] = false;
              delete App.state.inFlightRequests[key];
              App.setServiceStatus(key, "Offline", App.formatTime(new Date()));
              var error = new Error(serverFunction + " timed out after " + Math.round(timeoutMs / 1000) + " seconds");
              App.events.emit("service:error", { key: key, serverFunction: serverFunction, error: error });
              reject(error);
            }, timeoutMs);

            function finish(success, value) {
              if (settled) return;
              settled = true;
              clearTimeout(timer);
              App.state.loading[key] = false;
              delete App.state.inFlightRequests[key];

              if (success) {
                App.state.loadedServices[key] = true;
                App.state.serviceCache[key] = value;
                App.state.cacheTimestamps[key] = Date.now();
                App.setServiceStatus(key, "Connected", App.formatTime(new Date()));
                App.events.emit("service:loaded", { key: key, serverFunction: serverFunction, data: value });
                resolve(value);
                return;
              }

              App.events.emit("service:error", { key: key, serverFunction: serverFunction, error: value });
              App.setServiceStatus(key, "Offline", App.formatTime(new Date()));
              reject(value);
            }

            try {
              var runner = google.script.run
                .withSuccessHandler(function (data) { finish(true, data); })
                .withFailureHandler(function (error) { finish(false, error); });

              if (!runner || typeof runner[serverFunction] !== "function") {
                finish(false, new Error("Missing server function: " + serverFunction));
                return;
              }

              runner[serverFunction].apply(runner, args);
            } catch (err) {
              finish(false, err);
            }
          });

          return App.state.inFlightRequests[key];
        }
      },

      SearchRegistry: {
        register: function (provider) {
          App.registerSearchProvider(provider);
        },
        search: function (query, limit) {
          return App.runUniversalSearch(query, limit);
        },
        list: function () {
          return (App.state.searchProviders || []).slice();
        }
      },

      registerService: function (id, config) {
        if (!id) return;
        App.state.serviceRegistry[id] = Object.assign({ id: id, status: "Waiting" }, config || {});
        App.state.systemStatus[id] = App.state.systemStatus[id] || {
          label: App.state.serviceRegistry[id].label || id,
          status: "Waiting",
          lastRefresh: ""
        };
      },

      getService: function (id) {
        return App.state.serviceRegistry[id] || null;
      },

      registerCoreServices: function () {
        [
          ["config", "Dashboard", "portalGetSpecCentralConfig"],
          ["portalData", "Participants", "portalGetPortalData"],
          ["calendar", "Timeline", "portalGetCalendarData"],
          ["attendance", "Attendance", ""],
          ["staff", "Staff", "portalGetStaffProductionTeam"],
          ["announcements", "Announcements", ""],
          ["operations", "Operations", "portalGetOperationsData"],
          ["mediaTimeline", "Media", "portalGetMediaTimelineData"],
          ["photos", "Profile Photos", "portalGetStudentPhotos"]
        ].forEach(function (service) {
          App.registerService(service[0], {
            label: service[1],
            serverFunction: service[2],
            owner: service[0]
          });
        });
      },

      setServiceStatus: function (id, status, lastRefresh) {
        var service = App.getService(id) || { label: id };
        App.state.systemStatus[id] = {
          label: service.label || id,
          status: status || "Waiting",
          lastRefresh: lastRefresh || (App.state.systemStatus[id] || {}).lastRefresh || ""
        };
        App.renderStatusRibbon();
      },

      bindApplicationEvents: function () {
        App.events.on("service:loaded", function () {
          if (App.state.currentPage === "dashboard") App.scheduleDashboardRender();
        });
        App.events.on("service:error", function () {
          App.renderStatusRibbon();
        });
        App.events.on("dashboard:refresh", function () {
          App.state.dashboardStats = App.buildDashboardStats();
          App.scheduleDashboardRender();
        });
      },

      scheduleDashboardRender: function () {
        if (App.state.dashboardRenderTimer) clearTimeout(App.state.dashboardRenderTimer);
        App.state.dashboardRenderTimer = setTimeout(function () {
          App.state.dashboardRenderTimer = null;
          if (App.state.currentPage === "dashboard") App.renderDashboardPage();
        }, 50);
      },

      navigate: function (page, options) {
        options = options || {};
        if (page === "projectManagement") page = "operations";
        var config = App.pages[page] || App.pages.dashboard;
        var template = document.getElementById(config.template);
        var outlet = document.getElementById("appContent");

        if (config.permission && !App.hasPermission(config.permission)) {
          App.notify("You do not have permission to open " + config.title + ".");
          page = "dashboard";
          config = App.pages.dashboard;
          template = document.getElementById(config.template);
        }

        App.state.currentPage = page;
        App.state.currentModule = page;
        document.body.classList.toggle("attendanceFocus", page === "attendance");
        if (!options.fromHistory) {
          App.pushNavigation(page, options);
        }
        document.getElementById("topBarTitle").textContent = config.title;
        document.getElementById("topBarDescription").textContent = config.description;

        Array.prototype.forEach.call(document.querySelectorAll("[data-nav-page]"), function (button) {
          button.classList.toggle("active", button.getAttribute("data-nav-page") === page);
        });

        App.renderStatusRibbon();
        outlet.innerHTML = template ? template.innerHTML : '<div class="empty">Page not found.</div>';
        App.renderNavigation();

        if (page === "dashboard") App.renderDashboardPage();
        if (page === "participants") App.renderParticipantStatus();
        if (page === "calendar") App.renderCalendarPage();
        if (page === "attendance") App.renderAttendancePage();
        if (page === "rehearsals") App.renderRehearsalsPage();
        if (page === "operations") App.renderOperationsPage();
        if (page === "mediaTimeline") App.renderMediaTimelinePage();
        if (page === "staff") App.renderStaffPage();
      },

      pushNavigation: function (page, options) {
        var history = App.state.navigationHistory;
        var entry = { page: page, at: Date.now(), context: (options && options.context) || null };

        if (options && options.replace && history.length) {
          history[App.state.navigationIndex] = entry;
          return;
        }

        if (App.state.navigationIndex < history.length - 1) {
          history.splice(App.state.navigationIndex + 1);
        }

        history.push(entry);
        if (history.length > 30) history.shift();
        App.state.navigationIndex = history.length - 1;
      },

      goBack: function () {
        if (App.state.navigationIndex <= 0) return;
        App.state.navigationIndex--;
        App.navigate(App.state.navigationHistory[App.state.navigationIndex].page, { fromHistory: true });
      },

      goForward: function () {
        if (App.state.navigationIndex >= App.state.navigationHistory.length - 1) return;
        App.state.navigationIndex++;
        App.navigate(App.state.navigationHistory[App.state.navigationIndex].page, { fromHistory: true });
      },

      bindGlobalSearch: function () {
        var search = document.getElementById("globalSearch");
        if (!search) return;

        search.addEventListener("input", function () {
          App.navigate("participants");
          var participantSearch = document.getElementById("participantSearch");
          if (participantSearch) {
            participantSearch.value = search.value;
            App.queueParticipantSearch();
          }
        });
      },

      loadConfig: function () {
        App.services.request("config", "portalGetSpecCentralConfig", { timeoutMs: 30000 })
          .then(function (config) {
            config = config || {};
            App.state.dashboardContext = config;
            App.state.dashboardProfile = config.dashboardProfile || "operations";
            App.state.staff = config.staff || {};
            App.state.currentUser = App.state.staff;
            App.state.permissions = App.state.staff.permissions || [];
            App.state.staffTeam = config.staffTeam || [];
            App.state.attendanceUrl = config.attendanceUrl || "";
            App.state.attendanceStatus = config.attendanceStatus || "";
            App.state.attendanceSource = config.attendanceSource || "";
            App.state.announcements = config.announcements || [];
            App.state.notifications = config.notifications || [];
            App.state.rehearsals = config.rehearsals || [];
            App.state.todaysRehearsals = config.todaysRehearsals || [];
            App.state.attendanceEvents = config.attendanceEvents || [];
            App.state.currentDate = config.currentDate || "";
            App.state.timelineStatus = config.timelineStatus || "";
            App.state.timelineLastRefreshed = config.timelineLastRefreshed || "";
            App.state.staffStatus = config.staffStatus || "";
            App.applyServerServiceStatuses(config.services || {});
            App.state.dashboardStats = App.buildDashboardStats();
            App.renderNavigation();
            App.renderStaffContext();
            App.renderStatusRibbon();
            App.renderNotifications();
            if (App.state.currentPage === "attendance") App.renderAttendancePage();
            if (App.state.currentPage === "dashboard") App.renderDashboardPage();
            if (App.state.currentPage === "calendar") App.renderCalendarPage();
            if (App.state.currentPage === "rehearsals") App.renderRehearsalsPage();
            if (App.state.currentPage === "operations") App.renderOperationsPage();
            if (App.state.currentPage === "mediaTimeline") App.renderMediaTimelinePage();
            if (App.state.currentPage === "staff") App.renderStaffPage();
          })
          .catch(function (error) {
            App.notify("Staff context could not be loaded: " + App.getErrorMessage(error));
          });
      },

      loadPortalData: function () {
        App.services.request("portalData", "portalGetPortalData", { timeoutMs: 45000 })
          .then(function (data) {
            data = data || {};
            App.state.participants = data.participants || [];
            App.state.groups = data.groups || [];
            App.state.schools = data.schools || [];
            App.state.photos = data.photos || {};
            App.state.ready = true;
            App.rebuildSearchProviders();
            App.state.dashboardStats = App.buildDashboardStats();
            App.events.emit("dashboard:refresh");
            App.renderStaffContext();
            App.renderStatusRibbon();
            App.renderDashboardPage();
            App.renderParticipantStatus();
            App.loadPhotoData();
          })
          .catch(function (error) {
            App.state.ready = false;
            App.notify("Portal data could not be loaded: " + App.getErrorMessage(error));
            App.renderStatusRibbon();
            App.renderParticipantStatus();
          });
      },

      loadPhotoData: function () {
        App.services.request("photos", "portalGetStudentPhotos", { cacheMs: 120000, timeoutMs: 45000 })
          .then(function (photos) {
            App.state.photos = photos || {};
            App.state.participants.forEach(function (participant) {
              var photoUrl = App.getParticipantPhotoUrl(participant, true);
              if (photoUrl) participant.photoUrl = photoUrl;
            });
            App.refreshParticipantViews();
          })
          .catch(function (error) {
            console.warn("Spec Central photos could not be loaded", error);
          });
      },

      refreshParticipantViews: function () {
        var resultsEl = document.getElementById("participantResults");
        if (resultsEl && App.state.latestResults && App.state.latestResults.length) {
          resultsEl.innerHTML = App.state.latestResults.map(App.renderResultCard).join("");
        }

        if (App.state.currentPage !== "participants") return;
        if (App.state.selectedParticipant) {
          App.renderParticipantProfile(App.state.selectedParticipant);
        } else if (App.state.selectedSchool) {
          App.renderSchoolProfile(App.buildSchoolProfile(typeof App.state.selectedSchool === "string" ? App.state.selectedSchool : App.getSchoolName(App.state.selectedSchool)));
        } else if (App.state.selectedItem) {
          App.renderItemProfile(App.buildItemProfile(App.state.selectedItem));
        } else if (App.state.selectedGroup) {
          App.renderGroupProfile(App.state.selectedGroup);
        } else if (App.state.selectedTeacher) {
          App.renderTeacherProfile(App.buildTeacherProfile(App.state.selectedTeacher));
        }
      },

      renderStaffContext: function () {
        var el = document.getElementById("staffEmail");
        if (!el) return;
        el.textContent = App.state.staff.email || "Unknown user";
      },

      hasPermission: function (permission) {
        var permissions = App.state.staff.permissions || [];
        return permissions.indexOf(permission) >= 0;
      },

      renderNavigation: function () {
        Array.prototype.forEach.call(document.querySelectorAll("[data-permission]"), function (button) {
          var permission = button.getAttribute("data-permission");
          button.hidden = permission ? !App.hasPermission(permission) : false;
        });
      },

      renderStatusRibbon: function () {
        var ribbon = document.getElementById("statusRibbon");
        if (!ribbon) return;

        if (App.state.currentPage !== "dashboard") {
          ribbon.hidden = true;
          ribbon.innerHTML = "";
          return;
        }

        ribbon.hidden = false;
        var statuses = App.getStatusItems();

          var theme = App.getStatusTheme(item.id);
          var meta = [App.getStatusState(item.status), item.lastRefresh].filter(Boolean).join(" · ");

      getStatusTheme: function (id) {
        var themes = {
          portalData: { icon: "👤", color: "#44c2f0", bg: "rgba(68,194,240,.16)", purpose: "People + profiles" },
          calendar: { icon: "📅", color: "#2d67b2", bg: "rgba(45,103,178,.14)", purpose: "Events + rehearsals" },
          attendance: { icon: "✓", color: "#9dd085", bg: "rgba(157,208,133,.20)", purpose: "Rolls + check-in" },
          staff: { icon: "🪪", color: "#fbcc39", bg: "rgba(251,204,57,.24)", purpose: "Roles + access" },
          announcements: { icon: "!", color: "#ef509c", bg: "rgba(239,80,156,.16)", purpose: "Updates" },
          operations: { icon: "◆", color: "#bb529e", bg: "rgba(187,82,158,.16)", purpose: "Management" },
          mediaTimeline: { icon: "▶", color: "#f79420", bg: "rgba(247,148,32,.18)", purpose: "Campaigns" }
        };
        return themes[id] || { icon: "•", color: "#667085", bg: "rgba(102,112,133,.12)", purpose: "Service" };

      getStatusState: function (status) {
        var text = String(status || "Waiting");
        if (/connected/i.test(text)) return text.replace(/\s+·\s+/g, " · ");
        if (/loading/i.test(text)) return "Loading";
        if (/offline|unavailable|error|failed/i.test(text)) return "Offline";
        if (/ready/i.test(text)) return "Ready";
        return text;
      },

        Object.keys(services || {}).forEach(function (id) {
          App.setServiceStatus(id, services[id], App.state.currentDate || "");
        });
      },

      renderParticipantStatus: function () {
        var status = document.getElementById("participantStatus");
        if (!status) return;

        if (!App.state.ready) {
          status.textContent = "Loading participant data...";
          return;
        }

        status.textContent = "Ready - " + App.getTotalParticipantCount() + " participants, " +
          App.state.groups.length + " groups and " + App.state.schools.length + " schools loaded" +

      },

      runParticipantSearch: function () {
        if (App.state.participantSearchTimer) {
          clearTimeout(App.state.participantSearchTimer);
          App.state.participantSearchTimer = null;
        }
        var search = document.getElementById("participantSearch");
        var resultsEl = document.getElementById("participantResults");
        var statusEl = document.getElementById("participantStatus");
        var query = String((search && search.value) || "").trim().toLowerCase();

        if (!resultsEl || !statusEl) return;

        if (!App.state.ready) {
          statusEl.textContent = "Loading participant data...";
          resultsEl.innerHTML = "";
          return;
        }

        if (!query) {
          App.state.latestResults = [];
          resultsEl.innerHTML = "";
          App.renderParticipantStatus();
          return;
        }

        App.recordSearch(query);
        App.state.latestResults = App.getParticipantResults(query);
        statusEl.textContent = App.state.latestResults.length ? App.state.latestResults.length + " results" : "No matches found";
        resultsEl.innerHTML = App.state.latestResults.length
          ? App.state.latestResults.map(App.renderResultCard).join("")
          : '<div class="empty">No matches found.</div>';
      },

      queueParticipantSearch: function () {
        if (App.state.participantSearchTimer) clearTimeout(App.state.participantSearchTimer);
        App.state.participantSearchTimer = setTimeout(App.runParticipantSearch, 160);
      },

      registerSearchProvider: function (provider) {
        if (!provider || !provider.id || typeof provider.search !== "function") return;
        App.state.searchProviders = (App.state.searchProviders || []).filter(function (item) {
          return item.id !== provider.id;
        });
        App.state.searchProviders.push(provider);
        App.state.searchProviders.sort(function (a, b) {
          return (a.priority || 50) - (b.priority || 50);
        });
      },

      registerDefaultSearchProviders: function () {
        App.state.searchProviders = [];

        App.registerSearchProvider({
          id: "participants",
          priority: 10,
          search: function (query) {
            return App.state.participants.map(function (participant) {
              var title = App.getParticipantName(participant);
              var text = [
                title,
                App.getParticipantSchool(participant),
                App.getParticipantItem(participant),
                App.getParticipantCategory(participant),
                App.getParticipantCategoryDetail(participant),
                App.getParticipantTeacherName(participant),
                App.getParticipantTeacherEmail(participant)
              ].filter(Boolean).join(" ");
              var score = App.getSearchScore(text, query);

              return {
                resultType: "participant",
                title: title,
                meta: [App.getParticipantSchool(participant), App.getParticipantYear(participant) ? "Year " + App.getParticipantYear(participant) : "", App.getParticipantItem(participant) || App.getParticipantCategory(participant)].filter(Boolean).join(" - "),
                participant: participant,
                score: score
              };
            }).filter(function (result) {
              return result.title && result.score > 0;
            });
          }
        });

        App.registerSearchProvider({
          id: "schools",
          priority: 20,
          search: function (query) {
            return App.state.schools.map(function (school) {
              var name = App.getSchoolName(school);
              var score = App.getSearchScore(name, query);
              var participantTotal = App.getSchoolParticipantTotal(name);
              var participantNote = App.getSchoolParticipantTotalNote(name);
              return {
                resultType: "school",
                title: name,
                meta: participantTotal + " participant" + (participantTotal === 1 ? "" : "s") + (participantNote ? " - " + participantNote : ""),
                school: school,
                score: score
              };
            }).filter(function (result) {
              return result.title && result.score > 0;
            });
          }
        });

        App.registerSearchProvider({
          id: "groups",
          priority: 30,
          search: function (query) {
            return App.state.groups.map(function (group) {
              var title = [group.item, group.groupName].filter(Boolean).join(" - ") || group.category || "Unnamed group";
              var text = [group.item, group.groupName, group.category, group.school, group.teacherName, group.teacherEmail].filter(Boolean).join(" ");
              var score = App.getSearchScore(text, query);
              return {
                resultType: "group",
                title: title,
                meta: [group.school, group.teacherName, App.getGroupStudentCountLabel(group)].filter(Boolean).join(" - "),
                group: group,
                score: score
              };
            }).filter(function (result) {
              return result.score > 0;
            });
          }
        });

        App.registerSearchProvider({
          id: "items",
          priority: 40,
          search: function (query) {
            var itemMap = {};
            App.state.participants.forEach(function (participant) {
              var item = App.normaliseItemTitle(App.getParticipantItem(participant));
              if (!item) return;
              itemMap[item] = itemMap[item] || { participants: 0, schools: {} };
              itemMap[item].participants++;
              var school = App.getParticipantSchool(participant);
              if (school) itemMap[item].schools[school] = true;
            });

            App.state.groups.forEach(function (group) {
              var item = App.normaliseItemTitle(group.item || group.groupName || "");
              if (!item) return;
              itemMap[item] = itemMap[item] || { participants: 0, schools: {} };
              if (group.school) itemMap[item].schools[group.school] = true;
              itemMap[item].participants += App.parseParticipantCount(App.getGroupStudentCount(group));
            });

            return Object.keys(itemMap).map(function (item) {
              var score = App.getSearchScore(item, query);
              var stats = itemMap[item];
              var schoolCount = Object.keys(stats.schools).length;
              return {
                resultType: "item",
                title: item,
                meta: [schoolCount ? schoolCount + " schools" : "", stats.participants ? stats.participants + " participants" : ""].filter(Boolean).join(" - "),
                score: score
              };
            }).filter(function (result) {
              return result.score > 0;
            });
          }
        });

        App.registerSearchProvider({
          id: "teachers",
          priority: 50,
          search: function (query) {
            var teachers = {};
            App.state.groups.forEach(function (group) {
              var key = String(group.teacherEmail || group.teacherName || "").trim().toLowerCase();
              if (!key) return;
              teachers[key] = teachers[key] || {
                resultType: "teacher",
                title: group.teacherName || group.teacherEmail,
                meta: [group.teacherEmail, group.school].filter(Boolean).join(" - "),
                teacher: group,
                score: 0
              };
              teachers[key].score = Math.max(teachers[key].score, App.getSearchScore([group.teacherName, group.teacherEmail, group.school, group.item].join(" "), query));
            });

            return Object.keys(teachers).map(function (key) {
              return teachers[key];
            }).filter(function (result) {
              return result.title && result.score > 0;
            });
          }
        });

        App.registerSearchProvider({
          id: "staff",
          priority: 60,
          search: function (query) {
            return (App.state.staffTeam || []).map(function (staff) {
              var title = staff.displayName || staff.name || staff.email;
              var score = App.getSearchScore([title, staff.email, staff.role, staff.department, staff.team].join(" "), query);
              return {
                resultType: "staff",
                title: title,
                meta: [staff.role, staff.department || staff.team, staff.email].filter(Boolean).join(" - "),
                staff: staff,
                score: score
              };
            }).filter(function (result) {
              return result.title && result.score > 0;
            });
          }
        });

        App.registerSearchProvider({
          id: "timeline",
          priority: 70,
          search: function (query) {
            var events = ((App.state.calendarData && App.state.calendarData.events) || App.state.rehearsals || []);
            return events.map(function (event) {
              var title = event.title || event.event || "Event";
              var score = App.getSearchScore([title, event.venue, event.type, event.rehearsalType, (event.items || []).join(" ")].join(" "), query);
              return {
                resultType: "timeline",
                title: title,
                meta: [event.date || event.dateDisplay, event.venue, event.type || event.rehearsalType].filter(Boolean).join(" - "),
                event: event,
                score: score
              };
            }).filter(function (result) {
              return result.title && result.score > 0;
            });
          }
        });
      },

      rebuildSearchProviders: function () {
        App.registerDefaultSearchProviders();
        App.events.emit("search:providers-ready", { count: App.state.searchProviders.length });
      },

      runUniversalSearch: function (query, limit) {
        var normalisedQuery = String(query || "").trim().toLowerCase();
        if (!normalisedQuery) return [];

        return (App.state.searchProviders || []).reduce(function (results, provider) {
          try {
            return results.concat((provider.search(normalisedQuery) || []).map(function (result) {
              result.providerId = provider.id;
              result.providerPriority = provider.priority || 50;
              return result;
            }));
          } catch (err) {
            console.error("Search provider failed", provider.id, err);
            return results;
          }
        }, []).sort(function (a, b) {
          return b.score - a.score ||
            (a.providerPriority || 50) - (b.providerPriority || 50) ||
            String(a.title || "").localeCompare(String(b.title || ""));
        }).slice(0, limit || 50);
      },

      getParticipantResults: function (query) {
        return App.runUniversalSearch(query, 50);
      },

      renderResultCard: function (result, index) {
        var icon = result.resultType === "school"
          ? "🏫"
          : result.resultType === "group" || result.resultType === "item"
          ? "🎭"
          : result.resultType === "teacher"
          ? "👩‍🏫"
          : result.resultType === "staff"
          ? "🪪"
          : result.resultType === "timeline"
          ? "📅"
          : App.getInitials(result.title);
        var avatar = '<div class="avatar">' + App.escapeHtml(icon) + '</div>';

        if (result.resultType === "participant") {
          var photo = App.getParticipantPhotoUrl(result.participant, false, 120);
          avatar = '<div class="avatar">' + (photo
            ? '<img src="' + App.escapeHtml(photo) + '" alt="" onerror="App.showAvatarFallback(this)"><span class="avatarFallbackInline">' + App.escapeHtml(icon) + '</span>'
            : App.escapeHtml(icon)) + '</div>';
        }

        return '<button class="resultCard resultCard--' + App.escapeHtml(result.resultType || "item") + '" type="button" onclick="App.openResult(' + index + ')">' +
          '<div class="resultTop">' +
            avatar +
            '<div>' +
              '<div class="resultTitle">' + App.escapeHtml(result.title || "Untitled") + '</div>' +
              '<div class="resultMeta">' + App.escapeHtml(result.meta || result.resultType) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="pillRow"><span class="pill">' + App.escapeHtml(result.resultType) + '</span></div>' +
        '</button>';
      },

      openResult: function (index) {
        var result = App.state.latestResults[index];
        if (!result) return;

        if (result.resultType === "participant") {
          App.openParticipant(result.participant);
          return;
        }

        if (result.resultType === "school") {
          App.state.selectedSchool = result.school || result.title;
          App.events.emit("school:selected", App.state.selectedSchool);
          App.recordRecentlyViewed("school", result.title);
          App.renderSchoolProfile(App.buildSchoolProfile(result.title));
          return;
        }

        if (result.resultType === "item") {
          App.state.selectedItem = result.title;
          App.events.emit("item:selected", result.title);
          App.recordRecentlyViewed("item", result.title);
          App.renderItemProfile(App.buildItemProfile(result.title));
          return;
        }

        if (result.resultType === "group") {
          var group = result.group || {};
          App.state.selectedGroup = group;
          App.events.emit("group:selected", group);
          App.recordRecentlyViewed("group", result.title);
          App.renderGroupProfile(group);
          return;
        }

        if (result.resultType === "teacher") {
          App.state.selectedTeacher = result.teacher || result.title;
          App.events.emit("teacher:selected", App.state.selectedTeacher);
          App.recordRecentlyViewed("teacher", result.title);
          App.renderTeacherProfile(App.buildTeacherProfile(result.teacher || result.title));
          return;
        }

        if (result.resultType === "staff") {
          App.openStaff(result.staff || result.title);
          return;
        }

        if (result.resultType === "timeline") {
          App.openEvent(result.event);
        }
      },

      openParticipant: function (participant) {
        if (!participant) return;
        App.state.selectedParticipant = participant;
        App.events.emit("participant:selected", participant);
        App.recordRecentlyViewed("participant", App.getParticipantName(participant));
        App.renderParticipantProfile(participant);
      },

      openSchool: function (school) {
        App.navigate("participants");
        App.state.selectedSchool = school;
        App.events.emit("school:selected", school);
        App.renderSchoolProfile(App.buildSchoolProfile(typeof school === "string" ? school : App.getSchoolName(school)));
      },

      openGroup: function (group) {

      buildSchoolProfile: function (schoolName) {
        var target = String(schoolName || "").trim();
        var participants = App.getSchoolParticipants(target);
        var groups = App.getSchoolGroups(target);
        var master = (App.state.schools || []).find(function (school) {
          return String(App.getSchoolName(school)).trim().toLowerCase() === target.toLowerCase();
        }) || null;
        var teachers = {};
        var items = {};
        var categories = {};

        participants.forEach(function (participant) {
          var teacherKey = String(App.getParticipantTeacherEmail(participant) || App.getParticipantTeacherName(participant) || "").trim().toLowerCase();
          if (teacherKey) {
            teachers[teacherKey] = teachers[teacherKey] || {
              name: App.getParticipantTeacherName(participant),
              email: App.getParticipantTeacherEmail(participant)
            };
          }

          var item = App.getParticipantItem(participant);
          if (item) {
            items[item] = items[item] || { name: item, category: App.getParticipantCategory(participant), count: 0 };
            items[item].count++;
          }

          var category = App.getParticipantCategory(participant) || "Unspecified";
          categories[category] = categories[category] || { name: category, count: 0, items: {} };
          categories[category].count++;
          if (item) categories[category].items[item] = true;
        });

        groups.forEach(function (group) {
          var teacherKey = String(group.teacherEmail || group.teacherName || "").trim().toLowerCase();
          if (teacherKey) {
            teachers[teacherKey] = teachers[teacherKey] || { name: group.teacherName, email: group.teacherEmail };
          }
        });

        var groupParticipantCount = groups.reduce(function (total, group) {
          return total + App.parseParticipantCount(App.getGroupStudentCount(group));
        }, 0);
        var participantCountNote = groups.some(function (group) {
          var accepted = String((group && group.acceptedCount) || "").trim();
          var allocated = String((group && (group.allocatedCount || group.count)) || "").trim();
          return !accepted && App.parseParticipantCount(allocated) > 0;
        }) ? "Includes not accepted yet allocations" : "";

        return {
          schoolName: target,
          master: master,
          participants: participants.sort(App.sortByParticipantName),
          groups: groups,
          participantCount: participants.length + groupParticipantCount,
          participantCountNote: participantCountNote,
          teachers: App.objectValues(teachers).sort(App.sortByName),
          items: App.objectValues(items).sort(App.sortByName),
          categories: App.objectValues(categories).map(function (category) {
            category.items = Object.keys(category.items).sort();
            return category;
          }).sort(App.sortByName)
        };
      },

      buildItemProfile: function (itemName) {
        var target = App.normaliseItemTitle(itemName);
        var targetKey = App.getItemKey(target);
        var participants = (App.state.participants || []).filter(function (participant) {
          return App.getItemKey(App.getParticipantItem(participant)) === targetKey;
        });
        var groups = (App.state.groups || []).filter(function (group) {
          return App.getItemKey(group.item || group.groupName || "") === targetKey;
        });
        var schools = {};
        var teachers = {};
        var categories = {};

        groups.forEach(function (group) {
          var schoolName = String(group.school || "Unknown school").trim();
          var count = Number(App.getGroupStudentCount(group)) || 0;
          schools[schoolName] = schools[schoolName] || { name: schoolName, count: 0, acceptedCount: 0, allocatedCount: 0, notAcceptedYet: false };
          schools[schoolName].count += count;
          if (String(group.acceptedCount || "").trim()) {
            schools[schoolName].acceptedCount += Number(group.acceptedCount) || 0;
          } else {
            schools[schoolName].allocatedCount += Number(group.allocatedCount || group.count) || 0;
            schools[schoolName].notAcceptedYet = true;
          }
          App.addTeacherRecord(teachers, group);
          App.addCategoryRecord(categories, group.category || group.discipline, schoolName, count);
        });

        participants.forEach(function (participant) {
          var schoolName = App.getParticipantSchool(participant) || "Unknown school";
          schools[schoolName] = schools[schoolName] || { name: schoolName, count: 0, acceptedCount: 0, allocatedCount: 0, notAcceptedYet: false };
          schools[schoolName].count++;
          App.addTeacherRecord(teachers, participant);
          App.addCategoryRecord(categories, App.getParticipantCategory(participant), schoolName, 1);
        });

        return {
          itemName: target || itemName || "Item",
          participants: participants.sort(App.sortByParticipantName),
          groups: groups,
          schools: App.objectValues(schools).sort(App.sortByName),
          teachers: App.objectValues(teachers).sort(App.sortByName),
          categories: App.objectValues(categories).map(function (category) {
            category.schoolCount = Object.keys(category.schools || {}).length;
            return category;
          }).sort(App.sortByName)
        };
      },

          return target && values.indexOf(target) >= 0;

        var participants = (App.state.participants || []).filter(function (participant) {
          var values = [App.getParticipantTeacherEmail(participant), App.getParticipantTeacherName(participant)].map(function (value) {
            return String(value || "").trim().toLowerCase();
          });
          return target && values.indexOf(target) >= 0;
        }).sort(App.sortByParticipantName);
        var firstGroup = groups[0] || {};

        var name = App.getParticipantTeacherName(participants[0] || {}) || contact.name || firstGroup.teacherName || (typeof teacher === "object" ? teacher.title : "") || key || "Teacher";
        var email = App.getParticipantTeacherEmail(participants[0] || {}) || contact.email || firstGroup.teacherEmail || "";
        var schools = {};

        participants.forEach(function (participant) {

          if (group.item) items[group.item] = { name: App.normaliseItemTitle(group.item), count: (items[group.item] ? items[group.item].count : 0) + 1 };

      getProfileStatsFromLines: function (lines) {
        var stats = [];
        (lines || []).forEach(function (line) {
          String(line || "").split(/\s+-\s+|·/).forEach(function (part) {
            var match = String(part || "").trim().match(/^(\d+)\s+(.+)$/);
            if (!match) return;
            stats.push({
              value: match[1],
              label: match[2].replace(/s$/, "")
            });
          });
        });
        return stats.slice(0, 4);
      },

      renderProfileStats: function (stats) {
        stats = (stats || []).filter(function (stat) {
          return stat && stat.value !== undefined && stat.value !== null && String(stat.value) !== "";
        });
        if (!stats.length) return "";
        return '<div class="scProfileStats">' + stats.map(function (stat) {
          return '<div class="scProfileStat"><strong>' + App.escapeHtml(stat.value) + '</strong><span>' + App.escapeHtml(stat.label) + '</span></div>';
        }).join("") + '</div>';
      },
