        var target = String(schoolName || "").trim().toLowerCase();
        return (App.state.participants || []).filter(function (participant) {
          return String(App.getParticipantSchool(participant) || "").trim().toLowerCase() === target;
        });
      },

      getSchoolGroups: function (schoolName) {
        var target = String(schoolName || "").trim().toLowerCase();
        return (App.state.groups || []).filter(function (group) {
          return String(group.school || "").trim().toLowerCase() === target;
        });
      },

      getSchoolParticipantTotal: function (schoolName) {
        var individualCount = App.getSchoolParticipants(schoolName).length;
        var groupCount = App.getSchoolGroups(schoolName).reduce(function (total, group) {
          return total + App.parseParticipantCount(App.getGroupStudentCount(group));
        }, 0);
        return individualCount + groupCount;
      },

      getSchoolParticipantTotalNote: function (schoolName) {
        return App.getSchoolGroups(schoolName).some(function (group) {
          var accepted = String((group && group.acceptedCount) || "").trim();
          var allocated = String((group && (group.allocatedCount || group.count)) || "").trim();
          return !accepted && App.parseParticipantCount(allocated) > 0;
        }) ? "Includes not accepted yet allocations" : "";
      },

      objectValues: function (source) {
        return Object.keys(source || {}).map(function (key) { return source[key]; });
      },

      sortByName: function (a, b) {
        return String((a && a.name) || "").localeCompare(String((b && b.name) || ""));
      },

      sortByParticipantName: function (a, b) {
        return String(App.getParticipantName(a)).localeCompare(String(App.getParticipantName(b)));
      },

      addTeacherRecord: function (map, source) {
        var name = App.getParticipantTeacherName(source) || source.teacherName || "";
        var email = App.getParticipantTeacherEmail(source) || source.teacherEmail || "";
        var key = String(email || name || "").trim().toLowerCase();
        if (!key) return;
        map[key] = map[key] || { name: name, email: email };
      },

      addCategoryRecord: function (map, categoryName, schoolName, count) {
        var category = String(categoryName || "Unspecified").trim() || "Unspecified";
        map[category] = map[category] || { name: category, count: 0, schools: {} };
        map[category].count += Number(count) || 0;
        if (schoolName) map[category].schools[schoolName] = true;
      },

      getTeacherContact: function (group, target) {
        group = group || {};
        var primaryEmail = String(group.teacherEmail || "").trim().toLowerCase();
        var primaryName = String(group.teacherName || "").trim().toLowerCase();
        var secondEmail = String(group.secondTeacherEmail || "").trim().toLowerCase();
        var secondName = String(group.secondTeacherName || "").trim().toLowerCase();

        if (target && (primaryEmail === target || primaryName === target)) {
          return {
            contactType: group.teacherContactType || "Primary contact",
            name: group.teacherName || "",
            email: group.teacherEmail || "",
            mobile: group.teacherMobile || "",
            role: group.teacherRole || "",
            isSpecAlumni: group.teacherIsSpecAlumni || "",
            specRoles: group.teacherSpecRoles || "",
            firstTime: group.teacherFirstTime || ""
          };
        }

        if (target && (secondEmail === target || secondName === target)) {
          return {
            contactType: group.secondTeacherContactType || "Second contact",
            name: group.secondTeacherName || "",
            email: group.secondTeacherEmail || "",
            mobile: group.secondTeacherMobile || "",
            role: group.secondTeacherRole || "",
            isSpecAlumni: group.secondTeacherIsSpecAlumni || "",
            specRoles: group.secondTeacherSpecRoles || "",
            firstTime: ""
          };
        }

        return null;
      },

      isAffirmative: function (value) {
        return /^(yes|y|true|1)$/i.test(String(value || "").trim());
      },

      loadCalendarData: function () {
        if (App.state.calendarData) return;

        var source = document.getElementById("calendarSource");
        if (source) source.textContent = "Loading Timeline events...";

        App.services.request("calendar", "portalGetCalendarData", { cacheMs: 120000, timeoutMs: 30000 })
          .then(function (data) {
            App.state.calendarData = data || { events: [] };
            App.state.rehearsals = App.state.calendarData.events || App.state.rehearsals || [];
            App.rebuildSearchProviders();
            App.renderStatusRibbon();
            if (App.state.currentPage === "calendar") App.renderCalendarPage();
            if (App.state.currentPage === "rehearsals") App.renderRehearsalsPage();
          })
          .catch(function (error) {
            App.state.calendarData = { events: [], source: "Timeline unavailable", error: App.getErrorMessage(error) };
            App.notify("Calendar data could not be loaded: " + App.getErrorMessage(error));
            if (App.state.currentPage === "calendar") App.renderCalendarPage();
          });
      },

      renderCalendarPage: function () {
        if (!App.state.calendarData) {
          App.loadCalendarData();
          App.renderCalendarLoading();
          return;
        }

        var source = document.getElementById("calendarSource");
        if (source) {
          source.textContent = (App.state.calendarData.source || "Timeline data") +
            (App.state.calendarData.generatedAt ? " · " + App.state.calendarData.generatedAt : "");
        }

        App.populateEventFilters("calendarTypeFilter", "type", App.getCalendarEvents());
        App.populateEventFilters("calendarVenueFilter", "venue", App.getCalendarEvents());

        var heading = document.getElementById("calendarHeading");
        if (heading) {
          heading.textContent = new Intl.DateTimeFormat("en-AU", { month: "long", year: "numeric" }).format(App.state.calendarDate);
        }

        var month = document.getElementById("calendarMonth");
        var agenda = document.getElementById("calendarAgenda");
        if (!month || !agenda) return;

        if (App.state.calendarView === "agenda") {
          month.style.display = "none";
          agenda.style.display = "grid";
          App.renderCalendarAgenda(agenda);
          return;
        }

        month.style.display = "grid";
        agenda.style.display = "none";
        App.renderCalendarMonth(month);
      },

      renderCalendarLoading: function () {
        var month = document.getElementById("calendarMonth");
        if (month) month.innerHTML = '<div class="empty" style="grid-column:1/-1;">Loading calendar events...</div>';
      },

      getCalendarEvents: function () {
        var events = (App.state.calendarData && App.state.calendarData.events) || App.state.rehearsals || [];
        var search = String((document.getElementById("calendarSearch") || {}).value || "").toLowerCase();
        var type = String((document.getElementById("calendarTypeFilter") || {}).value || "");
        var venue = String((document.getElementById("calendarVenueFilter") || {}).value || "");

        return events.filter(function (event) {
          var text = [event.title, event.event, event.venue, event.type, event.rehearsalType, (event.items || []).join(" ")].join(" ").toLowerCase();
          if (search && text.indexOf(search) < 0) return false;
          if (type && String(event.type || event.rehearsalType || "") !== type) return false;
          if (venue && String(event.venue || "") !== venue) return false;
          return true;
        });
      },

      renderCalendarMonth: function (el) {
        var date = App.state.calendarDate;
        var first = new Date(date.getFullYear(), date.getMonth(), 1);
        var start = new Date(first);
        start.setDate(first.getDate() - first.getDay());
        var events = App.getCalendarEvents();
        var byDate = App.groupEventsByDate(events);
        var html = "";

        for (var i = 0; i < 42; i++) {
          var day = new Date(start);
          day.setDate(start.getDate() + i);
          var key = App.toDateKey(day);
          var dayEvents = byDate[key] || [];
          html += '<div class="calendarDay' + (day.getMonth() === date.getMonth() ? "" : " muted") + '">' +
            '<div class="calendarDayNumber">' + App.escapeHtml(App.formatShortDate(day)) + '</div>' +
            dayEvents.slice(0, 3).map(function (event) {
              return '<button class="calendarEvent" type="button" style="background:' + App.escapeHtml(event.colour || "#2d67b2") + '" onclick="App.showCalendarEventDetail(\'' + App.escapeJs(event.id) + '\')">' +
                App.escapeHtml(event.title || event.event || "Event") +
              '</button>';
            }).join("") +
            (dayEvents.length > 3 ? '<div class="moduleMeta">+' + (dayEvents.length - 3) + ' more</div>' : "") +
          '</div>';
        }

        el.innerHTML = html;
      },

      renderCalendarAgenda: function (el) {
        var events = App.getCalendarEvents().sort(App.sortEvents);
        el.innerHTML = events.length
          ? events.map(App.renderTimelineEventCard).join("")
          : '<div class="empty">No events match the current filters.</div>';
      },

      showCalendarEventDetail: function (id) {
        var events = ((App.state.calendarData && App.state.calendarData.events) || App.state.rehearsals || []);
        var event = events.find(function (item) { return String(item.id) === String(id); });
        var el = document.getElementById("calendarEventDetail");
        if (!event || !el) return;

        App.state.selectedCalendarEvent = event;
        el.className = "profilePanel";
        el.innerHTML =
          '<h2 class="profileTitle">' + App.escapeHtml(event.title || event.event || "Event") + '</h2>' +
          App.profileLine("Date / time", [event.date, [event.start, event.finish].filter(Boolean).join(" - ")].filter(Boolean).join(" · ")) +
          App.profileLine("Venue", event.venue) +
          App.profileLine("Type", event.type || event.rehearsalType) +
          App.profileLine("Groups / items", (event.items || event.groups || []).join(", ")) +
          App.profileLine("Allocated staff", event.allocatedStaffCount ? event.allocatedStaffCount + " staff" : "Not connected") +
          App.profileLine("Attendance", event.attendanceStatus || "Not connected") +
          App.profileLine("Source", event.sourceRow ? "Timeline row " + event.sourceRow : event.source || "Placeholder");
      },

      goCalendarToday: function () {
        App.state.calendarDate = new Date();
        App.renderCalendarPage();
      },

      moveCalendar: function (months) {
        var current = App.state.calendarDate;
        App.state.calendarDate = new Date(current.getFullYear(), current.getMonth() + months, 1);
        App.renderCalendarPage();
      },

      toggleCalendarView: function () {
        App.state.calendarView = App.state.calendarView === "month" ? "agenda" : "month";
        App.renderCalendarPage();
      },

      groupEventsByDate: function (events) {
        return (events || []).reduce(function (map, event) {
          var key = event.dateKey || App.toDateKey(event.date);
          if (!key) return map;
          map[key] = map[key] || [];
          map[key].push(event);
          return map;
        }, {});
      },

      renderAttendancePage: function () {
        var launch = document.getElementById("attendanceLaunch");
        var frame = document.getElementById("attendanceFrame");
        var placeholder = document.getElementById("attendancePlaceholder");
        var heroStatus = document.getElementById("attendanceHeroStatus");
        var sourceText = document.getElementById("attendanceSourceText");
        var urlText = document.getElementById("attendanceUrlText");
        var heroMode = document.getElementById("attendanceHeroMode");
        if (!frame || !placeholder) return;

        if (heroStatus) heroStatus.textContent = App.state.attendanceUrl ? "Connected" : "Waiting";
        if (heroMode) heroMode.textContent = App.state.attendanceUrl ? "Web app" : "Setup";
        if (sourceText) sourceText.textContent = App.state.attendanceSource || "Existing Attendance web app";
        if (urlText) {
          urlText.textContent = App.state.attendanceUrl
            ? "Embedded from the existing Attendance deployment."
            : "Configure SPEC_CENTRAL_ATTENDANCE_URL or ATTENDANCE_WEB_APP_URL.";
        }

        if (App.state.attendanceUrl) {
          if (launch) {
            launch.disabled = false;
            launch.textContent = "Open Attendance";
          }
          if (frame.src !== App.state.attendanceUrl) frame.src = App.state.attendanceUrl;
          frame.style.display = "block";
          placeholder.style.display = "none";
          return;
        }

        if (launch) {
          launch.disabled = true;
          launch.textContent = "Attendance Coming Soon";
        }
        frame.style.display = "none";
        placeholder.style.display = "block";
      },

      reloadAttendanceFrame: function () {
        var frame = document.getElementById("attendanceFrame");
        if (!frame || !App.state.attendanceUrl) {
          App.notify("Attendance URL is not configured yet.");
          return;
        }
        frame.src = App.state.attendanceUrl + (App.state.attendanceUrl.indexOf("?") >= 0 ? "&" : "?") + "refresh=" + Date.now();
      },

      renderRehearsalsPage: function () {
        var el = document.getElementById("rehearsalListFull");
        if (!el) return;

        if (!App.state.calendarData) {
          App.loadCalendarData();
        }

        App.populateEventFilters("rehearsalVenueFilter", "venue", App.state.rehearsals || []);
        App.populateEventFilters("rehearsalTypeFilter", "type", App.state.rehearsals || []);

        var rehearsals = App.getFilteredRehearsals();
        el.innerHTML = rehearsals.length
          ? rehearsals.map(App.renderTimelineEventCard).join("")
          : '<div class="empty">No rehearsals match the current filters.</div>';
      },

      renderRehearsalItem: function (rehearsal) {
        return App.renderTimelineEventCard(rehearsal);
      },

      renderTimelineEventCard: function (event) {
        var date = event.date || event.dateDisplay || "TBC";
        var time = [event.start, event.finish].filter(Boolean).join(" - ");
        var title = event.event || event.title || "Rehearsal";
        var meta = [
          time,
          event.venue,
          event.type || event.rehearsalType,
          (event.items || []).length ? (event.items || []).join(", ") : "",
          event.allocatedStaffCount ? event.allocatedStaffCount + " staff" : "",
          event.attendanceStatus || ""
        ].filter(Boolean).join(" · ");

        return '<button class="dateItem" type="button" onclick="App.showCalendarEventDetail(\'' + App.escapeJs(event.id || title) + '\')">' +
          '<div class="dateBadge" style="background:' + App.escapeHtml(event.colour || "#fbcc39") + '">' + App.escapeHtml(date) + '</div>' +
          '<div><strong>' + App.escapeHtml(title) + '</strong><br>' +
          '<span class="moduleMeta">' + App.escapeHtml(meta || "Timeline event") + '</span></div>' +
        '</button>';
      },

      setRehearsalMode: function (mode) {
        App.state.rehearsalMode = mode;
        App.renderRehearsalsPage();
      },

      getFilteredRehearsals: function () {
        var events = (App.state.rehearsals || []).slice();
        var search = String((document.getElementById("rehearsalSearch") || {}).value || "").toLowerCase();
        var venue = String((document.getElementById("rehearsalVenueFilter") || {}).value || "");
        var type = String((document.getElementById("rehearsalTypeFilter") || {}).value || "");
        var today = App.toDateKey(new Date());
        var mode = App.state.rehearsalMode || "upcoming";

        return events.filter(function (event) {
          var dateKey = event.dateKey || App.toDateKey(event.date);
          var text = [event.title, event.event, event.venue, event.type, (event.items || []).join(" ")].join(" ").toLowerCase();
          if (search && text.indexOf(search) < 0) return false;
          if (venue && String(event.venue || "") !== venue) return false;
          if (type && String(event.type || event.rehearsalType || "") !== type) return false;
          if (mode === "today") return dateKey === today;
          if (mode === "past") return dateKey && dateKey < today;
          return !dateKey || dateKey >= today;
        }).sort(App.sortEvents);
      },

      renderOperationsPage: function () {
        var el = document.getElementById("operationsContent");
        var source = document.getElementById("operationsSource");
        if (!el) return;

        if (!App.state.projectData) {
          el.innerHTML = '<div class="empty">Loading operations data...</div>';
          App.loadOperationsData();
          return;
        }

        if (source) source.textContent = (App.state.projectData.source || "Operations") +
          (App.state.projectData.generatedAt ? " · " + App.state.projectData.generatedAt : "");

        var tasks = App.state.projectData.tasks || [];
        var view = App.state.operationsView || "overview";

        if (view === "overview") {
          el.innerHTML = App.renderOperationsOverview();
        } else if (view === "events") {
          el.innerHTML = '<div class="empty">Event management will connect to Timeline in a later sprint.</div>';
        } else if (view === "users") {
          el.innerHTML = '<div class="empty">Users and permissions will connect to the Staff Production Team source.</div>';
        } else if (view === "data") {
          el.innerHTML = '<div class="empty">Import Centre, acceptance syncing and reconciliation tools will appear here.</div>';
        } else if (view === "announcements") {
          el.innerHTML = '<div class="empty">Announcement authoring will appear here once the source is connected.</div>';
        } else if (view === "integrations") {
          el.innerHTML = App.renderOperationsIntegrations();
        } else if (view === "diagnostics") {
          el.innerHTML = '<div class="empty">Diagnostics and audit logs will appear here after backend instrumentation is connected.</div>';
        } else if (view === "table") {
          el.innerHTML = App.renderProjectTable(tasks);
        } else if (view === "milestones" || view === "projects") {
          el.innerHTML = App.renderGroupedCards(tasks, "workstream");
        } else if (view === "mine") {
          el.innerHTML = App.renderProjectTable(App.filterMine(tasks, "owner"));
        } else if (view === "risk") {
          el.innerHTML = App.renderProjectTable(tasks.filter(function (task) {
            return /blocked|waiting|overdue|risk/i.test([task.status, task.priority, task.notes].join(" "));
          }));
        } else {
          el.innerHTML = App.renderTaskBoard(tasks, App.state.projectData.statuses || []);
        }
      },

        return '<div class="moduleGrid">' + stats.map(function (stat) {
          return '<div class="moduleCard"><div class="moduleTitle">' + App.escapeHtml(stat.value) + '</div><div class="moduleMeta">' + App.escapeHtml(stat.label) + '</div>' + (stat.note ? '<div class="moduleNote">' + App.escapeHtml(stat.note) + '</div>' : '') + '</div>';
        }).join("") + '</div>' +
          '<h4 class="sectionTitle">Project Management</h4>' +
          App.renderTaskBoard((App.state.projectData && App.state.projectData.tasks) || [], (App.state.projectData && App.state.projectData.statuses) || []);

      renderOperationsIntegrations: function () {

          return '<div class="moduleCard"><div class="moduleTitle">' + App.escapeHtml(item.label) + '</div><div class="moduleMeta">' + App.escapeHtml(item.status || "Waiting") + '</div></div>';

          })
          .catch(function (error) {

      setOperationsView: function (view) {

        App.renderOperationsPage();
      },

      renderProjectManagementPage: function () {
        App.renderOperationsPage();
      },

      loadProjectManagementData: function () {
        App.loadOperationsData();
      },

      setProjectView: function (view) {
        App.setOperationsView(view === "board" ? "projects" : view);
      },

      renderTaskBoard: function (tasks, statuses) {
        statuses = statuses.length ? statuses : ["Not started", "In progress", "Waiting", "Ready for review", "Complete"];
        return '<div class="boardGrid">' + statuses.map(function (status) {

            (columnTasks.length ? columnTasks.map(App.renderTaskCard).join("") : '<div class="moduleMeta">No tasks</div>') +

      renderTaskCard: function (task) {

          '<strong>' + App.escapeHtml(task.task || task.activity || "Untitled") + '</strong>' +
          '<div class="moduleMeta">' + App.escapeHtml([task.workstream || task.campaign, task.owner, task.department].filter(Boolean).join(" · ")) + '</div>' +
          '<div class="pillRow"><span class="pill">' + App.escapeHtml(task.status || "No status") + '</span><span class="pill">' + App.escapeHtml(task.priority || "Priority pending") + '</span></div>' +

      renderProjectTable: function (tasks) {

      renderGroupedCards: function (items, field) {
        var groups = {};
        (items || []).forEach(function (item) {
          var key = item[field] || "Unspecified";
          groups[key] = groups[key] || [];
          groups[key].push(item);
        });

        var keys = Object.keys(groups).sort();
        return keys.length ? keys.map(function (key) {
          return '<div class="boardColumn" style="margin-bottom:12px;"><strong>' + App.escapeHtml(key) + '</strong>' +
            groups[key].map(App.renderTaskCard).join("") +
          '</div>';
        }).join("") : '<div class="empty">No records found.</div>';

      renderDataTable: function (rows, columns) {
        if (!rows.length) return '<div class="empty">No records found.</div>';
        return '<table class="dataTable"><thead><tr>' +
          columns.map(function (column) { return '<th>' + App.escapeHtml(App.toTitle(column)) + '</th>'; }).join("") +
          '</tr></thead><tbody>' +
          rows.map(function (row) {
            return '<tr>' + columns.map(function (column) {
              return '<td>' + App.escapeHtml(row[column] || "") + '</td>';
            }).join("") + '</tr>';
          }).join("") +
          '</tbody></table>';
      },

      filterMine: function (items, ownerField) {
        var email = String(App.state.staff.email || "").toLowerCase();
        var name = String(App.state.staff.name || App.state.staff.displayName || "").toLowerCase();
        return (items || []).filter(function (item) {
          var owner = String(item[ownerField] || "").toLowerCase();
          return owner && (owner.indexOf(email) >= 0 || owner.indexOf(name) >= 0);
        });
      },

      toTitle: function (value) {
        return String(value || "")
          .replace(/([A-Z])/g, " $1")
          .replace(/^./, function (char) { return char.toUpperCase(); });
      },

      renderStaffPage: function () {
        var el = document.getElementById("staffProfileSummary");
        if (!el) return;

        var staff = App.state.staff || {};
        el.innerHTML =
          '<div class="profileLine"><strong>Email</strong><br>' + App.escapeHtml(staff.email || "Unknown user") + '</div>' +
          '<div class="profileLine"><strong>Display name</strong><br>' + App.escapeHtml(staff.displayName || "Spec Central user") + '</div>' +
          '<div class="profileLine"><strong>Role</strong><br>' + App.escapeHtml(staff.role || "Staff") + '</div>' +
          '<div class="profileLine"><strong>Staff team records</strong><br>' + App.escapeHtml((App.state.staffTeam || []).length) + '</div>' +
          '<div class="profileLine"><strong>Source</strong><br>' + App.escapeHtml(staff.source || "Placeholder") + '</div>';
      },

      openAttendance: function () {
        if (App.state.attendanceUrl) {
          window.open(App.state.attendanceUrl, "_blank");
          return;
        }
        App.navigate("attendance");
        App.notify("Attendance URL is not configured yet.");
      },

      focusParticipantsSearch: function () {
        App.navigate("participants");
        setTimeout(function () {
          var search = document.getElementById("participantSearch");
          if (search) search.focus();
        }, 0);
      },

      browseGlobal: function (type) {
        App.navigate("participants");
        setTimeout(function () {
          var search = document.getElementById("participantSearch");
          var resultsEl = document.getElementById("participantResults");
          var statusEl = document.getElementById("participantStatus");
          if (!search || !resultsEl || !statusEl) return;

          search.value = "";

          if (type === "schools") {
            App.state.latestResults = App.state.schools
              .map(function (school) {
                var title = App.getSchoolName(school);
                return { resultType: "school", title: title, meta: "School", score: 100 };
              })
              .filter(function (result) { return result.title; })
              .sort(function (a, b) { return a.title.localeCompare(b.title); })
              .slice(0, 50);
          } else {
            var itemMap = {};
            App.state.participants.forEach(function (participant) {
              var item = participant.item || participant.Item || "";
              if (!item) return;
              itemMap[item] = (itemMap[item] || 0) + 1;
            });
            App.state.groups.forEach(function (group) {
              var item = group.item || group.groupName || "";
              if (!item) return;
              itemMap[item] = itemMap[item] || 0;
            });
            App.state.latestResults = Object.keys(itemMap)
              .sort()
              .slice(0, 50)
              .map(function (item) {
                return { resultType: "item", title: item, meta: itemMap[item] + " participant" + (itemMap[item] === 1 ? "" : "s"), score: 100 };
              });
          }

          statusEl.textContent = App.state.latestResults.length + " " + (type === "schools" ? "schools" : "items");
          resultsEl.innerHTML = App.state.latestResults.map(App.renderResultCard).join("");
          search.focus();
        }, 0);
      },

      openImportCentre: function () {
        App.notify("Open the spreadsheet menu: Spec Tools > Upload Acceptances/New Participant.");
      },

      notify: function (message) {
        var el = document.getElementById("notifications");
        if (!el) return;
        el.textContent = message;
        el.classList.add("show");
      },

      renderNotifications: function () {
        var notifications = App.state.notifications || [];
        if (notifications.length) {
          App.notify(notifications[0].title + ": " + notifications[0].body);
        }
      },

      clearNotification: function () {
        var el = document.getElementById("notifications");
        if (!el) return;
        el.textContent = "";
        el.classList.remove("show");
      },

      profileLine: function (label, value) {
        if (!value) return "";
        return '<div class="scProfileLine"><strong>' + App.escapeHtml(label) + '</strong>' + App.escapeHtml(value) + '</div>';
      },

      getGreeting: function () {
        var hour = new Date().getHours();
        if (hour < 12) return "Good morning";
        if (hour < 18) return "Good afternoon";
        return "Good evening";
      },

      formatShortDate: function (value) {
        try {
          return new Intl.DateTimeFormat("en-AU", {
            weekday: "short",
            day: "numeric",
            month: "short"
          }).format(value instanceof Date ? value : new Date(value));
        } catch (err) {
          return String(value || "");
        }
      },

      formatTime: function (value) {
        var date = value instanceof Date ? value : new Date(value);
        if (typeof value === "number") date = new Date(value);
        if (isNaN(date.getTime())) return "";

        try {
          return new Intl.DateTimeFormat("en-AU", {
            hour: "numeric",
            minute: "2-digit"
          }).format(date);
        } catch (err) {
          return "";
        }
      },

      toDateKey: function (value) {
        if (!value) return "";
        var date = value instanceof Date ? value : new Date(value);
        if (isNaN(date.getTime())) return "";
        var year = date.getFullYear();
        var month = String(date.getMonth() + 1).padStart(2, "0");
        var day = String(date.getDate()).padStart(2, "0");
        return year + "-" + month + "-" + day;
      },

      sortEvents: function (a, b) {
        return String(a.dateKey || "").localeCompare(String(b.dateKey || "")) ||
          String(a.start || "").localeCompare(String(b.start || "")) ||
          String(a.title || a.event || "").localeCompare(String(b.title || b.event || ""));
      },

      populateEventFilters: function (elementId, field, events) {
        var select = document.getElementById(elementId);
        if (!select || select.dataset.ready === "true") return;

        var values = Array.from(new Set((events || [])
          .map(function (event) { return String(event[field] || (field === "type" ? event.rehearsalType : "") || "").trim(); })
          .filter(Boolean)))
          .sort();

        select.innerHTML = '<option value="">All ' + App.escapeHtml(field === "venue" ? "venues" : "types") + '</option>' +
          values.map(function (value) {
            return '<option value="' + App.escapeHtml(value) + '">' + App.escapeHtml(value) + '</option>';
          }).join("");
        select.dataset.ready = "true";
      },

      safeLoadJson: function (key, fallback) {
        try {
          var raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (err) {
          return fallback;
        }
      },

      safeSaveJson: function (key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (err) {}
      },

      recordSearch: function (query) {
        var term = String(query || "").trim();
        if (term.length < 2) return;
        App.state.searchHistory = [term].concat((App.state.searchHistory || []).filter(function (item) {
          return String(item).toLowerCase() !== term.toLowerCase();
        })).slice(0, 10);
        App.safeSaveJson("specCentralSearchHistory", App.state.searchHistory);
        App.safeSaveJson("specPortalRecentSearches", App.state.searchHistory);
      },

      recordRecentlyViewed: function (type, label) {
        if (!type || !label) return;
        var key = type + ":" + String(label).toLowerCase();
        App.state.recentlyViewed = [{ type: type, label: label, key: key, at: Date.now() }].concat((App.state.recentlyViewed || []).filter(function (item) {
          return item.key !== key;
        })).slice(0, 12);
        App.safeSaveJson("specCentralRecentlyViewed", App.state.recentlyViewed);
        App.safeSaveJson("specPortalRecentlyViewed", App.state.recentlyViewed);
      },

      getSearchScore: function (text, query) {
        text = String(text || "").toLowerCase();
        if (!text || !query) return 0;
        if (text === query) return 100;
        if (text.indexOf(query) === 0) return 75;
        if (text.indexOf(query) >= 0) return 30;
        return 0;
      },

      getField: function (source, names) {
        if (!source) return "";
        for (var i = 0; i < names.length; i++) {
          var value = source[names[i]];
          if (value !== undefined && value !== null && String(value).trim() !== "") return value;
        }
        return "";
      },

      getParticipantName: function (participant) {
        return App.getField(participant, ["name", "fullName", "studentName", "Student Name"]) ||
          [App.getField(participant, ["firstName", "studentFirstName", "Student First Name"]), App.getField(participant, ["lastName", "studentLastName", "Student Last Name"])].filter(Boolean).join(" ");
      },

      getParticipantSchool: function (participant) {
        return App.getField(participant, ["school", "currentSchool", "schoolName", "Current School"]);
      },

      getSchoolName: function (school) {
        return App.getField(school, ["schoolName", "school", "currentSchool", "School Name", "Current School"]);
      },

      getParticipantYear: function (participant) {
        return App.getField(participant, ["year", "studentYear", "Student Year"]);
      },

      getParticipantItem: function (participant) {
        return App.getField(participant, ["item", "Item"]);
      },

      getParticipantDiscipline: function (participant) {
        return App.getField(participant, ["discipline", "Discipline"]);
      },

      getParticipantSubDiscipline: function (participant) {
        return App.getField(participant, ["subDiscipline", "subDisciplineName", "Sub-Discipline"]);
      },

      getParticipantCategory: function (participant) {
        return App.getField(participant, ["category", "Category"]) || App.getParticipantDiscipline(participant);
      },

      getParticipantCategoryDetail: function (participant) {
        return App.getField(participant, ["categoryDetail", "Category Detail"]) || App.getParticipantSubDiscipline(participant);
      },

      getParticipantTeacherName: function (participant) {
        return App.getField(participant, ["teacherName", "Teacher Name"]);
      },

      getParticipantTeacherEmail: function (participant) {
        return App.getField(participant, ["teacherEmail", "Teacher Email"]);
      },

      getParticipantStudentEmail: function (participant) {
        return App.getField(participant, ["studentEmail", "Student Email"]);
      },

      getParticipantStudentMobile: function (participant) {
        return App.formatPhoneNumber(App.getField(participant, ["studentMobile", "Student Mobile"]));
      },

      getParticipantParentName: function (participant) {
        return App.getField(participant, ["parentName", "Parent Name"]);
      },

      getParticipantParentEmail: function (participant) {
        return App.getField(participant, ["parentEmail", "Parent Email"]);
      },

      getParticipantParentPhone: function (participant) {
        return App.formatPhoneNumber(App.getField(participant, ["parentPhone", "Parent Phone"]));
      },

      getParticipantAdditionalParentName: function (participant) {
        return App.getField(participant, ["additionalParentName", "Additional Parent Name"]);
      },

      getParticipantAdditionalParentEmail: function (participant) {
        return App.getField(participant, ["additionalParentEmail", "Additional Parent Email"]);
      },

      getParticipantAdditionalParentPhone: function (participant) {
        return App.formatPhoneNumber(App.getField(participant, ["additionalParentPhone", "Additional Parent Phone"]));
      },

      getParticipantStudentId: function (participant) {
        return App.getField(participant, ["studentId", "Student ID"]);
      },

      getParticipantSrn: function (participant) {
        return App.getField(participant, ["srn", "SRN"]);
      },

      normaliseItemTitle: function (value) {
        return String(value || "")
          .trim()
          .replace(/^[\s"'(]*\d+\s*[a-z]\s+/i, "")
          .replace(/^[\s"'(]*(?:item\s*)?(?:\d+\s*)?[a-z]\s*[\).:\-–—]\s*/i, "")
          .replace(/^[\s"'(]*\d+\s*[\).:\-–—]\s*/i, "")
          .replace(/\s+/g, " ")
          .trim();
      },

      getItemKey: function (value) {
        return App.normaliseItemTitle(value).toLowerCase();
      },

      getGroupStudentCount: function (group) {
        var accepted = String((group && group.acceptedCount) || "").trim();
        var allocated = String((group && (group.allocatedCount || group.count)) || "").trim();
        return accepted || allocated;
      },

      parseParticipantCount: function (value) {
        var number = Number(String(value || "").replace(/,/g, "").trim());
        return Number.isFinite(number) ? number : 0;
      },

      getTotalGroupStudentCount: function () {
        return (App.state.groups || []).reduce(function (total, group) {
          return total + App.parseParticipantCount(App.getGroupStudentCount(group));
        }, 0);
      },

      hasNotAcceptedAllocationCounts: function () {
        return (App.state.groups || []).some(function (group) {
          var accepted = String((group && group.acceptedCount) || "").trim();
          var allocated = String((group && (group.allocatedCount || group.count)) || "").trim();
          return !accepted && App.parseParticipantCount(allocated) > 0;
        });
      },

      getTotalParticipantCount: function () {
        return (App.state.participants || []).length + App.getTotalGroupStudentCount();
      },

      getParticipantTotalNote: function () {
        return App.hasNotAcceptedAllocationCounts() ? "Includes not accepted yet allocations" : "";
      },

      getGroupStudentCountLabel: function (group) {
        var accepted = String((group && group.acceptedCount) || "").trim();
        var allocated = String((group && (group.allocatedCount || group.count)) || "").trim();
        var count = accepted || allocated || "0";
        var suffix = Number(count) === 1 ? "student" : "students";
        return accepted ? count + " " + suffix : count + " " + suffix + " · Not accepted yet";
      },

      formatPhoneNumber: function (value) {
        var original = String(value || "").trim();
        if (!original) return "";
        var digits = original.replace(/\D/g, "");
        if (!digits) return original;
        if (digits.indexOf("610") === 0) digits = "61" + digits.slice(3);
        if (digits.indexOf("61") === 0 && digits.length === 11) {
          var local = "0" + digits.slice(2);
          if (/^04\d{8}$/.test(local)) return "+61 " + local.slice(1, 4) + " " + local.slice(4, 7) + " " + local.slice(7);
          if (/^0[2378]\d{8}$/.test(local)) return "+61 " + local.slice(1, 2) + " " + local.slice(2, 6) + " " + local.slice(6);
          return "+61 " + digits.slice(2);
        }
        if (digits.length === 9 && /^[23478]/.test(digits)) digits = "0" + digits;
        if (/^04\d{8}$/.test(digits)) return digits.slice(0, 4) + " " + digits.slice(4, 7) + " " + digits.slice(7);
        if (/^0[2378]\d{8}$/.test(digits)) return digits.slice(0, 2) + " " + digits.slice(2, 6) + " " + digits.slice(6);
        return original;
      },

      getPhotoKey: function (participant) {
        return App.getParticipantName(participant)
          .replace(/\.[^.]+$/, "")
          .replace(/\s*-\s*Headshot$/i, "")
          .replace(/[\-_]+/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .toLowerCase();
      },

      getParticipantPhotoUrl: function (participant, forceCache, size) {
        if (!participant) return "";
        var explicitId = App.getField(participant, ["photoId", "PhotoID", "Photo ID", "Photo Id", "Drive Photo ID", "headshotId", "Headshot ID"]);
        if (explicitId) return App.normalisePhotoUrl(explicitId, size || 360);
        var explicitUrl = App.getField(participant, ["photoUrl", "Photo URL", "PhotoURL", "Headshot URL", "HeadshotURL", "imageUrl", "Image URL"]);
        if (!forceCache && explicitUrl) return App.normalisePhotoUrl(explicitUrl, size || 360);
        var photo = App.state.photos[App.getPhotoKey(participant)] || {};
        if (typeof photo === "string") return App.normalisePhotoUrl(photo, size || 360);
        if (photo.fileId) return App.buildDriveThumbnailUrl(photo.fileId, size || 360);
        return App.normalisePhotoUrl(photo.url || photo.thumbnailUrl || "", size || 360);
      },

      normalisePhotoUrl: function (value, size) {
        var text = String(value || "").trim();
        var fileId = App.extractDriveFileId(text);
        if (fileId) return App.buildDriveThumbnailUrl(fileId, size || 360);
        return text;
      },

      extractDriveFileId: function (value) {
        var text = String(value || "").trim();
        if (!text) return "";
        var fileMatch = text.match(/\/file\/d\/([^/]+)/);
        if (fileMatch) return fileMatch[1];
        var idMatch = text.match(/[?&]id=([^&]+)/);
        if (idMatch) return decodeURIComponent(idMatch[1]);
        return /^[a-zA-Z0-9_-]{20,}$/.test(text) ? text : "";
      },

      buildDriveThumbnailUrl: function (fileId, size) {
        return "https://drive.google.com/thumbnail?id=" + encodeURIComponent(fileId) + "&sz=w" + (size || 360);
      },

      showAvatarFallback: function (image) {
        if (!image) return;
        image.style.display = "none";
        if (image.nextElementSibling) image.nextElementSibling.style.display = "grid";
      },

      getInitials: function (name) {
        var parts = String(name || "").split(/\s+/).filter(Boolean);
        var first = parts[0] ? parts[0].charAt(0) : "?";
        var second = parts[1] ? parts[1].charAt(0) : "";
        return first + second;
      },

      escapeHtml: function (value) {
        return String(value === undefined || value === null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      },

      escapeJs: function (value) {
        return String(value === undefined || value === null ? "" : value)
          .replace(/\\/g, "\\\\")
          .replace(/'/g, "\\'")
          .replace(/"/g, "&quot;")
          .replace(/\n/g, " ")
          .replace(/\r/g, " ");
      },

      getErrorMessage: function (error) {
        return error && error.message ? error.message : String(error || "Unknown error");
      }
    };

    App.init();
  </script>
</body>
</html>
